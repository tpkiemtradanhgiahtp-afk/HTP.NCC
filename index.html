let trashSelected = new Set(); // chọn tạm để thao tác hàng loạt — reset mỗi lần mở lại tab Thùng rác
function renderTrash(c){
  // Tự dọn các mục đã quá 30 ngày — im lặng, không cần thông báo, chỉ để tránh phình dữ liệu vô hạn.
  const cutoff = Date.now() - 30*24*60*60*1000;
  let anyCleaned = false;
  TRASH_KEYS.forEach(key=>{
    if(!Array.isArray(state[key])) return;
    const before = state[key].length;
    state[key] = state[key].filter(t=> new Date(t.deletedAt).getTime() >= cutoff);
    if(state[key].length!==before) anyCleaned = true;
  });
  if(anyCleaned) saveState();

  trashSelected = new Set();
  const list = combinedTrash();
  setTitle('Thùng rác', list.length+' mục đã xoá gần đây — khôi phục nếu xoá nhầm, tự dọn sau 30 ngày');
  c.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div><h2>Các mục đã xoá</h2>
        <div class="desc">Áp dụng cho Doanh số, Đối soát CK, Chính sách/Biểu phí, Danh mục NCC/NH/Bảo hiểm và Tài khoản ở cả 3 module. Tích chọn nhiều dòng để khôi phục/xoá hàng loạt, hoặc xoá vĩnh viễn toàn bộ.</div></div>
        <div id="trashBulkBar" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"></div>
      </div>
      <div class="panel-body flush"><div class="tbl-wrap"><table class="data" id="trashTable"></table></div></div>
    </div>
  `;
  const bulkBar = document.getElementById('trashBulkBar');
  const tbl = document.getElementById('trashTable');
  if(list.length===0){
    tbl.outerHTML = `<div class="empty"><div class="big">Thùng rác trống</div></div>`; return;
  }
  tbl.innerHTML = `
    <thead><tr><th style="width:32px"><input type="checkbox" id="trashSelectAll" title="Chọn tất cả"></th><th>Loại</th><th class="wrap">Nội dung</th><th>Xoá lúc</th><th>Người xoá</th><th></th></tr></thead>
    <tbody>${list.map(t=>{
      const deleter = state.accounts.find(a=>a.id===t.deletedBy);
      return `<tr>
        <td><input type="checkbox" class="trash-check" data-id="${t.trashId}"></td>
        <td><span class="tag">${escHtml(t.entityLabel)}</span></td>
        <td class="wrap">${escHtml(trashItemSummary(t))}</td>
        <td>${new Date(t.deletedAt).toLocaleString('vi-VN')}</td>
        <td>${deleter?escHtml(deleter.name):'<em>—</em>'}</td>
        <td style="display:flex;gap:6px;white-space:nowrap">
          <button class="btn btn-ghost" data-restore="${t.trashId}" style="padding:3px 10px;font-size:12px">↩ Khôi phục</button>
          <button class="row-del" data-purge="${t.trashId}" title="Xoá vĩnh viễn — không thể khôi phục">✕</button>
        </td>
      </tr>`;
    }).join('')}</tbody>`;

  function refreshSelectAllState(){
    const selectAllCb = document.getElementById('trashSelectAll');
    if(!selectAllCb) return;
    selectAllCb.checked = list.length>0 && trashSelected.size===list.length;
    selectAllCb.indeterminate = trashSelected.size>0 && trashSelected.size<list.length;
  }
  function updateBulkBar(){
    const n = trashSelected.size;
    bulkBar.innerHTML = `
      ${n>0 ? `
        <span style="font-size:12.5px;color:var(--slate)">${n} mục đã chọn</span>
        <button class="btn btn-ghost" id="trashBulkRestore">↩ Khôi phục đã chọn</button>
        <button class="btn btn-danger-ghost" id="trashBulkPurge">✕ Xoá vĩnh viễn đã chọn (${n})</button>
      ` : ''}
      <button class="btn btn-danger-ghost" id="trashPurgeAll">🗑 Xoá vĩnh viễn tất cả (${list.length})</button>
    `;
    if(n>0){
      document.getElementById('trashBulkRestore').addEventListener('click', ()=>{
        const ids = Array.from(trashSelected);
        let count = 0;
        ids.forEach(id=>{
          const restored = restoreFromTrash(id);
          if(restored){ logActivity('create', restored.entityLabel, `Khôi phục hàng loạt từ thùng rác: ${trashItemSummary(restored)}`); count++; }
        });
        saveState();
        toast(`Đã khôi phục ${count} mục`);
        renderAll();
      });
      document.getElementById('trashBulkPurge').addEventListener('click', ()=>{
        const ids = Array.from(trashSelected);
        confirmModal(`Xoá VĨNH VIỄN ${ids.length} mục đã chọn? Không thể khôi phục sau bước này.`, ()=>{
          ids.forEach(id=> purgeTrashEntry(id));
          logActivity('delete','Thùng rác', `Xoá vĩnh viễn hàng loạt: ${ids.length} mục đã chọn`);
          saveState();
          toast(`Đã xoá vĩnh viễn ${ids.length} mục`);
          renderAll();
        });
      });
    }
    document.getElementById('trashPurgeAll').addEventListener('click', ()=>{
      confirmModal(`Xoá VĨNH VIỄN TOÀN BỘ ${list.length} mục trong Thùng rác? Không thể khôi phục sau bước này.`, ()=>{
        list.forEach(t=> purgeTrashEntry(t.trashId));
        logActivity('delete','Thùng rác', `Xoá vĩnh viễn toàn bộ Thùng rác (${list.length} mục)`);
        saveState();
        toast('Đã xoá vĩnh viễn toàn bộ Thùng rác');
        renderAll();
      });
    });
  }
  updateBulkBar();

  tbl.querySelectorAll('.trash-check').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      if(cb.checked) trashSelected.add(cb.dataset.id); else trashSelected.delete(cb.dataset.id);
      refreshSelectAllState();
      updateBulkBar();
    });
  });
  document.getElementById('trashSelectAll').addEventListener('change', (e)=>{
    if(e.target.checked) list.forEach(t=>trashSelected.add(t.trashId));
    else trashSelected.clear();
    tbl.querySelectorAll('.trash-check').forEach(cb=>{ cb.checked = trashSelected.has(cb.dataset.id); });
    updateBulkBar();
  });
  tbl.querySelectorAll('[data-restore]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const restored = restoreFromTrash(btn.dataset.restore);
      if(restored){
        logActivity('create', restored.entityLabel, `Khôi phục từ thùng rác: ${trashItemSummary(restored)}`);
        toast('Đã khôi phục');
        renderAll();
      }
    });
  });
  tbl.querySelectorAll('[data-purge]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const entry = list.find(t=>t.trashId===btn.dataset.purge);
      confirmModal(`Xoá VĨNH VIỄN "${entry?trashItemSummary(entry):''}"? Không thể khôi phục sau bước này.`, ()=>{
        purgeTrashEntry(btn.dataset.purge);
        logActivity('delete', entry?entry.entityLabel:'Thùng rác', `Xoá vĩnh viễn: ${entry?trashItemSummary(entry):''}`);
        toast('Đã xoá vĩnh viễn');
        renderAll();
      });
    });
  });
}

let accountsSelected = new Set(); // chọn tạm để xoá hàng loạt — reset mỗi lần mở lại trang Quản trị tài khoản
let unitPickerOpenIds = new Set(); // các dòng tài khoản đang mở khung tick chọn đơn vị phụ trách — không reset khi vẽ lại trang, chỉ đóng khi bấm "Xong"
// Bấm 1 ô trong bảng "Phân quyền theo vai trò" -> bật/tắt role đó cho TẤT CẢ key gộp trong dòng, đồng thời
// (áp dụng ngay, không cần nút Lưu riêng — nhất quán với cách các cài đặt khác trong app hoạt động).
function togglePermForRole(keys, role, grant){
  if(!state.editPerms) state.editPerms = JSON.parse(JSON.stringify(DEFAULT_EDIT_PERMS));
  keys.forEach(k=>{
    if(!Array.isArray(state.editPerms[k])) state.editPerms[k] = (DEFAULT_EDIT_PERMS[k]||[]).slice();
    const set = new Set(state.editPerms[k]);
    if(grant) set.add(role); else set.delete(role);
    if(!set.has('Admin')) set.add('Admin'); // phòng hờ tuyệt đối — dù logic canEdit() đã luôn cho Admin qua, vẫn không để dữ liệu tự thiếu Admin
    state.editPerms[k] = Array.from(set);
  });
}
function wirePermsTable(){
  document.querySelectorAll('[data-perm-toggle]').forEach(td=>{
    td.addEventListener('click', ()=>{
      const role = td.dataset.permToggle;
      const keys = td.closest('tr').dataset.permKeys.split(',');
      const currentlyAllowed = td.textContent.trim()==='✅';
      const label = td.closest('tr').querySelector('td').textContent.trim();
      confirmModal(`${currentlyAllowed?'Thu hồi':'Cấp'} quyền sửa "${label}" cho vai trò "${role}"?`, ()=>{
        togglePermForRole(keys, role, !currentlyAllowed);
        logActivity('update','Cài đặt', `Phân quyền: ${currentlyAllowed?'thu hồi':'cấp'} "${label}" ${currentlyAllowed?'khỏi':'cho'} vai trò "${role}"`);
        saveState();
        toast(currentlyAllowed ? 'Đã thu hồi quyền' : 'Đã cấp quyền');
        renderAll();
      }, {danger: currentlyAllowed});
    });
  });
  const grantBtn = document.getElementById('permsGrantAllMgrBtn');
  const revokeBtn = document.getElementById('permsRevokeAllMgrBtn');

        <td>${a.id===currentUserId?'<span class="tag gold">Bạn</span>':`<button class="row-del" data-del="${a.id}">✕</button>`}</td>
      </tr>`).join('')}</tbody>`;
  function refreshAcctsSelectAllState(){
    const cb = document.getElementById('acctsSelectAll');
    if(!cb) return;
    const selectableIds = state.accounts.filter(a=>a.id!==currentUserId).map(a=>a.id);
    const allSelected = selectableIds.length>0 && selectableIds.every(id=>accountsSelected.has(id));
    cb.checked = allSelected;
    cb.indeterminate = accountsSelected.size>0 && !allSelected;
  }
  function updateAcctsBulkBar(){
    const bar = document.getElementById('acctsBulkBar');
    const n = accountsSelected.size;
    bar.innerHTML = n>0 ? `<span style="font-size:12.5px;color:var(--slate)">${n} đã chọn</span><button class="btn btn-danger-ghost" id="acctsBulkDelBtn">🗑 Xoá ${n} tài khoản đã chọn</button>` : '';
    if(n>0){
      document.getElementById('acctsBulkDelBtn').addEventListener('click', ()=>{
        const ids = Array.from(accountsSelected);
        const adminCountAfter = state.accounts.filter(a=>a.role==='Admin' && !ids.includes(a.id)).length;
        if(adminCountAfter<1){ toast('Cần giữ lại ít nhất 1 tài khoản Admin — bỏ bớt lựa chọn'); return; }
        confirmModal(`Chuyển ${ids.length} tài khoản đã chọn vào Thùng rác?`, ()=>{
          let count = 0;
          ids.forEach(id=>{
            const acc = state.accounts.find(a=>a.id===id);
            if(!acc || acc.id===currentUserId) return;
            softDelete('accounts', acc, 'Tài khoản');
            logActivity('delete','Tài khoản', `Xoá tài khoản "${acc.name}" (xoá hàng loạt)`);
            count++;
          });
          toast(`Đã xoá ${count} tài khoản — khôi phục lại được ở Thùng rác`);
          renderAll();
        });
      });
    }
  }
  tbl.querySelectorAll('.acct-check').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      if(cb.checked) accountsSelected.add(cb.dataset.id); else accountsSelected.delete(cb.dataset.id);
      refreshAcctsSelectAllState();
      updateAcctsBulkBar();
    });
  });
  const acctsSelectAllCb = document.getElementById('acctsSelectAll');
  if(acctsSelectAllCb) acctsSelectAllCb.addEventListener('change', e=>{
    const selectableIds = state.accounts.filter(a=>a.id!==currentUserId).map(a=>a.id);
    if(e.target.checked) selectableIds.forEach(id=>accountsSelected.add(id));
    else accountsSelected.clear();
    tbl.querySelectorAll('.acct-check').forEach(cb=>{ cb.checked = accountsSelected.has(cb.dataset.id); });
    updateAcctsBulkBar();
  });
  updateAcctsBulkBar();
  tbl.querySelectorAll('.module-toggle').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const acc = state.accounts.find(a=>a.id===cb.dataset.acc);
      if(!acc) return;
      let mods = accountModules(acc).slice();
      if(cb.checked){ if(!mods.includes(cb.dataset.module)) mods.push(cb.dataset.module); }
      else { mods = mods.filter(x=>x!==cb.dataset.module); }
      acc.modules = mods;
      const modInfo = MODULES.find(m=>m.id===cb.dataset.module);
      logActivity('update','Tài khoản', `Sửa tài khoản "${acc.name}" (module ${modInfo?modInfo.label:cb.dataset.module}: ${cb.checked?'bật':'tắt'})`);
      renderAll();
    });
  });
  tbl.querySelectorAll('[data-unitpicker-open]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      unitPickerOpenIds.add(btn.dataset.unitpickerOpen);
      renderAll();
    });
  });
  tbl.querySelectorAll('[data-unitpicker-close]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      unitPickerOpenIds.delete(btn.dataset.unitpickerClose);
      renderAll();
    });
  });
  tbl.querySelectorAll('.unit-toggle').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const acc = state.accounts.find(a=>a.id===cb.dataset.acc);
      if(!acc) return;
      let units = accountUnits(acc).slice();
      if(cb.checked){ if(!units.includes(cb.dataset.unit)) units.push(cb.dataset.unit); }
      else { units = units.filter(x=>x!==cb.dataset.unit); }
      const before = accountUnits(acc).join(' + ') || '(chưa gán)';
      setAccountUnits(acc, units);
      const after = accountUnits(acc).join(' + ') || '(chưa gán)';
      logActivity('update','Tài khoản', `Sửa tài khoản "${acc.name}" (đơn vị phụ trách: "${before}" → "${after}")`);
      renderAll();
    });

  tbl.querySelectorAll('[data-newunit-id]').forEach(input=>{

      const name = input.value.trim();
      if(!acc || !name) return;
      const before = accountUnits(acc).join(' + ') || '(chưa gán)';
      setAccountUnits(acc, [...accountUnits(acc), name]);
      const after = accountUnits(acc).join(' + ') || '(chưa gán)';
      logActivity('update','Tài khoản', `Sửa tài khoản "${acc.name}" (đơn vị phụ trách: "${before}" → "${after}")`);
      toast(`Đã gán thêm đơn vị "${name}" cho "${acc.name}"`);
      renderAll();

  });
  tbl.querySelectorAll('.partner-entity-select').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const acc = state.accounts.find(a=>a.id===sel.dataset.acc);
      if(!acc) return;
      const before = partnerEntityLabel(acc);
      acc.partnerId = sel.value;
      logActivity('update','Tài khoản', `Sửa tài khoản Đối tác "${acc.name}": gán lại từ "${before}" → "${partnerEntityLabel(acc)}"`);
      renderAll();
    });
  });
  tbl.querySelectorAll('[data-field]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const acc = state.accounts.find(a=>a.id===el.dataset.id);
      if(!acc) return;
      const before = acc[el.dataset.field];
      let val = el.value;
      if(el.dataset.field==='unit') val = ensureUnit(val);
      if(el.dataset.field==='username'){
        val = val.trim();
        if(val && state.accounts.some(o=>o.id!==acc.id && o.username && o.username.toLowerCase()===val.toLowerCase())){
          toast(`Tài khoản "${val}" đã được dùng cho người khác — chọn tên khác`);
          el.value = before||''; return;
        }
      }
      if(el.dataset.field==='password'){
        // Ô này luôn hiển thị rỗng (không có gì để lộ ra F12) — chỉ khi Admin thực sự gõ chữ mới mới đổi.
        await setAccountPassword(acc, val);

        renderAll();

  tbl.querySelectorAll('[data-toggle-pw]').forEach(btn=>{

    btn.addEventListener('click', ()=>{
      const acc = state.accounts.find(a=>a.id===btn.dataset.clearPw);
      if(!acc) return;
      confirmModal(`Xoá mật khẩu của tài khoản "${acc.name}"? Sau đó đăng nhập không cần mật khẩu.`, async ()=>{
        await setAccountPassword(acc, '');
        logActivity('update','Tài khoản', `Sửa tài khoản "${acc.name}" (xoá mật khẩu)`);
        toast('Đã xoá mật khẩu');
        renderAll();

  tbl.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const acc = state.accounts.find(a=>a.id===btn.dataset.del);
      if(state.accounts.filter(a=>a.role==='Admin').length<=1 && acc.role==='Admin'){

      confirmModal(`Xoá tài khoản "${acc.name}"?`, ()=>{

        logActivity('delete','Tài khoản', `Xoá tài khoản "${acc.name}"`);
        toastUndo('Đã xoá tài khoản "'+acc.name+'"', trashId);
        renderAll();
      });
    });
  });

  const assignedUnits = new Set(state.accounts.flatMap(a=>accountUnits(a)));
  const unassigned = state.units.filter(u=>!assignedUnits.has(u));
  const box = document.getElementById('unassignedUnitsBox');
  box.innerHTML = state.units.length===0
    ? `<div class="helper">Chưa có đơn vị nào trong hệ thống. Gõ tên đơn vị ở ô "Đơn vị phụ trách" phía trên để tự tạo, hoặc thêm ở tab Cài đặt.</div>`
    : unassigned.length===0
    ? `<div class="helper">Mọi đơn vị đều đã có ít nhất 1 tài khoản phụ trách. Quản lý/xoá đơn vị ở tab Cài đặt, hoặc bấm ✕ ngay dưới đây.</div>
       <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${state.units.map(u=>`
         <span class="tag" style="display:inline-flex;align-items:center;gap:6px">${escHtml(u)}<button class="row-del" data-del-unit-acct="${escAttr(u)}" title="Xoá đơn vị ${escAttr(u)}" style="padding:0 4px">✕</button></span>`).join('')}</div>`
    : `<div style="display:flex;flex-wrap:wrap;gap:6px">${unassigned.map(u=>`
         <span class="tag" style="display:inline-flex;align-items:center;gap:6px">${escHtml(u)}<button class="row-del" data-del-unit-acct="${escAttr(u)}" title="Xoá đơn vị ${escAttr(u)}" style="padding:0 4px">✕</button></span>`).join('')}</div>
       <div class="helper">${unassigned.length} đơn vị chưa có tài khoản nào phụ trách — sửa cột "Đơn vị phụ trách" ở bảng trên để gán, hoặc bấm ✕ để xoá hẳn đơn vị không dùng nữa.</div>`;
  document.querySelectorAll('[data-del-unit-acct]').forEach(btn=>{
    btn.addEventListener('click', ()=>{

        : `Xoá đơn vị "${u}" khỏi danh sách?`;
      confirmModal(msg, ()=>{
        deleteUnit(u);
        toast('Đã xoá đơn vị "'+u+'"');
        renderAll();
      });
    });
  });
}

function renderActivityLog(c){
  const log = combinedActivityLog();
  setTitle('Nhật ký hoạt động', log.length+' thao tác gần nhất trên toàn hệ thống');
  const users = ['Tất cả', ...new Set(log.map(l=>l.userName))];
  let visibleCount = 300;
  let keyword = '';
  let filterUser = 'Tất cả';
  c.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div><h2>Lịch sử thao tác</h2><div class="desc">Ghi lại mọi thêm/sửa/xoá trên toàn hệ thống, mới nhất trước</div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <input id="logKeyword" placeholder="Tìm theo từ khoá (khu vực, chi tiết, người...)" style="min-width:230px">
          <select id="logUserFilter">${users.map(u=>`<option>${escHtml(u)}</option>`).join('')}</select>
        </div>
      </div>
      <div class="panel-body flush"><div class="tbl-wrap"><table class="data" id="logTable"></table></div></div>
      <div class="panel-body" id="logMoreBox" style="display:none;text-align:center">
        <button class="btn btn-ghost" id="logMoreBtn">Xem thêm</button>
      </div>
    </div>
  `;
  function filteredLog(){
    const kw = keyword.trim().toLowerCase();
    return log.filter(l=>{
      if(filterUser!=='Tất cả' && l.userName!==filterUser) return false;
      if(kw){
        const hay = [l.userName, l.role, l.entity, l.action, l.detail].join(' ').toLowerCase();
        if(!hay.includes(kw)) return false;
      }
      return true;
    });
  }
  function draw(){
    const all = filteredLog();
    const rows = all.slice(0, visibleCount);
    const tbl = document.getElementById('logTable');
    const moreBox = document.getElementById('logMoreBox');
    if(rows.length===0){
      tbl.innerHTML = '';
      tbl.style.display = 'none';
      moreBox.style.display = 'none';
      tbl.insertAdjacentHTML('afterend', `<div class="empty" id="logEmptyMsg"><div class="big">Không có hoạt động nào khớp bộ lọc</div></div>`);
      return;
    }
    const oldEmpty = document.getElementById('logEmptyMsg'); if(oldEmpty) oldEmpty.remove();
    tbl.style.display = '';
    tbl.innerHTML = `
      <thead><tr><th>Thời gian</th><th>Người thực hiện</th><th>Khu vực</th><th>Hành động</th><th class="wrap">Chi tiết</th></tr></thead>
      <tbody>${rows.map(l=>{
        const t = new Date(l.ts);
        const actionLabel = l.action==='create'?'Thêm':l.action==='update'?'Sửa':'Xoá';
        return `<tr class="log-row">
          <td>${t.toLocaleString('vi-VN')}</td>
          <td class="who">${escHtml(l.userName)} <span class="role-badge ${roleBadgeClass(l.role)}">${escHtml(l.role)}</span></td>
          <td>${escHtml(l.entity)}</td>
          <td><span class="action-badge ${l.action}">${actionLabel}</span></td>
          <td class="wrap">${escHtml(l.detail||'')}</td>
        </tr>`;
      }).join('')}</tbody>`;
    if(all.length > rows.length){
      moreBox.style.display = '';
      document.getElementById('logMoreBtn').textContent = `Xem thêm 300 dòng (còn ${all.length-rows.length} dòng khớp bộ lọc)`;
    } else {
      moreBox.style.display = 'none';
    }
  }
  draw();
  document.getElementById('logUserFilter').addEventListener('change', e=>{ filterUser=e.target.value; visibleCount=300; draw(); });
  document.getElementById('logKeyword').addEventListener('input', e=>{ keyword=e.target.value; visibleCount=300; draw(); });
  document.getElementById('logMoreBtn').addEventListener('click', ()=>{ visibleCount+=300; draw(); });
}

// Chuyển toàn bộ mật khẩu đang lưu dạng chữ thô (account.password, kể cả ADMIN_PASSWORD mặc định của Admin
// gốc) sang dạng đã băm SHA-256 + salt riêng — chạy đúng 1 lần, tự động, không cần ai đặt lại mật khẩu.
async function migratePasswordsV1(){
  if(state.__pwHashMigrationV1) return false;
  state.__pwHashMigrationV1 = true;
  let changed = false;
  for(const acc of state.accounts){
    if(acc.passwordHash){ delete acc.password; continue; } // đã băm rồi, chỉ dọn field thô nếu còn sót
    const plain = acc.password || (acc.role==='Admin' ? ADMIN_PASSWORD : '');
    if(plain){ await setAccountPassword(acc, plain); changed = true; }
    else { delete acc.password; }
  }
  if(changed) logActivity('update','Tài khoản', 'Tự động chuyển mật khẩu sang dạng đã băm (SHA-256) — không còn lưu dạng chữ thô');
  return changed;
}
// Chuyển Nhật ký hoạt động & Thùng rác từ 1 mảng gộp chung (state.activityLog/state.trash, nằm trong nhánh
// /shared — tải về cho MỌI tài khoản bất kể module) sang tách riêng theo từng module (activityLogNcc/Nh/Bh/
// Shared, trashNcc/Nh/Bh/Shared — mỗi nhánh chỉ chứa đúng phần của module đó) — vá lỗ hổng: trước đây 1 tài
// khoản chỉ được cấp 1 module (hoặc tài khoản Đối tác) vẫn vô tình tải về TOÀN BỘ log/thùng rác của module
// khác qua nhánh /shared, dù giao diện có ẩn đúng (chỉ Admin xem được 2 tab đó) — dữ liệu vẫn nằm sẵn trong
// bộ nhớ trình duyệt, xem được qua Console. Cần đủ cả 4 nhánh (ncc/nh/bh/shared) nên chỉ Admin chạy đúng
// được — gọi hàm này khi currentRole()==='Admin'. Chạy 1 lần, an toàn khi gọi lại (không còn gì để chuyển).
function migrateActivityLogTrashSplitV1(){
  let changed = false;
  const oldLog = state.activityLog;
  if(Array.isArray(oldLog) && oldLog.length){
    oldLog.forEach(entry=>{
      const key = activityLogKeyFor(moduleOfLogEntity(entry.entity));
      if(!Array.isArray(state[key])) state[key] = [];
      state[key].push(entry);
    });
    changed = true;
  }
  const oldTrash = state.trash;
  if(Array.isArray(oldTrash) && oldTrash.length){
    oldTrash.forEach(entry=>{
      const key = trashKeyFor(moduleOfArrName(entry.arrName));
      if(!Array.isArray(state[key])) state[key] = [];
      state[key].push(entry);
    });
    changed = true;
  }
  if(changed){
    ['activityLogNcc','activityLogNh','activityLogBh','activityLogShared'].forEach(k=>{
      if(Array.isArray(state[k])){ state[k].sort((a,b)=>(b.ts||'').localeCompare(a.ts||'')); if(state[k].length>500) state[k].length=500; }
    });
    TRASH_KEYS.forEach(k=>{
      if(Array.isArray(state[k])){ state[k].sort((a,b)=>(b.deletedAt||'').localeCompare(a.deletedAt||'')); if(state[k].length>300) state[k].length=300; }
    });
    logActivity('update','Cài đặt', 'Tự động tách Nhật ký hoạt động & Thùng rác theo từng module (vá rò rỉ dữ liệu chéo module)');
  }
  delete state.activityLog;
  delete state.trash;
  return changed;
}
// Chuyển Hợp đồng & Yêu cầu/Trao đổi từ chỗ LỒNG SẴN bên trong từng object NCC/NH/BH (obj.contracts,
// obj.requests) sang bản ghi độc lập riêng (state.contracts/bankContracts/insContracts,
// state.requests/bankRequests/insRequests — mỗi bản ghi tự mang supplierId/bankId/insurerId) — để đồng bộ
// Firebase theo TỪNG BẢN GHI như Doanh số, thay vì phải kéo cả cục hợp đồng+tin nhắn mỗi khi động vào 1 NCC
// bất kỳ. Chỉ chuyển đúng phần module đã thực sự tải về (hasModuleAccess) — tài khoản chỉ có 1-2 module sẽ
// không đụng tới module chưa tải, tránh ghi đè nhầm dữ liệu module khác bằng mảng rỗng. Chạy lại vô hại
// (không còn gì lồng sẵn thì coi như không đổi gì).
function migrateContractsRequestsToRecordsV1(){
  let changed = false;
  const moves = [
    {mod:'ncc', objs: state.suppliers, idField:'supplierId', ctArr:'contracts', reqArr:'requests'},
    {mod:'nh',  objs: state.banks,     idField:'bankId',     ctArr:'bankContracts', reqArr:'bankRequests'},
    {mod:'bh',  objs: state.insurers,  idField:'insurerId',  ctArr:'insContracts',  reqArr:'insRequests'},
  ];
  moves.forEach(({mod, objs, idField, ctArr, reqArr})=>{
    if(!hasModuleAccess(mod, currentUser()) || !Array.isArray(objs)) return;
    if(!Array.isArray(state[ctArr])) state[ctArr] = [];
    if(!Array.isArray(state[reqArr])) state[reqArr] = [];
    objs.forEach(o=>{
      if(Array.isArray(o.contracts) && o.contracts.length){
        o.contracts.forEach(ct=> state[ctArr].push({...ct, [idField]: o.id}));
        changed = true;
      }
      if(Array.isArray(o.requests) && o.requests.length){
        o.requests.forEach(r=> state[reqArr].push({...r, [idField]: o.id}));
        changed = true;
      }
      delete o.contracts; delete o.requests; // dọn field cũ dù có gì để chuyển hay không, tránh sót lại object rỗng []
    });
  });
  if(changed) logActivity('update','Cài đặt', 'Tự động tách Hợp đồng & Yêu cầu/Trao đổi thành bản ghi riêng (không còn lồng trong từng NCC/NH/BH)');
  return changed;
}

(async function init(){
  // Đóng menu tài khoản (Đổi mật khẩu / Đăng xuất) khi bấm ra ngoài — gắn đúng 1 lần, không phụ
  // thuộc vào renderUserChip() để tránh cộng dồn listener sau mỗi lần renderAll().
  document.addEventListener('click', (e)=>{
    const menu = document.getElementById('userMenu');
    if(menu && menu.classList.contains('open') && !e.target.closest('.user-chip-wrap')) menu.classList.remove('open');
    const pmenu = document.getElementById('periodFilterMenu');
    if(pmenu && pmenu.classList.contains('open') && !e.target.closest('.period-filter-wrap')) pmenu.classList.remove('open');
  });
  // Cảnh báo trước khi đóng tab/rời trang nếu vẫn còn thay đổi chưa kịp lưu xong (đang trong 800ms debounce
  // hoặc lượt ghi Firebase đang chạy dở) — tránh mất đúng thao tác cuối cùng nếu đóng tab quá nhanh.
  window.addEventListener('beforeunload', (e)=>{
    if(!pendingSave) return;
    e.preventDefault();
    e.returnValue = '';
  });
  // Ghi lại lỗi runtime (nếu có) vào Nhật ký hoạt động để Admin biết mà kiểm tra, thay vì chỉ nằm im
  // trong Console trình duyệt của đúng người gặp lỗi đó (không ai khác biết để xử lý).
  window.addEventListener('error', (e)=>{
    try{ logActivity('update','Lỗi hệ thống', `${e.message||'Lỗi không rõ'} (${(e.filename||'').split('/').pop()}:${e.lineno||'?'})`); saveState(); }catch(err){}
  });
  // Theo dõi hoạt động để tự đăng xuất sau 10 phút không thao tác (xem resetInactivityTimer/autoLogoutIdle) —
  // {passive:true} vì chỉ đọc sự kiện, không cần gọi preventDefault, giúp cuộn trang mượt hơn.
  ['mousemove','keydown','mousedown','touchstart','scroll'].forEach(evt=>{
    document.addEventListener(evt, resetInactivityTimer, {passive:true});
  });
  window.addEventListener('unhandledrejection', (e)=>{
    try{ logActivity('update','Lỗi hệ thống', 'Promise bị từ chối: '+(e.reason && e.reason.message ? e.reason.message : String(e.reason))); saveState(); }catch(err){}
  });
  document.getElementById('globalSearchBtn').addEventListener('click', ()=>{
    if(!currentUser()){ return; } // chưa đăng nhập thì chưa có gì để tìm
    openGlobalSearch();
  });
  // Sidebar trên di động: mặc định ẩn (trượt ra khi bấm nút ☰), có lớp phủ tối để bấm ra ngoài là đóng lại,
  // và tự đóng ngay khi chọn xong 1 mục trong menu (đỡ phải tự bấm đóng sau khi điều hướng xong).
  function closeMobileSidebar(){
    document.querySelector('.sidebar').classList.remove('mobile-open');
    document.getElementById('sidebarBackdrop').classList.remove('show');
  }
  document.getElementById('sidebarToggleBtn').addEventListener('click', ()=>{
    document.querySelector('.sidebar').classList.add('mobile-open');
    document.getElementById('sidebarBackdrop').classList.add('show');
  });
  document.getElementById('sidebarBackdrop').addEventListener('click', closeMobileSidebar);
  document.getElementById('navList').addEventListener('click', (e)=>{
    if(e.target.closest('.nav-item')) closeMobileSidebar();
  });
  document.getElementById('periodFilterBtn').addEventListener('click', (e)=>{
    e.stopPropagation();
    if(!currentUser()) return;
    const menu = document.getElementById('periodFilterMenu');
    const willOpen = !menu.classList.contains('open');
    if(willOpen) renderPeriodFilterMenu();
    menu.classList.toggle('open', willOpen);
  });
  // Luôn có sẵn 1 bộ khung dữ liệu đầy đủ (mẫu) TRƯỚC khi tải dữ liệu thật — để subscribeBranch() có chỗ
  // gộp từng nhánh vào ngay khi tải xong (đặc biệt cần thiết cho luồng Firebase — xem loadShared()).
  state = seedState();
  const [shared, session] = await Promise.all([loadShared(), loadSession()]);
  // shared === 'firebase' -> nhánh 'shared' đã được gộp thẳng vào `state` bên trong loadShared() rồi.
  // shared === object -> tầng dự phòng (không Firebase), trả nguyên khối kiểu cũ, gộp đè lên state đã seed.
  // shared === null -> chưa từng có dữ liệu nào, giữ nguyên state mẫu.
  if(shared && shared!=='firebase') Object.assign(state, shared);
  if(!state.accounts || state.accounts.length===0) state.accounts = seedState().accounts; // không bao giờ để trống hẳn -> khoá đăng nhập của mọi người
  currentUserId = (session && session.currentUserId && state.accounts.some(a=>a.id===session.currentUserId))
    ? session.currentUserId : null;
  // Biết đang đăng nhập là ai rồi -> tải thêm đúng nhánh module được cấp (nếu đang dùng Firebase); Admin
  // luôn tải đủ cả 3, tài khoản khác chỉ tải đúng module mình dùng — đây chính là phần "tách đồng bộ theo
  // module" giúp giảm băng thông cho tài khoản chỉ dùng 1-2 module.
  await syncBranchesForCurrentUser();
  // Tự động đưa "Ngày báo cáo" (state.reportDate, nhánh NCC) về đúng hôm nay mỗi khi mở app, NẾU đang bị
  // "kẹt" ở 1 ngày cũ hơn hôm nay — đây chính là nguyên nhân từng khiến các mốc CK có Ngày bắt đầu mới
  // (VD 01/09/2026) bị lọc mất khỏi mọi phép tính dù doanh số đã lên đủ (baseTierPolicies() so sánh theo
  // đúng field này). Chỉ bump lên khi CHẮC CHẮN đã có dữ liệu NCC thật trong tay (đã tải xong nhánh 'ncc'
  // qua Firebase, hoặc đang ở tầng dự phòng không Firebase nên state đã đầy đủ ngay từ đầu) — tránh lỡ ghi
  // đè bằng dữ liệu mẫu (seed) đang tạm nằm trong state lúc chưa tải xong. Vẫn cho sửa tay bình thường sau
  // đó ở ô "Ngày báo cáo" (tab Theo dõi mốc CK) — chỉ áp lại đúng 1 lần mỗi lần mở app, không tự nhảy tiếp
  // trong lúc đang dùng (để không phá ngày người dùng đang cố tình chọn xem lùi về quá khứ).
  if(state.reportDate && state.reportDate < todayISO() && (fb.status!=='connected' || fb.loaded.ncc)){
    const oldReportDate = state.reportDate;
    state.reportDate = todayISO();
    logActivity('update','Theo dõi mốc CK', `Tự động cập nhật Ngày báo cáo → ${state.reportDate} (trước đó ${oldReportDate}, do mở app ở ngày mới)`);
    saveState();
  }
  if(await migratePasswordsV1()) saveState();
  if(currentRole()==='Admin' && migrateActivityLogTrashSplitV1()) saveState(); // cần đủ cả 4 nhánh nên chỉ Admin chạy được đúng
  if(migrateContractsRequestsToRecordsV1()) saveState();
  setStoragePill(storageMode);
  resetInactivityTimer(); // nếu phiên đăng nhập cũ còn hiệu lực (đã có currentUserId), bắt đầu đếm luôn từ lúc mở trang
  renderAll();
})();
</script>
</body>
</html>
