        <td>${escHtml(r.topUnit)}</td>
        ${partnerAcc?'':`<td>${r.total===0?'—': (r.share>=0.5? '<span class="stamp warn">Xem xét đàm phán riêng</span>':'<span class="stamp muted">Theo dõi</span>')}</td>`}
      </tr>`).join('')}</tbody>`;
  wireStickyHeaderRows(tbl);
}

/* ---------------------------- Đối soát CK ---------------------------- */
const RECON_PAY_METHODS = ['Chuyển khoản','Tiền mặt','Trừ công nợ','Khác'];

/* Chuẩn hoá 1 kỳ đối soát sang mô hình "Sổ nhận tiền" (nhiều dòng thanh toán) thay vì 1 số "Đã nhận" gõ tay.
   Nếu kỳ cũ (từ trước khi có tính năng này) đã có sẵn r.received > 0, tự chuyển thành 1 dòng thanh toán
   đầu tiên để không mất dữ liệu đã nhập trước đó. */
function ensureReconciliationPayments(r){
  if(!Array.isArray(r.payments)){
    const legacy = Number(r.received)||0;
    r.payments = legacy>0 ? [{
      id: uid('pay'), date: r.toDate||todayISO(), amount: legacy,
      method:'Chuyển khoản', note:'Chuyển từ dữ liệu "Đã nhận" cũ', createdBy: null,
    }] : [];
  }
  return r.payments;
}
function reconReceivedTotal(r){
  return ensureReconciliationPayments(r).reduce((sum,p)=> sum+(Number(p.amount)||0), 0);
}
/* Trạng thái đối soát giờ SUY RA tự động từ số tiền đã nhận thực tế so với CK phải hưởng,
   không cho chọn tay nữa — tránh tình trạng Trạng thái nói một đằng, số liệu nói một nẻo. */
function reconStatus(totalDue, receivedTotal){
  if(totalDue<=0) return {label:'Chưa có CK', cls:'muted'};
  if(receivedTotal<=0) return {label:'Chưa đối soát', cls:'muted'};
  if(receivedTotal < totalDue) return {label:'Đang xử lý', cls:'pending'};
  if(receivedTotal > totalDue) return {label:'Nhận vượt', cls:'warn'};
  return {label:'Đã nhận đủ', cls:'ok'};
}

/* ---------------------------- Chốt kỳ đối soát (khoá sửa/xoá hồ sơ nguồn) ----------------------------
   Dùng chung cho cả 3 module: NCC (idField:'supplierId', list: state.reconciliations),
   Ngân hàng ('bankId', state.bankReconciliations), Bảo hiểm ('insurerId', state.insReconciliations).
   Sau khi "Chốt" 1 kỳ: số liệu quan trọng được SNAPSHOT (đóng băng) vào chính kỳ đó, đồng thời mọi hồ sơ
   nguồn (Doanh số / Sổ hồ sơ vay / Sổ hợp đồng bảo hiểm) cùng đối tác và có ngày nằm trong khoảng
   Từ ngày–Đến ngày của kỳ sẽ bị KHOÁ sửa/xoá với mọi vai trò TRỪ Admin. Chỉ Admin được sửa hồ sơ đã khoá,
   và chỉ Admin được "Mở khoá" (gỡ khoá áp dụng cho CẢ KỲ, không mở lẻ từng hồ sơ). */
function isDateInRange(dateStr, fromStr, toStr){
  const d = toDate(dateStr), from = toDate(fromStr), to = toDate(toStr);
  if(!d || !from || !to) return false;
  return d>=from && d<=to;
}
// Tìm kỳ đối soát ĐÃ CHỐT đang khoá 1 hồ sơ cụ thể (nếu có).
function lockingReconOf(t, reconList, idField){
  if(!Array.isArray(reconList) || !t) return null;
  return reconList.find(r=> r.locked && r[idField]===t[idField] && isDateInRange(t.date, r.fromDate, r.toDate)) || null;
}
// Hồ sơ có đang bị khoá sửa/xoá với vai trò hiện tại không (Admin luôn được sửa hồ sơ đã khoá).
function isRecordLockedForMe(t, reconList, idField){
  if(currentRole()==='Admin') return false;
  return !!lockingReconOf(t, reconList, idField);
}
function lockReconciliation(r, snapshot, entityName, label){
  r.locked = true; r.lockedAt = new Date().toISOString(); r.lockedBy = currentUserId; r.lockSnapshot = snapshot;
  logActivity('update', entityName, `🔒 Chốt kỳ "${label}" — khoá sửa/xoá hồ sơ nguồn trong kỳ`);
}
function unlockReconciliation(r, entityName, label){
  r.locked = false; r.unlockedAt = new Date().toISOString(); r.unlockedBy = currentUserId;
  logActivity('update', entityName, `🔓 Mở khoá kỳ "${label}" — cho phép sửa/xoá hồ sơ trở lại`);
}
// Ghi chú cảnh báo khi số liệu hiện tại (tính lại real-time) đã lệch so với lúc chốt — chỉ hiện khi đã chốt.
function lockMismatchNote(r, liveDue){
  if(!r.locked || !r.lockSnapshot) return '';
  const before = Math.round(Number(r.lockSnapshot.totalDue)||0);
  const after = Math.round(Number(liveDue)||0);
  if(before===after) return '';
  return `<div style="font-size:10px;font-weight:400;color:var(--rust)">⚠ Lệch so với lúc chốt (${fmt(before)}đ) — Admin đã sửa hồ sơ sau khi chốt</div>`;
}
// Nút "Chốt kỳ" / badge+nút "Mở khoá" hiển thị ở cột Chốt của bảng kỳ đối soát.
function lockActionCellHTML(r, editable){
  if(r.locked){

    if(currentRole()==='Admin'){
      return `${badge}<br><button class="btn btn-ghost" data-unlock-recon="${r.id}" style="padding:1px 8px;font-size:11px;margin-top:4px">Mở khoá</button>`;
    }
    return badge;
  }

}
// Icon khoá hiển thị trên từng dòng hồ sơ (Sổ chứng từ / Sổ hồ sơ vay / Sổ hợp đồng) khi bị 1 kỳ đã chốt khoá lại.
// moduleKey dùng để nút "Mở khoá" trên hồ sơ biết phải mở kỳ nào, thuộc mảng nào.
function lockIconHTML(lockR, moduleKey){

  const title = `Hồ sơ thuộc kỳ đối soát "${lockR.period}" (${lockR.fromDate} → ${lockR.toDate}) đã chốt — ${isAdmin?'bấm để mở khoá cả kỳ':'chỉ Admin được sửa/xoá'}`;
  if(isAdmin){
    return `<button data-unlock-tx="${moduleKey}|${lockR.id}" title="${escAttr(title)}" style="border:none;background:none;cursor:pointer;padding:0 2px;font-size:13px" class="row-lock-toggle">🔒</button>`;
  }
  return `<span title="${escAttr(title)}" style="font-size:13px;cursor:default">🔒</span>`;
}
// Gắn sự kiện cho các icon 🔒 mở khoá trên bảng hồ sơ (Admin bấm để mở khoá cả kỳ đang khoá dòng đó).
function wireLockToggle(tbl){
  const MODULES = {
    ncc: {list: ()=>state.reconciliations, entity:'Đối soát CK'},
    nh:  {list: ()=>state.bankReconciliations, entity:'Đối soát CK (NH)'},
    bh:  {list: ()=>state.insReconciliations, entity:'Đối soát CK (Bảo hiểm)'},
  };
  tbl.querySelectorAll('[data-unlock-tx]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [moduleKey, reconId] = btn.dataset.unlockTx.split('|');
      const cfg = MODULES[moduleKey]; if(!cfg) return;
      const list = cfg.list();
      const r = list.find(x=>x.id===reconId); if(!r) return;
      confirmModal(`Hồ sơ này thuộc kỳ đối soát "${r.period}" đã chốt. Mở khoá CẢ KỲ này để sửa/xoá hồ sơ?`, ()=>{
        unlockReconciliation(r, cfg.entity, r.period);
        toast('Đã mở khoá kỳ "'+r.period+'"');
        renderAll();
      });
    });
  });
}

function reconCalc(r){
  const from = toDate(r.fromDate), to = toDate(r.toDate);
  if(!r.supplierId || !from || !to) return {revenue:0, rate:0, discount:0, bonus:0, totalDue:0, diff:0, stillOwed:0};
  // Dùng đúng "Phương pháp áp dụng" (hồi tố toàn bộ / chỉ phần vượt mốc) và tôn trọng "Ngày kết thúc"
  // của từng mốc — đánh giá hiệu lực mốc TẠI THỜI ĐIỂM CUỐI KỲ đối soát (to), không phải hôm nay,
  // để đối soát 1 kỳ trong quá khứ vẫn đúng ngay cả khi mốc đó đã hết hạn ở hiện tại.
  // groupedDiscountForPeriod() tự cộng dồn đúng theo từng NHÓM áp dụng nếu NCC có chia nhóm (xem
  // supplierPolicyGroups) — NCC không chia nhóm thì kết quả y hệt cách tính cũ (1 nhóm duy nhất = cả NCC).
  const g = groupedDiscountForPeriod(r.supplierId, from, to, to);
  const method = calcMethodOf(r.supplierId, to); // chỉ để hiển thị tham khảo — khi có nhiều nhóm, mỗi nhóm có thể dùng phương pháp khác nhau, số này chỉ đại diện nhóm đầu tiên
  const ref = toDate(state.reportDate) || new Date();
  const bonus = bonusAmount(r.supplierId, ref);
  const totalDue = g.discount + bonus;
  const confirmed = Number(r.confirmed)||0;
  const received = reconReceivedTotal(r);
  return {revenue: g.revenue, rate: g.rate, discount: g.discount, bonus, totalDue, diff: received-totalDue, stillOwed: Math.max(0, totalDue-received), received, method, groupCount: g.groupCount};
}

/* ============================================================================
   MODULE NGÂN HÀNG — Danh mục NH · Chính sách CK (điều kiện vay) · Doanh số
   (hồ sơ vay/giải ngân) · Phân bổ đơn vị · Đối soát CK (hoa hồng)
   Cùng cấu trúc thao tác với module "NCC Dịch vụ Ô tô - Xe máy" nhưng dùng
   state.banks/bankPolicies/bankTransactions/bankReconciliations riêng, vì
   chính sách ngân hàng đổi theo THÁNG (không theo mốc doanh số luỹ kế) và
   Hoa hồng tính trực tiếp trên số tiền GIẢI NGÂN, không có luỹ kế mốc.
   ============================================================================ */
function bankById(id){ return state.banks.find(b=>b.id===id); }
function insurerById(id){ return state.insurers.find(x=>x.id===id); }
function monthKey(dateStr){ return (dateStr||todayISO()).slice(0,7); }
function monthLabel(mk){
  if(!mk) return '—';
  const [y,m] = mk.split('-');
  return 'Tháng '+Number(m)+'/'+y;
}
/* Chính sách áp dụng cho 1 NH tại 1 ngày = dòng chính sách CÙNG THÁNG hoặc THÁNG GẦN NHẤT
   trước đó (chính sách tháng trước vẫn có hiệu lực cho tới khi có chính sách tháng mới hơn). */
// Tên gói vay mặc định — dùng cho mọi chính sách/hồ sơ ĐÃ CÓ TỪ TRƯỚC (chưa từng chọn gói vay), để không
// mất/sai lệch dữ liệu cũ khi bổ sung tính năng "nhiều gói vay, mỗi gói 1 mức hoa hồng riêng".
const DEFAULT_BANK_PRODUCT = 'Chưa phân loại';
// Danh sách tên gói vay đã từng cấu hình cho đúng 1 ngân hàng — dùng cho ô chọn gói ở form Ghi nhận hồ sơ
// vay và form Thêm chính sách (gợi ý, không giới hạn phải chọn đúng cái có sẵn — gõ tên mới là tự thêm gói).
function bankProductsFor(bankId){
  const set = new Set([DEFAULT_BANK_PRODUCT]);
  state.bankPolicies.filter(p=>p.bankId===bankId).forEach(p=>{ set.add(p.product || DEFAULT_BANK_PRODUCT); });
  return Array.from(set);
}
function activeBankPolicy(bankId, dateStr, product){
  const mk = monthKey(dateStr);
  const prod = product || DEFAULT_BANK_PRODUCT;
  const rows = state.bankPolicies.filter(p=>p.bankId===bankId && (p.product||DEFAULT_BANK_PRODUCT)===prod && p.month<=mk).sort((a,b)=> b.month.localeCompare(a.month));
  return rows[0] || null;
}
function bankTxCommission(t){
  if(t.status!=='Đã giải ngân') return 0;
  const pol = activeBankPolicy(t.bankId, t.date, t.product);
  if(!pol) return 0;
  return (Number(t.loanAmount)||0) * (Number(pol.commissionRate)||0);
}
function bankLoanSum(bankId, from, to, unit){
  let total=0;
  for(const t of state.bankTransactions){
    if(t.bankId!==bankId || t.status!=='Đã giải ngân') continue;
    if(unit && t.unit!==unit) continue;
    const d = toDate(t.date);
    if(from && d<from) continue;
    if(to && d>to) continue;
    total += Number(t.loanAmount)||0;
  }
  return total;
}
// Đếm số hồ sơ vay THỰC SỰ khớp điều kiện (đúng NH + trạng thái "Đã giải ngân" + trong khoảng ngày) —
// dùng để hiện chú thích chẩn đoán ngay trong bảng Đối soát CK, giúp thấy ngay lý do 1 kỳ ra 0đ
// (VD: đúng ngân hàng nhưng chưa hồ sơ nào "Đã giải ngân" trong khoảng ngày đó → 0 hồ sơ khớp).
function bankTxMatchCount(bankId, from, to, unit){
  let n=0;
  for(const t of state.bankTransactions){
    if(t.bankId!==bankId || t.status!=='Đã giải ngân') continue;
    if(unit && t.unit!==unit) continue;
    const d = toDate(t.date);
    if(from && d<from) continue;
    if(to && d>to) continue;
    n++;
  }
  return n;
}
function bankCommissionSum(bankId, from, to, unit){
  let total=0;
  for(const t of state.bankTransactions){
    if(t.bankId!==bankId || t.status!=='Đã giải ngân') continue;
    if(unit && t.unit!==unit) continue;
    const d = toDate(t.date);
    if(from && d<from) continue;
    if(to && d>to) continue;
    total += bankTxCommission(t);
  }
  return total;
}
function allTimeBankLoan(bankId, unit){ return bankLoanSum(bankId,null,null,unit); }
function allTimeBankCommission(bankId, unit){ return bankCommissionSum(bankId,null,null,unit); }
function bankReconCalc(r){
  const from=toDate(r.fromDate), to=toDate(r.toDate);
  if(!r.bankId||!from||!to) return {loan:0, totalDue:0, dueForCalc:0, received:0, diff:0, stillOwed:0, matchCount:0, totalTxForBank:0};
  const loan = bankLoanSum(r.bankId, from, to);
  const totalDue = bankCommissionSum(r.bankId, from, to); // số hệ thống TỰ TÍNH từ Doanh số × Chính sách CK
  const matchCount = bankTxMatchCount(r.bankId, from, to);
  // Tổng số hồ sơ (mọi trạng thái, mọi ngày) đang gán cho đúng ngân hàng này — để phân biệt 2 tình huống:
  // "ngân hàng này chưa có hồ sơ nào cả" (totalTxForBank=0, nhiều khả năng ghi nhầm module/NH khác)
  // với "có hồ sơ nhưng không khớp trạng thái/khoảng ngày của kỳ đối soát" (totalTxForBank>0, matchCount=0).
  const totalTxForBank = state.bankTransactions.filter(t=>t.bankId===r.bankId).length;
  const confirmed = Number(r.confirmed)||0;
  // "NH xác nhận": nếu ngân hàng đã xác nhận 1 số hoa hồng cụ thể (có thể lệch với số hệ thống tự tính do
  // phí, làm tròn, điều chỉnh...) thì ƯU TIÊN dùng số NH xác nhận làm chuẩn để tính Chênh lệch/Còn phải thu.
  // Nếu NH chưa xác nhận (để 0), vẫn dùng số hệ thống tự tính như trước.
  const dueForCalc = confirmed>0 ? confirmed : totalDue;
  const received = reconReceivedTotal(r);
  return {loan, totalDue, dueForCalc, received, diff:received-dueForCalc, stillOwed:Math.max(0,dueForCalc-received), matchCount, totalTxForBank};
}

              <input id="bpf_renew" type="checkbox" style="width:auto"> Yêu cầu mua lại bảo hiểm hằng năm
            </label>
          </div>
          <div class="field" style="grid-column:1/-1"><label>Điều kiện phê duyệt cho vay</label><input id="bpf_approval" placeholder="VD: Không nợ xấu nhóm 2"></div>
          <div class="field"><label>Thời gian giải ngân</label><input id="bpf_time" placeholder="VD: Trong ngày làm việc"></div>
          <div class="field"><label>Giấy tờ giải ngân</label><input id="bpf_docs" placeholder="VD: Giấy hẹn"></div>
          <div class="field" style="grid-column:1/-1"><label>Đánh giá</label><input id="bpf_review" placeholder="Nhận xét thủ tục, hỗ trợ khách hàng..."></div>

        </div>
      </div>
    </div>` : lockedNote('Bạn đang xem ở chế độ chỉ đọc — chỉ Admin/Quản lý mới thêm/sửa chính sách.')}
    <div class="panel">
      <div class="panel-head">
        <div><h2>Tất cả chính sách theo tháng</h2>
        <div class="desc">1 ngân hàng có thể có nhiều gói vay song song trong cùng 1 tháng — mỗi gói 1 dòng, chỉ cần khác "Tên gói vay". Chính sách của 1 gói áp dụng từ tháng nhập cho tới khi có dòng chính sách tháng mới hơn của ĐÚNG gói đó.</div></div>
        <div class="field" style="max-width:220px"><label>Lọc theo tái tục hằng năm</label>
          <select id="bankPolicyRenewalFilterSel">
            <option value="">Tất cả gói vay</option>
            <option value="yes" ${bankPolicyRenewalFilter==='yes'?'selected':''}>Chỉ gói YÊU CẦU tái tục</option>
            <option value="no" ${bankPolicyRenewalFilter==='no'?'selected':''}>Chỉ gói KHÔNG yêu cầu</option>
          </select>
        </div>
      </div>
      <div class="panel-body flush"><div class="tbl-wrap"><table class="data sticky-cols-2" id="bankPolicyTable"></table></div></div>
    </div>
  `;
  document.getElementById('bankPolicyRenewalFilterSel').addEventListener('change', e=>{ bankPolicyRenewalFilter = e.target.value; renderAll(); });
  if(editable){
    document.getElementById('addBankPolicyBtn').addEventListener('click', ()=>{
      const bankId = document.getElementById('bpf_bank').value;
      if(!bankId){ toast('Cần có ngân hàng trước khi thêm chính sách'); return; }
      const month = document.getElementById('bpf_month').value || monthKey();
      const p = {
        id: uid('bp'), bankId, month,
        product: (document.getElementById('bpf_product').value||'').trim() || DEFAULT_BANK_PRODUCT,
        maxLoanRatio: (Number(document.getElementById('bpf_ratio').value)||0)/100,
        maxLoanTerm: Number(document.getElementById('bpf_term').value)||0,
        promoRateY1: (Number(document.getElementById('bpf_promo').value)||0)/100,
        marginAfterPromo: (Number(document.getElementById('bpf_margin').value)||0)/100,
        prepaymentFee: (Number(document.getElementById('bpf_prepay').value)||0)/100,
        commissionRate: (Number(document.getElementById('bpf_comm').value)||0)/100,
        annualRenewalRequired: document.getElementById('bpf_renew').checked,
        approvalCondition: document.getElementById('bpf_approval').value.trim(),
        disbursementTime: document.getElementById('bpf_time').value.trim(),
        disbursementDocs: document.getElementById('bpf_docs').value.trim(),
        review: document.getElementById('bpf_review').value.trim(),
      };
      state.bankPolicies.push(p);
      const b = bankById(bankId);
      logActivity('create','Chính sách CK (NH)', `Thêm chính sách "${p.product}" ${monthLabel(month)} cho ${b?b.name:''}`);
      toast('Đã thêm chính sách '+monthLabel(month));
      renderAll();
    });
  }

  const tbl = document.getElementById('bankPolicyTable');
  if(state.banks.length===0){
    tbl.outerHTML = `<div class="empty"><div class="big">Chưa có ngân hàng</div>Thêm ngân hàng ở tab "Danh mục NCC" trước.</div>`; return;
  }
  const allScopedPolicies = pf ? state.bankPolicies.filter(pf) : state.bankPolicies;
  if(allScopedPolicies.length===0){
    tbl.outerHTML = `<div class="empty"><div class="big">Chưa có chính sách nào</div>${editable?'Thêm chính sách ở form phía trên.':''}</div>`; return;
  }
  const scopedPolicies = allScopedPolicies
    .filter(p=> !bankPolicyRenewalFilter || (bankPolicyRenewalFilter==='yes' ? !!p.annualRenewalRequired : !p.annualRenewalRequired));
  if(scopedPolicies.length===0){
    tbl.outerHTML = `<div class="empty"><div class="big">Không có chính sách nào khớp bộ lọc</div></div>`; return;
  }
  const dis = editable?'':'disabled';
  const sorted = scopedPolicies.slice().sort((a,b)=>{
    const ba = bankById(a.bankId), bb = bankById(b.bankId);
    const bankCmp = (ba?ba.name:'').localeCompare(bb?bb.name:'');
    if(bankCmp!==0) return bankCmp;
    const prodCmp = (a.product||DEFAULT_BANK_PRODUCT).localeCompare(b.product||DEFAULT_BANK_PRODUCT);
    if(prodCmp!==0) return prodCmp;
    return b.month.localeCompare(a.month);
  });
  tbl.innerHTML = `
    <thead><tr>
      <th class="wrap">Ngân hàng</th><th class="wrap">Gói vay</th><th>Tháng</th><th class="num">Tỷ lệ vay tối đa</th><th class="num">TG vay tối đa</th>
      <th class="num">LS ưu đãi năm đầu</th><th class="num">Biên độ sau ưu đãi</th><th class="num">Phí trả trước hạn</th>
      <th class="num">Hoa hồng (trước thuế)</th><th>Tái tục hằng năm</th><th class="wrap">Phê duyệt</th><th>Giải ngân</th><th>Giấy tờ</th><th class="wrap">Đánh giá</th><th></th>
    </tr></thead>
    <tbody>${sorted.map(p=>{
      const b = bankById(p.bankId);
      return `<tr>
        <td class="wrap">${b?escHtml(b.name):'<em>(đã xoá)</em>'}</td>
        <td class="wrap"><input class="cell-edit" data-field="product" data-id="${p.id}" value="${escAttr(p.product||DEFAULT_BANK_PRODUCT)}" ${dis}></td>
        <td>${monthLabel(p.month)}</td>
        <td class="num"><input class="cell-edit num pct" data-field="maxLoanRatio" data-id="${p.id}" type="number" step="1" value="${round2(p.maxLoanRatio*100)}" ${dis} style="width:60px"></td>
        <td class="num"><input class="cell-edit num" data-field="maxLoanTerm" data-id="${p.id}" type="number" step="1" value="${p.maxLoanTerm}" ${dis} style="width:52px"> năm</td>
        <td class="num"><input class="cell-edit num pct" data-field="promoRateY1" data-id="${p.id}" type="number" step="0.01" value="${round2(p.promoRateY1*100)}" ${dis} style="width:60px"></td>
        <td class="num"><input class="cell-edit num pct" data-field="marginAfterPromo" data-id="${p.id}" type="number" step="0.01" value="${round2(p.marginAfterPromo*100)}" ${dis} style="width:60px"></td>
        <td class="num"><input class="cell-edit num pct" data-field="prepaymentFee" data-id="${p.id}" type="number" step="0.01" value="${round2(p.prepaymentFee*100)}" ${dis} style="width:60px"></td>
        <td class="num" style="font-weight:700"><input class="cell-edit num pct" data-field="commissionRate" data-id="${p.id}" type="number" step="0.01" value="${round2(p.commissionRate*100)}" ${dis} style="width:60px"></td>
        <td style="text-align:center"><input class="renew-toggle" data-id="${p.id}" type="checkbox" ${p.annualRenewalRequired?'checked':''} ${dis} title="Xe vay theo gói này phải mua lại bảo hiểm mỗi năm — dùng để tính Lịch tái tục ở module Bảo hiểm"></td>
        <td class="wrap"><input class="cell-edit" data-field="approvalCondition" data-id="${p.id}" value="${escAttr(p.approvalCondition||'')}" ${dis}></td>
        <td><input class="cell-edit" data-field="disbursementTime" data-id="${p.id}" value="${escAttr(p.disbursementTime||'')}" ${dis}></td>
        <td><input class="cell-edit" data-field="disbursementDocs" data-id="${p.id}" value="${escAttr(p.disbursementDocs||'')}" ${dis}></td>
        <td class="wrap"><input class="cell-edit" data-field="review" data-id="${p.id}" value="${escAttr(p.review||'')}" ${dis}></td>
        <td>${editable?`<button class="row-del" data-del="${p.id}">✕</button>`:''}</td>
      </tr>`;
    }).join('')}</tbody>`;
  if(editable){
    wireCellEdits(tbl, state.bankPolicies, 'Chính sách CK (NH)', p=>{ const b=bankById(p.bankId); return `${b?b.name:''} — ${p.product||DEFAULT_BANK_PRODUCT} — ${monthLabel(p.month)}`; });
    tbl.querySelectorAll('.renew-toggle').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const p = state.bankPolicies.find(x=>x.id===cb.dataset.id);
        if(!p) return;
        p.annualRenewalRequired = cb.checked;
        const b = bankById(p.bankId);
        logActivity('update','Chính sách CK (NH)', `${b?b.name:''} — ${p.product||DEFAULT_BANK_PRODUCT} — ${monthLabel(p.month)}: Yêu cầu tái tục hằng năm → ${cb.checked?'Có':'Không'}`);
        saveState();
        renderNav(); // có thể đổi số hồ sơ cần theo dõi -> cập nhật chấm cảnh báo trên menu Bảo hiểm
      });
    });
    tbl.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const p = state.bankPolicies.find(x=>x.id===btn.dataset.del);
        const b = p ? bankById(p.bankId) : null;
        confirmModal(`Xoá chính sách ${p?monthLabel(p.month):''} của "${b?b.name:''}"?`, ()=>{
          const trashId = softDelete('bankPolicies', p, 'Chính sách CK (NH)');
          logActivity('delete','Chính sách CK (NH)', `Xoá chính sách ${p?monthLabel(p.month):''} — ${b?b.name:''}`);
          toastUndo('Đã xoá chính sách', trashId);
          renderAll();
        });
      });
    });
  }
}

          <div class="field"><label>Ngân hàng</label><input id="btf_bank" list="btf_bank_list" placeholder="Chọn ngân hàng">
            <datalist id="btf_bank_list">${state.banks.map(b=>`<option value="${escAttr(b.name)}">`).join('')}</datalist>

    <div class="panel">

          <button class="btn btn-ghost" id="btxExportBtn">⬇ Xuất Excel</button>
          ${editable ? `
          <button class="btn btn-danger-ghost" id="btxDeleteSelectedBtn" disabled>🗑 Xoá mục đã chọn (<span id="btxSelectedCount">0</span>)</button>
          <button class="btn btn-danger-ghost" id="btxDeleteAllBtn" title="Xoá toàn bộ hồ sơ đang khớp bộ lọc hiện tại (không chỉ trang đang hiện) — dùng để dọn lại sau khi nhập Excel sai hàng loạt">🗑 Xoá toàn bộ đang lọc</button>` : ''}
        </div>

      <div class="panel-body flush"><div class="tbl-wrap tbl-wrap-tall"><table class="data" id="btxTable"></table></div></div>

        <button class="btn btn-ghost" id="btxMoreBtn">Xem thêm</button>
      </div>
    </div>
  `;
  wirePanelToggles(c);
  const redrawBankTxDebounced = debounce(()=>{ bankTxVisibleCount = 150; renderBankTxTable(editable); }, 300);
  const unitFFilter = document.getElementById('btxf_unit');
  if(unitFFilter && !lockedUnit) unitFFilter.addEventListener(lockedMulti?'change':'input', ()=>{ bankTxUnitFilter = unitFFilter.value; redrawBankTxDebounced(); });
  document.getElementById('btxf_bank').addEventListener('input', ()=>{ bankTxBankFilter = document.getElementById('btxf_bank').value; redrawBankTxDebounced(); });
  document.getElementById('btxf_search').addEventListener('input', ()=>{ bankTxSearchFilter = document.getElementById('btxf_search').value; redrawBankTxDebounced(); });
  const btxBadDateChk = document.getElementById('btxf_baddate');
  if(btxBadDateChk) btxBadDateChk.addEventListener('change', ()=>{ bankTxBadDateOnly = btxBadDateChk.checked; bankTxVisibleCount=150; renderBankTxTable(editable); });
  document.getElementById('btxfClearBtn').addEventListener('click', ()=>{
    bankTxBankFilter = ''; bankTxSearchFilter = ''; bankTxVisibleCount = 150; bankTxBadDateOnly = false;

    renderAll();
  });

    attachMoneyFormatting(document.getElementById('btf_amount'));
    const btfBankInput = document.getElementById('btf_bank');
    const btfProductList = document.getElementById('btf_product_list');
    function refreshBtfProductList(){
      const bank = state.banks.find(b=>b.name.trim().toLowerCase()===btfBankInput.value.trim().toLowerCase());
      btfProductList.innerHTML = (bank ? bankProductsFor(bank.id) : [DEFAULT_BANK_PRODUCT]).map(pr=>`<option value="${escAttr(pr)}">`).join('');
    }
    btfBankInput.addEventListener('input', refreshBtfProductList);
    refreshBtfProductList();
    wireInvoiceUploadField('btf', ()=> 'Doanh số NH · '+(document.getElementById('btf_bank').value||'').trim());

      const bankName = document.getElementById('btf_bank').value;
      const bank = state.banks.find(b=>b.name.trim().toLowerCase()===bankName.trim().toLowerCase());
      if(!bank){ toast(bankName.trim() ? `Không tìm thấy ngân hàng "${bankName.trim()}" — chọn đúng tên có trong danh sách gợi ý` : 'Cần chọn ngân hàng trước'); return; }

      if(amount<=0){ toast('Nhập số tiền vay'); return; }
      const unit = lockedUnit || (lockedMulti ? document.getElementById('btf_unit').value : ensureUnit(document.getElementById('btf_unit').value));
      if(!unit){ toast('Nhập tên đơn vị trước'); return; }
      const status = document.getElementById('btf_status').value;
      const btxDate = document.getElementById('btf_date').value || todayISO();
      if(currentRole()!=='Admin'){
        const lockR = lockingReconOf({bankId:bank.id, date:btxDate}, state.bankReconciliations, 'bankId');
        if(lockR){ toast(`Ngày này thuộc kỳ đối soát "${lockR.period}" đã chốt với ${bank.name} — chỉ Admin được ghi nhận thêm`); return; }
      }

        const line = `Dòng ${idx+2}`;

        if(!bank){ errors.push(`${line}: không tìm thấy ngân hàng "${bankName}"`); return; }
        const amount = parseMoneyInput(row['Số tiền vay']);
        if(amount<=0){ errors.push(`${line}: thiếu hoặc sai "Số tiền vay"`); return; }
        let unit;
        if(lockedUnit) unit = lockedUnit;
        else if(lockedMulti){
          const raw = String(row['Đơn vị']||'').trim();
          unit = lockedUnits.find(x=>x.toLowerCase()===raw.toLowerCase());
          if(!unit){ errors.push(`${line}: "Đơn vị" phải là 1 trong: ${lockedUnits.join(', ')}`); return; }
        } else {
          unit = ensureUnit(row['Đơn vị']);

        }
        const date = parseImportDate(row['Ngày']);
        if(!date){ errors.push(`${line}: không đọc được "Ngày" (giá trị đang ghi: "${row['Ngày']}") — sửa lại đúng định dạng rồi nhập lại dòng này, KHÔNG tự gán ngày hôm nay để tránh sai lệch báo cáo theo tháng`); return; }
        const statusRaw = String(row['Trạng thái']||'').trim();
        const status = BANK_TX_STATUSES.find(s=>s.toLowerCase()===statusRaw.toLowerCase()) || 'Đang xử lý';
        const product = String(row['Gói vay']||'').trim() || DEFAULT_BANK_PRODUCT;
        if(currentRole()!=='Admin'){
          const lockR = lockingReconOf({bankId:bank.id, date}, state.bankReconciliations, 'bankId');
          if(lockR){ errors.push(`${line}: ngày ${date} thuộc kỳ đối soát "${lockR.period}" đã chốt với ${bank.name} — chỉ Admin nhập được`); return; }

          vehicle: formatVehicleField(row['Biển số/xe']),

      });
      openImportPreviewModal('Xem trước nhập Excel — Doanh số Ngân hàng', previewRows, errors, ()=>{
        toInsert.forEach(rec=> state.bankTransactions.push(rec));
        logActivity('create','Doanh số (NH)', `Nhập Excel: thêm ${toInsert.length} hồ sơ vay`);
        saveState();
        toast(`Đã nhập ${toInsert.length} hồ sơ vay`);

  if(editable){

        saveState();
        toast(skipped>0 ? `Đã xoá ${deleted} hồ sơ, bỏ qua ${skipped} hồ sơ không đủ quyền/đang khoá` : `Đã xoá ${deleted} hồ sơ — xem lại ở Thùng rác nếu cần khôi phục`);
        renderAll();
      }, {danger:true});
    });
    document.getElementById('btxDeleteAllBtn').addEventListener('click', ()=>{
      const list = getFilteredBankTx();
      if(list.length===0){ toast('Không có hồ sơ nào khớp bộ lọc hiện tại để xoá'); return; }
      confirmModal(`Xoá TOÀN BỘ ${list.length} hồ sơ đang khớp bộ lọc hiện tại (không chỉ trang đang hiện)?\n\nDùng khi lỡ nhập Excel sai hàng loạt, cần dọn để nhập lại. Các hồ sơ này sẽ chuyển vào Thùng rác, có thể khôi phục lại trong 30 ngày nếu cần.`, ()=>{
        const {deleted, skipped} = bulkSoftDeleteBankTx(list.map(t=>t.id));
        if(deleted>0) logActivity('delete','Doanh số (NH)', `Xoá hàng loạt ${deleted} hồ sơ đang lọc${skipped>0?` (bỏ qua ${skipped} hồ sơ không đủ quyền/đang khoá đối soát)`:''}`);
        saveState();
        toast(skipped>0 ? `Đã xoá ${deleted} hồ sơ, bỏ qua ${skipped} hồ sơ không đủ quyền/đang khoá` : `Đã xoá ${deleted} hồ sơ — xem lại ở Thùng rác nếu cần khôi phục`);
        renderAll();
      }, {danger:true});
    });
  }
  renderBankTxTable(editable);
  const sumBox = document.getElementById('btxSummaryStats');
  if(sumBox){
    const list = getFilteredBankTx();
    const totalLoan = list.reduce((s,t)=>s+(Number(t.loanAmount)||0), 0);
    const totalComm = list.reduce((s,t)=>s+bankTxCommission(t), 0);
    sumBox.innerHTML = `
      <div class="mini-stat"><div class="mini-stat-label">Tổng số tiền vay</div><div class="mini-stat-value">${fmt(totalLoan)}đ</div></div>
      <div class="mini-stat"><div class="mini-stat-label">Hoa hồng<span title="Chỉ tính hồ sơ trạng thái Đã giải ngân, theo đúng chính sách của ngân hàng đó" style="cursor:help">ⓘ</span></div><div class="mini-stat-value">${fmt(totalComm)}đ</div></div>
      <div class="mini-stat"><div class="mini-stat-label">Số hồ sơ</div><div class="mini-stat-value">${list.length}</div></div>`;
  }
}
function getFilteredBankTx(){
  const unitFilter = (bankTxUnitFilter||'').trim().toLowerCase();
  const bankFilter = (bankTxBankFilter||'').trim().toLowerCase();
  const searchFilter = (bankTxSearchFilter||'').trim().toLowerCase();
  const me = currentUser();
  const lockedUnits = (me && me.role==='Nhân viên') ? accountUnits(me) : [];
  const pf = partnerScopeFilter('bankId');
  const all = (pf ? state.bankTransactions.filter(pf) : state.bankTransactions).slice().sort((a,b)=> b.date.localeCompare(a.date));
  return all.filter(t=>{
    if(lockedUnits.length && !lockedUnits.includes(t.unit)) return false;
    if(unitFilter && !(t.unit||'').trim().toLowerCase().includes(unitFilter)) return false;
    if(bankFilter){ const b = bankById(t.bankId); if(!b || !b.name.trim().toLowerCase().includes(bankFilter)) return false; }
    if(searchFilter){
      const hay = [t.customer, t.phone, t.vehicle, t.refCode].filter(Boolean).join(' ').toLowerCase();
      if(!hay.includes(searchFilter)) return false;
    }
    if(bankTxBadDateOnly && isValidDateStr(t.date)) return false;
    if(!periodFilterMatches(t.date)) return false;
    return true;
  });
}
// Xoá hàng loạt hồ sơ vay (chuyển vào Thùng rác — khôi phục được), tôn trọng đúng quyền xoá từng bản ghi.
function bulkSoftDeleteBankTx(ids){
  let deleted=0, skipped=0;
  ids.forEach(id=>{
    const t = state.bankTransactions.find(x=>x.id===id);
    if(!t || !canDeleteBankTx(t)){ skipped++; return; }
    softDelete('bankTransactions', t, 'Doanh số (NH)');
    deleted++;
  });
  return {deleted, skipped};
}

      e.preventDefault();

    const moreBox = document.getElementById('btxMoreBox'); if(moreBox) moreBox.style.display='none';

      ${editable ? `<th style="width:32px"><input type="checkbox" id="btxSelectAll" title="Chọn tất cả (trong trang đang hiện)"></th>` : ''}
      <th>Hồ sơ</th><th>Khách hàng</th><th class="num">Số tiền vay</th><th>Trạng thái</th><th class="num">Hoa hồng</th><th>Người nhập</th><th>Hoá đơn</th><th></th></tr></thead>
    <tbody>${rows.map(t=>{
      const b = bankById(t.bankId);
      const creator = state.accounts.find(a=>a.id===t.createdBy);
      const pol = t.status==='Đã giải ngân' ? activeBankPolicy(t.bankId, t.date, t.product) : null;
      const comm = bankTxCommission(t);
      const commCell = t.status!=='Đã giải ngân'
        ? '<span class="comm-cell zero">—</span>'
        : (pol ? `<span class="comm-cell has-value">${fmt(comm)}</span>` : `<span class="comm-cell warn-empty" title="Chưa có chính sách gói ${escAttr(t.product||DEFAULT_BANK_PRODUCT)} cho ${monthLabel(monthKey(t.date))}">0đ · chưa có CS</span>`);
      const lockR = lockingReconOf(t, state.bankReconciliations, 'bankId');
      const lockedForMe = !!lockR && currentRole()!=='Admin';
      const dis = (editable && !lockedForMe)?'':'disabled';
      const canDelRow = editable && canDeleteBankTx(t);
      return `<tr>
        ${editable ? `<td>${canDelRow?`<input type="checkbox" class="btx-chk" data-id="${escAttr(t.id)}">`:''}</td>` : ''}
        <td>
          <div class="stack-cell">
            ${editable
              ? `<input class="cell-edit mini-field" data-field="date" data-id="${t.id}" type="date" value="${t.date}" ${dis}>`
              : `<div class="mini-field">${new Date(t.date+'T00:00:00').toLocaleDateString('vi-VN')}</div>`}

  if(bankScope.length===0){ tbl.outerHTML = `<div class="empty"><div class="big">Chưa có ngân hàng</div></div>`; return; }
  const {from: pfFrom, to: pfTo} = periodFilterDateObjects();
  const rows = bankScope.map(b=>{
    const perUnit = state.units.map(u=>bankLoanSum(b.id, pfFrom, pfTo, u));
    const total = perUnit.reduce((a,x)=>a+x,0);
    const commTotal = bankCommissionSum(b.id, pfFrom, pfTo);
    const max = Math.max(0,...perUnit);
    const share = total>0 ? max/total : 0;
    const topIdx = perUnit.indexOf(max);
    return {b, perUnit, total, commTotal, share, topUnit: total>0?state.units[topIdx]:'—'};
  });
  tbl.innerHTML = `
    ${matrixColgroupHTML(state.units.length, [11, 11, 13])}
    <thead>
    <tr>
      <th>Ngân hàng</th>${state.units.map(u=>matrixUnitHeaderCell(u)).join('')}

        <td class="num">${fmt(r.commTotal)}</td>
        <td>${escHtml(r.topUnit)}</td>
      </tr>`).join('')}</tbody>`;
  wireStickyHeaderRows(tbl);
}

/* ---------------------------- Module đang xây dựng (Ngân hàng / Bảo hiểm) ---------------------------- */
/* ============================================================================
   BẢO HIỂM (NCC bán bảo hiểm xe: BHVC/BHDS)
   Thiết kế dữ liệu:
   - insurers: danh mục hãng/đại lý bảo hiểm — hoa hồng chuẩn BHVC (vật chất xe) & BHDS (dân sự),
     điều khoản nổi bật (mã BS) để tra nhanh quyền lợi đặc thù.
   - insRates: BIỂU PHÍ — mỗi dòng = 1 khoảng "Giá trị xe" của 1 NCC, có sẵn 4 cột tỷ lệ phí (%)
     theo "Tuổi xe" (<3 / 3-6 / 6-10 / ≥10 năm). Để trống ô nào nghĩa là NCC đó CHƯA báo giá mốc tuổi đó
     — khoa học ở chỗ: 1 dòng khớp đúng 1 hàng trong bảng Excel gốc, không tách vụn theo từng ô,
     nên thêm/sửa/xoá cả 1 khoảng giá trị chỉ cần đúng 1 thao tác.
   - valueOrder (triệu đồng): mốc dưới của khoảng, dùng để bảng tự sắp xếp & công cụ "So sánh phí"
     tự dò đúng khoảng theo giá trị xe nhập vào — không phải dò tay từng dòng.
   ========================================================================= */
const AGE_BANDS = [
  {key:'lt3', label:'Dưới 3 năm'},
  {key:'y3to6', label:'Từ 3 – dưới 6 năm'},
  {key:'y6to10', label:'Từ 6 – dưới 10 năm'},
  {key:'gte10', label:'Từ 10 năm trở lên'},
];
function ageBandKey(years){
  const y = Number(years)||0;
  if(y<3) return 'lt3';
  if(y<6) return 'y3to6';
  if(y<10) return 'y6to10';
  return 'gte10';
}
function insRateRowsFor(insurerId){
  return state.insRates.filter(r=>r.insurerId===insurerId).sort((a,b)=>a.valueOrder-b.valueOrder);
}// Dò đúng khoảng "Giá trị xe" theo valueOrder, rồi lấy đúng cột tuổi xe tương ứng.
function findInsRate(insurerId, valueTrieu, ageYears){
  const rows = insRateRowsFor(insurerId);
  if(!rows.length) return null;
  let match = null;
  for(let i=0;i<rows.length;i++){
    const cur = rows[i], next = rows[i+1];
    if(valueTrieu>=cur.valueOrder && (!next || valueTrieu<next.valueOrder)){ match = cur; break; }
  }
  if(!match) return null;
  const ageKey = ageBandKey(ageYears);
  return {row:match, ageKey, rate: match[ageKey]};
}

/* ---------------------------- Bảo hiểm · Doanh số (hợp đồng đã bán) ---------------------------- */
const INS_TX_STATUSES = ['Đang xử lý','Đã duyệt','Đã cấp đơn','Huỷ'];
const INS_PRODUCTS = ['BHVC','BHDS'];
let insTxUnitFilter = '';
let insTxInsurerFilter = '';
let insTxSearchFilter = ''; // tìm theo Khách hàng / SĐT / Biển số / Số đơn — khớp gần đúng (chứa)
let insTxBadDateOnly = false; // true = chỉ hiện hợp đồng thiếu ngày hoặc ngày không hợp lệ — công cụ dọn dữ liệu cũ bị lỗi
let insTxVisibleCount = 150; // phân trang kiểu "Xem thêm" — tránh vẽ hàng nghìn dòng input cùng lúc gây đơ máy
let insReconExpanded = new Set();
let insRenewalUnitFilter = '';
let insRenewalBankFilter = '';
let insRenewalStatusFilter = 'attention'; // 'attention' (mặc định, gộp overdue+due_soon+in_progress) | '' = tất cả | 'overdue' | 'due_soon' | 'in_progress' | 'ok' | 'snoozed'

// Hoa hồng chỉ tính khi hợp đồng đã "Đã cấp đơn", theo đúng tỷ lệ BHVC/BHDS của NCC đó
// (khác Ngân hàng: hoa hồng bảo hiểm không đổi theo tháng, chỉ đổi theo loại sản phẩm).
// premiumAmount đang lưu là phí bảo hiểm ĐÃ CÓ VAT 10% — hoa hồng phải tính trên phí TRƯỚC VAT, nên
// luôn quy đổi ngược lại (chia 1.1) trước khi nhân tỷ lệ %, KHÔNG nhân thẳng lên phí đã có VAT.
const INS_VAT_RATE = 0.10;
function insPremiumBeforeVat(premiumAmount){
  return (Number(premiumAmount)||0) / (1 + INS_VAT_RATE);
}
function insTxCommission(t){
  if(t.status!=='Đã cấp đơn') return 0;
  const ins = insurerById(t.insurerId);
  if(!ins) return 0;
  const rate = t.product==='BHDS' ? ins.bhds : ins.bhvc;
  return insPremiumBeforeVat(t.premiumAmount) * (Number(rate)||0);
}
function insPremiumSum(insurerId, from, to, unit){
  let total=0;
  for(const t of state.insTransactions){
    if(t.insurerId!==insurerId || t.status!=='Đã cấp đơn') continue;
    if(unit && t.unit!==unit) continue;
    const d = toDate(t.date);
    if(from && d<from) continue;
    if(to && d>to) continue;
    total += Number(t.premiumAmount)||0;
  }
  return total;
}
function insCommissionSum(insurerId, from, to, unit){
  let total=0;
  for(const t of state.insTransactions){
    if(t.insurerId!==insurerId || t.status!=='Đã cấp đơn') continue;
    if(unit && t.unit!==unit) continue;
    const d = toDate(t.date);
    if(from && d<from) continue;
    if(to && d>to) continue;
    total += insTxCommission(t);
  }
  return total;
}
function allTimeInsPremium(insurerId, unit){ return insPremiumSum(insurerId,null,null,unit); }
function allTimeInsCommission(insurerId, unit){ return insCommissionSum(insurerId,null,null,unit); }

/* ---- DT dịch vụ/sửa chữa theo hãng theo tháng (nhập tay) + đề xuất tỷ lệ bán tháng sau ---- */
function currentMonthISO(){ return todayISO().slice(0,7); }
function insMonthBounds(monthStr){
  // monthStr dạng 'YYYY-MM' -> {from,to} phủ trọn tháng đó (đặt tên riêng, tránh trùng với monthRange(ref) dùng cho chu kỳ theo dõi)
  const [y,m] = String(monthStr||'').split('-').map(Number);
  if(!y||!m) return {from:null,to:null};
  const from = toDate(`${monthStr}-01`);
  const lastDay = new Date(y, m, 0).getDate();
  const to = toDate(`${monthStr}-${String(lastDay).padStart(2,'0')}`);
  return {from,to};
}
function insBRForMonth(insurerId, month){
  const {from,to} = insMonthBounds(month);
  return insPremiumSum(insurerId, from, to);
}
function insMonthlyRevenueEntry(insurerId, month){
  return (state.insMonthlyRevenue||[]).find(x=>x.insurerId===insurerId && x.month===month) || null;
}
function insDVForMonth(insurerId, month){
  const e = insMonthlyRevenueEntry(insurerId, month);
  return e ? (Number(e.serviceAmount)||0) : 0;
}
function upsertInsMonthlyRevenue(insurerId, month, amount){
  if(!state.insMonthlyRevenue) state.insMonthlyRevenue = [];
  let e = insMonthlyRevenueEntry(insurerId, month);
  if(!e){
    e = {id:uid('imr'), insurerId, month, serviceAmount:0, allocationRate:null, note:'', updatedBy:currentUserId, updatedAt:new Date().toISOString()};
    state.insMonthlyRevenue.push(e);
  }
  e.serviceAmount = Math.max(0, Number(amount)||0);
  e.updatedBy = currentUserId; e.updatedAt = new Date().toISOString();
  return e;
}
function prevMonthISO(month){
  const [y,m] = String(month||'').split('-').map(Number);
  if(!y||!m) return currentMonthISO();
  const d = new Date(y, m-2, 1); // m-1 = tháng hiện tại (0-idx), -1 nữa để lùi 1 tháng
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
/* Tỷ lệ phân bổ tháng (%) — kế hoạch bán ra được Admin/Quản lý nhập định kỳ mỗi tháng cho từng hãng,
   thường căn cứ theo "Đề xuất tỷ lệ bán tháng sau" đã tính ở tháng liền trước. Lưu dạng phân số (0-1). */
function insAllocationRateForMonth(insurerId, month){
  const e = insMonthlyRevenueEntry(insurerId, month);
  return e && e.allocationRate!=null ? Number(e.allocationRate) : null;
}
function upsertInsAllocationRate(insurerId, month, ratePct){
  if(!state.insMonthlyRevenue) state.insMonthlyRevenue = [];
  let e = insMonthlyRevenueEntry(insurerId, month);
  if(!e){
    e = {id:uid('imr'), insurerId, month, serviceAmount:0, allocationRate:null, note:'', updatedBy:currentUserId, updatedAt:new Date().toISOString()};
    state.insMonthlyRevenue.push(e);
  }
  e.allocationRate = (ratePct===null || ratePct==='') ? null : Math.max(0, Number(ratePct)||0)/100;
  e.updatedBy = currentUserId; e.updatedAt = new Date().toISOString();
  return e;
}
/* Áp dụng "Đề xuất tỷ lệ bán tháng sau" đã tính ở tháng liền trước làm Tỷ lệ phân bổ cho tháng đang xem — áp dụng hàng loạt cho mọi hãng */
function applyPrevMonthSuggestionToAllocation(month){
  const prev = prevMonthISO(month);
  const {rows} = insAllocRows(prev);
  let applied = 0;
  rows.forEach(r=>{
    if(r.hasData){ upsertInsAllocationRate(r.ins.id, month, round2(r.proposedRate*100)); applied++; }
  });
  return {prev, applied};
}
/* Tổng hợp DT bán ra (BR) + DT dịch vụ (DV) của TOÀN hệ thống trong 1 tháng, cộng dồn mọi hãng bảo hiểm */
function insSystemTotalsForMonth(month){
  let br=0, dv=0;
  state.insurers.forEach(ins=>{ br += insBRForMonth(ins.id, month); dv += insDVForMonth(ins.id, month); });
  return {br, dv, total: br+dv};
}
function insAlertThreshold(){ return Number(state.insAllocAlertThreshold ?? 0.05) || 0.05; }
/* Tính bảng so sánh Thực tế tỷ lệ bán vs Tỷ lệ phân bổ tháng (kế hoạch) cho 1 tháng, sắp theo mức lệch |diff| giảm dần.
   Chênh lệch = Thực tế tỷ lệ bán − Tỷ lệ phân bổ tháng.
   status: 'over' (đang bán VƯỢT kế hoạch phân bổ — nên giảm), 'under' (đang bán DƯỚI kế hoạch — nên tăng),
           'noplan' (chưa đặt tỷ lệ phân bổ tháng nên chưa so sánh được), 'nodata' (chưa có BR/DV), 'ok' (trong ngưỡng) */
function insAllocRows(month){
  const sys = insSystemTotalsForMonth(month);
  const th = insAlertThreshold();
  const rows = state.insurers.map(ins=>{
    const br = insBRForMonth(ins.id, month);
    const dv = insDVForMonth(ins.id, month);
    const scBr = br>0 ? dv/br : (dv>0 ? Infinity : null);
    const actualRate = sys.br>0 ? br/sys.br : 0;
    const proposedRate = sys.dv>0 ? dv/sys.dv : 0; // đề xuất tỷ lệ bán THÁNG SAU = tỷ trọng DT dịch vụ của hãng trong TỔNG DT dịch vụ toàn hệ thống — luôn cộng lại đúng 100% giữa các hãng, dùng làm căn cứ chia % bán ra tháng sau (không dùng để tính chênh lệch/cảnh báo tháng này)
    const hasData = br>0 || dv>0;
    const allocationRate = insAllocationRateForMonth(ins.id, month);
    const hasPlan = allocationRate!=null;
    const diff = hasPlan ? (actualRate - allocationRate) : null; // Chênh lệch = Thực tế − Phân bổ tháng
    let status = 'ok';
    if(!hasData) status = 'nodata';
    else if(!hasPlan) status = 'noplan';
    else if(Math.abs(diff) > th) status = diff>0 ? 'over' : 'under';
    return {ins, br, dv, scBr, actualRate, proposedRate, diff, hasData, hasPlan, status, allocationRate};
  });
  rows.sort((a,b)=> Math.abs(b.diff||0)-Math.abs(a.diff||0));
  return {rows, sys, threshold:th};
}
/* Số hãng đang vượt ngưỡng cảnh báo trong tháng hiện tại — dùng để gắn chấm đỏ trên menu (nhắc nhở mỗi lần mở app) */
function insAllocAlertCount(){
  if(!state.insurers || state.insurers.length===0) return 0;
  const {rows} = insAllocRows(currentMonthISO());
  return rows.filter(r=>r.status==='over'||r.status==='under').length;
}
function insReconCalc(r){
  const from=toDate(r.fromDate), to=toDate(r.toDate);
  if(!r.insurerId||!from||!to) return {premium:0, totalDue:0, received:0, diff:0, stillOwed:0};
  const premium = insPremiumSum(r.insurerId, from, to);
  const totalDue = insCommissionSum(r.insurerId, from, to);
  const received = reconReceivedTotal(r);
  return {premium, totalDue, received, diff:received-totalDue, stillOwed:Math.max(0,totalDue-received)};
}

/* ---------------------------- Bảo hiểm · Lịch tái tục hằng năm ----------------------------
   Với các hồ sơ vay thuộc gói yêu cầu "tái tục hằng năm" (annualRenewalRequired trên Chính sách CK NH,
   VD gói TFS): tự liên kết sang Doanh số Bảo hiểm theo BIỂN SỐ XE (đáng tin cậy nhất, không đổi theo thời
   gian) — nếu xe chưa có biển số ghi nhận thì dự phòng bằng SĐT, rồi tới tên khách hàng. Chỉ hợp đồng đã
   "Đã cấp đơn" mới được coi là đã hoàn tất 1 chu kỳ (dời mốc đến hạn sang năm sau); hợp đồng "Đang xử lý"/
   "Đã duyệt" chỉ được dùng để hiển thị trạng thái "Đang xử lý tái tục", KHÔNG dời mốc, để không mất dấu
   nếu hồ sơ đó cuối cùng không chốt được. Mốc đến hạn = ngày CẤP ĐƠN gần nhất + 1 năm; nếu xe chưa từng có
   đơn nào thì tính từ ngày giải ngân + 1 năm (giả định năm đầu mua kèm lúc giải ngân, ngoài sổ Doanh số BH).

   bankTransactions.renewalLink (tuỳ chọn, mặc định không có = tự động khớp theo biển số/SĐT/tên):
     - id của 1 insTransactions cụ thể -> ép khớp đúng hợp đồng đó (Admin/Quản lý gán tay khi tự động sai)
     - 'NONE' -> đã xác nhận thủ công là CHƯA có hợp đồng nào phù hợp, không tự khớp nữa (tránh khớp nhầm
       liên tục hiện ra rồi bị người dùng bỏ qua)

   .renewalExempt (dùng chung cho cả bankTransactions lẫn insTransactions): Admin đánh dấu tay để hồ sơ
   không hiện lại trong Lịch tái tục nữa (VD hợp đồng nhiều năm, khách đã bán xe/huỷ). Có thể gán qua nút
   "🚫 Không theo dõi" ở từng dòng, hoặc chọn checkbox nhiều dòng rồi bấm "Bỏ theo dõi mục đã chọn"/"Bỏ theo
   dõi toàn bộ" ở đầu bảng (chỉ Admin thấy các nút này). Bỏ đánh dấu bằng cách sửa trực tiếp ở Doanh số
   Ngân hàng/Bảo hiểm. */
function renewalAlertDays(){ return Number(state.insRenewalAlertDays ?? 45) || 45; }
// Số ngày quá hạn tối đa trước khi hệ thống TỰ ĐỘNG coi là "khách không tái tục lần này", tự dời mốc sang
// đúng 1 năm sau (không cần Admin tự tay bấm Tạm ẩn cho từng hồ sơ) — mặc định 15 ngày, Admin chỉnh được.
function renewalAutoSnoozeDays(){ return Number(state.insRenewalAutoSnoozeDays ?? 15) || 15; }
// Từ mốc đến hạn gốc (originalDue), tự dời từng năm 1 cho tới khi số ngày quá hạn không vượt quá
// autoSnoozeDays — mô phỏng việc mỗi năm nhắc lại 1 lần dù khách chưa từng tái tục lại. Trả về mốc đến hạn
// "hiệu lực" hiện tại (cycleDue) + số chu kỳ đã lỡ (missedCycles, >0 nghĩa là đã từng quá hạn quá lâu mà
// không tái tục, giúp nhân viên phân biệt với khách hàng mới chưa từng đến hạn lần nào).
function rollForwardRenewalCycle(originalDue, today, autoSnoozeDays){
  let cycleDue = originalDue;
  let missedCycles = 0;
  while(Math.round((today-cycleDue)/86400000) > autoSnoozeDays && missedCycles<50){
    cycleDue = new Date(cycleDue);
    cycleDue.setFullYear(cycleDue.getFullYear()+1);
    missedCycles++;
  }
  return {cycleDue, missedCycles};
}
// Trường "Xe (biển số / mẫu xe)" là 1 ô tự do gộp cả biển số lẫn mẫu xe (VD "29A-123.45 · Honda SH") —
// phải tách lấy đúng phần biển số (trước dấu "·") trước khi so khớp, nếu không 2 hồ sơ cùng biển số nhưng
// ghi khác nhau ("có ghi mẫu xe" vs "không ghi") sẽ bị coi là khác nhau và không bao giờ khớp được.
function extractPlateToken(v){ return String(v||'').split('·')[0].trim(); }
function normalizePlate(s){ return extractPlateToken(s).toLowerCase().replace(/[^a-z0-9]/g,''); }
function normalizePhone(s){ return String(s||'').replace(/[^0-9]/g,''); }
// Bỏ dấu tiếng Việt trước khi so khớp tên — nhân viên NH/BH có thể gõ tên khách có dấu hoặc không dấu
// không nhất quán giữa 2 sổ, nếu so khớp nguyên văn có dấu sẽ bỏ sót nhiều trường hợp lẽ ra khớp được.
function stripDiacritics(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d'); }
function normalizeName(s){ return stripDiacritics(s).trim().toLowerCase(); }
// Chuẩn hoá cách viết ô "Xe (biển số / mẫu xe)" khi rời khỏi ô nhập: viết hoa phần biển số, giữ nguyên
// cách viết phần mẫu xe (không ép hoa/thường tên mẫu xe) — giảm sai lệch biển số do gõ hoa/thường lẫn lộn.
function formatVehicleField(raw){
  const parts = String(raw||'').split('·');
  const plate = parts[0].trim().toUpperCase();
  const rest = parts.slice(1).join('·').trim();
  return rest ? `${plate} · ${rest}` : plate;
}
function matchMethodLabel(method){
  return ({plate:'Biển số xe', phone:'SĐT khách hàng', name:'Tên khách hàng (không dấu)',
    manual:'Liên kết thủ công', manual_none:'Đã xác nhận: chưa có hợp đồng phù hợp', none:'Chưa khớp được'})[method] || 'Chưa khớp được';
}
// Khoá nhóm dùng chung cho cả 2 nguồn Lịch tái tục (qua khoản vay / bảo hiểm độc lập) — ưu tiên biển số,
// dự phòng SĐT/tên, để nhận diện "cùng 1 xe" mà không cần biết trước đây là khớp kiểu gì.
function renewalGroupKeyFor(t){
  const plate = normalizePlate(t.vehicle);
  if(plate) return 'plate:'+plate;
  const phone = normalizePhone(t.phone);
  if(phone) return 'phone:'+phone;
  const name = normalizeName(t.customer);
  if(name) return 'name:'+name;
  return null;
}
// Tìm hợp đồng bảo hiểm khớp với 1 hồ sơ vay — ưu tiên: liên kết thủ công (nếu có) > biển số > SĐT > tên.
// Trả về {matches, method} để giao diện hiển thị rõ đang khớp theo cách nào, tránh coi kết quả suy đoán
// như dữ liệu chắc chắn.
function computeRenewalMatches(t){
  if(t.renewalLink==='NONE') return {matches:[], method:'manual_none'};
  if(t.renewalLink){
    const forced = state.insTransactions.find(it=>it.id===t.renewalLink && it.status!=='Huỷ');
    if(forced) return {matches:[forced], method:'manual'};
    // Liên kết thủ công trỏ tới hợp đồng đã bị xoá/Huỷ -> rơi về tự động thay vì báo lỗi im lặng.
  }
  const plate = normalizePlate(t.vehicle);
  const phone = normalizePhone(t.phone);
  const name = normalizeName(t.customer);
  const active = state.insTransactions.filter(it=>it.status!=='Huỷ');
  if(plate){
    const byPlate = active.filter(it=>normalizePlate(it.vehicle)===plate);
    if(byPlate.length) return {matches:byPlate, method:'plate'};
  }
  if(phone){
    const byPhone = active.filter(it=>normalizePhone(it.phone)===phone);
    if(byPhone.length) return {matches:byPhone, method:'phone'};
  }
  if(name){
    const byName = active.filter(it=>normalizeName(it.customer)===name);
    if(byName.length) return {matches:byName, method:'name'};
  }
  return {matches:[], method:'none'};
}
function addYearsToDate(dateStr, n){
  const d = toDate(dateStr);
  if(!d || isNaN(d.getTime())) return null; // isNaN(d.getTime()) bắt cả trường hợp Date "Invalid Date" (object vẫn truthy) — chỉ check !d là chưa đủ, để lọt lỗi này từng làm sập cả bảng Lịch tái tục khi có 1 bản ghi ngày sai/rỗng.
  const r = new Date(d);
  r.setFullYear(r.getFullYear()+n);
  return r;
}
// Tính trạng thái tái tục cho 1 hồ sơ vay đã giải ngân — trả về null nếu gói vay đó không yêu cầu tái tục
// hằng năm (chính sách hiện hành không bật cờ này -> không thuộc diện theo dõi).
function renewalRowFor(t){
  if(t.status!=='Đã giải ngân') return null;
  if(t.renewalExempt) return null; // Admin đã bỏ theo dõi tái tục cho hồ sơ này (qua checkbox ở Lịch tái tục)
  const policy = activeBankPolicy(t.bankId, t.date, t.product);
  if(!policy || !policy.annualRenewalRequired) return null;
  const {matches, method} = computeRenewalMatches(t);
  const sorted = matches.slice().sort((a,b)=> b.date.localeCompare(a.date));
  const issuedMatches = sorted.filter(m=>m.status==='Đã cấp đơn');
  const pendingMatches = sorted.filter(m=>m.status!=='Đã cấp đơn');
  const lastIssued = issuedMatches[0] || null;
  const anchorDate = lastIssued ? lastIssued.date : t.date;
  const originalDue = addYearsToDate(anchorDate, 1);
  if(!originalDue) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const {cycleDue, missedCycles} = rollForwardRenewalCycle(originalDue, today, renewalAutoSnoozeDays());
  const nextDue = cycleDue;
  const daysLeft = Math.round((nextDue-today)/86400000);
  const threshold = renewalAlertDays();
  let status = daysLeft<0 ? 'overdue' : (daysLeft<=threshold ? 'due_soon' : 'ok');
  // Đã có hợp đồng đang xử lý/đã duyệt nhắm đúng chu kỳ này (tạo sau lần cấp đơn gần nhất) -> nhân viên đã
  // đang xử lý, không nên xếp chung với "chưa ai động vào" dù kỹ thuật vẫn coi là chưa cấp đơn chính thức.
  const hasPendingForCycle = pendingMatches.some(m=> m.date>=anchorDate);
  if(status!=='ok' && hasPendingForCycle) status = 'in_progress';
  // Tạm ẩn thủ công (snooze): ưu tiên cao hơn auto-rollover ở trên — dùng khi Admin/Quản lý muốn hẹn 1 ngày
  // CỤ THỂ khác với lịch tự động (VD khách hẹn "gọi lại sau 6 tháng" thay vì đúng 1 năm sau). Hồ sơ vẫn nằm
  // trong danh sách theo dõi, quá ngày hẹn tự động hiện cảnh báo lại (không cần dọn field khi hết hạn).
  const snoozeUntil = t.renewalSnoozeUntil || '';
  if(snoozeUntil && snoozeUntil>todayISO()) status = 'snoozed';
  return {source:'bank', t, policy, lastIssued, pendingMatches, anchorDate, nextDue, daysLeft, status, matchMethod:method, snoozeUntil, contactLog:t.renewalContactLog||[], missedCycles};
}
/* ---------------------------- Lịch tái tục · nguồn "Bảo hiểm độc lập" (không qua khoản vay) ----------------------------
   Mặc định MỌI đơn bảo hiểm "Đã cấp đơn" đều cần theo dõi tái tục (đúng thực tế nghiệp vụ hiện tại — không
   có hợp đồng nhiều năm hay ngoại lệ) — CHỈ bỏ qua nếu: (1) xe đó đã được theo dõi qua đường vay ngân hàng
   rồi (tránh hiện trùng 2 dòng cho cùng 1 xe), hoặc (2) đơn đó bị đánh dấu tay "Không theo dõi tái tục"
   (t.renewalExempt — dùng cho trường hợp hiếm: hợp đồng nhiều năm, khách đã bán xe/huỷ...). */
function standaloneRenewalRows(){
  const bankTrackedKeys = new Set();
  state.bankTransactions.forEach(t=>{
    if(t.status!=='Đã giải ngân') return;
    const policy = activeBankPolicy(t.bankId, t.date, t.product);
    if(policy && policy.annualRenewalRequired){
      const key = renewalGroupKeyFor(t);
      if(key) bankTrackedKeys.add(key);
    }
  });
  const active = state.insTransactions.filter(t=>t.status!=='Huỷ');
  const groups = new Map();
  active.forEach(t=>{
    const key = renewalGroupKeyFor(t);
    if(!key || bankTrackedKeys.has(key)) return; // không đủ thông tin để nhóm, hoặc đã theo dõi qua đường vay -> bỏ qua tránh trùng
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(t);
  });
  const rows = [];
  groups.forEach((txs, key)=>{
    const issued = txs.filter(t=>t.status==='Đã cấp đơn' && !t.renewalExempt);
    if(issued.length===0) return; // chưa từng cấp đơn nào (toàn "Đang xử lý"), hoặc đơn cấp gần nhất đã bị đánh dấu miễn -> chưa có gì để tính mốc
    const sorted = issued.slice().sort((a,b)=> b.date.localeCompare(a.date));
    const lastIssued = sorted[0];
    const pendingMatches = txs.filter(t=>t.status!=='Đã cấp đơn' && t.status!=='Huỷ');
    const anchorDate = lastIssued.date;
    const originalDue = addYearsToDate(anchorDate, 1);
    if(!originalDue) return;
    const today = new Date(); today.setHours(0,0,0,0);
    const {cycleDue, missedCycles} = rollForwardRenewalCycle(originalDue, today, renewalAutoSnoozeDays());
    const nextDue = cycleDue;
    const daysLeft = Math.round((nextDue-today)/86400000);
    const threshold = renewalAlertDays();
    let status = daysLeft<0 ? 'overdue' : (daysLeft<=threshold ? 'due_soon' : 'ok');
    const hasPendingForCycle = pendingMatches.some(m=> m.date>=anchorDate);
    if(status!=='ok' && hasPendingForCycle) status = 'in_progress';
    const snoozeUntil = lastIssued.renewalSnoozeUntil || '';
    if(snoozeUntil && snoozeUntil>todayISO()) status = 'snoozed';
    rows.push({source:'standalone', t:lastIssued, lastIssued, pendingMatches, anchorDate, nextDue, daysLeft, status, matchMethod: key.split(':')[0], snoozeUntil, contactLog:lastIssued.renewalContactLog||[], missedCycles});
  });
  return rows;
}
function allRenewalRows(){
  const bankRows = state.bankTransactions.map(renewalRowFor).filter(Boolean);
  return [...bankRows, ...standaloneRenewalRows()];
}
// Số hồ sơ Sắp đến hạn + Quá hạn thật sự cần hành động — dùng để gắn chấm đỏ trên menu Bảo hiểm (giống cơ
// chế insAllocAlertCount). Hồ sơ đang "in_progress" không tính vào đây vì nhân viên đã đang xử lý rồi.
function renewalAlertCount(){
  return allRenewalRows().filter(r=>r.status==='overdue'||r.status==='due_soon').length;
}
function renewalAlertBadgeHTML(){
  const n = renewalAlertCount();
  return n>0 ? `<span class="alert-dot" title="${n} hồ sơ sắp đến hạn hoặc quá hạn tái tục bảo hiểm">${n}</span>` : '';
}

function getFilteredInsTx(){
  const unitFilter = (insTxUnitFilter||'').trim().toLowerCase();
  const insFilter = (insTxInsurerFilter||'').trim().toLowerCase();
  const searchFilter = (insTxSearchFilter||'').trim().toLowerCase();
  const me = currentUser();
  const lockedUnits = (me && me.role==='Nhân viên') ? accountUnits(me) : [];
  const pf = partnerScopeFilter('insurerId');
  const all = (pf ? state.insTransactions.filter(pf) : state.insTransactions).slice().sort((a,b)=> b.date.localeCompare(a.date));
  return all.filter(t=>{
    if(lockedUnits.length && !lockedUnits.includes(t.unit)) return false;
    if(unitFilter && !(t.unit||'').trim().toLowerCase().includes(unitFilter)) return false;
    if(insFilter){ const ins = insurerById(t.insurerId); if(!ins || !ins.name.trim().toLowerCase().includes(insFilter)) return false; }
    if(searchFilter){
      const hay = [t.customer, t.phone, t.vehicle, t.policyNo].filter(Boolean).join(' ').toLowerCase();
      if(!hay.includes(searchFilter)) return false;
    }
    if(insTxBadDateOnly && isValidDateStr(t.date)) return false;
    if(!periodFilterMatches(t.date)) return false;
    return true;
  });
}
// Xoá hàng loạt hợp đồng bảo hiểm (chuyển vào Thùng rác — khôi phục được ở "Thùng rác", không mất vĩnh viễn
// ngay). Tôn trọng đúng quyền xoá từng bản ghi (canDeleteInsTx) — bản ghi nào không đủ quyền/đang khoá đối
// soát thì bỏ qua, không chặn cả lô. Trả về {deleted, skipped} để nơi gọi báo cáo rõ cho người dùng.
function bulkSoftDeleteInsTx(ids){
  let deleted=0, skipped=0;
  ids.forEach(id=>{
    const t = state.insTransactions.find(x=>x.id===id);
    if(!t || !canDeleteInsTx(t)){ skipped++; return; }
    softDelete('insTransactions', t, 'Doanh số (Bảo hiểm)');
    deleted++;
  });
  return {deleted, skipped};
}

    tbl.insertAdjacentHTML('afterend', `<div class="empty"><div class="big">Không có hợp đồng nào khớp bộ lọc hiện tại</div></div>`);

  // đơ máy. "Xem thêm" bên dưới bảng để tải thêm dần, không mất khả năng lọc/tìm trên toàn bộ dữ liệu.
  if(tbl.nextElementSibling && tbl.nextElementSibling.classList.contains('empty')) tbl.nextElementSibling.remove();
  const rows = sorted.slice(0, insTxVisibleCount);

      <th>Hợp đồng</th><th>Khách hàng</th><th class="num">Phí bảo hiểm</th><th>Trạng thái</th><th class="num">Hoa hồng</th><th>Người nhập</th><th>Hoá đơn</th><th></th></tr></thead>
    <tbody>${rows.map(t=>{

      const creator = state.accounts.find(a=>a.id===t.createdBy);

      const dis = (editable && !lockedForMe)?'':'disabled';
      const canDelRow = editable && canDeleteInsTx(t);
      return `<tr>
        ${editable ? `<td>${canDelRow?`<input type="checkbox" class="itx-chk" data-id="${escAttr(t.id)}">`:''}</td>` : ''}

              : `<div class="mini-field">${new Date(t.date+'T00:00:00').toLocaleDateString('vi-VN')}</div>`}
            <div class="meta-line">${escHtml(t.unit)} → ${ins?escHtml(ins.name):'<em>(đã xoá)</em>'} · <span class="tag">${escHtml(t.product||'BHVC')}</span> ${lockIconHTML(lockR,'bh')}</div>
            ${editable
              ? `<input class="cell-edit mini-field muted" data-field="policyNo" data-id="${t.id}" value="${escAttr(t.policyNo||'')}" ${dis} placeholder="Số đơn bảo hiểm">`
              : (t.policyNo?`<div class="meta-line">Số đơn: ${escAttr(t.policyNo)}</div>`:'')}
          </div>
        </td>
        <td>
          <div class="stack-cell">
            <input class="cell-edit mini-field" data-field="customer" data-id="${t.id}" value="${escAttr(t.customer||'')}" ${dis} placeholder="Tên khách hàng" style="font-weight:600">
            <input class="cell-edit mini-field muted" data-field="phone" data-id="${t.id}" type="tel" value="${escAttr(t.phone||'')}" ${dis} placeholder="SĐT">
            <input class="cell-edit mini-field muted italic" data-field="vehicle" data-id="${t.id}" value="${escAttr(t.vehicle||'')}" ${dis} placeholder="Biển số / xe">
          </div>
        </td>
        <td class="num"><input class="cell-edit num money mini-field" data-field="premiumAmount" data-id="${t.id}" type="text" inputmode="numeric" value="${formatMoneyValue(t.premiumAmount)}" ${dis} style="text-align:right;font-weight:600;min-width:120px"></td>
        <td>${(editable && !lockedForMe)
          ? `<select class="cell-edit status-select ${statusClass(t.status)}" data-status-id="${t.id}">${INS_TX_STATUSES.map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select>`
          : `<span class="stamp ${t.status==='Đã cấp đơn'?'ok':(t.status==='Huỷ'?'warn':'pending')}">${t.status}</span>`}</td>
        <td class="num">${commCell}</td>
        <td class="meta-line">${creator?escHtml(creator.name):'<em>—</em>'}</td>
        <td>${invoiceCellHTML(t, editable && !lockedForMe)}</td>
        <td>${canDelRow?`<button class="row-del" data-del="${t.id}">✕</button>`:''}</td>
      </tr>`;
    }).join('')}</tbody>`;
  const itxMoreBox = document.getElementById('itxMoreBox');
  if(itxMoreBox){
    if(sorted.length > rows.length){
      itxMoreBox.style.display = '';
      document.getElementById('itxMoreBtn').textContent = `Xem thêm 150 dòng (còn ${sorted.length-rows.length} dòng khớp bộ lọc)`;
      document.getElementById('itxMoreBtn').onclick = ()=>{ insTxVisibleCount += 150; renderInsTxTable(editable); };
    } else {
      itxMoreBox.style.display = 'none';
    }
  }
  if(editable){
    const selAllChk = tbl.querySelector('#itxSelectAll');
    const rowChks = ()=> Array.from(tbl.querySelectorAll('.itx-chk'));
    const updateSelectedUI = ()=>{
      const checked = rowChks().filter(x=>x.checked);
      const btn = document.getElementById('itxDeleteSelectedBtn');
      const cnt = document.getElementById('itxSelectedCount');
      if(cnt) cnt.textContent = checked.length;
      if(btn) btn.disabled = checked.length===0;
      if(selAllChk) selAllChk.checked = rowChks().length>0 && checked.length===rowChks().length;
    };
    if(selAllChk) selAllChk.addEventListener('change', ()=>{
      rowChks().forEach(chk=> chk.checked = selAllChk.checked);
      updateSelectedUI();
    });
    rowChks().forEach(chk=> chk.addEventListener('change', updateSelectedUI));
    updateSelectedUI();
  }
  if(editable){
    wireCellEdits(tbl, state.insTransactions, 'Doanh số (Bảo hiểm)', t=>{ const ins=insurerById(t.insurerId); return `${t.unit} → ${ins?ins.name:''}`; });
    wireInvoiceAttachColumn(tbl, state.insTransactions, 'Doanh số (Bảo hiểm)', t=>{ const ins=insurerById(t.insurerId); return 'Doanh số BH · '+(ins?ins.name:''); });
    tbl.querySelectorAll('[data-field="date"]').forEach(el=>{
      el.addEventListener('change', ()=>{ renderInsTxTable(editable); });
    });
    tbl.querySelectorAll('[data-status-id]').forEach(sel=>{
      sel.addEventListener('change', e=>{
        const t = state.insTransactions.find(x=>x.id===sel.dataset.statusId);
        if(!t) return;
        const before = t.status;
        t.status = e.target.value;
        const ins = insurerById(t.insurerId);
        logActivity('update','Doanh số (Bảo hiểm)', `${t.unit} → ${ins?ins.name:''}: đổi trạng thái "${before}" → "${t.status}"`);

        renderInsTxTable(editable);

      if(t && isRecordLockedForMe(t, state.insReconciliations, 'insurerId')){ toast('Hợp đồng thuộc kỳ đối soát đã chốt — chỉ Admin được xoá'); return; }
      const ins = t ? insurerById(t.insurerId) : null;
      const trashId = softDelete('insTransactions', t, 'Doanh số (Bảo hiểm)');
      logActivity('delete','Doanh số (Bảo hiểm)', `Xoá hợp đồng (${ins?ins.name:''}, ${t?fmt(t.premiumAmount):''}đ)`);
      toastUndo('Đã xoá hợp đồng bảo hiểm', trashId);
      renderAll();
    });
  });
}

let insAllocMonth = currentMonthISO();
function insAlertBadgeHTML(){
  const n = insAllocAlertCount();
  return n>0 ? `<span class="alert-dot" title="${n} hãng đang lệch tỷ lệ bán quá ngưỡng cảnh báo">${n}</span>` : '';
}
// "Chốt" tỷ lệ phân bổ theo THÁNG (không phải theo từng hãng riêng lẻ) — vì tổng tỷ lệ cả tháng luôn phải
// = 100%, khoá lẻ từng hãng sẽ làm vỡ tính toàn vẹn đó nếu hãng còn lại vẫn sửa được. Chỉ khoá đúng cột
// "Tỷ lệ phân bổ tháng" — KHÔNG khoá "DT dịch vụ/sửa chữa" (số liệu thô, vẫn có thể cần sửa sai sót sau
// này mà không ảnh hưởng gì tới tỷ lệ ĐÃ CHỐT, vì tỷ lệ chốt xong là cố định, không tự tính lại theo DV).
function isInsAllocMonthLocked(month){
  return !!(state.insAllocMonthLocks && state.insAllocMonthLocks[month] && state.insAllocMonthLocks[month].locked);
}
function insAllocMonthLockInfo(month){
  return (state.insAllocMonthLocks && state.insAllocMonthLocks[month]) || null;
}
function lockInsAllocMonth(month){
  if(!state.insAllocMonthLocks) state.insAllocMonthLocks = {};
  state.insAllocMonthLocks[month] = { locked:true, lockedBy:currentUserId, lockedAt:new Date().toISOString() };
}
function unlockInsAllocMonth(month){
  if(!state.insAllocMonthLocks) state.insAllocMonthLocks = {};
  state.insAllocMonthLocks[month] = { locked:false, lockedBy:currentUserId, lockedAt:new Date().toISOString() };
}
function renderInsAllocation(c){
  const partnerAcc = isPartnerAccount(currentUser()) ? currentUser() : null;
  setTitle('Phân bổ đơn vị', (partnerAcc?'Phí bảo hiểm thu của bạn theo từng đơn vị':'Đóng góp phí bảo hiểm thu của từng đơn vị cho từng NCC — cộng dồn toàn thời gian, chỉ tính hợp đồng "Đã cấp đơn"'));

        <div class="desc">Hãng đưa khách quay lại xưởng dịch vụ nhiều hơn thì được đề xuất tỷ lệ bán cao hơn tháng sau. Di chuột vào <span class="info-tip" style="width:13px;height:13px" title="${escAttr(formulaTip)}">i</span> để xem công thức đầy đủ.</div></div>

            <label>Ngưỡng cảnh báo (%) ${!isAdmin?'🔒':''}</label>

          ${editable ? `<div class="field"><label>&nbsp;</label><button class="btn btn-ghost" id="insApplyPrevBtn" type="button" ${isInsAllocMonthLocked(insAllocMonth)?'disabled title="Tháng này đã chốt — mở khoá trước khi áp dụng đề xuất"':`title="Lấy 'Đề xuất tỷ lệ bán tháng sau' của tháng liền trước, điền vào cột 'Tỷ lệ phân bổ tháng' của tháng đang xem cho mọi hãng"`}>↳ Áp dụng đề xuất tháng trước</button></div>` : ''}
          ${isAdmin ? `<div class="field"><label>&nbsp;</label><button class="btn ${isInsAllocMonthLocked(insAllocMonth)?'btn-primary':'btn-danger-ghost'}" id="insAllocLockBtn" type="button">${isInsAllocMonthLocked(insAllocMonth)?'🔓 Mở khoá tháng này':'🔒 Chốt tỷ lệ phân bổ tháng này'}</button></div>` : ''}
        </div>
      </div>
      <div class="panel-body" id="insAllocKpiWrap" style="padding-bottom:12px"></div>
      <div class="panel-body flush"><div class="tbl-wrap"><table class="data" id="insRevenueTable"></table></div></div>
      ${!editable ? lockedNote('Bạn đang xem ở chế độ chỉ đọc — chỉ Admin/Quản lý mới nhập được DT dịch vụ/sửa chữa theo hãng.') : ''}
      ${editable && !isAdmin ? `<div class="helper" style="padding:0 20px 16px">🔒 Chỉ Admin mới đổi được ngưỡng cảnh báo chênh lệch.</div>` : ''}
    </div>`}
    <div class="panel"><div class="panel-head"><div><h2>${partnerAcc?'Phí bảo hiểm thu theo Đơn vị':'Ma trận NCC bảo hiểm × Đơn vị (phí bảo hiểm thu)'}</h2>
      <div class="desc">${state.units.length} đơn vị hiện có · chỉ tính hợp đồng trạng thái "Đã cấp đơn"${globalYearFilter?' · đang lọc theo '+escHtml(periodFilterDescText()):' · cộng dồn toàn thời gian'}</div></div></div>
      <div class="panel-body flush"><div class="matrix-scroll"><table class="data matrix-fixed" id="insAllocTable"></table></div></div></div>
  `;
  if(!partnerAcc){

  monthInput.addEventListener('change', ()=>{
    insAllocMonth = monthInput.value || currentMonthISO();
    renderAll(); // đổi cả renderInsRevenueTable(editable) thành renderAll() vì nút Chốt/Mở khoá + nút "Áp dụng đề xuất" cũng cần cập nhật lại theo đúng trạng thái khoá của tháng mới chọn

  const applyPrevBtn = document.getElementById('insApplyPrevBtn');

        ()=>{

          logActivity('update','Tỷ lệ phân bổ (Bảo hiểm)', `${locked?'🔓 Mở khoá':'🔒 Chốt'} tỷ lệ phân bổ tháng ${month}`);

      saveState();
      renderInsRevenueTable(editable);
      renderNav(); // cập nhật lại chấm cảnh báo trên menu nếu ngưỡng đổi làm thay đổi số hãng vượt ngưỡng
    });
  }
  renderInsRevenueTable(editable);
  }

  const tbl = document.getElementById('insAllocTable');

  const {from: pfFrom, to: pfTo} = periodFilterDateObjects();
  const rows = insurerScope.map(ins=>{

    const max = Math.max(0,...perUnit);

    return {ins, perUnit, total, commTotal, topUnit: total>0?state.units[topIdx]:'—'};

  tbl.innerHTML = `
    ${matrixColgroupHTML(state.units.length, [11, 11, 13])}
    <thead>
    <tr>
      <th>NCC bảo hiểm</th>${state.units.map(u=>matrixUnitHeaderCell(u)).join('')}
      <th class="num">Tổng phí thu</th><th class="num">Hoa hồng luỹ kế</th><th>Đơn vị chính</th>
    </tr>

    <tbody>${rows.map(r=>`
      <tr>

        ${r.perUnit.map(v=>`<td class="num">${v>0?fmt(v):'—'}</td>`).join('')}
        <td class="num" style="font-weight:700">${fmt(r.total)}</td>

        <td>${escHtml(r.topUnit)}</td>
      </tr>`).join('')}</tbody>`;
  wireStickyHeaderRows(tbl);
