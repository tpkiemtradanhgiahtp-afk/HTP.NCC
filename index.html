    renderAll();
    });
  }

  const tbl = document.getElementById('policyTable');
  if(state.suppliers.length===0){
    tbl.outerHTML = `<div class="empty"><div class="big">Chưa có NCC</div>Thêm NCC ở tab "Danh mục NCC" trước.</div>`; return;
  }
  if(state.policies.length===0){
    tbl.outerHTML = `<div class="empty"><div class="big">Chưa có chính sách nào</div>${editable?'Thêm chính sách CK ở form phía trên.':''}</div>`; return;
  }
  tbl.innerHTML = `
    <thead><tr>
      <th class="wrap">NCC</th><th>Mã CS</th><th>Loại</th><th>Chu kỳ</th><th class="num money-col">Mốc (VNĐ)</th>
      <th class="num">Tỷ lệ CK</th><th class="num">Thưởng thêm</th><th>Bắt đầu</th><th>Kết thúc</th><th>Phương pháp</th><th class="wrap">Điều kiện</th><th>Phân bổ đơn vị</th><th></th>
    </tr></thead>
    <tbody>${state.policies.map(p=>{
      const s = supplierById(p.supplierId);
      const dis = editable?'':'disabled';
      const isBaseTier = p.type==='CK theo doanh số'||p.type==='CK cố định';
      const cycleDisabled = dis || (isBaseTier?'disabled':'');
      const rowConflict = isBaseTier && tierConflicts(p.supplierId).some(w=>w.includes(p.code||p.id));
      return `<tr data-rowid="${p.id}" ${rowConflict?'style="background:var(--rust-soft)"':''}>
        <td class="wrap">${s?s.name:'<em>(NCC đã xoá)</em>'}${rowConflict?' ⚠':''}</td>
        <td><input class="cell-edit" data-field="code" data-id="${p.id}" value="${escAttr(p.code)}" ${dis}></td>
        <td><select class="cell-edit" data-field="type" data-id="${p.id}" ${dis}>${['CK theo doanh số','CK cố định','Thưởng thêm'].map(v=>`<option ${p.type===v?'selected':''}>${v}</option>`).join('')}</select></td>
        <td><select class="cell-edit" data-field="cycle" data-id="${p.id}" ${cycleDisabled} title="${isBaseTier?'Không có tác dụng với mốc CK cơ bản — chu kỳ theo dõi đặt ở tab Theo dõi mốc CK':''}">${['Cần xác nhận','THANG','QUY','YTD','Cố định'].map(v=>`<option ${p.cycle===v?'selected':''}>${v}</option>`).join('')}</select></td>
        <td class="money-col"><input class="cell-edit money" data-field="threshold" data-id="${p.id}" type="text" inputmode="numeric" value="${formatMoneyValue(p.threshold)}" ${dis}></td>
        <td><input class="cell-edit num pct" data-field="rate" data-id="${p.id}" type="number" step="0.1" value="${round2(p.rate*100)}" ${dis}></td>
        <td><input class="cell-edit num pct" data-field="bonusRate" data-id="${p.id}" type="number" step="0.1" value="${round2(p.bonusRate*100)}" ${dis}></td>
        <td><input class="cell-edit" data-field="startDate" data-id="${p.id}" type="date" value="${p.startDate||''}" ${dis} title="Trước ngày này, dòng chính sách này CHƯA được tính — để trống nếu áp dụng ngay"></td>
        <td><input class="cell-edit" data-field="endDate" data-id="${p.id}" type="date" value="${p.endDate||''}" ${dis} title="Quá ngày này, dòng chính sách này tự ngừng được tính"></td>
        <td><select class="cell-edit" data-field="method" data-id="${p.id}" ${dis}>${['Hồi tố toàn bộ','Chỉ phần vượt mốc'].map(v=>`<option ${p.method===v?'selected':''}>${v}</option>`).join('')}</select></td>
        <td class="wrap"><input class="cell-edit" data-field="condition" data-id="${p.id}" value="${escAttr(p.condition||'')}" ${dis}></td>
        <td>${policyTargetBadgeHTML(p)}</td>
        <td>${editable?`<button class="row-del" data-del="${p.id}">✕</button>`:''}</td>
      </tr>`;
    }).join('')}</tbody>`;
  wirePolicyTargetBadges(tbl, editable);
  if(editable){
    wireCellEdits(tbl, state.policies, 'Chính sách CK', p=>p.code||p.id);
    tbl.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const p = state.policies.find(x=>x.id===btn.dataset.del);
        state.policies = state.policies.filter(x=>x.id!==btn.dataset.del);
        logActivity('delete','Chính sách CK', `Xoá CS "${p?p.code:''}"`);
        renderAll();
      });
    });
  }
}

/* ---------------------------- Doanh số ---------------------------- */
function canDeleteTx(t){
  return ['Admin','Quản lý'].includes(currentRole()) || t.createdBy===currentUserId;
}
function renderTransactions(c){
  setTitle('Doanh số', state.transactions.length+' chứng từ — mỗi dòng là 1 hoá đơn/chứng từ theo đơn vị & NCC');
  const editable = canEdit('transactions'); // Admin, Quản lý, Nhân viên đều được ghi nhận doanh số
  const me = currentUser();
  const lockedUnit = (me && me.role==='Nhân viên' && me.unit) ? me.unit : null;
  const supplierOptions = state.suppliers.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  if(lockedUnit) txUnitFilter = lockedUnit; // NV chỉ nên thấy đúng đơn vị mình phụ trách theo mặc định
  c.innerHTML = `
    ${editable ? `
    <div class="panel">
      <div class="panel-head"><div><h2>Ghi nhận doanh số</h2></div>
      ${lockedUnit ? `<span class="tag gold">Đơn vị của bạn: ${lockedUnit}</span>` : ''}
      </div>
      <div class="panel-body">
        <div class="form-grid">
          <div class="field"><label>Ngày</label><input id="tf_date" type="date" value="${todayISO()}"></div>
          <div class="field">
            <label>Đơn vị</label>
            ${lockedUnit
              ? `<input id="tf_unit" value="${escAttr(lockedUnit)}" disabled>`
              : `<input id="tf_unit" list="tf_unit_list" placeholder="Gõ tên đơn vị thực tế..." value="${escAttr(txUnitFilter)}">${unitDatalistHTML('tf_unit_list')}`}
          </div>
          <div class="field"><label>NCC</label><input id="tf_supplier" list="tf_supplier_list" placeholder="Gõ tên NCC..." value="${escAttr(txSupplierFilter)}">${supplierDatalistHTML('tf_supplier_list')}</div>
          <div class="field"><label>Số chứng từ</label><input id="tf_doc" placeholder="HD00123"></div>
          <div class="field"><label>Nhóm hàng</label><input id="tf_cat" placeholder="Phụ tùng..."></div>
          <div class="field"><label>Doanh số trước VAT</label><input id="tf_gross" class="field-money" type="text" inputmode="numeric" placeholder="0"></div>
          <div class="field"><label>Trả hàng / Điều chỉnh</label><input id="tf_return" class="field-money" type="text" inputmode="numeric" placeholder="0"></div>
          <button class="btn btn-primary" id="addTxBtn">+ Ghi nhận</button>
        </div>
        ${lockedUnit ? `<div class="helper">Tài khoản của bạn được gán phụ trách <b>${lockedUnit}</b> (đặt ở tab Quản trị tài khoản) nên đơn vị đã tự khoá để tránh nhập nhầm. Cần đổi đơn vị? Liên hệ Admin/Quản lý.</div>` : `<div class="helper">Gõ tên đơn vị mới nếu chưa có trong danh sách — hệ thống sẽ tự thêm vào. Sổ chứng từ bên dưới tự lọc theo đúng Đơn vị và NCC bạn đang gõ/chọn ở đây.</div>`}
      </div>
    </div>` : lockedNote('Tài khoản của bạn chưa được cấp quyền ghi nhận doanh số.')}
    <div class="panel">
      <div class="panel-head">
        <div><h2>Sổ chứng từ</h2>
        <div class="desc" id="txFilterNote"></div></div>
        <div style="font-size:12px;color:var(--slate)">Doanh số tính CK = Trước VAT − Trả hàng/Điều chỉnh</div>
      </div>
      <div class="panel-body flush"><div class="tbl-wrap"><table class="data" id="txTable"></table></div></div>
    </div>
  `;
  if(editable){
    attachMoneyFormatting(document.getElementById('tf_gross'));
    attachMoneyFormatting(document.getElementById('tf_return'));
    const unitField = document.getElementById('tf_unit');
    if(unitField && !lockedUnit) unitField.addEventListener('input', ()=>{
      txUnitFilter = unitField.value;
      renderTxTable(editable);
    });
    const supplierField = document.getElementById('tf_supplier');
    if(supplierField) supplierField.addEventListener('input', ()=>{
      txSupplierFilter = supplierField.value;
      renderTxTable(editable);
    });
    document.getElementById('addTxBtn').addEventListener('click', ()=>{
    const supplierName = document.getElementById('tf_supplier').value;
    const matchedSupplier = findSupplierByName(supplierName);
    if(!matchedSupplier){ toast(supplierName.trim() ? `Không tìm thấy NCC "${supplierName.trim()}" — chọn đúng tên có trong danh sách gợi ý` : 'Cần chọn NCC trước'); return; }
    const supplierId = matchedSupplier.id;
    const gross = parseMoneyInput(document.getElementById('tf_gross').value);
    if(gross<=0){ toast('Nhập doanh số trước VAT'); return; }
    const s = supplierById(supplierId);
    const unit = lockedUnit || ensureUnit(document.getElementById('tf_unit').value);
    if(!unit){ toast('Nhập tên đơn vị trước'); return; }
    state.transactions.push({
      id: uid('t'),
      date: document.getElementById('tf_date').value || todayISO(),
      unit, supplierId,
      doc: document.getElementById('tf_doc').value.trim(),
      category: document.getElementById('tf_cat').value.trim(),
      gross, returns: parseMoneyInput(document.getElementById('tf_return').value),
      createdBy: currentUserId,
    });
    document.getElementById('tf_gross').value=''; document.getElementById('tf_return').value=''; document.getElementById('tf_doc').value='';
    logActivity('create','Doanh số', `${unit} → ${s?s.name:''}: ${fmt(gross)}đ`);
    toast('Đã ghi nhận chứng từ');
    txUnitFilter = unit;
    txSupplierFilter = matchedSupplier.name;
    renderAll();
    });
  }
  renderTxTable(editable);
}
function renderTxTable(editable){
  const tbl = document.getElementById('txTable');
  const note = document.getElementById('txFilterNote');
  const unitFilter = (txUnitFilter||'').trim().toLowerCase();
  const supFilter = (txSupplierFilter||'').trim().toLowerCase();
  const all = state.transactions.slice().sort((a,b)=> b.date.localeCompare(a.date));
  const sorted = all.filter(t=>{
    if(unitFilter && !(t.unit||'').trim().toLowerCase().includes(unitFilter)) return false;
    if(supFilter){
      const s = supplierById(t.supplierId);
      if(!s || !s.name.trim().toLowerCase().includes(supFilter)) return false;
    }
    return true;
  });
  if(note){
    const parts = [];
    if(unitFilter) parts.push(`đơn vị <b>${escAttr(txUnitFilter)}</b>`);
    if(supFilter) parts.push(`NCC <b>${escAttr(txSupplierFilter)}</b>`);
    note.innerHTML = parts.length
      ? `Đang lọc theo ${parts.join(' · ')} (${sorted.length}/${all.length} chứng từ) · <a href="#" id="txClearFilter" style="color:var(--gold)">Xem tất cả</a>`
      : `Đang xem tất cả (${all.length} chứng từ)`;
    const clearBtn = document.getElementById('txClearFilter');
    if(clearBtn) clearBtn.addEventListener('click', e=>{
      e.preventDefault();
      txUnitFilter = ''; txSupplierFilter = '';
      const unitField = document.getElementById('tf_unit');
      if(unitField && !unitField.disabled) unitField.value = '';
      const supplierField = document.getElementById('tf_supplier');
      if(supplierField) supplierField.value = '';
      renderTxTable(editable);
    });
  }
  if(all.length===0){
    tbl.outerHTML = `<div class="empty"><div class="big">Chưa có chứng từ nào</div>${editable?'Ghi nhận doanh số đầu tiên ở form phía trên.':''}</div>`; return;
  }
  if(sorted.length===0){
    tbl.innerHTML = `<thead><tr><th>Ngày</th><th>Đơn vị</th><th class="wrap">NCC</th><th>Số CT</th><th>Nhóm hàng</th>
      <th class="num">Trước VAT</th><th class="num">Trả hàng</th><th class="num">DS tính CK</th><th>Người nhập</th><th></th></tr></thead>`;
    tbl.insertAdjacentHTML('afterend', `<div class="empty"><div class="big">Không có chứng từ nào khớp bộ lọc hiện tại</div></div>`);
    return;
  }
  tbl.innerHTML = `
    <thead><tr><th>Ngày</th><th>Đơn vị</th><th class="wrap">NCC</th><th>Số CT</th><th>Nhóm hàng</th>
      <th class="num">Trước VAT</th><th class="num">Trả hàng</th><th class="num">DS tính CK</th><th>Người nhập</th><th></th></tr></thead>
    <tbody>${sorted.map(t=>{
      const s = supplierById(t.supplierId);
      const net = (Number(t.gross)||0)-(Number(t.returns)||0);
      const creator = state.accounts.find(a=>a.id===t.createdBy);
      return `<tr>
        <td>${new Date(t.date+'T00:00:00').toLocaleDateString('vi-VN')}</td>
        <td>${t.unit}</td>
        <td class="wrap">${s?s.name:'<em>(đã xoá)</em>'}</td>
        <td>${t.doc||''}</td>
        <td>${t.category||''}</td>
        <td class="num">${fmt(t.gross)}</td>
        <td class="num">${fmt(t.returns)}</td>
        <td class="num" style="font-weight:600">${fmt(net)}</td>
        <td>${creator?creator.name:'<em>—</em>'}</td>
        <td>${canDeleteTx(t)?`<button class="row-del" data-del="${t.id}">✕</button>`:''}</td>
      </tr>`;
    }).join('')}</tbody>`;
  tbl.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const t = state.transactions.find(x=>x.id===btn.dataset.del);
      const s = t ? supplierById(t.supplierId) : null;
      state.transactions = state.transactions.filter(x=>x.id!==btn.dataset.del);
      logActivity('delete','Doanh số', `Xoá chứng từ ${t?t.doc||'':''} (${s?s.name:''}, ${t?fmt(t.gross):''}đ)`);
      renderAll();
    });
  });
}

/* ---------------------------- Phân bổ đơn vị ---------------------------- */
function renderAllocation(c){
  setTitle('Phân bổ đơn vị', 'Đóng góp doanh số của từng đơn vị cho từng NCC — cộng dồn toàn thời gian');
  const unitOwners = {};
  state.units.forEach(u=>{ unitOwners[u] = state.accounts.filter(a=>a.unit===u).map(a=>a.name); });
  const unassignedCount = state.units.filter(u=>unitOwners[u].length===0).length;
  const canManageUnits = canEdit('settings');
  c.innerHTML = `
    <div class="panel">
      <div class="panel-head"><div><h2>Người phụ trách theo đơn vị</h2>
      <div class="desc">Lấy từ Đơn vị phụ trách ở tab Quản trị tài khoản — ${unassignedCount>0?unassignedCount+' đơn vị chưa gán ai':'mọi đơn vị đều đã có người phụ trách'}${canManageUnits?' · bấm ✕ trên thẻ để xoá đơn vị':''}</div></div>
      ${canEdit('accounts') ? `<button class="btn btn-ghost" id="gotoAccountsBtn">Đi tới Quản trị tài khoản</button>` : ''}
      </div>
      <div class="panel-body">
        ${state.units.length===0 ? `<div class="helper">Chưa có đơn vị nào. Đơn vị sẽ tự tạo khi bạn gán "Đơn vị phụ trách" cho tài khoản, hoặc thêm thủ công ở tab Cài đặt.</div>` : `
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          ${state.units.map(u=>`
            <span class="tag ${unitOwners[u].length?'gold':''}" style="display:inline-flex;align-items:center;gap:6px" title="${unitOwners[u].join(', ')||'Chưa gán'}">
              ${u.replace('Đơn vị ','')}: ${unitOwners[u].length? unitOwners[u].join(', ') : '<em>chưa gán</em>'}
              ${canManageUnits ? `<button class="row-del" data-del-unit-alloc="${escAttr(u)}" title="Xoá đơn vị ${escAttr(u)}" style="padding:0 4px">✕</button>` : ''}
            </span>`).join('')}
        </div>`}
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><div><h2>Ma trận NCC × Đơn vị</h2>
      <div class="desc">${state.units.length} đơn vị hiện có · sửa danh sách đơn vị ở tab Cài đặt · % dưới mỗi ô là % hoàn thành chỉ tiêu đơn vị so với mốc đã phân bổ (xem/chỉnh ở nút "Phân bổ đơn vị" trong tab Chính sách CK; mốc chưa phân bổ chỉ tiêu sẽ không hiện %)</div></div></div>
      <div class="panel-body flush"><div class="matrix-scroll"><table class="data matrix-fixed" id="allocTable"></table></div></div>
    </div>
  `;
  if(canEdit('accounts')) document.getElementById('gotoAccountsBtn').addEventListener('click', ()=>{ activeTab='accounts'; renderAll(); });
  if(canManageUnits) document.querySelectorAll('[data-del-unit-alloc]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const u = btn.dataset.delUnitAlloc;
      const usage = unitUsage(u);
      const msg = usage.total>0
        ? `Đơn vị "${u}" đang được ${usage.accountsUsing} tài khoản phụ trách và có ${usage.txUsing} chứng từ ghi nhận. Xoá khỏi danh sách sẽ gỡ liên kết khỏi các tài khoản đó (chứng từ cũ vẫn giữ nguyên). Vẫn xoá?`
        : `Xoá đơn vị "${u}" khỏi danh sách?`;
      if(!confirm(msg)) return;
      deleteUnit(u);
      toast('Đã xoá đơn vị "'+u+'"');
      renderAll();
    });
  });
  const tbl = document.getElementById('allocTable');
  if(state.suppliers.length===0){
    tbl.outerHTML = `<div class="empty"><div class="big">Chưa có NCC</div></div>`; return;
  }
  // Mốc dùng để tính % hoàn thành theo đơn vị: CHỈ xét trong số các mốc ĐÃ ĐƯỢC PHÂN BỔ chỉ tiêu
  // (bỏ qua các mốc chưa cấu hình unitTargets, dù threshold gần hơn) — vì mốc chưa phân bổ gì thì
  // không có cơ sở tính %, và người dùng thường chỉ chủ động phân bổ đúng 1 mốc họ đang thực sự theo dõi.
  // Trong số các mốc đã phân bổ: ưu tiên mốc GẦN NHẤT CHƯA ĐẠT; nếu không còn mốc nào phía trên,
  // lấy mốc đã phân bổ có threshold cao nhất (đã đạt) để vẫn có % tham chiếu.
  function matrixTargetPolicyFor(supplierId, total){
    const withTargets = state.policies.filter(p=>p.supplierId===supplierId && p.unitTargets && Object.keys(p.unitTargets).length>0);
    if(withTargets.length===0) return null;
    const unmet = withTargets.filter(p=>p.threshold>total).sort((a,b)=>a.threshold-b.threshold);
    if(unmet.length) return unmet[0];
    return withTargets.slice().sort((a,b)=>b.threshold-a.threshold)[0];
  }
  const rows = state.suppliers.map(s=>{
    const perUnit = state.units.map(u=>allTimeRevenue(s.id,u));
    const total = perUnit.reduce((a,b)=>a+b,0);
    const max = Math.max(0,...perUnit);
    const share = total>0 ? max/total : 0;
    const topIdx = perUnit.indexOf(max);
    const targetPolicy = matrixTargetPolicyFor(s.id, total);
    return {s, perUnit, total, share, topUnit: total>0?state.units[topIdx]:'—', targetPolicy};
  });
  tbl.innerHTML = `
    ${matrixColgroupHTML(state.units.length, [8, 11, 13, 16])}
    <thead>
    <tr>
      <th>NCC</th>${state.units.map(u=>matrixUnitHeaderCell(u)).join('')}
      <th class="num">Tổng</th><th class="num">Tỷ trọng lớn nhất</th><th>Đơn vị chính</th><th>Gợi ý</th>
    </tr>
    <tr style="background:#fff">
      <th style="font-weight:400;color:var(--slate);font-size:10px">Người phụ trách</th>
      ${state.units.map(u=>`<th class="num unit-col" style="font-weight:400;color:var(--slate);font-size:10px;text-transform:none" title="${escAttr(unitOwners[u].join(', '))}"><span class="unit-col-inner">${unitOwners[u][0]||'—'}</span></th>`).join('')}
      <th></th><th></th><th></th><th></th>
    </tr>
    </thead>
    <tbody>${rows.map(r=>`
      <tr>
        ${matrixRowLabelCell(r.s.name)}
        ${r.perUnit.map((v,i)=>{
          const u = state.units[i];
          const target = (r.targetPolicy && r.targetPolicy.unitTargets) ? Number(r.targetPolicy.unitTargets[u])||0 : 0;
          const pct = target>0 ? Math.round(v/target*100) : null;
          const pctColor = pct===null ? '' : pct>=100 ? 'var(--forest)' : pct>=70 ? 'var(--amber)' : 'var(--rust)';
          return `<td class="num">${v>0?fmt(v):'—'}${pct!==null?`<div style="font-size:10px;font-weight:700;color:${pctColor}">${pct}%</div>`:''}</td>`;
        }).join('')}
        <td class="num" style="font-weight:700">${fmt(r.total)}</td>
        <td class="num">${r.total>0?fmtPct(r.share):'—'}</td>
        <td>${r.topUnit}</td>
        <td>${r.total===0?'—': (r.share>=0.5? '<span class="stamp warn">Xem xét đàm phán riêng</span>':'<span class="stamp muted">Theo dõi</span>')}</td>
      </tr>`).join('')}</tbody>`;
  wireStickyHeaderRows(tbl);
}

const RECON_PAY_METHODS = ['Chuyển khoản','Tiền mặt','Trừ công nợ','Khác'];

/* Chuẩn hoá 1 kỳ đối soát sang mô hình "Sổ nhận tiền" (nhiều dòng thanh toán) thay vì 1 số "Đã nhận" gõ tay.
   Nếu kỳ cũ (từ trước khi có tính năng này) đã có sẵn r.received > 0, tự chuyển thành 1 dòng thanh toán
   đầu tiên để không mất dữ liệu đã nhập trước đó. */
function ensureReconciliationPayments(r){
  if(!Array.isArray(r.payments)){
    const legacy = Number(r.received)||0;
    r.payments = legacy>0 ? [{
      id: uid('pay'), date: r.toDate||todayISO(), amount: legacy,
      method:'Chuyển khoản', note:'Chuyển từ dữ liệu "Đã nhận" cũ', createdBy: null,
    }] : [];
  }
  return r.payments;
}
function reconReceivedTotal(r){
  return ensureReconciliationPayments(r).reduce((sum,p)=> sum+(Number(p.amount)||0), 0);
}
/* Trạng thái đối soát giờ SUY RA tự động từ số tiền đã nhận thực tế so với CK phải hưởng,
   không cho chọn tay nữa — tránh tình trạng Trạng thái nói một đằng, số liệu nói một nẻo. */
function reconStatus(totalDue, receivedTotal){
  if(totalDue<=0) return {label:'Chưa có CK', cls:'muted'};
  if(receivedTotal<=0) return {label:'Chưa đối soát', cls:'muted'};
  if(receivedTotal < totalDue) return {label:'Đang xử lý', cls:'pending'};
  if(receivedTotal > totalDue) return {label:'Nhận vượt', cls:'warn'};
  return {label:'Đã nhận đủ', cls:'ok'};
}

function reconCalc(r){
  const from = toDate(r.fromDate), to = toDate(r.toDate);
  if(!r.supplierId || !from || !to) return {revenue:0, rate:0, discount:0, bonus:0, totalDue:0, diff:0, stillOwed:0};
  const revenue = sumRevenue(r.supplierId, from, to);
  // Dùng đúng "Phương pháp áp dụng" (hồi tố toàn bộ / chỉ phần vượt mốc) và tôn trọng "Ngày kết thúc"
  // của từng mốc — đánh giá hiệu lực mốc TẠI THỜI ĐIỂM CUỐI KỲ đối soát (to), không phải hôm nay,
  // để đối soát 1 kỳ trong quá khứ vẫn đúng ngay cả khi mốc đó đã hết hạn ở hiện tại.
  const method = calcMethodOf(r.supplierId, to);
  const tier = currentTier(r.supplierId, revenue, to);
  const rate = tier ? tier.rate : 0;
  const discount = method==='Chỉ phần vượt mốc' ? incrementalDiscount(r.supplierId, revenue, to) : revenue*rate;
  const ref = toDate(state.reportDate) || new Date();
  const bonus = bonusAmount(r.supplierId, ref);
  const totalDue = discount + bonus;
  const confirmed = Number(r.confirmed)||0;
  const received = reconReceivedTotal(r);
  return {revenue, rate, discount, bonus, totalDue, diff: received-totalDue, stillOwed: Math.max(0, totalDue-received), received, method};
}

/* ============================================================================
   MODULE NGÂN HÀNG — Danh mục NH · Chính sách CK (điều kiện vay) · Doanh số
   (hồ sơ vay/giải ngân) · Phân bổ đơn vị · Đối soát CK (hoa hồng)
   Cùng cấu trúc thao tác với module "NCC Dịch vụ Ô tô - Xe máy" nhưng dùng
   state.banks/bankPolicies/bankTransactions/bankReconciliations riêng, vì
   chính sách ngân hàng đổi theo THÁNG (không theo mốc doanh số luỹ kế) và
   Hoa hồng tính trực tiếp trên số tiền GIẢI NGÂN, không có luỹ kế mốc.
   ============================================================================ */
function bankById(id){ return state.banks.find(b=>b.id===id); }
function insurerById(id){ return state.insurers.find(x=>x.id===id); }
function monthKey(dateStr){ return (dateStr||todayISO()).slice(0,7); }
function monthLabel(mk){
  if(!mk) return '—';
  const [y,m] = mk.split('-');
  return 'Tháng '+Number(m)+'/'+y;
}
/* Chính sách áp dụng cho 1 NH tại 1 ngày = dòng chính sách CÙNG THÁNG hoặc THÁNG GẦN NHẤT
   trước đó (chính sách tháng trước vẫn có hiệu lực cho tới khi có chính sách tháng mới hơn). */
function activeBankPolicy(bankId, dateStr){
  const mk = monthKey(dateStr);
  const rows = state.bankPolicies.filter(p=>p.bankId===bankId && p.month<=mk).sort((a,b)=> b.month.localeCompare(a.month));
  return rows[0] || null;
}
function bankTxCommission(t){
  if(t.status!=='Đã giải ngân') return 0;
  const pol = activeBankPolicy(t.bankId, t.date);
  if(!pol) return 0;
  return (Number(t.loanAmount)||0) * (Number(pol.commissionRate)||0);
}
function bankLoanSum(bankId, from, to, unit){
  let total=0;
  for(const t of state.bankTransactions){
    if(t.bankId!==bankId || t.status!=='Đã giải ngân') continue;
    if(unit && t.unit!==unit) continue;
    const d = toDate(t.date);
    if(from && d<from) continue;
    if(to && d>to) continue;
    total += Number(t.loanAmount)||0;
  }
  return total;
}
function bankCommissionSum(bankId, from, to, unit){
  let total=0;
  for(const t of state.bankTransactions){
    if(t.bankId!==bankId || t.status!=='Đã giải ngân') continue;
    if(unit && t.unit!==unit) continue;
    const d = toDate(t.date);
    if(from && d<from) continue;
    if(to && d>to) continue;
    total += bankTxCommission(t);
  }
  return total;
}
function allTimeBankLoan(bankId, unit){ return bankLoanSum(bankId,null,null,unit); }
function allTimeBankCommission(bankId, unit){ return bankCommissionSum(bankId,null,null,unit); }
function bankReconCalc(r){
  const from=toDate(r.fromDate), to=toDate(r.toDate);
  if(!r.bankId||!from||!to) return {loan:0, totalDue:0, received:0, diff:0, stillOwed:0};
  const loan = bankLoanSum(r.bankId, from, to);
  const totalDue = bankCommissionSum(r.bankId, from, to);
  const received = reconReceivedTotal(r);
  return {loan, totalDue, received, diff:received-totalDue, stillOwed:Math.max(0,totalDue-received)};
}

      status: document.getElementById('bf_status').value, note:''};
    state.banks.push(b);

    toast('Đã thêm ngân hàng: '+name);
    renderAll();

    tbl.outerHTML = `<div class="empty"><div class="big">Chưa có ngân hàng nào</div>${editable?'Thêm ngân hàng đầu tiên ở form phía trên.':''}</div>`;

    <tbody>${state.banks.map(b=>`
      <tr data-rowid="${b.id}">
        <td>${b.stt}</td>
        <td class="wrap"><input class="cell-edit" data-field="name" data-id="${b.id}" value="${escAttr(b.name)}" ${editable?'':'disabled'}></td>
        <td><input class="cell-edit" data-field="contact" data-id="${b.id}" value="${escAttr(b.contact||'')}" ${editable?'':'disabled'}></td>
        <td><select class="cell-edit" data-field="status" data-id="${b.id}" ${editable?'':'disabled'}>${['Đang hợp tác','Theo dõi','Thử nghiệm','Ngừng hợp tác'].map(p=>`<option ${b.status===p?'selected':''}>${p}</option>`).join('')}</select></td>
        <td>${contractBadgeHTML(b)}</td>
        <td>${editable?`<button class="row-del" data-del="${b.id}" title="Xoá ngân hàng">✕</button>`:''}</td>
      </tr>`).join('')}</tbody>`;
  wireContractBadges(tbl, state.banks, 'NH', editable);
  if(editable){
    wireCellEdits(tbl, state.banks, 'NH', b=>b.name);
    tbl.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.del;
        const bk = bankById(id);
        const hasDeps = state.bankPolicies.some(p=>p.bankId===id) || state.bankTransactions.some(t=>t.bankId===id);
        if(hasDeps && !confirm('Ngân hàng này đang có chính sách/doanh số liên quan. Xoá sẽ không xoá các dữ liệu đó nhưng chúng sẽ mất liên kết. Vẫn xoá?')) return;
        state.banks = state.banks.filter(b=>b.id!==id);
        logActivity('delete','NH', `Xoá ngân hàng "${bk?bk.name:id}"`);
        renderAll();
      });
    });
  }
}

  c.innerHTML = `
    ${editable ? `
    <div class="panel">
      <div class="panel-head"><div><h2>Ghi nhận hồ sơ vay</h2></div></div>

          </div>

          <div class="field"><label>SĐT khách hàng</label><input id="btf_phone" type="tel" placeholder="09xxxxxxxx"></div>
          <div class="field"><label>Xe (biển số / mẫu xe)</label><input id="btf_vehicle" placeholder="VD: 29A-123.45 · Honda SH"></div>
          <div class="field"><label>Mã hồ sơ NH</label><input id="btf_refcode" placeholder="Số HĐ tín dụng / mã hồ sơ"></div>
          <div class="field"><label>Số tiền vay (VNĐ)</label><input id="btf_amount" class="field-money" type="text" inputmode="numeric" placeholder="0"></div>
          <div class="field"><label>Trạng thái</label><select id="btf_status">${BANK_TX_STATUSES.map(s=>`<option ${s==='Đang xử lý'?'selected':''}>${s}</option>`).join('')}</select></div>
          <div class="field" style="grid-column:1/-1"><label>Ghi chú</label><input id="btf_note" placeholder="Ghi chú khác..."></div>
          <button class="btn btn-primary" id="addBankTxBtn">+ Ghi nhận hồ sơ</button>
        </div>
        <div class="helper">Chỉ hồ sơ trạng thái <b>"Đã giải ngân"</b> mới được tính Hoa hồng, theo đúng chính sách của ngân hàng đó tại tháng giải ngân. Nếu ngân hàng chưa có chính sách của tháng đó (hoặc tháng trước gần nhất), hệ thống báo "Chưa có chính sách" và Hoa hồng ghi 0đ.</div>
      </div>
    </div>` : lockedNote('Bạn đang xem ở chế độ chỉ đọc — chỉ Admin/Quản lý/Nhân viên mới ghi nhận hồ sơ vay.')}
    <div class="panel">
      <div class="panel-head">
        <div><h2>Sổ hồ sơ vay</h2><div class="desc" id="btxFilterNote"></div></div>
      </div>
      <div class="panel-body flush"><div class="tbl-wrap"><table class="data" id="btxTable"></table></div></div>
    </div>
  `;
  if(editable){
    attachMoneyFormatting(document.getElementById('btf_amount'));
    const unitField = document.getElementById('btf_unit');
    if(unitField && !lockedUnit) unitField.addEventListener('input', ()=>{ bankTxUnitFilter = unitField.value; renderBankTxTable(editable); });
    const bankField = document.getElementById('btf_bank');
    if(bankField) bankField.addEventListener('input', ()=>{ bankTxBankFilter = bankField.value; renderBankTxTable(editable); });
    document.getElementById('addBankTxBtn').addEventListener('click', ()=>{
      const bankName = document.getElementById('btf_bank').value;
      const bank = state.banks.find(b=>b.name.trim().toLowerCase()===bankName.trim().toLowerCase());
      if(!bank){ toast(bankName.trim() ? `Không tìm thấy ngân hàng "${bankName.trim()}" — chọn đúng tên có trong danh sách gợi ý` : 'Cần chọn ngân hàng trước'); return; }
      const amount = parseMoneyInput(document.getElementById('btf_amount').value);
      if(amount<=0){ toast('Nhập số tiền vay'); return; }
      const unit = lockedUnit || ensureUnit(document.getElementById('btf_unit').value);
      if(!unit){ toast('Nhập tên đơn vị trước'); return; }
      const status = document.getElementById('btf_status').value;
      state.bankTransactions.push({
        id: uid('bt'), date: document.getElementById('btf_date').value || todayISO(),
        unit, bankId: bank.id, customer: document.getElementById('btf_customer').value.trim(),
        phone: document.getElementById('btf_phone').value.trim(),
        vehicle: document.getElementById('btf_vehicle').value.trim(),
        refCode: document.getElementById('btf_refcode').value.trim(),
        loanAmount: amount, status, note: document.getElementById('btf_note').value.trim(),
        createdBy: currentUserId,
      });
      document.getElementById('btf_amount').value=''; document.getElementById('btf_customer').value='';
      document.getElementById('btf_phone').value=''; document.getElementById('btf_vehicle').value='';
      document.getElementById('btf_refcode').value=''; document.getElementById('btf_note').value='';
      logActivity('create','Doanh số (NH)', `${unit} → ${bank.name}: ${fmt(amount)}đ (${status})`);
      toast('Đã ghi nhận hồ sơ vay');
      bankTxUnitFilter = unit; bankTxBankFilter = bank.name;
      renderAll();
    });
  }
  renderBankTxTable(editable);
}
function renderBankTxTable(editable){
  const tbl = document.getElementById('btxTable');
  const note = document.getElementById('btxFilterNote');
  const unitFilter = (bankTxUnitFilter||'').trim().toLowerCase();
  const bankFilter = (bankTxBankFilter||'').trim().toLowerCase();
  const all = state.bankTransactions.slice().sort((a,b)=> b.date.localeCompare(a.date));
  const sorted = all.filter(t=>{
    if(unitFilter && !(t.unit||'').trim().toLowerCase().includes(unitFilter)) return false;
    if(bankFilter){ const b = bankById(t.bankId); if(!b || !b.name.trim().toLowerCase().includes(bankFilter)) return false; }
    return true;
  });
  if(note){
    const parts = [];
    if(unitFilter) parts.push(`đơn vị <b>${escAttr(bankTxUnitFilter)}</b>`);
    if(bankFilter) parts.push(`ngân hàng <b>${escAttr(bankTxBankFilter)}</b>`);
    note.innerHTML = parts.length
      ? `Đang lọc theo ${parts.join(' · ')} (${sorted.length}/${all.length} hồ sơ) · <a href="#" id="btxClearFilter" style="color:var(--gold)">Xem tất cả</a>`
      : `Đang xem tất cả (${all.length} hồ sơ)`;
    const clearBtn = document.getElementById('btxClearFilter');
    if(clearBtn) clearBtn.addEventListener('click', e=>{
      e.preventDefault();
      bankTxUnitFilter=''; bankTxBankFilter='';
      const unitField = document.getElementById('btf_unit'); if(unitField && !unitField.disabled) unitField.value='';
      const bankField = document.getElementById('btf_bank'); if(bankField) bankField.value='';
      renderBankTxTable(editable);
    });
  }
  if(all.length===0){
    tbl.outerHTML = `<div class="empty"><div class="big">Chưa có hồ sơ vay nào</div>${editable?'Ghi nhận hồ sơ đầu tiên ở form phía trên.':''}</div>`; return;
  }
  if(sorted.length===0){
    tbl.innerHTML = `<thead><tr><th>Hồ sơ</th><th>Khách hàng</th><th class="num">Số tiền vay</th><th>Trạng thái</th><th class="num">Hoa hồng</th><th>Người nhập</th><th></th></tr></thead>`;
    tbl.insertAdjacentHTML('afterend', `<div class="empty"><div class="big">Không có hồ sơ nào khớp bộ lọc hiện tại</div></div>`);
    return;
  }
  const statusClass = s => s==='Đã giải ngân'?'st-disbursed':(s==='Đã duyệt'?'st-approved':(s==='Từ chối'?'st-rejected':'st-pending'));
  tbl.innerHTML = `
    <thead><tr><th>Hồ sơ</th><th>Khách hàng</th><th class="num">Số tiền vay</th><th>Trạng thái</th><th class="num">Hoa hồng</th><th>Người nhập</th><th></th></tr></thead>
    <tbody>${sorted.map(t=>{
      const b = bankById(t.bankId);
      const creator = state.accounts.find(a=>a.id===t.createdBy);
      const pol = t.status==='Đã giải ngân' ? activeBankPolicy(t.bankId, t.date) : null;
      const comm = bankTxCommission(t);
      const commCell = t.status!=='Đã giải ngân'
        ? '<span class="comm-cell zero">—</span>'
        : (pol ? `<span class="comm-cell has-value">${fmt(comm)}</span>` : `<span class="comm-cell warn-empty" title="Chưa có chính sách cho ${monthLabel(monthKey(t.date))}">0đ · chưa có CS</span>`);
      const dis = editable?'':'disabled';
      return `<tr>
        <td>
          <div class="stack-cell">
            ${editable
              ? `<input class="cell-edit mini-field" data-field="date" data-id="${t.id}" type="date" value="${t.date}">`
              : `<div class="mini-field">${new Date(t.date+'T00:00:00').toLocaleDateString('vi-VN')}</div>`}
            <div class="meta-line">${t.unit} → ${b?b.name:'<em>(đã xoá)</em>'}</div>
            ${editable
              ? `<input class="cell-edit mini-field muted" data-field="refCode" data-id="${t.id}" value="${escAttr(t.refCode||'')}" placeholder="Mã hồ sơ NH">`
              : (t.refCode?`<div class="meta-line">Mã HS: ${escAttr(t.refCode)}</div>`:'')}
          </div>
        </td>
        <td>
          <div class="stack-cell">
            <input class="cell-edit mini-field" data-field="customer" data-id="${t.id}" value="${escAttr(t.customer||'')}" ${dis} placeholder="Tên khách hàng" style="font-weight:600">
            <input class="cell-edit mini-field muted" data-field="phone" data-id="${t.id}" type="tel" value="${escAttr(t.phone||'')}" ${dis} placeholder="SĐT">
            <input class="cell-edit mini-field muted italic" data-field="vehicle" data-id="${t.id}" value="${escAttr(t.vehicle||'')}" ${dis} placeholder="Biển số / xe">
          </div>
        </td>
        <td class="num"><input class="cell-edit num money mini-field" data-field="loanAmount" data-id="${t.id}" type="text" inputmode="numeric" value="${formatMoneyValue(t.loanAmount)}" ${dis} style="text-align:right;font-weight:600;min-width:120px"></td>
        <td>${editable
          ? `<select class="cell-edit status-select ${statusClass(t.status)}" data-status-id="${t.id}">${BANK_TX_STATUSES.map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select>`
          : `<span class="stamp ${t.status==='Đã giải ngân'?'ok':(t.status==='Từ chối'?'warn':'pending')}">${t.status}</span>`}</td>
        <td class="num">${commCell}</td>
        <td class="meta-line">${creator?creator.name:'<em>—</em>'}</td>
        <td>${editable?`<button class="row-del" data-del="${t.id}">✕</button>`:''}</td>

/* ---------------------------- Module đang xây dựng (Ngân hàng / Bảo hiểm) ---------------------------- */
/* ============================================================================
   BẢO HIỂM (NCC bán bảo hiểm xe: BHVC/BHDS)
   Thiết kế dữ liệu:
   - insurers: danh mục hãng/đại lý bảo hiểm — hoa hồng chuẩn BHVC (vật chất xe) & BHDS (dân sự),
     điều khoản nổi bật (mã BS) để tra nhanh quyền lợi đặc thù.
   - insRates: BIỂU PHÍ — mỗi dòng = 1 khoảng "Giá trị xe" của 1 NCC, có sẵn 4 cột tỷ lệ phí (%)
     theo "Tuổi xe" (<3 / 3-6 / 6-10 / ≥10 năm). Để trống ô nào nghĩa là NCC đó CHƯA báo giá mốc tuổi đó
     — khoa học ở chỗ: 1 dòng khớp đúng 1 hàng trong bảng Excel gốc, không tách vụn theo từng ô,
     nên thêm/sửa/xoá cả 1 khoảng giá trị chỉ cần đúng 1 thao tác.
   - valueOrder (triệu đồng): mốc dưới của khoảng, dùng để bảng tự sắp xếp & công cụ "So sánh phí"
     tự dò đúng khoảng theo giá trị xe nhập vào — không phải dò tay từng dòng.
   ========================================================================= */
const AGE_BANDS = [
  {key:'lt3', label:'Dưới 3 năm'},
  {key:'y3to6', label:'Từ 3 – dưới 6 năm'},
  {key:'y6to10', label:'Từ 6 – dưới 10 năm'},
  {key:'gte10', label:'Từ 10 năm trở lên'},
];
function ageBandKey(years){
  const y = Number(years)||0;
  if(y<3) return 'lt3';
  if(y<6) return 'y3to6';
  if(y<10) return 'y6to10';
  return 'gte10';
}
function insRateRowsFor(insurerId){
  return state.insRates.filter(r=>r.insurerId===insurerId).sort((a,b)=>a.valueOrder-b.valueOrder);
}// Dò đúng khoảng "Giá trị xe" theo valueOrder, rồi lấy đúng cột tuổi xe tương ứng.
function findInsRate(insurerId, valueTrieu, ageYears){
  const rows = insRateRowsFor(insurerId);
  if(!rows.length) return null;
  let match = null;
  for(let i=0;i<rows.length;i++){
    const cur = rows[i], next = rows[i+1];
    if(valueTrieu>=cur.valueOrder && (!next || valueTrieu<next.valueOrder)){ match = cur; break; }
  }
  if(!match) return null;
  const ageKey = ageBandKey(ageYears);
  return {row:match, ageKey, rate: match[ageKey]};
}

        state.insurers = state.insurers.filter(x=>x.id!==id);
        logActivity('delete','NCC Bảo hiểm', `Xoá NCC bảo hiểm "${ins?ins.name:id}"`);
        renderAll();
      });
    });
  }
}

/* ---------------------------- Bảo hiểm · Doanh số (hợp đồng đã bán) ---------------------------- */
const INS_TX_STATUSES = ['Đang xử lý','Đã duyệt','Đã cấp đơn','Huỷ'];
const INS_PRODUCTS = ['BHVC','BHDS'];
let insTxUnitFilter = '';
let insTxInsurerFilter = '';
let insReconExpanded = new Set();

// Hoa hồng chỉ tính khi hợp đồng đã "Đã cấp đơn", theo đúng tỷ lệ BHVC/BHDS của NCC đó
// (khác Ngân hàng: hoa hồng bảo hiểm không đổi theo tháng, chỉ đổi theo loại sản phẩm).
function insTxCommission(t){
  if(t.status!=='Đã cấp đơn') return 0;
  const ins = insurerById(t.insurerId);
  if(!ins) return 0;
  const rate = t.product==='BHDS' ? ins.bhds : ins.bhvc;
  return (Number(t.premiumAmount)||0) * (Number(rate)||0);
}
function insPremiumSum(insurerId, from, to, unit){
  let total=0;
  for(const t of state.insTransactions){
    if(t.insurerId!==insurerId || t.status!=='Đã cấp đơn') continue;
    if(unit && t.unit!==unit) continue;
    const d = toDate(t.date);
    if(from && d<from) continue;
    if(to && d>to) continue;
    total += Number(t.premiumAmount)||0;
  }
  return total;
}
function insCommissionSum(insurerId, from, to, unit){
  let total=0;
  for(const t of state.insTransactions){
    if(t.insurerId!==insurerId || t.status!=='Đã cấp đơn') continue;
    if(unit && t.unit!==unit) continue;
    const d = toDate(t.date);
    if(from && d<from) continue;
    if(to && d>to) continue;
    total += insTxCommission(t);
  }
  return total;
}
function allTimeInsPremium(insurerId, unit){ return insPremiumSum(insurerId,null,null,unit); }
function allTimeInsCommission(insurerId, unit){ return insCommissionSum(insurerId,null,null,unit); }

/* ---- DT dịch vụ/sửa chữa theo hãng theo tháng (nhập tay) + đề xuất tỷ lệ bán tháng sau ---- */
function currentMonthISO(){ return todayISO().slice(0,7); }
function insMonthBounds(monthStr){
  // monthStr dạng 'YYYY-MM' -> {from,to} phủ trọn tháng đó (đặt tên riêng, tránh trùng với monthRange(ref) dùng cho chu kỳ theo dõi)
  const [y,m] = String(monthStr||'').split('-').map(Number);
  if(!y||!m) return {from:null,to:null};
  const from = toDate(`${monthStr}-01`);
  const lastDay = new Date(y, m, 0).getDate();
  const to = toDate(`${monthStr}-${String(lastDay).padStart(2,'0')}`);
  return {from,to};
}
function insBRForMonth(insurerId, month){
  const {from,to} = insMonthBounds(month);
  return insPremiumSum(insurerId, from, to);
}
function insMonthlyRevenueEntry(insurerId, month){
  return (state.insMonthlyRevenue||[]).find(x=>x.insurerId===insurerId && x.month===month) || null;
}
function insDVForMonth(insurerId, month){
  const e = insMonthlyRevenueEntry(insurerId, month);
  return e ? (Number(e.serviceAmount)||0) : 0;
}
function upsertInsMonthlyRevenue(insurerId, month, amount){
  if(!state.insMonthlyRevenue) state.insMonthlyRevenue = [];
  let e = insMonthlyRevenueEntry(insurerId, month);
  if(!e){
    e = {id:uid('imr'), insurerId, month, serviceAmount:0, allocationRate:null, note:'', updatedBy:currentUserId, updatedAt:new Date().toISOString()};
    state.insMonthlyRevenue.push(e);
  }
  e.serviceAmount = Math.max(0, Number(amount)||0);
  e.updatedBy = currentUserId; e.updatedAt = new Date().toISOString();
  return e;
}
function prevMonthISO(month){
  const [y,m] = String(month||'').split('-').map(Number);
  if(!y||!m) return currentMonthISO();
  const d = new Date(y, m-2, 1); // m-1 = tháng hiện tại (0-idx), -1 nữa để lùi 1 tháng
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
/* Tỷ lệ phân bổ tháng (%) — kế hoạch bán ra được Admin/Quản lý nhập định kỳ mỗi tháng cho từng hãng,
   thường căn cứ theo "Đề xuất tỷ lệ bán tháng sau" đã tính ở tháng liền trước. Lưu dạng phân số (0-1). */
function insAllocationRateForMonth(insurerId, month){
  const e = insMonthlyRevenueEntry(insurerId, month);
  return e && e.allocationRate!=null ? Number(e.allocationRate) : null;
}
function upsertInsAllocationRate(insurerId, month, ratePct){
  if(!state.insMonthlyRevenue) state.insMonthlyRevenue = [];
  let e = insMonthlyRevenueEntry(insurerId, month);
  if(!e){
    e = {id:uid('imr'), insurerId, month, serviceAmount:0, allocationRate:null, note:'', updatedBy:currentUserId, updatedAt:new Date().toISOString()};
    state.insMonthlyRevenue.push(e);
  }
  e.allocationRate = (ratePct===null || ratePct==='') ? null : Math.max(0, Number(ratePct)||0)/100;
  e.updatedBy = currentUserId; e.updatedAt = new Date().toISOString();
  return e;
}
/* Áp dụng "Đề xuất tỷ lệ bán tháng sau" đã tính ở tháng liền trước làm Tỷ lệ phân bổ cho tháng đang xem — áp dụng hàng loạt cho mọi hãng */
function applyPrevMonthSuggestionToAllocation(month){
  const prev = prevMonthISO(month);
  const {rows} = insAllocRows(prev);
  let applied = 0;
  rows.forEach(r=>{
    if(r.hasData){ upsertInsAllocationRate(r.ins.id, month, round2(r.proposedRate*100)); applied++; }
  });
  return {prev, applied};
}
/* Tổng hợp DT bán ra (BR) + DT dịch vụ (DV) của TOÀN hệ thống trong 1 tháng, cộng dồn mọi hãng bảo hiểm */
function insSystemTotalsForMonth(month){
  let br=0, dv=0;
  state.insurers.forEach(ins=>{ br += insBRForMonth(ins.id, month); dv += insDVForMonth(ins.id, month); });
  return {br, dv, total: br+dv};
}
function insAlertThreshold(){ return Number(state.insAllocAlertThreshold ?? 0.05) || 0.05; }
/* Tính bảng so sánh Thực tế tỷ lệ bán vs Tỷ lệ phân bổ tháng (kế hoạch) cho 1 tháng, sắp theo mức lệch |diff| giảm dần.
   Chênh lệch = Thực tế tỷ lệ bán − Tỷ lệ phân bổ tháng.
   status: 'over' (đang bán VƯỢT kế hoạch phân bổ — nên giảm), 'under' (đang bán DƯỚI kế hoạch — nên tăng),
           'noplan' (chưa đặt tỷ lệ phân bổ tháng nên chưa so sánh được), 'nodata' (chưa có BR/DV), 'ok' (trong ngưỡng) */
function insAllocRows(month){
  const sys = insSystemTotalsForMonth(month);
  const th = insAlertThreshold();
  const rows = state.insurers.map(ins=>{
    const br = insBRForMonth(ins.id, month);
    const dv = insDVForMonth(ins.id, month);
    const scBr = br>0 ? dv/br : (dv>0 ? Infinity : null);
    const actualRate = sys.br>0 ? br/sys.br : 0;
    const proposedRate = sys.dv>0 ? dv/sys.dv : 0; // đề xuất tỷ lệ bán THÁNG SAU = tỷ trọng DT dịch vụ của hãng trong TỔNG DT dịch vụ toàn hệ thống — luôn cộng lại đúng 100% giữa các hãng, dùng làm căn cứ chia % bán ra tháng sau (không dùng để tính chênh lệch/cảnh báo tháng này)
    const hasData = br>0 || dv>0;
    const allocationRate = insAllocationRateForMonth(ins.id, month);
    const hasPlan = allocationRate!=null;
    const diff = hasPlan ? (actualRate - allocationRate) : null; // Chênh lệch = Thực tế − Phân bổ tháng
    let status = 'ok';
    if(!hasData) status = 'nodata';
    else if(!hasPlan) status = 'noplan';
    else if(Math.abs(diff) > th) status = diff>0 ? 'over' : 'under';
    return {ins, br, dv, scBr, actualRate, proposedRate, diff, hasData, hasPlan, status, allocationRate};
  });
  rows.sort((a,b)=> Math.abs(b.diff||0)-Math.abs(a.diff||0));
  return {rows, sys, threshold:th};
}
/* Số hãng đang vượt ngưỡng cảnh báo trong tháng hiện tại — dùng để gắn chấm đỏ trên menu (nhắc nhở mỗi lần mở app) */
function insAllocAlertCount(){
  if(!state.insurers || state.insurers.length===0) return 0;
  const {rows} = insAllocRows(currentMonthISO());
  return rows.filter(r=>r.status==='over'||r.status==='under').length;
}
function insReconCalc(r){
  const from=toDate(r.fromDate), to=toDate(r.toDate);
  if(!r.insurerId||!from||!to) return {premium:0, totalDue:0, received:0, diff:0, stillOwed:0};
  const premium = insPremiumSum(r.insurerId, from, to);
  const totalDue = insCommissionSum(r.insurerId, from, to);
  const received = reconReceivedTotal(r);
  return {premium, totalDue, received, diff:received-totalDue, stillOwed:Math.max(0,totalDue-received)};
}

          <div class="field"><label>SĐT khách hàng</label><input id="itf_phone" type="tel" placeholder="09xxxxxxxx"></div>
          <div class="field"><label>Xe (biển số / mẫu xe)</label><input id="itf_vehicle" placeholder="VD: 29A-123.45 · Honda SH"></div>
          <div class="field"><label>Số đơn bảo hiểm</label><input id="itf_policyno" placeholder="Số hợp đồng / giấy CN bảo hiểm"></div>
          <div class="field"><label>Phí bảo hiểm thu (VNĐ)</label><input id="itf_amount" class="field-money" type="text" inputmode="numeric" placeholder="0"></div>
          <div class="field"><label>Trạng thái</label><select id="itf_status">${INS_TX_STATUSES.map(s=>`<option ${s==='Đang xử lý'?'selected':''}>${s}</option>`).join('')}</select></div>
          <div class="field" style="grid-column:1/-1"><label>Ghi chú</label><input id="itf_note" placeholder="Ghi chú khác..."></div>
          <button class="btn btn-primary" id="addInsTxBtn">+ Ghi nhận hợp đồng</button>
        </div>
        <div class="helper">Chỉ hợp đồng trạng thái <b>"Đã cấp đơn"</b> mới được tính Hoa hồng, theo đúng tỷ lệ BHVC/BHDS của NCC đó — xem/sửa tỷ lệ ở tab "Danh mục NCC".</div>
      </div>
    </div>` : lockedNote('Bạn đang xem ở chế độ chỉ đọc — chỉ Admin/Quản lý/Nhân viên mới ghi nhận hợp đồng.')}
    <div class="panel">
      <div class="panel-head">
        <div><h2>Sổ hợp đồng bảo hiểm</h2><div class="desc" id="itxFilterNote"></div></div>
      </div>
      <div class="panel-body flush"><div class="tbl-wrap"><table class="data" id="itxTable"></table></div></div>
    </div>
  `;
  if(editable){
    attachMoneyFormatting(document.getElementById('itf_amount'));
    const unitField = document.getElementById('itf_unit');
    if(unitField && !lockedUnit) unitField.addEventListener('input', ()=>{ insTxUnitFilter = unitField.value; renderInsTxTable(editable); });
    const insField = document.getElementById('itf_ins');
    if(insField) insField.addEventListener('input', ()=>{ insTxInsurerFilter = insField.value; renderInsTxTable(editable); });
    document.getElementById('addInsTxBtn').addEventListener('click', ()=>{
      const insName = document.getElementById('itf_ins').value;
      const ins = state.insurers.find(x=>x.name.trim().toLowerCase()===insName.trim().toLowerCase());
      if(!ins){ toast(insName.trim() ? `Không tìm thấy NCC "${insName.trim()}" — chọn đúng tên có trong danh sách gợi ý` : 'Cần chọn NCC bảo hiểm trước'); return; }
      const amount = parseMoneyInput(document.getElementById('itf_amount').value);
      if(amount<=0){ toast('Nhập phí bảo hiểm thu'); return; }
      const unit = lockedUnit || ensureUnit(document.getElementById('itf_unit').value);
      if(!unit){ toast('Nhập tên đơn vị trước'); return; }
      const status = document.getElementById('itf_status').value;
      state.insTransactions.push({
        id: uid('it'), date: document.getElementById('itf_date').value || todayISO(),
        unit, insurerId: ins.id, product: document.getElementById('itf_product').value,
        customer: document.getElementById('itf_customer').value.trim(),
        phone: document.getElementById('itf_phone').value.trim(),
        vehicle: document.getElementById('itf_vehicle').value.trim(),
        policyNo: document.getElementById('itf_policyno').value.trim(),
        premiumAmount: amount, status, note: document.getElementById('itf_note').value.trim(),
        createdBy: currentUserId,
      });
      document.getElementById('itf_amount').value=''; document.getElementById('itf_customer').value='';
      document.getElementById('itf_phone').value=''; document.getElementById('itf_vehicle').value='';
      document.getElementById('itf_policyno').value=''; document.getElementById('itf_note').value='';
      logActivity('create','Doanh số (Bảo hiểm)', `${unit} → ${ins.name}: ${fmt(amount)}đ (${status})`);
      toast('Đã ghi nhận hợp đồng bảo hiểm');
      insTxUnitFilter = unit; insTxInsurerFilter = ins.name;
      renderAll();
    });
  }
  renderInsTxTable(editable);
}
function renderInsTxTable(editable){
  const tbl = document.getElementById('itxTable');
  const note = document.getElementById('itxFilterNote');
  const unitFilter = (insTxUnitFilter||'').trim().toLowerCase();
  const insFilter = (insTxInsurerFilter||'').trim().toLowerCase();
  const all = state.insTransactions.slice().sort((a,b)=> b.date.localeCompare(a.date));
  const sorted = all.filter(t=>{
    if(unitFilter && !(t.unit||'').trim().toLowerCase().includes(unitFilter)) return false;
    if(insFilter){ const ins = insurerById(t.insurerId); if(!ins || !ins.name.trim().toLowerCase().includes(insFilter)) return false; }
    return true;
  });
  if(note){
    const parts = [];
    if(unitFilter) parts.push(`đơn vị <b>${escAttr(insTxUnitFilter)}</b>`);
    if(insFilter) parts.push(`NCC <b>${escAttr(insTxInsurerFilter)}</b>`);
    note.innerHTML = parts.length
      ? `Đang lọc theo ${parts.join(' · ')} (${sorted.length}/${all.length} hợp đồng) · <a href="#" id="itxClearFilter" style="color:var(--gold)">Xem tất cả</a>`
      : `Đang xem tất cả (${all.length} hợp đồng)`;
    const clearBtn = document.getElementById('itxClearFilter');
    if(clearBtn) clearBtn.addEventListener('click', e=>{
      e.preventDefault();
      insTxUnitFilter=''; insTxInsurerFilter='';
      const unitField = document.getElementById('itf_unit'); if(unitField && !unitField.disabled) unitField.value='';
      const insField = document.getElementById('itf_ins'); if(insField) insField.value='';
      renderInsTxTable(editable);
    });
  }
  if(all.length===0){
    tbl.outerHTML = `<div class="empty"><div class="big">Chưa có hợp đồng bảo hiểm nào</div>${editable?'Ghi nhận hợp đồng đầu tiên ở form phía trên.':''}</div>`; return;
  }
  if(sorted.length===0){
    tbl.innerHTML = `<thead><tr><th>Hợp đồng</th><th>Khách hàng</th><th class="num">Phí bảo hiểm</th><th>Trạng thái</th><th class="num">Hoa hồng</th><th>Người nhập</th><th></th></tr></thead>`;
    tbl.insertAdjacentHTML('afterend', `<div class="empty"><div class="big">Không có hợp đồng nào khớp bộ lọc hiện tại</div></div>`);
    return;
  }
  const statusClass = s => s==='Đã cấp đơn'?'st-disbursed':(s==='Đã duyệt'?'st-approved':(s==='Huỷ'?'st-rejected':'st-pending'));
  tbl.innerHTML = `
    <thead><tr><th>Hợp đồng</th><th>Khách hàng</th><th class="num">Phí bảo hiểm</th><th>Trạng thái</th><th class="num">Hoa hồng</th><th>Người nhập</th><th></th></tr></thead>
    <tbody>${sorted.map(t=>{
      const ins = insurerById(t.insurerId);
      const creator = state.accounts.find(a=>a.id===t.createdBy);
      const comm = insTxCommission(t);
      const commCell = t.status!=='Đã cấp đơn'
        ? '<span class="comm-cell zero">—</span>'
        : `<span class="comm-cell has-value">${fmt(comm)}</span>`;
      const dis = editable?'':'disabled';
      return `<tr>
        <td>
          <div class="stack-cell">
            ${editable
              ? `<input class="cell-edit mini-field" data-field="date" data-id="${t.id}" type="date" value="${t.date}">`
              : `<div class="mini-field">${new Date(t.date+'T00:00:00').toLocaleDateString('vi-VN')}</div>`}
            <div class="meta-line">${t.unit} → ${ins?ins.name:'<em>(đã xoá)</em>'} · <span class="tag">${t.product||'BHVC'}</span></div>
            ${editable
              ? `<input class="cell-edit mini-field muted" data-field="policyNo" data-id="${t.id}" value="${escAttr(t.policyNo||'')}" placeholder="Số đơn bảo hiểm">`
              : (t.policyNo?`<div class="meta-line">Số đơn: ${escAttr(t.policyNo)}</div>`:'')}
          </div>
        </td>
        <td>
          <div class="stack-cell">
            <input class="cell-edit mini-field" data-field="customer" data-id="${t.id}" value="${escAttr(t.customer||'')}" ${dis} placeholder="Tên khách hàng" style="font-weight:600">
            <input class="cell-edit mini-field muted" data-field="phone" data-id="${t.id}" type="tel" value="${escAttr(t.phone||'')}" ${dis} placeholder="SĐT">
            <input class="cell-edit mini-field muted italic" data-field="vehicle" data-id="${t.id}" value="${escAttr(t.vehicle||'')}" ${dis} placeholder="Biển số / xe">
          </div>
        </td>
        <td class="num"><input class="cell-edit num money mini-field" data-field="premiumAmount" data-id="${t.id}" type="text" inputmode="numeric" value="${formatMoneyValue(t.premiumAmount)}" ${dis} style="text-align:right;font-weight:600;min-width:120px"></td>
        <td>${editable
          ? `<select class="cell-edit status-select ${statusClass(t.status)}" data-status-id="${t.id}">${INS_TX_STATUSES.map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select>`
          : `<span class="stamp ${t.status==='Đã cấp đơn'?'ok':(t.status==='Huỷ'?'warn':'pending')}">${t.status}</span>`}</td>
        <td class="num">${commCell}</td>
        <td class="meta-line">${creator?creator.name:'<em>—</em>'}</td>
        <td>${editable?`<button class="row-del" data-del="${t.id}">✕</button>`:''}</td>
      </tr>`;
    }).join('')}</tbody>`;
  if(editable){
    wireCellEdits(tbl, state.insTransactions, 'Doanh số (Bảo hiểm)', t=>{ const ins=insurerById(t.insurerId); return `${t.unit} → ${ins?ins.name:''}`; });
    tbl.querySelectorAll('[data-field="date"]').forEach(el=>{
      el.addEventListener('change', ()=>{ renderInsTxTable(editable); });
    });
    tbl.querySelectorAll('[data-status-id]').forEach(sel=>{
      sel.addEventListener('change', e=>{
        const t = state.insTransactions.find(x=>x.id===sel.dataset.statusId);
        if(!t) return;
        const before = t.status;
        t.status = e.target.value;
        const ins = insurerById(t.insurerId);
        logActivity('update','Doanh số (Bảo hiểm)', `${t.unit} → ${ins?ins.name:''}: đổi trạng thái "${before}" → "${t.status}"`);
        saveState();
        renderInsTxTable(editable);
      });
    });
  }
  tbl.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const t = state.insTransactions.find(x=>x.id===btn.dataset.del);
      const ins = t ? insurerById(t.insurerId) : null;
      state.insTransactions = state.insTransactions.filter(x=>x.id!==btn.dataset.del);
      logActivity('delete','Doanh số (Bảo hiểm)', `Xoá hợp đồng (${ins?ins.name:''}, ${t?fmt(t.premiumAmount):''}đ)`);
      renderAll();
    });
  });
}

let insAllocMonth = currentMonthISO();
function insAlertBadgeHTML(){
  const n = insAllocAlertCount();
  return n>0 ? `<span class="alert-dot" title="${n} hãng đang lệch tỷ lệ bán quá ngưỡng cảnh báo">${n}</span>` : '';

function renderInsAllocation(c){
  setTitle('Phân bổ đơn vị', 'Đóng góp phí bảo hiểm thu của từng đơn vị cho từng NCC — cộng dồn toàn thời gian, chỉ tính hợp đồng "Đã cấp đơn"');
  const editable = canEdit('bh_allocation');
  const isAdmin = currentRole()==='Admin';
  const thresholdPct = round2(insAlertThreshold()*100);
  const formulaTip = 'DT bán ra (BR): tự tính từ Doanh số, hợp đồng "Đã cấp đơn" trong tháng. DT dịch vụ/sửa chữa (DV): nhập tay theo tháng. Đề xuất tỷ lệ bán tháng sau = DT dịch vụ của hãng ÷ Tổng DT dịch vụ toàn hệ thống trong tháng (các hãng cộng lại đúng 100%).';
  c.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div><h2>Doanh thu bảo hiểm theo hãng &amp; đề xuất tỷ lệ bán tháng sau <span class="info-tip" title="${escAttr(formulaTip)}">i</span></h2>
        <div class="desc">Hãng đưa khách quay lại xưởng dịch vụ nhiều hơn thì được đề xuất tỷ lệ bán cao hơn tháng sau. Di chuột vào <span class="info-tip" style="width:13px;height:13px" title="${escAttr(formulaTip)}">i</span> để xem công thức đầy đủ.</div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <div class="field" style="min-width:150px"><label>Tháng xem</label><input id="insAllocMonthInput" type="month" value="${insAllocMonth}"></div>
          <div class="field" style="min-width:110px">
            <label>Ngưỡng cảnh báo (%) ${!isAdmin?'🔒':''}</label>
            <input id="insAlertThresholdInput" type="number" min="0" max="100" step="0.5" value="${thresholdPct}" ${isAdmin?'':'disabled'} style="width:100%">
          </div>
          ${editable ? `<div class="field"><label>&nbsp;</label><button class="btn btn-ghost" id="insApplyPrevBtn" type="button" title="Lấy 'Đề xuất tỷ lệ bán tháng sau' của tháng liền trước, điền vào cột 'Tỷ lệ phân bổ tháng' của tháng đang xem cho mọi hãng">↳ Áp dụng đề xuất tháng trước</button></div>` : ''}
        </div>
      </div>
      <div class="panel-body" id="insAllocKpiWrap" style="padding-bottom:12px"></div>
      <div class="panel-body flush"><div class="tbl-wrap"><table class="data" id="insRevenueTable"></table></div></div>
      ${!editable ? lockedNote('Bạn đang xem ở chế độ chỉ đọc — chỉ Admin/Quản lý mới nhập được DT dịch vụ/sửa chữa theo hãng.') : ''}
      ${editable && !isAdmin ? `<div class="helper" style="padding:0 20px 16px">🔒 Chỉ Admin mới đổi được ngưỡng cảnh báo chênh lệch.</div>` : ''}
    </div>
    <div class="panel"><div class="panel-head"><div><h2>Ma trận NCC bảo hiểm × Đơn vị (phí bảo hiểm thu)</h2>
      <div class="desc">${state.units.length} đơn vị hiện có · chỉ tính hợp đồng trạng thái "Đã cấp đơn" · cộng dồn toàn thời gian</div></div></div>
      <div class="panel-body flush"><div class="matrix-scroll"><table class="data matrix-fixed" id="insAllocTable"></table></div></div></div>
  `;
  const monthInput = document.getElementById('insAllocMonthInput');
  monthInput.addEventListener('change', ()=>{
    insAllocMonth = monthInput.value || currentMonthISO();
    renderInsRevenueTable(editable);
  });
  const applyPrevBtn = document.getElementById('insApplyPrevBtn');
  if(applyPrevBtn){
    applyPrevBtn.addEventListener('click', ()=>{
      const {prev, applied} = applyPrevMonthSuggestionToAllocation(insAllocMonth);
      if(applied===0){ toast(`Chưa có dữ liệu đề xuất ở tháng ${prev} để áp dụng.`); return; }
      logActivity('update','Tỷ lệ phân bổ (Bảo hiểm)', `Áp dụng đề xuất tháng ${prev} → tỷ lệ phân bổ tháng ${insAllocMonth} cho ${applied} hãng`);
      saveState();
      renderInsRevenueTable(editable);
      renderNav();
      toast(`Đã áp dụng đề xuất tháng ${prev} cho ${applied} hãng.`);
    });
  }
  if(isAdmin){
    const thInput = document.getElementById('insAlertThresholdInput');
    thInput.addEventListener('change', ()=>{
      const pct = Math.max(0, Number(thInput.value)||0);
      state.insAllocAlertThreshold = pct/100;
      thInput.value = round2(pct);
      logActivity('update','Cài đặt (Bảo hiểm)', `Đổi ngưỡng cảnh báo chênh lệch tỷ lệ bán → ${round2(pct)}%`);
      saveState();
      renderInsRevenueTable(editable);
      renderNav(); // cập nhật lại chấm cảnh báo trên menu nếu ngưỡng đổi làm thay đổi số hãng vượt ngưỡng
    });
  }
  renderInsRevenueTable(editable);

  const tbl = document.getElementById('insAllocTable');
  if(state.insurers.length===0){ tbl.outerHTML = `<div class="empty"><div class="big">Chưa có NCC bảo hiểm</div></div>`; return; }
  const rows = state.insurers.map(ins=>{
    const perUnit = state.units.map(u=>allTimeInsPremium(ins.id,u));
    const total = perUnit.reduce((a,x)=>a+x,0);
    const commTotal = allTimeInsCommission(ins.id);
    const max = Math.max(0,...perUnit);
    const topIdx = perUnit.indexOf(max);
    return {ins, perUnit, total, commTotal, topUnit: total>0?state.units[topIdx]:'—'};
  });
  tbl.innerHTML = `
    ${matrixColgroupHTML(state.units.length, [11, 11, 13])}
    <thead>
    <tr>
      <th>NCC bảo hiểm</th>${state.units.map(u=>matrixUnitHeaderCell(u)).join('')}
      <th class="num">Tổng phí thu</th><th class="num">Hoa hồng luỹ kế</th><th>Đơn vị chính</th>
    </tr>
    </thead>
    <tbody>${rows.map(r=>`
      <tr>
        ${matrixRowLabelCell(r.ins.name)}
        ${r.perUnit.map(v=>`<td class="num">${v>0?fmt(v):'—'}</td>`).join('')}
        <td class="num" style="font-weight:700">${fmt(r.total)}</td>
        <td class="num">${fmt(r.commTotal)}</td>
        <td>${r.topUnit}</td>
      </tr>`).join('')}</tbody>`;
  wireStickyHeaderRows(tbl);
}

      ${thCompact('Đề xuất', 'T sau', 'Đề xuất tỷ lệ bán tháng sau = DT dịch vụ hãng ÷ Tổng DT dịch vụ toàn hệ thống tháng này (các hãng cộng lại đúng 100%)', true)}

      <td class="num">${fmt(sys.br)}</td>
      <td class="num">${fmt(sys.dv)}</td>
      <td class="num">${sys.br>0?fmtPct(sys.dv/sys.br):'—'}</td>

        const raw = el.value.trim().replace(',', '.');
        const pct = raw==='' ? null : Math.max(0, Number(raw)||0);
        upsertInsAllocationRate(insurerId, month, pct);
        logActivity('update','Tỷ lệ phân bổ (Bảo hiểm)', `${ins?ins.name:''} — tháng ${month}: ${pct==null?'xoá':round2(pct)+'%'}`);
        saveState();
        renderInsRevenueTable(editable);

    });

      attachMoneyFormatting(el);
      el.addEventListener('change', ()=>{
        const insurerId = el.dataset.ins;
        const ins = insurerById(insurerId);

        upsertInsMonthlyRevenue(insurerId, month, amount);
        logActivity('update','DT dịch vụ (Bảo hiểm)', `${ins?ins.name:''} — tháng ${month}: ${fmt(amount)}đ`);

        renderInsRevenueTable(editable);
        renderNav(); // dữ liệu DV thay đổi có thể làm đổi số hãng vượt ngưỡng -> cập nhật chấm cảnh báo trên menu
      });
    });
  }
}

function renderInsReconcile(c){
  setTitle('Đối soát CK', state.insReconciliations.length+' kỳ đối soát — theo dõi Hoa hồng phải hưởng / đã nhận theo từng NCC bảo hiểm');

    ${editable ? `
    <div class="panel">
      <div class="panel-head"><div><h2>Thêm kỳ đối soát</h2></div></div>
      <div class="panel-body">
        <div class="form-grid">

          <div class="field"><label>Tên kỳ</label><input id="irf_period" placeholder="VD: T5/2026"></div>

          <div class="field"><label>Đến ngày</label><input id="irf_to" type="date"></div>

        </div>
      </div>

    <div class="panel">
      <div class="panel-head"><div><h2>Tất cả kỳ đối soát</h2></div></div>

    </div>
  `;
  if(editable){

      const insurerId = document.getElementById('irf_ins').value;
      if(!insurerId){ toast('Cần có NCC bảo hiểm trước'); return; }
      const from = document.getElementById('irf_from').value, to = document.getElementById('irf_to').value;
      if(!from || !to){ toast('Nhập đủ Từ ngày / Đến ngày'); return; }

      const r = {id: uid('ir'), insurerId, period, fromDate:from, toDate:to, confirmed:0, payments:[]};
      state.insReconciliations.push(r);

function renderInsReconTable(editable){
  const tbl = document.getElementById('insReconTable');
  if(state.insReconciliations.length===0){
    tbl.outerHTML = `<div class="empty"><div class="big">Chưa có kỳ đối soát nào</div>${editable?'Thêm kỳ đối soát ở form phía trên.':''}</div>`; return;
  }
  const dis = editable?'':'disabled';
  tbl.innerHTML = `
    <thead><tr>
      <th>Kỳ</th><th class="wrap">NCC bảo hiểm</th><th>Từ ngày</th><th>Đến ngày</th>
      <th class="num">Phí bảo hiểm thu</th><th class="num">Hoa hồng phải hưởng</th>
      <th class="num money-col">NCC xác nhận</th><th class="num money-col">Đã nhận</th>
      <th class="num">Chênh lệch</th><th class="num">Còn phải thu</th><th>Trạng thái</th><th></th>
    </tr></thead>
    <tbody>${state.insReconciliations.map(r=>{
      const ins = insurerById(r.insurerId);
      const rc = insReconCalc(r);
      const payments = ensureReconciliationPayments(r);
      const status = reconStatus(rc.totalDue, rc.received);
      const expanded = insReconExpanded.has(r.id);
      const mainRow = `<tr>
        <td>${r.period}</td>
        <td class="wrap">${ins?ins.name:'<em>(đã xoá)</em>'}</td>
        <td>${r.fromDate}</td><td>${r.toDate}</td>
        <td class="num">${fmt(rc.premium)}</td>
        <td class="num" style="font-weight:700">${fmt(rc.totalDue)}</td>
        <td class="num money-col"><input class="cell-edit money" data-field="confirmed" data-id="${r.id}" type="text" inputmode="numeric" value="${formatMoneyValue(r.confirmed)}" ${dis}></td>
        <td class="num money-col">
          <button class="row-toggle-pay" data-toggle-pay="${r.id}" style="border:none;background:none;cursor:pointer;font-family:inherit;font-size:inherit;color:var(--ink);text-decoration:underline dotted;text-underline-offset:3px" title="${payments.length} lần thanh toán — bấm để xem/ghi nhận thêm">
            ${fmt(rc.received)} <span style="color:var(--slate);font-weight:400">(${payments.length})</span> ${expanded?'▾':'▸'}
          </button>
        </td>
        <td class="num" style="color:${rc.diff<0?'var(--rust)':'var(--forest)'}">${fmt(rc.diff)}</td>
        <td class="num" style="font-weight:700">${fmt(rc.stillOwed)}</td>
        <td><span class="stamp ${status.cls}">${status.label}</span></td>
        <td>${editable?`<button class="row-del" data-del="${r.id}">✕</button>`:''}</td>
      </tr>`;
      if(!expanded) return mainRow;
      const payRows = payments.slice().sort((a,b)=> b.date.localeCompare(a.date)).map(p=>`
        <tr style="background:#fff">
          <td style="padding-left:4px;color:var(--slate)">${new Date(p.date+'T00:00:00').toLocaleDateString('vi-VN')}</td>
          <td class="num" style="font-weight:600">${fmt(p.amount)}</td>
          <td><span class="tag">${p.method||'—'}</span></td>
          <td class="wrap" style="color:var(--slate)">${p.note||''}</td>
          <td>${editable?`<button class="row-del" data-del-pay="${r.id}|${p.id}" title="Xoá lần thanh toán này">✕</button>`:''}</td>
        </tr>`).join('');
      const detailRow = `<tr style="background:#FBFAF3">
        <td></td>
        <td colspan="11" style="padding:12px 16px 16px">
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);font-weight:600;margin-bottom:8px">Sổ nhận tiền — ${ins?ins.name:''} · ${r.period}</div>
          ${editable ? `
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:10px">
            <div class="field" style="width:150px"><label>Ngày nhận</label><input type="date" id="irpay_date_${r.id}" value="${todayISO()}"></div>
            <div class="field" style="width:160px"><label>Số tiền (VNĐ)</label><input type="text" inputmode="numeric" class="field-money" id="irpay_amount_${r.id}" placeholder="0"></div>
            <div class="field" style="width:150px"><label>Hình thức</label><select id="irpay_method_${r.id}">${RECON_PAY_METHODS.map(m=>`<option>${m}</option>`).join('')}</select></div>
            <div class="field" style="flex:1;min-width:160px"><label>Ghi chú</label><input id="irpay_note_${r.id}" placeholder="VD: UNC 0234, đợt 1..."></div>
            <button class="btn btn-primary" data-add-pay="${r.id}">+ Ghi nhận thanh toán</button>
          </div>` : ''}
          ${payments.length===0 ? `<div style="color:var(--slate);font-size:12.5px">Chưa có lần thanh toán nào được ghi nhận.</div>` : `
          <table class="data" style="width:100%">
            <thead><tr><th style="padding-left:4px">Ngày</th><th class="num">Số tiền</th><th>Hình thức</th><th class="wrap">Ghi chú</th><th></th></tr></thead>
            <tbody>${payRows}</tbody>
          </table>`}
        </td>
      </tr>`;
      return mainRow + detailRow;
    }).join('')}</tbody>`;
  if(editable){
    wireCellEdits(tbl, state.insReconciliations, 'Đối soát CK (Bảo hiểm)', r=>{ const ins=insurerById(r.insurerId); return `${r.period} (${ins?ins.name:''})`; });
    tbl.querySelectorAll('[data-add-pay]').forEach(el=>{
      const fld = document.getElementById('irpay_amount_'+el.dataset.addPay);
      if(fld) attachMoneyFormatting(fld);
    });
  }
  tbl.querySelectorAll('[data-toggle-pay]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.togglePay;
      if(insReconExpanded.has(id)) insReconExpanded.delete(id); else insReconExpanded.add(id);
      renderInsReconTable(editable);
    });
  });
  if(editable){
    tbl.querySelectorAll('[data-add-pay]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.addPay;
        const r = state.insReconciliations.find(x=>x.id===id);
        if(!r) return;
        const amount = parseMoneyInput(document.getElementById('irpay_amount_'+id).value);
        if(amount<=0){ toast('Nhập số tiền đã nhận'); return; }
        const date = document.getElementById('irpay_date_'+id).value || todayISO();
        const method = document.getElementById('irpay_method_'+id).value;
        const note = document.getElementById('irpay_note_'+id).value.trim();
        ensureReconciliationPayments(r).push({id:uid('pay'), date, amount, method, note, createdBy:currentUserId});
        const ins = insurerById(r.insurerId);
        logActivity('create','Đối soát CK (Bảo hiểm)', `Ghi nhận thanh toán ${fmt(amount)}đ (${method}) cho kỳ "${r.period}" — ${ins?ins.name:''}`);
        toast('Đã ghi nhận thanh toán');
        saveState();
        renderInsReconTable(editable);
      });
    });
    tbl.querySelectorAll('[data-del-pay]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const [rid, pid] = btn.dataset.delPay.split('|');
        const r = state.insReconciliations.find(x=>x.id===rid);
        if(!r) return;
        if(!confirm('Xoá lần thanh toán này khỏi Sổ nhận tiền?')) return;
        r.payments = ensureReconciliationPayments(r).filter(p=>p.id!==pid);
        logActivity('delete','Đối soát CK (Bảo hiểm)', `Xoá 1 lần thanh toán ở kỳ "${r.period}"`);
        saveState();
        renderInsReconTable(editable);
      });
    });
    tbl.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const r = state.insReconciliations.find(x=>x.id===btn.dataset.del);
        const ins = r ? insurerById(r.insurerId) : null;
        state.insReconciliations = state.insReconciliations.filter(x=>x.id!==btn.dataset.del);
        logActivity('delete','Đối soát CK (Bảo hiểm)', `Xoá kỳ "${r?r.period:''}" (${ins?ins.name:''})`);
        renderAll();
      });
    });
  }
}

/* ---------------------------- Cài đặt ---------------------------- */
function unitUsage(u){
  const accountsUsing = state.accounts.filter(a=>a.unit===u).length;
  const txUsing = state.transactions.filter(t=>t.unit===u).length;
  return {accountsUsing, txUsing, total: accountsUsing+txUsing};
}
function deleteUnit(u){
  state.units = state.units.filter(x=>x!==u);
  // gỡ gán khỏi các tài khoản đang phụ trách đơn vị này (không xoá tài khoản, chỉ gỡ liên kết)
  state.accounts.forEach(a=>{ if(a.unit===u) a.unit=''; });
  logActivity('delete','Cài đặt', `Xoá đơn vị "${u}" khỏi danh sách (gỡ liên kết khỏi các tài khoản đang phụ trách)`);
}
