  }
}

/* ---------------------------- Quản trị tài khoản (Admin) ---------------------------- */
/* ---------------------------- Thùng rác ---------------------------- */
function renderTrash(c){
  // Tự dọn các mục đã quá 30 ngày — im lặng, không cần thông báo, chỉ để tránh phình dữ liệu vô hạn.
  const cutoff = Date.now() - 30*24*60*60*1000;
  let anyCleaned = false;
  TRASH_KEYS.forEach(key=>{
    if(!Array.isArray(state[key])) return;
    const before = state[key].length;
    state[key] = state[key].filter(t=> new Date(t.deletedAt).getTime() >= cutoff);
    if(state[key].length!==before) anyCleaned = true;
  });
  if(anyCleaned) saveState();

  const list = combinedTrash();
  setTitle('Thùng rác', list.length+' mục đã xoá gần đây — khôi phục nếu xoá nhầm, tự dọn sau 30 ngày');
  c.innerHTML = `
    <div class="panel">
      <div class="panel-head"><div><h2>Các mục đã xoá</h2>
      <div class="desc">Áp dụng cho Doanh số, Đối soát CK, Chính sách/Biểu phí, Danh mục NCC/NH/Bảo hiểm và Tài khoản ở cả 3 module.</div></div></div>
      <div class="panel-body flush"><div class="tbl-wrap"><table class="data" id="trashTable"></table></div></div>
    </div>
  `;
  const tbl = document.getElementById('trashTable');
  if(list.length===0){
    tbl.outerHTML = `<div class="empty"><div class="big">Thùng rác trống</div></div>`; return;
  }
  tbl.innerHTML = `
    <thead><tr><th>Loại</th><th class="wrap">Nội dung</th><th>Xoá lúc</th><th>Người xoá</th><th></th></tr></thead>
    <tbody>${list.map(t=>{
      const deleter = state.accounts.find(a=>a.id===t.deletedBy);
      return `<tr>
        <td><span class="tag">${escHtml(t.entityLabel)}</span></td>
        <td class="wrap">${escHtml(trashItemSummary(t))}</td>
        <td>${new Date(t.deletedAt).toLocaleString('vi-VN')}</td>
        <td>${deleter?escHtml(deleter.name):'<em>—</em>'}</td>
        <td style="display:flex;gap:6px;white-space:nowrap">
          <button class="btn btn-ghost" data-restore="${t.trashId}" style="padding:3px 10px;font-size:12px">↩ Khôi phục</button>
          <button class="row-del" data-purge="${t.trashId}" title="Xoá vĩnh viễn — không thể khôi phục">✕</button>
        </td>
      </tr>`;
    }).join('')}</tbody>`;
  tbl.querySelectorAll('[data-restore]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const restored = restoreFromTrash(btn.dataset.restore);
      if(restored){
        logActivity('create', restored.entityLabel, `Khôi phục từ thùng rác: ${trashItemSummary(restored)}`);
        toast('Đã khôi phục');
        renderAll();
      }
    });
  });
  tbl.querySelectorAll('[data-purge]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const entry = list.find(t=>t.trashId===btn.dataset.purge);
      if(!confirm(`Xoá VĨNH VIỄN "${entry?trashItemSummary(entry):''}"? Không thể khôi phục sau bước này.`)) return;
      purgeTrashEntry(btn.dataset.purge);
      logActivity('delete', entry?entry.entityLabel:'Thùng rác', `Xoá vĩnh viễn: ${entry?trashItemSummary(entry):''}`);
      toast('Đã xoá vĩnh viễn');
      renderAll();
    });
  });
}

      toast(`Tài khoản "${username}" đã tồn tại — đổi tên tài khoản khác`); return;

      state.accounts.push(acc);

      renderAll();
      return;
    }

    const acc = {id:uid('u'), name, username, role, unit, modules, createdAt: todayISO()};
    await setAccountPassword(acc, password);
    state.accounts.push(acc);

    <tbody>${state.accounts.map(a=>`
      <tr>
        <td><input class="cell-edit" data-field="name" data-id="${a.id}" value="${escAttr(a.name)}"></td>
        <td><input class="cell-edit" data-field="username" data-id="${a.id}" value="${escAttr(a.username||'')}" placeholder="— Chưa đặt (dùng Tên) —" style="min-width:130px"></td>
        <td><select class="cell-edit" data-field="role" data-id="${a.id}">${ROLES.filter(r=>r!=='Đối tác'||a.role==='Đối tác').map(r=>`<option ${a.role===r?'selected':''}>${r}</option>`).join('')}</select></td>
        <td>
          <input class="cell-edit" data-field="unit" data-id="${a.id}" list="rowunit_${a.id}" value="${escAttr(a.unit||'')}" placeholder="— Không gán —">
          ${unitDatalistHTML('rowunit_'+a.id)}
        </td>
        <td>
          ${a.role==='Đối tác' ? `
          <div style="display:flex;flex-direction:column;gap:4px;font-size:11.5px;white-space:nowrap">
            <div><span class="tag gold">${MODULES.find(m=>m.id===a.partnerType)?.label || a.partnerType || '—'}</span></div>
            <select class="cell-edit partner-entity-select" data-acc="${a.id}" style="max-width:220px">
              ${partnerEntityOptions(a.partnerType).map(o=>`<option value="${o.id}" ${o.id===a.partnerId?'selected':''}>${escAttr(o.name)}</option>`).join('') || `<option value="">— Không có —</option>`}
            </select>
          </div>` : `
          <div style="display:flex;flex-direction:column;gap:3px;font-size:11.5px;white-space:nowrap">
            ${MODULES.map(m=>`<label style="display:flex;align-items:center;gap:5px;cursor:${a.role==='Admin'?'default':'pointer'};${a.role==='Admin'?'color:var(--slate)':''}">
              <input type="checkbox" class="module-toggle" data-acc="${a.id}" data-module="${m.id}" ${(a.role==='Admin'||accountModules(a).includes(m.id))?'checked':''} ${a.role==='Admin'?'disabled':''}> ${m.label}
            </label>`).join('')}
            ${a.role==='Admin' ? `<div style="color:var(--slate)">(Admin luôn đủ quyền)</div>` : ''}
          </div>`}
        </td>
        <td>
          <div style="display:flex; align-items:center; gap:4px">
            <input class="cell-edit" type="password" autocomplete="new-password" data-field="password" data-id="${a.id}" value="" placeholder="${accountHasPassword(a)?'•••••• (đã đặt) — gõ để đổi':'— Không đặt — gõ để đặt mật khẩu'}" style="min-width:170px">
            <button type="button" class="row-del" data-toggle-pw="${a.id}" title="Hiện/ẩn chữ đang gõ" style="flex:0 0 auto; color:var(--slate)">👁</button>
            ${accountHasPassword(a) ? `<button type="button" class="row-del" data-clear-pw="${a.id}" title="Xoá mật khẩu — tài khoản sẽ đăng nhập không cần mật khẩu">🗑</button>` : ''}

  tbl.querySelectorAll('.module-toggle').forEach(cb=>{

      let mods = accountModules(acc).slice();
      if(cb.checked){ if(!mods.includes(cb.dataset.module)) mods.push(cb.dataset.module); }
      else { mods = mods.filter(x=>x!==cb.dataset.module); }
      acc.modules = mods;
      const modInfo = MODULES.find(m=>m.id===cb.dataset.module);

      renderAll();
    });
  });

    sel.addEventListener('change', ()=>{
      const acc = state.accounts.find(a=>a.id===sel.dataset.acc);
      if(!acc) return;
      const before = partnerEntityLabel(acc);
      acc.partnerId = sel.value;
      logActivity('update','Tài khoản', `Sửa tài khoản Đối tác "${acc.name}": gán lại từ "${before}" → "${partnerEntityLabel(acc)}"`);
      renderAll();
    });
  });
  tbl.querySelectorAll('[data-field]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const acc = state.accounts.find(a=>a.id===el.dataset.id);
      if(!acc) return;
      const before = acc[el.dataset.field];
      let val = el.value;
      if(el.dataset.field==='unit') val = ensureUnit(val);
      if(el.dataset.field==='username'){
        val = val.trim();
        if(val && state.accounts.some(o=>o.id!==acc.id && o.username && o.username.toLowerCase()===val.toLowerCase())){
          toast(`Tài khoản "${val}" đã được dùng cho người khác — chọn tên khác`);
          el.value = before||''; return;
        }
      }
      if(el.dataset.field==='password'){
        // Ô này luôn hiển thị rỗng (không có gì để lộ ra F12) — chỉ khi Admin thực sự gõ chữ mới mới đổi.
        await setAccountPassword(acc, val);
        el.value = '';
        logActivity('update','Tài khoản', `Sửa tài khoản "${acc.name}" (${val ? 'đặt/đổi mật khẩu' : 'xoá mật khẩu'})`);
        renderAll();
        return;
      }
      acc[el.dataset.field] = val;
      const logMsg = `Sửa tài khoản "${acc.name}" (${el.dataset.field}: "${before||'(trống)'}" → "${val||'(trống)'}")`;
      logActivity('update','Tài khoản', logMsg);
      renderAll();
    });
  });
  tbl.querySelectorAll('[data-toggle-pw]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const input = tbl.querySelector(`input[data-field="password"][data-id="${btn.dataset.togglePw}"]`);
      if(!input) return;
      input.type = input.type==='password' ? 'text' : 'password';
    });
  });
  tbl.querySelectorAll('[data-clear-pw]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const acc = state.accounts.find(a=>a.id===btn.dataset.clearPw);
      if(!acc) return;
      if(!confirm(`Xoá mật khẩu của tài khoản "${acc.name}"? Sau đó đăng nhập không cần mật khẩu.`)) return;
      await setAccountPassword(acc, '');
      logActivity('update','Tài khoản', `Sửa tài khoản "${acc.name}" (xoá mật khẩu)`);
      toast('Đã xoá mật khẩu');
      renderAll();
    });
  });
  tbl.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const acc = state.accounts.find(a=>a.id===btn.dataset.del);
      if(state.accounts.filter(a=>a.role==='Admin').length<=1 && acc.role==='Admin'){
        toast('Cần giữ lại ít nhất 1 tài khoản Admin'); return;
      }
      if(!confirm(`Xoá tài khoản "${acc.name}"?`)) return;
      softDelete('accounts', acc, 'Tài khoản');
      logActivity('delete','Tài khoản', `Xoá tài khoản "${acc.name}"`);
      renderAll();
    });
  });

  const assignedUnits = new Set(state.accounts.map(a=>a.unit).filter(Boolean));
  const unassigned = state.units.filter(u=>!assignedUnits.has(u));
  const box = document.getElementById('unassignedUnitsBox');
  box.innerHTML = state.units.length===0
    ? `<div class="helper">Chưa có đơn vị nào trong hệ thống. Gõ tên đơn vị ở ô "Đơn vị phụ trách" phía trên để tự tạo, hoặc thêm ở tab Cài đặt.</div>`
    : unassigned.length===0
    ? `<div class="helper">Mọi đơn vị đều đã có ít nhất 1 tài khoản phụ trách. Quản lý/xoá đơn vị ở tab Cài đặt, hoặc bấm ✕ ngay dưới đây.</div>
       <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${state.units.map(u=>`
         <span class="tag" style="display:inline-flex;align-items:center;gap:6px">${escHtml(u)}<button class="row-del" data-del-unit-acct="${escAttr(u)}" title="Xoá đơn vị ${escAttr(u)}" style="padding:0 4px">✕</button></span>`).join('')}</div>`
    : `<div style="display:flex;flex-wrap:wrap;gap:6px">${unassigned.map(u=>`
         <span class="tag" style="display:inline-flex;align-items:center;gap:6px">${escHtml(u)}<button class="row-del" data-del-unit-acct="${escAttr(u)}" title="Xoá đơn vị ${escAttr(u)}" style="padding:0 4px">✕</button></span>`).join('')}</div>
       <div class="helper">${unassigned.length} đơn vị chưa có tài khoản nào phụ trách — sửa cột "Đơn vị phụ trách" ở bảng trên để gán, hoặc bấm ✕ để xoá hẳn đơn vị không dùng nữa.</div>`;
  document.querySelectorAll('[data-del-unit-acct]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const u = btn.dataset.delUnitAcct;
      const usage = unitUsage(u);
      const msg = usage.total>0
        ? `Đơn vị "${u}" đang được ${usage.accountsUsing} tài khoản phụ trách và có ${usage.txUsing} chứng từ ghi nhận. Xoá khỏi danh sách sẽ gỡ liên kết khỏi các tài khoản đó (chứng từ cũ vẫn giữ nguyên). Vẫn xoá?`
        : `Xoá đơn vị "${u}" khỏi danh sách?`;
      if(!confirm(msg)) return;
      deleteUnit(u);
      toast('Đã xoá đơn vị "'+u+'"');
      renderAll();
    });
  });
}

/* ---------------------------- Nhật ký hoạt động ---------------------------- */
function renderActivityLog(c){
  const log = combinedActivityLog();
  setTitle('Nhật ký hoạt động', log.length+' thao tác gần nhất trên toàn hệ thống');
  const users = ['Tất cả', ...new Set(log.map(l=>l.userName))];
  c.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div><h2>Lịch sử thao tác</h2><div class="desc">Ghi lại mọi thêm/sửa/xoá trên toàn hệ thống, mới nhất trước</div></div>
        <div class="field" style="width:200px"><select id="logUserFilter">${users.map(u=>`<option>${escHtml(u)}</option>`).join('')}</select></div>
      </div>
      <div class="panel-body flush"><div class="tbl-wrap"><table class="data" id="logTable"></table></div></div>
    </div>
  `;
  function draw(filterUser){
    const rows = log.filter(l=> !filterUser || filterUser==='Tất cả' || l.userName===filterUser).slice(0,300);
    const tbl = document.getElementById('logTable');
    if(rows.length===0){ tbl.outerHTML = `<div class="empty"><div class="big">Chưa có hoạt động nào</div></div>`; return; }
    tbl.innerHTML = `
      <thead><tr><th>Thời gian</th><th>Người thực hiện</th><th>Khu vực</th><th>Hành động</th><th class="wrap">Chi tiết</th></tr></thead>
      <tbody>${rows.map(l=>{
        const t = new Date(l.ts);
        const actionLabel = l.action==='create'?'Thêm':l.action==='update'?'Sửa':'Xoá';
        return `<tr class="log-row">
          <td>${t.toLocaleString('vi-VN')}</td>
          <td class="who">${l.userName} <span class="role-badge ${roleBadgeClass(l.role)}">${l.role}</span></td>
          <td>${l.entity}</td>
          <td><span class="action-badge ${l.action}">${actionLabel}</span></td>
          <td class="wrap">${escHtml(l.detail||'')}</td>
        </tr>`;
      }).join('')}</tbody>`;
  }
  draw('Tất cả');
  document.getElementById('logUserFilter').addEventListener('change', e=> draw(e.target.value));
}

/* ---------------------------- Init ---------------------------- */
// Chuyển toàn bộ mật khẩu đang lưu dạng chữ thô (account.password, kể cả ADMIN_PASSWORD mặc định của Admin
// gốc) sang dạng đã băm SHA-256 + salt riêng — chạy đúng 1 lần, tự động, không cần ai đặt lại mật khẩu.
async function migratePasswordsV1(){
  if(state.__pwHashMigrationV1) return false;
  state.__pwHashMigrationV1 = true;
  let changed = false;
  for(const acc of state.accounts){
    if(acc.passwordHash){ delete acc.password; continue; } // đã băm rồi, chỉ dọn field thô nếu còn sót
    const plain = acc.password || (acc.role==='Admin' ? ADMIN_PASSWORD : '');
    if(plain){ await setAccountPassword(acc, plain); changed = true; }
    else { delete acc.password; }
  }
  if(changed) logActivity('update','Tài khoản', 'Tự động chuyển mật khẩu sang dạng đã băm (SHA-256) — không còn lưu dạng chữ thô');
  return changed;
}
// Chuyển Nhật ký hoạt động & Thùng rác từ 1 mảng gộp chung (state.activityLog/state.trash, nằm trong nhánh
// /shared — tải về cho MỌI tài khoản bất kể module) sang tách riêng theo từng module (activityLogNcc/Nh/Bh/
// Shared, trashNcc/Nh/Bh/Shared — mỗi nhánh chỉ chứa đúng phần của module đó) — vá lỗ hổng: trước đây 1 tài
// khoản chỉ được cấp 1 module (hoặc tài khoản Đối tác) vẫn vô tình tải về TOÀN BỘ log/thùng rác của module
// khác qua nhánh /shared, dù giao diện có ẩn đúng (chỉ Admin xem được 2 tab đó) — dữ liệu vẫn nằm sẵn trong
// bộ nhớ trình duyệt, xem được qua Console. Cần đủ cả 4 nhánh (ncc/nh/bh/shared) nên chỉ Admin chạy đúng
// được — gọi hàm này khi currentRole()==='Admin'. Chạy 1 lần, an toàn khi gọi lại (không còn gì để chuyển).
function migrateActivityLogTrashSplitV1(){
  let changed = false;
  const oldLog = state.activityLog;
  if(Array.isArray(oldLog) && oldLog.length){
    oldLog.forEach(entry=>{
      const key = activityLogKeyFor(moduleOfLogEntity(entry.entity));
      if(!Array.isArray(state[key])) state[key] = [];
      state[key].push(entry);
    });
    changed = true;
  }
  const oldTrash = state.trash;
  if(Array.isArray(oldTrash) && oldTrash.length){
    oldTrash.forEach(entry=>{
      const key = trashKeyFor(moduleOfArrName(entry.arrName));
      if(!Array.isArray(state[key])) state[key] = [];
      state[key].push(entry);
    });
    changed = true;
  }
  if(changed){
    ['activityLogNcc','activityLogNh','activityLogBh','activityLogShared'].forEach(k=>{
      if(Array.isArray(state[k])){ state[k].sort((a,b)=>(b.ts||'').localeCompare(a.ts||'')); if(state[k].length>500) state[k].length=500; }
    });
    TRASH_KEYS.forEach(k=>{
      if(Array.isArray(state[k])){ state[k].sort((a,b)=>(b.deletedAt||'').localeCompare(a.deletedAt||'')); if(state[k].length>300) state[k].length=300; }
    });
    logActivity('update','Cài đặt', 'Tự động tách Nhật ký hoạt động & Thùng rác theo từng module (vá rò rỉ dữ liệu chéo module)');
  }
  delete state.activityLog;
  delete state.trash;
  return changed;
}

(async function init(){
  // Đóng menu tài khoản (Đổi mật khẩu / Đăng xuất) khi bấm ra ngoài — gắn đúng 1 lần, không phụ
  // thuộc vào renderUserChip() để tránh cộng dồn listener sau mỗi lần renderAll().
  document.addEventListener('click', (e)=>{
    const menu = document.getElementById('userMenu');
    if(menu && menu.classList.contains('open') && !e.target.closest('.user-chip-wrap')) menu.classList.remove('open');
    const pmenu = document.getElementById('periodFilterMenu');
    if(pmenu && pmenu.classList.contains('open') && !e.target.closest('.period-filter-wrap')) pmenu.classList.remove('open');
  });
  // Cảnh báo trước khi đóng tab/rời trang nếu vẫn còn thay đổi chưa kịp lưu xong (đang trong 800ms debounce
  // hoặc lượt ghi Firebase đang chạy dở) — tránh mất đúng thao tác cuối cùng nếu đóng tab quá nhanh.
  window.addEventListener('beforeunload', (e)=>{
    if(!pendingSave) return;
    e.preventDefault();
    e.returnValue = '';
  });
  // Ghi lại lỗi runtime (nếu có) vào Nhật ký hoạt động để Admin biết mà kiểm tra, thay vì chỉ nằm im
  // trong Console trình duyệt của đúng người gặp lỗi đó (không ai khác biết để xử lý).
  window.addEventListener('error', (e)=>{
    try{ logActivity('update','Lỗi hệ thống', `${e.message||'Lỗi không rõ'} (${(e.filename||'').split('/').pop()}:${e.lineno||'?'})`); saveState(); }catch(err){}
  });
  window.addEventListener('unhandledrejection', (e)=>{
    try{ logActivity('update','Lỗi hệ thống', 'Promise bị từ chối: '+(e.reason && e.reason.message ? e.reason.message : String(e.reason))); saveState(); }catch(err){}
  });
  document.getElementById('globalSearchBtn').addEventListener('click', ()=>{
    if(!currentUser()){ return; } // chưa đăng nhập thì chưa có gì để tìm
    openGlobalSearch();
  });
  document.getElementById('periodFilterBtn').addEventListener('click', (e)=>{
    e.stopPropagation();
    if(!currentUser()) return;
    const menu = document.getElementById('periodFilterMenu');
    const willOpen = !menu.classList.contains('open');
    if(willOpen) renderPeriodFilterMenu();
    menu.classList.toggle('open', willOpen);
  });
  // Luôn có sẵn 1 bộ khung dữ liệu đầy đủ (mẫu) TRƯỚC khi tải dữ liệu thật — để subscribeBranch() có chỗ
  // gộp từng nhánh vào ngay khi tải xong (đặc biệt cần thiết cho luồng Firebase — xem loadShared()).
  state = seedState();
  const [shared, session] = await Promise.all([loadShared(), loadSession()]);
  // shared === 'firebase' -> nhánh 'shared' đã được gộp thẳng vào `state` bên trong loadShared() rồi.
  // shared === object -> tầng dự phòng (không Firebase), trả nguyên khối kiểu cũ, gộp đè lên state đã seed.
  // shared === null -> chưa từng có dữ liệu nào, giữ nguyên state mẫu.
  if(shared && shared!=='firebase') Object.assign(state, shared);
  if(!state.accounts || state.accounts.length===0) state.accounts = seedState().accounts; // không bao giờ để trống hẳn -> khoá đăng nhập của mọi người
  currentUserId = (session && session.currentUserId && state.accounts.some(a=>a.id===session.currentUserId))
    ? session.currentUserId : null;
  // Biết đang đăng nhập là ai rồi -> tải thêm đúng nhánh module được cấp (nếu đang dùng Firebase); Admin
  // luôn tải đủ cả 3, tài khoản khác chỉ tải đúng module mình dùng — đây chính là phần "tách đồng bộ theo
  // module" giúp giảm băng thông cho tài khoản chỉ dùng 1-2 module.
  await syncBranchesForCurrentUser();
  if(await migratePasswordsV1()) saveState();
  if(currentRole()==='Admin' && migrateActivityLogTrashSplitV1()) saveState(); // cần đủ cả 4 nhánh nên chỉ Admin chạy được đúng
  setStoragePill(storageMode);
  renderAll();
})();
</script>
