}

let saveTimer=null;
let pendingSave = false; // true = có thay đổi đang chờ ghi (chưa chắc đã lưu xong) — dùng để cảnh báo khi rời trang
/* ---------------------------- Ghi dữ liệu theo TỪNG BẢN GHI ----------------------------
   Mỗi field "tập hợp bản ghi" (suppliers/transactions/reconciliations/...) giờ lưu trên Firebase dưới
   dạng 1 node con riêng cho từng bản ghi (khớp theo id), thay vì gộp chung thành 1 mảng lớn trong 1 field
   — nên chỉ cần ghi ĐÚNG bản ghi nào thực sự thay đổi/mới thêm/bị xoá, không phải ghi lại cả mảng mỗi lần.
   Nhờ vậy 2 người thêm/sửa 2 bản ghi KHÁC NHAU gần như cùng lúc tự động không đụng nhau (khác đường dẫn
   Firebase) — không cần đọc lại server trước khi ghi để "hợp nhất" như cách làm trước đây nữa. Chỉ còn
   đúng 1 tình huống hiếm: 2 người sửa ĐÚNG CÙNG 1 bản ghi cùng lúc — khi đó ai ghi sau thắng đúng bản ghi
   đó (chấp nhận được, không ảnh hưởng các bản ghi khác). */
/* ---------------------------- Cache số đếm badge (chấm đỏ trên menu) ----------------------------
   Trước đây insAlertBadgeHTML()/renewalAlertBadgeHTML()/requestBadgeHTML() được gọi lại từ đầu MỖI LẦN vẽ
   trang (kể cả chỉ đổi tab, gõ tìm kiếm... không hề đổi dữ liệu gì) — với dữ liệu ít như hiện tại thì không
   cảm nhận được chậm, nhưng sẽ rõ rệt hơn khi lượng NCC/tin nhắn/hợp đồng tích luỹ nhiều theo thời gian.
   Giờ chỉ tính lại khi THẬT SỰ có gì thay đổi — đánh dấu "cần tính lại" (badgeCacheDirty=true) ngay trong
   saveState(), vì MỌI thao tác ghi dữ liệu trong app đều đi qua đúng 1 cửa này; những lần vẽ lại trang
   không kèm ghi dữ liệu (đổi tab, gõ tìm kiếm...) sẽ dùng lại đúng kết quả đã tính từ lần trước. */
let badgeCacheDirty = true; // true ban đầu để lần vẽ đầu tiên luôn tính đủ
let badgeCache = {};
function recomputeBadgeCacheIfNeeded(){
  if(!badgeCacheDirty) return;
  badgeCache = {
    insAlert: insAlertBadgeHTML(),
    renewal: renewalAlertBadgeHTML(),
    nccRequests: requestBadgeHTML(scopedObjsFor('supplierId', state.suppliers), 'ncc'),
    nhRequests: requestBadgeHTML(scopedObjsFor('bankId', state.banks), 'nh'),
    bhRequests: requestBadgeHTML(scopedObjsFor('insurerId', state.insurers), 'bh'),
  };
  badgeCacheDirty = false;
}

function saveState(){
  badgeCacheDirty = true; // có ghi dữ liệu -> lần vẽ trang kế tiếp phải tính lại badge, không dùng cache cũ
  pendingSave = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
    if(fb.status==='connected' && fb.db){
      // CHỈ ghi những nhánh mình đang thực sự lắng nghe (Object.keys(fb.refs)) — bắt buộc phải giới hạn thế
      // này, vì nếu ghi cả nhánh chưa từng tải (vd 1 Nhân viên chỉ có module Ngân hàng thì KHÔNG có dữ liệu
      // NCC thật trong bộ nhớ, `state.suppliers`... vẫn đang là dữ liệu mẫu mặc định) sẽ VÔ TÌNH GHI ĐÈ/XOÁ
      // MẤT dữ liệu thật của module đó trên Firebase.
      const updates = {};
      let anyChange = false;
      // CHỈ xử lý nhánh đã tải xong THẬT SỰ (fb.loaded[branch]===true) — fb.refs[branch] có thể đã là
      // true từ sớm (đang tải dở) trong khi state[field] của nhánh đó vẫn còn là dữ liệu mẫu (seed); nếu
      // không chặn ở đây, saveState() lỡ chạy đúng lúc đó sẽ tưởng toàn bộ dữ liệu mẫu là "bản ghi mới"
      // và ghi đè/nhân bản lên Firebase (bug cũ: mỗi lần đăng nhập lại thêm đúng lô chính sách mẫu ban đầu).
      for(const branch of Object.keys(fb.refs)){
        if(!fb.loaded[branch]) continue;
        // Phần "meta" (field nhỏ, ít đổi: nextSupplierNo, reportDate, units...) — vẫn so sánh + ghi gộp
        // như 1 khối nhỏ, không cần tối ưu theo bản ghi vì hiếm khi đổi và không phình to theo thời gian.
        const metaObj = {};
        (BRANCH_META_FIELDS[branch]||[]).forEach(k=>{ metaObj[k] = state[k]; });
        const metaJson = JSON.stringify(metaObj);
        if(metaJson !== lastSavedMeta[branch]){
          lastSavedMeta[branch] = metaJson;
          updates[FB_ROOT+'/'+branch+'/meta'] = metaObj;
          anyChange = true;
        }
        // Từng field "tập hợp bản ghi" — so sánh TỪNG BẢN GHI với lần lưu gần nhất, chỉ ghi đúng bản ghi
        // mới/đổi (set) hoặc đã bị xoá khỏi mảng cục bộ (set = null để xoá trên Firebase).
        for(const field of (BRANCH_RECORD_FIELDS[branch]||[])){
          const fkey = recordFieldKey(branch, field);
          const known = lastSavedRecords[fkey] || (lastSavedRecords[fkey] = new Map());
          const currentArr = Array.isArray(state[field]) ? state[field] : [];
          const seenIds = new Set();
          currentArr.forEach(item=>{
            const id = recordKeyOf(item);
            if(id===undefined || id===null) return;
            seenIds.add(id);
            const json = JSON.stringify(item);
            if(known.get(id) === json) return; // không đổi so với lần lưu gần nhất -> bỏ qua
            known.set(id, json);
            updates[FB_ROOT+'/'+branch+'/'+field+'/'+id] = item;
            anyChange = true;
          });
          known.forEach((_, id)=>{
            if(!seenIds.has(id)){
              known.delete(id);
              updates[FB_ROOT+'/'+branch+'/'+field+'/'+id] = null; // ghi null = xoá đúng bản ghi đó trên Firebase
              anyChange = true;
            }
          });
        }
      }
      if(anyChange){
        try{
          await fb.db.ref().update(updates);
          setStoragePill('firebase');
          return;
        }catch(e){ console.error('Firebase save failed, dùng tầng dự phòng', e); }
      } else {
        setStoragePill('firebase'); // không có gì mới cần ghi, nhưng vẫn đang kết nối bình thường
        return;
      }
    }
    // Tầng dự phòng (không có Firebase): vẫn lưu NGUYÊN state đầy đủ dạng 1 khối JSON như trước đây —
    // đây là lưu trữ CÁ NHÂN/nội bộ trò chuyện, không tốn băng thông chia sẻ nên không cần tách nhánh.
    const json = JSON.stringify(state);
    if(json === lastSavedJsonByBranch.__local) return;
    try{
      if(window.storage && typeof window.storage.set==='function'){
        await window.storage.set(STORE_KEY, json, true);
        lastSavedJsonByBranch.__local = json;
        setStoragePill('cloud'); return;
      }
    }catch(e){ /* fall through */ }
    try{
      localStorage.setItem(STORE_KEY, json);
      lastSavedJsonByBranch.__local = json;
      setStoragePill('local'); return;
    }catch(e){ /* fall through */ }
    setStoragePill('memory');
    } finally { pendingSave = false; } // dù thành công/thất bại/không có gì để ghi, đều coi như đã "xử lý xong" lượt lưu này
  }, 800);
}
async function saveSession(){
  const json = JSON.stringify({currentUserId});
  try{
    if(window.storage && typeof window.storage.set==='function'){
      await window.storage.set(SESSION_KEY, json, false); return;
    }
  }catch(e){}
  try{ localStorage.setItem(SESSION_KEY, json); }catch(e){}
}

/* ---------------------------- Tự đăng xuất khi không thao tác ----------------------------
   Đăng nhập vẫn giữ kết nối/lắng nghe real-time tới các nhánh Firebase của module được cấp — nếu mở app
   rồi để đó không dùng, vẫn tốn băng thông tải về mỗi khi có ai khác ghi dữ liệu. Sau NGƯỠNG phút không có
   bất kỳ thao tác nào (chuột/gõ phím/chạm/cuộn), tự đăng xuất — ngừng lắng nghe mọi nhánh module (chỉ còn
   nhánh 'shared' tối thiểu để hiện màn đăng nhập), giảm hẳn lượng tải về khi không có ai thực sự dùng. */
const INACTIVITY_LIMIT_MINUTES = 10;
let inactivityTimer = null;
function resetInactivityTimer(){
  if(!currentUserId) return; // chưa đăng nhập -> không cần đếm
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(autoLogoutIdle, INACTIVITY_LIMIT_MINUTES*60*1000);
}
async function autoLogoutIdle(){
  if(!currentUserId) return;
  const menu = document.getElementById('userMenu'); if(menu) menu.classList.remove('open');
  closeModal();
  currentUserId = null;
  saveSession();
  await syncBranchesForCurrentUser(); // ngừng lắng nghe mọi nhánh module, chỉ còn 'shared'
  renderAll();
  toast(`Đã tự động đăng xuất do không thao tác trong ${INACTIVITY_LIMIT_MINUTES} phút`);
}

function fbStatusLabel(){
  if(fb.status==='connected') return '🔥 Đã kết nối Firebase';
  if(fb.status==='connecting') return 'Đang kết nối...';
  if(fb.status==='error') return 'Lỗi kết nối';
  return 'Chưa kết nối';
}
function setStoragePill(mode){
  storageMode = mode;
  const pill = document.getElementById('storagePill');
  if(!pill) return;
  if(mode==='firebase'){
    pill.className='storage-pill'; pill.innerHTML='<span class="blip"></span><span>🔥 Firebase — đồng bộ real-time</span>';
  } else if(mode==='cloud'){
    pill.className='storage-pill'; pill.innerHTML='<span class="blip"></span><span>Đã lưu — dùng chung trò chuyện</span>';
  } else if(mode==='local'){
    pill.className='storage-pill'; pill.innerHTML='<span class="blip"></span><span>Đã lưu trên trình duyệt này</span>';
  } else {
    pill.className='storage-pill offline'; pill.innerHTML='<span class="blip"></span><span>Chưa lưu được — dữ liệu chỉ tồn tại trong phiên này</span>';
  }
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
// Toast có nút "Hoàn tác" — dùng ngay sau softDelete() (trashId = kết quả trả về của softDelete). Hiện lâu
// hơn toast thường (5s thay vì 2.2s) để kịp bấm; bấm là khôi phục lại ngay tại chỗ, không cần vào Thùng rác.
function toastUndo(msg, trashId){
  if(!trashId){ toast(msg); return; } // phòng hờ softDelete() trả về null (không tìm thấy bản ghi) -> vẫn báo bình thường
  const t = document.getElementById('toast');
  t.innerHTML = `<span>${escHtml(msg)}</span> <button type="button" class="toast-undo-btn" id="toastUndoBtn">Hoàn tác</button>`;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 5000);
  document.getElementById('toastUndoBtn').addEventListener('click', ()=>{
    const restored = restoreFromTrash(trashId);
    clearTimeout(toast._t);
    t.classList.remove('show');
    if(restored){
      logActivity('create', restored.entityLabel, `Hoàn tác xoá: ${trashItemSummary(restored)}`);
      saveState();
      toast('Đã hoàn tác');
      renderAll();
    }
  });
}
/* ---------------------------- Gợi ý lần đầu dùng (dismissible) ----------------------------
   Xuất hiện 1 lần cho tới khi người dùng bấm ✕ — lưu vào localStorage của TRÌNH DUYỆT (không đồng bộ qua
   Firebase, vì đây chỉ là sở thích hiển thị của riêng máy đó, không phải dữ liệu nghiệp vụ). Nếu người
   dùng đổi máy/trình duyệt khác, gợi ý sẽ hiện lại — chấp nhận được vì đây không phải hạn chế nghiêm trọng.*/
function hintDismissed(hintId){
  try{ return localStorage.getItem('hintDismissed_'+hintId)==='1'; }catch(e){ return false; }
}
function dismissHint(hintId){
  try{ localStorage.setItem('hintDismissed_'+hintId, '1'); }catch(e){}
}
function hintBannerHTML(hintId, text){
  if(hintDismissed(hintId)) return '';
  return `<div class="hint-banner" data-hint-id="${escAttr(hintId)}">
    <span>💡 ${text}</span>
    <button class="hint-dismiss" data-dismiss-hint="${escAttr(hintId)}" title="Không hiện lại gợi ý này">✕</button>
  </div>`;
}
// Gọi sau khi đổ hintBannerHTML() vào DOM, truyền đúng phần tử cha chứa nó.
function wireHintDismiss(container){
  container.querySelectorAll('[data-dismiss-hint]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      dismissHint(btn.dataset.dismissHint);
      const banner = btn.closest('.hint-banner');
      if(banner) banner.remove();
    });
  });
}
/* ---------------------------- Giải thích thu gọn (nút "?") ----------------------------
   Dùng cho các đoạn giải thích dài trong Cài đặt — mặc định ẩn, bấm mới hiện, để trang đỡ rối mắt cho việc
   dùng hàng ngày (người mới cần đọc kỹ mới bấm xem, người quen thao tác nhanh không bị đoạn dài chắn tầm nhìn).*/

    <div class="helper" id="${escAttr(id)}" style="display:none;margin-top:8px">${text}</div>`;
}
function wireInfoToggles(container){

/* ---------------------------- Panel thu gọn được (Bộ lọc / Ghi nhận doanh số...) ----------------------------
   Các khối "Bộ lọc" và "Ghi nhận..." ở đầu mỗi trang Doanh số (NCC/Ngân hàng/Bảo hiểm) khá dài, chiếm nhiều
   diện tích màn hình, đẩy bảng Sổ chứng từ/hợp đồng/hồ sơ vay (nội dung chính, xem thường xuyên nhất) xuống
   quá thấp. panelToggleHeadHTML() vẽ 1 panel-head có thể bấm để thu gọn/mở rộng phần thân — nội dung phần
   thân vẫn luôn ở trong DOM (chỉ ẩn bằng display:none) nên mọi input/nút bên trong vẫn hoạt động bình
   thường kể cả khi đang thu gọn, không cần sửa lại phần logic wiring các trường bên trong.
   Trạng thái đóng/mở nhớ theo id trong biến panelOpenState suốt phiên dùng app (không mất khi vẽ lại trang
   do đổi bộ lọc/thêm dữ liệu...), chỉ đổi khi người dùng bấm. */
function panelIsOpen(id, defaultOpen){
  if(!(id in panelOpenState)) panelOpenState[id] = !!defaultOpen;
  return panelOpenState[id];
}
function panelToggleHeadHTML(id, title, desc, rightHTML, defaultOpen, actionLabel){
  const open = panelIsOpen(id, defaultOpen);
  const label = actionLabel || 'mở rộng';
  const stateText = open ? 'Thu gọn' : `Bấm để ${label}`;
  return `<div class="panel-head" data-panel-toggle="${escAttr(id)}" style="cursor:pointer;user-select:none" title="${open?'Thu gọn':'Bấm để '+label}">
    <div><h2>${title} <span style="font-size:11.5px;color:var(--gold);font-weight:600;margin-left:6px;letter-spacing:0.01em">${open?'▾':'▸'} ${stateText}</span></h2>${desc?`<div class="desc">${desc}</div>`:''}</div>
    ${rightHTML||''}
  </div>`;
}
function panelBodyOpenAttr(id, defaultOpen){
  return panelIsOpen(id, defaultOpen) ? '' : 'style="display:none"';
}
function wirePanelToggles(container){
  container.querySelectorAll('[data-panel-toggle]').forEach(head=>{
    head.addEventListener('click', (e)=>{
      if(e.target.closest('input,select,textarea,button,a,label')) return; // không toggle khi bấm vào ô lọc/nút nằm ngay trên panel-head (VD mini-stats, badge đơn vị)
      const id = head.dataset.panelToggle;
      panelOpenState[id] = !panelIsOpen(id, false);
      renderAll();
    });
  });
}


/* ---------------------------- Modal dùng chung (dùng cho Đính kèm hợp đồng và các popup sau này) ----------------------------
   openModal(title, desc, bodyHtml, onMount): chèn 1 overlay full-màn-hình vào <body>, đóng bằng nút X, click nền, hoặc phím Esc.
   onMount(bodyEl) chạy SAU khi HTML đã gắn vào DOM — dùng để wire sự kiện cho nội dung modal. */
function openModal(title, desc, bodyHtml, onMount){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'activeModal';
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-head">
        <div><h2>${title}</h2>${desc?`<div class="desc">${desc}</div>`:''}</div>
        <button class="modal-close" id="modalCloseBtn" title="Đóng">✕</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.addEventListener('keydown', modalEscHandler);
  if(onMount) onMount(overlay.querySelector('.modal-body'));
}
function modalEscHandler(e){ if(e.key==='Escape') closeModal(); }
function closeModal(){
  const el = document.getElementById('activeModal');
  if(el) el.remove();
  document.removeEventListener('keydown', modalEscHandler);
}
// Modal xác nhận dùng chung — thay cho confirm() mặc định xấu xí của trình duyệt, đồng bộ giao diện app.
// KHÁC BIỆT QUAN TRỌNG với confirm(): confirm() CHẶN code chạy tiếp cho tới khi người dùng bấm nút (đồng
// bộ), còn modal này KHÔNG chặn được — code viết ngay sau lời gọi confirmModal() sẽ chạy luôn, không đợi
// người dùng bấm gì cả. Vì vậy mọi việc cần làm SAU KHI xác nhận phải đặt trong tham số onConfirm (callback),
// không được viết nối tiếp ngay dưới dòng gọi confirmModal() như thói quen cũ với confirm().
// opts.danger=false nếu là hành động nhẹ nhàng (mặc định coi là hành động cần cẩn trọng, nút đỏ).
function confirmModal(message, onConfirm, opts){
  opts = opts || {};
  const danger = opts.danger !== false;
  openModal(opts.title || 'Xác nhận thao tác', '',
    `<div style="font-size:14px;line-height:1.65;white-space:pre-wrap">${escHtml(message)}</div>
     <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:20px">
       <button class="btn btn-ghost" id="confirmModalCancelBtn">Huỷ</button>
       <button class="btn ${danger?'btn-danger-ghost':'btn-primary'}" id="confirmModalOkBtn">${escHtml(opts.confirmLabel||'Xác nhận')}</button>
     </div>`,
    (body)=>{
      body.querySelector('#confirmModalCancelBtn').addEventListener('click', closeModal);
      body.querySelector('#confirmModalOkBtn').addEventListener('click', ()=>{ closeModal(); onConfirm(); });
    });
}
// Modal thông báo dùng chung — thay cho alert() mặc định của trình duyệt.
function alertModal(message, opts){
  opts = opts || {};
  openModal(opts.title || 'Thông báo', '',
    `<div style="font-size:14px;line-height:1.65;white-space:pre-wrap">${escHtml(message)}</div>
     <div style="display:flex;justify-content:flex-end;margin-top:20px">
       <button class="btn btn-primary" id="alertModalOkBtn">Đã hiểu</button>
     </div>`,
    (body)=>{ body.querySelector('#alertModalOkBtn').addEventListener('click', closeModal); });
}

/* ---------------------------- Upload ảnh/PDF lên Google Drive (qua Google Apps Script) ----------------------------
   App không có backend riêng nên không tự gọi thẳng Drive API được — thay vào đó gửi file (dạng base64) tới
   1 Google Apps Script Web App do Admin tự deploy 1 lần (xem hướng dẫn kèm theo), script đó lưu file vào
   đúng thư mục Drive chỉ định và trả về link chia sẻ. Cấu hình URL + mã bí mật ở tab Cài đặt. */
function driveUploadConfigured(){ return !!(state.driveUploadUrl && state.driveUploadUrl.trim()); }
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(String(reader.result).split(',')[1] || ''); // bỏ phần "data:...;base64," ở đầu
    reader.onerror = ()=> reject(new Error('Không đọc được file'));
    reader.readAsDataURL(file);
  });
}
// subfolder: tên thư mục con muốn gộp file vào bên trong thư mục gốc đã cấu hình ở script (VD tên NCC/NH/BH)
// — script Apps Script mẫu sẽ tự tạo thư mục con này nếu chưa có, giúp hồ sơ không bị dồn hết vào 1 chỗ.
//
// LƯU Ý KỸ THUẬT: Apps Script Web App đôi khi chặn được fetch() thẳng do CORS ("Failed to fetch"), đôi khi
// lại chặn được cách né CORS bằng <form>+<iframe>+postMessage do chính Google tự lồng thêm iframe/áp chính
// sách khung riêng ở hạ tầng của họ (nằm ngoài khả năng cấu hình từ phía script) — tuỳ theo cách deploy,
// tài khoản Google, thời điểm... mà 1 trong 2 cách có thể không hoạt động dù cách kia vẫn ổn. Để không phải
// đoán mò, app TỰ THỬ fetch() trước (nhanh, đơn giản); nếu lỗi/timeout mới thử tiếp bằng <iframe> ẩn.
let driveUploadReqSeq = 0;
// Hàm gửi dùng CHUNG cho mọi loại request tới Apps Script (upload file, gửi email...) — chỉ khác nhau ở
// payload gửi lên. Luôn thêm sẵn "secret" — nơi gọi không cần tự thêm.
function postToScript(payload){
  if(!driveUploadConfigured()) return Promise.reject(new Error('Chưa cấu hình Google Apps Script — vào Cài đặt (Admin) để thiết lập trước.'));
  const reqId = 'gsPost_'+(++driveUploadReqSeq)+'_'+Date.now();
  const bodyStr = JSON.stringify({ secret: state.driveUploadSecret||'', reqId, ...payload });
  return postViaFetch(bodyStr).catch(fetchErr=>{
    console.warn('postToScript: fetch() thất bại, thử lại bằng form ẩn:', fetchErr);
    return postViaHiddenForm(bodyStr, reqId);
  });
}
// Cách 1 — fetch() thẳng, dùng Content-Type: text/plain để tránh bước "preflight" (OPTIONS) mà Apps
// Script không xử lý tốt. Đây là cách đơn giản, nhanh nhất khi hoạt động được.
function postViaFetch(bodyStr){
  return fetch(state.driveUploadUrl, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: bodyStr })
    .then(res=> res.json())
    .then(data=>{
      if(!data || typeof data.ok==='undefined') throw new Error('Phản hồi không hợp lệ từ Apps Script.');
      if(!data.ok) throw new Error(data.error || 'Yêu cầu thất bại — kiểm tra lại URL Web App/Mã bí mật ở Cài đặt.');
      return data;
    });
}
// Cách 2 (dự phòng) — <form> ẩn POST vào 1 <iframe> ẩn, script phía Google trả về 1 trang HTML nhỏ gọi
// postMessage() để gửi kết quả ngược lại. Chỉ dùng khi fetch() ở trên thất bại.
function postViaHiddenForm(bodyStr, reqId){
  return new Promise((resolve, reject)=>{
    const iframe = document.createElement('iframe');
    iframe.name = reqId; iframe.style.display = 'none';
    const form = document.createElement('form');
    form.method = 'POST'; form.action = state.driveUploadUrl; form.target = reqId; form.style.display = 'none';
    const input = document.createElement('input'); input.type = 'hidden'; input.name = 'payload'; input.value = bodyStr;
    form.appendChild(input);
    document.body.appendChild(iframe);
    document.body.appendChild(form);

    const timeoutId = setTimeout(()=>{ cleanup(); reject(new Error('Hết thời gian chờ phản hồi từ Google Apps Script (30s) — kiểm tra lại mạng hoặc cấu hình URL ở Cài đặt.')); }, 30000);
    function cleanup(){
      clearTimeout(timeoutId);
      window.removeEventListener('message', onMessage);
      form.remove();
      setTimeout(()=> iframe.remove(), 500); // đợi 1 nhịp để tránh huỷ iframe giữa lúc nó còn đang chạy script trả kết quả
    }
    function onMessage(ev){
      // Xác nhận theo đúng reqId thay vì so khớp cửa sổ nguồn (ev.source) — Apps Script có thể tự lồng
      // thêm 1-2 lớp iframe sandbox bên trong khi hiển thị trang trả về, khiến ev.source không còn khớp
      // đúng iframe.contentWindow mà ta tạo ra nữa dù message thực sự đến từ đúng request này.
      let data;
      try{ data = JSON.parse(ev.data); }catch(err){ return; }
      if(!data || typeof data.ok==='undefined' || data.reqId!==reqId) return;
      cleanup();
      if(data.ok) resolve(data);
      else reject(new Error(data.error || 'Yêu cầu thất bại — kiểm tra lại URL Web App ở Cài đặt.'));
    }
    window.addEventListener('message', onMessage);
    form.submit();
  });
}
function uploadFileToDrive(file, subfolder){
  return new Promise(async (resolve, reject)=>{
    if(!driveUploadConfigured()){ reject(new Error('Chưa cấu hình nơi lưu trữ Google Drive — vào Cài đặt (Admin) để thiết lập trước.')); return; }
    if(file.size > 15*1024*1024){ reject(new Error('File quá lớn (>15MB) — vui lòng chụp ảnh nhẹ hơn hoặc nén PDF trước khi tải lên.')); return; }
    let dataBase64;
    try{ dataBase64 = await fileToBase64(file); }catch(err){ reject(err); return; }
    postToScript({ type:'upload', filename: file.name, mimeType: file.type||'application/octet-stream', subfolder: subfolder||'', dataBase64 })
      .then(data=> resolve({ url: data.url, name: data.name }))
      .catch(reject);
  });
}
// Gửi email thông báo qua đúng Apps Script đã cấu hình (dùng MailApp phía Google) — cố tình KHÔNG throw
// lỗi ra ngoài ở nơi gọi (xem notifyAboutRequestMessage): gửi thông báo thất bại không được phép làm hỏng
// thao tác chính (gửi yêu cầu/trả lời) — chỉ log ra console để debug khi cần.
// Gửi kèm accountId (id tài khoản đang đăng nhập) để Code.gs giới hạn được tần suất THEO TỪNG TÀI KHOẢN —
// không phải để xác thực (bảo mật vẫn dựa vào "secret"), chỉ để đếm số lần gọi cho đúng người.
function sendEmailNotification(toEmails, subject, body){
  return postToScript({ type:'notify', to: toEmails, subject, body, accountId: currentUserId||'' });
}
// Công tắc khẩn cấp — bật/tắt hẳn việc gửi email ở đúng phía Apps Script (không chỉ ẩn nút trong app), để
// dù ai đó có mã bí mật và gọi thẳng script cũng không gửi được nữa khi đã khoá. Trả về Promise; nơi gọi
// (UI Cài đặt) chỉ cập nhật state.emailNotifyEnabled SAU KHI xác nhận script đã đổi thành công.
function setRemoteEmailEnabled(enabled){
  return postToScript({ type:'setEmailEnabled', enabled: !!enabled });
}
// Gắn 1 input[type=file] + 1 span trạng thái vào cơ chế upload chung: chọn file -> tự upload -> gọi onDone(url).
// Dùng chung cho mọi nơi cần nút "📷 Chụp ảnh / Chọn file" (Hợp đồng, Doanh số...).
// subfolder có thể là chuỗi cố định, hoặc 1 hàm () => chuỗi để lấy tên thư mục con ĐÚNG THỜI ĐIỂM bấm chọn
// file (VD lấy đúng tên NCC/NH/BH đang gõ trong form ngay lúc đó, thay vì cố định từ lúc mở trang).
function wireDriveUploadButton(fileInputEl, statusEl, subfolder, onDone){
  fileInputEl.addEventListener('change', async ()=>{
    const file = fileInputEl.files && fileInputEl.files[0];
    if(!file) return;
    statusEl.innerHTML = '<span class="mini-spinner"></span>Đang tải lên Google Drive...';
    statusEl.style.color = 'var(--slate)';
    try{
      const sf = typeof subfolder==='function' ? subfolder() : subfolder;
      const { url, name } = await uploadFileToDrive(file, sf);
      statusEl.textContent = '✓ Đã tải lên: '+name;
      statusEl.style.color = 'var(--forest)';
      onDone(url);
    }catch(err){
      statusEl.textContent = '✕ '+err.message;
      statusEl.style.color = 'var(--rust)';
    }finally{
      fileInputEl.value = ''; // cho phép chọn lại đúng file đó lần nữa nếu cần thử lại
    }
  });
}

/* ---------------------------- Đính kèm hoá đơn ở Doanh số (NCC/Ngân hàng/Bảo hiểm) ----------------------------
   Dùng chung cho cả 3 sổ Doanh số: (1) khối HTML + wiring cho form "Ghi nhận..." (chụp/chọn lúc nhập mới),
   (2) 1 cột "Hoá đơn" trong bảng Sổ chứng từ cho phép đính kèm sau nếu lúc nhập chưa kịp chụp — dùng 1

function wireInvoiceUploadField(idPrefix, subfolder){

}

// Ô "Hoá đơn" trong 1 dòng bảng Sổ chứng từ — link xem (nếu đã có) + nút đính kèm/đổi (nếu editable).
function invoiceCellHTML(t, editable){
  const safeLink = t.invoiceLink && /^https?:\/\//i.test(t.invoiceLink) ? t.invoiceLink : null;
  const viewPart = safeLink ? `<a href="${escAttr(safeLink)}" target="_blank" rel="noopener" class="contract-link">🧾 Xem</a>` : (editable ? '' : '<span style="color:var(--slate)">—</span>');
  const attachPart = editable ? `<button class="btn btn-ghost" data-attach-invoice="${t.id}" style="padding:2px 7px;font-size:11px;white-space:nowrap">${safeLink?'Đổi':'+ Đính kèm'}</button>` : '';
  return `<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start">${viewPart}${attachPart}</div>`;
}
// Gắn nút "+ Đính kèm"/"Đổi" ở cột Hoá đơn sau khi bảng đã render — subfolderFn(t) trả tên thư mục con
// theo đúng dòng đang thao tác (VD tên NCC/NH/BH của chính dòng đó).
function wireInvoiceAttachColumn(tbl, arr, entityLabel, subfolderFn){
  const wrap = tbl.parentElement || document.body;
  const old = wrap.querySelector('.invoice-attach-hidden-input');
  if(old) old.remove(); // tránh tích luỹ input ẩn mỗi lần bảng vẽ lại (đổi bộ lọc, sửa 1 ô...)
  const hiddenInput = document.createElement('input');
  hiddenInput.type = 'file'; hiddenInput.accept = 'image/*,application/pdf'; hiddenInput.className = 'invoice-attach-hidden-input';
  hiddenInput.style.display = 'none';
  wrap.appendChild(hiddenInput);
  let pendingId = null;
  hiddenInput.addEventListener('change', async ()=>{
    const file = hiddenInput.files && hiddenInput.files[0];
    const targetId = pendingId;
    hiddenInput.value = ''; pendingId = null;
    if(!file || !targetId) return;
    const item = arr.find(x=>x.id===targetId);
    if(!item) return;
    toast('Đang tải hoá đơn lên Google Drive...');
    try{
      const { url } = await uploadFileToDrive(file, subfolderFn(item));
      item.invoiceLink = url;
      logActivity('update', entityLabel, `Đính kèm hoá đơn cho 1 chứng từ ngày ${item.date}`);
      saveState();
      toast('Đã đính kèm hoá đơn');
      renderAll();
    }catch(err){
      toast('Lỗi đính kèm: '+err.message);
    }
  });
  tbl.querySelectorAll('[data-attach-invoice]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ pendingId = btn.dataset.attachInvoice; hiddenInput.click(); });
  });
}

/* ---------------------------- Đính kèm hợp đồng NCC/Ngân hàng/Bảo hiểm ----------------------------
   Dùng chung cho cả 3 khối (NCC dịch vụ ô tô, Ngân hàng, Bảo hiểm) — MỖI HỢP ĐỒNG LÀ 1 BẢN GHI ĐỘC LẬP
   trong state.contracts/bankContracts/insContracts (không lồng trong object NCC/NH/BH — xem
   migrateContractsRequestsToRecordsV1 phía dưới để hiểu lý do đổi cách lưu), tự mang supplierId/bankId/
   insurerId để biết thuộc về ai: {id, supplierId|bankId|insurerId, ten, soHopDong, ngayKy, ngayHieuLuc,
   ngayHetHan, link, ghiChu, units, supersededBy, createdAt, createdBy}.
   units: mảng tên đơn vị (lấy từ state.units) mà hợp đồng NÀY áp dụng riêng — mảng RỖNG nghĩa là
   "áp dụng chung, không phân theo đơn vị" (mặc định, hợp lý với NCC chỉ ký 1 hợp đồng cho tất cả).
   Trạng thái KHÔNG lưu tay mà luôn tự suy ra từ contractStatus() để tránh sai lệch khi quên cập nhật. */
const CONTRACT_STORE_BY_LABEL = {
  'NCC': {arr:'contracts', idField:'supplierId'},
  'NH': {arr:'bankContracts', idField:'bankId'},
  'NCC Bảo hiểm': {arr:'insContracts', idField:'insurerId'},
};
function contractList(obj, entityLabel){
  const store = CONTRACT_STORE_BY_LABEL[entityLabel];
  return (store && obj) ? state[store.arr].filter(c=>c[store.idField]===obj.id) : [];
}
function contractStatus(ct){
  if(ct.supersededBy) return 'superseded';
  if(!ct.ngayHieuLuc) return 'draft';
  if(ct.ngayHetHan && ct.ngayHetHan < todayISO()) return 'expired';
  return 'active';
}
function contractStatusMeta(status, ct){
  if(status==='active'){
    if(ct && ct.ngayHetHan){
      const daysLeft = Math.round((new Date(ct.ngayHetHan) - new Date(todayISO()))/86400000);
      if(daysLeft<=30) return {label:`Sắp hết hạn (còn ${daysLeft} ngày)`, cls:'st-expiring'};
    }
    return {label:'Hiệu lực', cls:'st-active'};
  }
  if(status==='expired') return {label:'Hết hạn', cls:'st-expired'};
  if(status==='superseded') return {label:'Đã thay thế', cls:''};
  return {label:'Nháp', cls:''};
}
/* Nhãn đơn vị áp dụng của 1 hợp đồng — dùng ở cả dòng trong modal và bộ lọc. */
function contractUnitsLabel(ct){
  return (ct.units && ct.units.length) ? ct.units.join(', ') : 'Áp dụng chung (mọi đơn vị)';
}
/* Hai hợp đồng có "đụng" đơn vị hay không — mảng rỗng nghĩa là áp dụng chung nên luôn coi là đụng với bất kỳ ai.
   Dùng để xác định hợp đồng mới thêm chỉ nên "thay thế" đúng những bản cũ cùng phạm vi đơn vị,
   thay vì thay thế nhầm cả hợp đồng của đơn vị khác không liên quan. */
function contractUnitsOverlap(a, b){
  const ua = a.units||[], ub = b.units||[];
  if(ua.length===0 || ub.length===0) return true;
  return ua.some(u=>ub.includes(u));
}
/* Hợp đồng "đại diện" hiển thị trên badge của bảng danh sách: ưu tiên hiển thị bản có trạng thái ĐÁNG CHÚ Ý
   nhất trong số các bản chưa bị thay thế (hết hạn > sắp hết hạn > nháp > hiệu lực bình thường) — để nếu
   1 trong nhiều đơn vị bị hết hạn hợp đồng, người quản trị nhìn bảng tổng là thấy ngay, không phải mở modal mới biết. */
function representativeContract(obj, entityLabel){
  const list = contractList(obj, entityLabel).filter(ct=>contractStatus(ct)!=='superseded');
  if(list.length===0) return null;
  const rank = ct=>{
    const st = contractStatus(ct);
    if(st==='expired') return 0;
    if(st==='active' && contractStatusMeta(st,ct).cls==='st-expiring') return 1;
    if(st==='draft') return 2;
    return 3;
  };
  return [...list].sort((a,b)=> rank(a)-rank(b))[0];
}
function contractBadgeHTML(obj, entityLabel){
  const all = contractList(obj, entityLabel);
  if(all.length===0) return `<button class="contract-badge" data-open-contracts="1">📎 Chưa có hợp đồng</button>`;
  const rep = representativeContract(obj, entityLabel);
  const nonSup = all.filter(ct=>contractStatus(ct)!=='superseded');
  if(!rep) return `<button class="contract-badge" data-open-contracts="1">📎 Chỉ còn bản đã thay thế <span class="cnt-extra">${all.length} bản</span></button>`;
  const status = contractStatus(rep);
  const meta = contractStatusMeta(status, rep);
  const distinctScopes = new Set(nonSup.map(ct=> (ct.units&&ct.units.length) ? ct.units.slice().sort().join('|') : '__ALL__'));
  const unitHint = distinctScopes.size>1 ? ' · nhiều đơn vị' : '';
  const extra = all.length>1 ? `<span class="cnt-extra">+${all.length-1} bản${unitHint}</span>` : '';
  return `<button class="contract-badge ${meta.cls}" data-open-contracts="1">📎 ${meta.label} ${extra}</button>`;
}
/* Gắn sự kiện mở modal hợp đồng cho mọi nút [data-open-contracts] bên trong 1 bảng.
   getObj(id) trả về object (supplier/bank/insurer) theo id đã gắn ở data-id trên <tr>. */
function wireContractBadges(tbl, list, entityLabel, editable){
  tbl.querySelectorAll('[data-open-contracts]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.closest('tr').dataset.rowid;
      const obj = list.find(x=>x.id===id);
      if(obj) openContractsModal(obj, list, entityLabel, editable);
    });
  });
}
/* unitFilter: '' = xem tất cả đơn vị; tên đơn vị cụ thể = chỉ hiện hợp đồng áp dụng chung HOẶC có chứa đơn vị đó. */
function contractRowsHTML(obj, editable, unitFilter, entityLabel){
  const items = [...contractList(obj, entityLabel)]
    .filter(ct=> !unitFilter || !ct.units || ct.units.length===0 || ct.units.includes(unitFilter))
    .sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  if(items.length===0) return `<div class="empty" style="padding:20px 0;"><div class="big">Chưa có hợp đồng nào${unitFilter?' cho đơn vị này':''}</div></div>`;
  return items.map(ct=>{
    const status = contractStatus(ct);
    const meta = contractStatusMeta(status, ct);
    const range = ct.ngayHieuLuc ? `${ct.ngayHieuLuc}${ct.ngayHetHan?' → '+ct.ngayHetHan:' → vô thời hạn'}` : 'Chưa có ngày hiệu lực';
    // Chỉ coi là link hợp lệ nếu bắt đầu bằng http/https — chặn kiểu "javascript:..." (có thể tự chạy mã khi bấm "Mở link").
    const safeLink = (ct.link && /^https?:\/\//i.test(ct.link.trim())) ? ct.link.trim() : '';
    return `
    <div class="contract-row ${status==='superseded'?'is-superseded':''}" data-cid="${ct.id}">
      <div class="contract-main">
        <div class="c-title">${escHtml(ct.ten||'(chưa đặt tên)')} <span class="tag ${meta.cls==='st-active'?'gold':''}">${meta.label}</span></div>
        <div class="c-meta">${ct.soHopDong?'Số: '+escHtml(ct.soHopDong)+' · ':''}${range}</div>
        <div class="c-meta">Đơn vị: ${escHtml(contractUnitsLabel(ct))}</div>
        ${ct.ghiChu?`<div class="c-note">${escHtml(ct.ghiChu)}</div>`:''}
      </div>
      <div class="contract-actions">
        ${safeLink ? `<a class="contract-link" href="${escAttr(safeLink)}" target="_blank" rel="noopener">Mở link</a>` : (ct.link ? `<span class="contract-link disabled" title="Link phải bắt đầu bằng http:// hoặc https://">Link không hợp lệ</span>` : `<span class="contract-link disabled">Chưa có link</span>`)}
        ${editable ? `
          ${status==='active' ? `<button class="btn btn-ghost btn-sm" data-mark-superseded="${ct.id}">Đánh dấu đã thay thế</button>` : ''}
          <button class="btn btn-danger-ghost btn-sm" data-del-contract="${ct.id}">Xoá</button>
        ` : ''}
      </div>
    </div>`;
  }).join('');
}
function openContractsModal(obj, list, entityLabel, editable, unitFilter){
  unitFilter = unitFilter || '';
  const hasUnits = state.units && state.units.length>0;
  const filterHtml = hasUnits ? `
    <div class="field" style="max-width:260px; margin-bottom:14px;">
      <label>Lọc theo đơn vị</label>
      <select id="ctUnitFilter">
        <option value="">— Tất cả đơn vị —</option>
        ${state.units.map(u=>`<option value="${escAttr(u)}" ${unitFilter===u?'selected':''}>${escAttr(u)}</option>`).join('')}
      </select>
    </div>` : '';

  const hasActive = contractList(obj, entityLabel).some(ct=>contractStatus(ct)==='active');
  const unitChecklistHtml = hasUnits ? `
      <div class="field" style="grid-column:1/-1;">
        <label>Đơn vị áp dụng</label>

            </label>`).join('')}
        </div>
      </div>` : '';

  const formHtml = editable ? `
    <div class="contract-form-title">+ Thêm hợp đồng/phụ lục mới</div>
    <div class="form-grid" id="contractForm">
      <div class="field"><label>Tên hợp đồng</label><input id="ct_ten" placeholder="HĐ nguyên tắc 2026..."></div>
      <div class="field"><label>Số hợp đồng</label><input id="ct_so" placeholder="Không bắt buộc"></div>
      <div class="field"><label>Ngày ký</label><input id="ct_ngayky" type="date"></div>
      <div class="field"><label>Ngày hiệu lực</label><input id="ct_hieuluc" type="date"></div>
      <div class="field"><label>Ngày hết hạn</label><input id="ct_hethan" type="date"></div>
      <div class="field" style="grid-column:1/-1">
        <label>Link (Drive...)</label>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <input id="ct_link" placeholder="Dán link tài liệu, hoặc bấm nút bên cạnh để tự chụp/tải lên" style="flex:1;min-width:220px">
          <label class="btn btn-ghost" style="cursor:pointer;white-space:nowrap;margin:0">📷 Chụp ảnh<input id="ct_upload_cam" type="file" accept="image/*" capture="environment" style="display:none"></label>
          <label class="btn btn-ghost" style="cursor:pointer;white-space:nowrap;margin:0">📁 Chọn file<input id="ct_upload_file" type="file" accept="image/*,application/pdf" style="display:none"></label>
        </div>
        <div class="helper" style="margin-top:2px">"Chụp ảnh" mở thẳng camera trên điện thoại (chỉ nhận ảnh) · "Chọn file" để lấy ảnh có sẵn hoặc PDF từ máy. Trên máy tính, cả 2 đều mở hộp chọn file như nhau (máy tính không có camera để chụp trực tiếp).</div>
        <div id="ct_upload_status" class="helper" style="margin-top:4px"></div>
      </div>
      <div class="field" style="grid-column:1/-1;"><label>Ghi chú</label><input id="ct_note" placeholder="Không bắt buộc"></div>
      ${unitChecklistHtml}
      ${hasActive ? `
      <div class="field" style="flex-direction:row; align-items:center; gap:8px;">
        <input id="ct_supersede" type="checkbox" style="width:auto;" checked>
        <label style="text-transform:none; font-size:12.5px;">Bản này thay thế hợp đồng đang hiệu lực (cùng đơn vị)</label>
      </div>` : ''}
      <button class="btn btn-primary" id="ctAddBtn">+ Thêm hợp đồng</button>
    </div>
  ` : '';

  openModal(`Hợp đồng · ${escHtml(obj.name)}`, `${escHtml(entityLabel)} — ${contractList(obj, entityLabel).length} bản trong lịch sử`,

        body.querySelectorAll('[data-del-contract]').forEach(b=>b.addEventListener('click', ()=>{
          confirmModal('Xoá bản hợp đồng này khỏi lịch sử?', ()=>{
            const store = CONTRACT_STORE_BY_LABEL[entityLabel];
            state[store.arr] = state[store.arr].filter(ct=>ct.id!==b.dataset.delContract);
            logActivity('delete', entityLabel+' · Hợp đồng', `${obj.name}: xoá 1 bản hợp đồng`);
            saveState(); renderAll(); openContractsModal(obj, list, entityLabel, editable, unitFilter);
          });

      };
      wireListButtons();

        );
        wireDriveUploadButton(
          body.querySelector('#ct_upload_file'), body.querySelector('#ct_upload_status'),
          entityLabel+' · '+obj.name,
          (url)=>{ document.getElementById('ct_link').value = url; }

          const supersedeChk = document.getElementById('ct_supersede');
          const doSupersede = supersedeChk && supersedeChk.checked;
          const chosenUnits = allUnitsChk && !allUnitsChk.checked
            ? Array.from(body.querySelectorAll('.ct-unit-chk:checked')).map(c=>c.value)
            : [];
          const newCt = {
            id: uid('ctr'), ten,
            soHopDong: document.getElementById('ct_so').value.trim(),
            ngayKy: document.getElementById('ct_ngayky').value,
            ngayHieuLuc: document.getElementById('ct_hieuluc').value,
            ngayHetHan: document.getElementById('ct_hethan').value,
            link: document.getElementById('ct_link').value.trim(),
            ghiChu: document.getElementById('ct_note').value.trim(),
            units: chosenUnits,
            supersededBy: null,
            createdAt: new Date().toISOString(),
            createdBy: currentUser() ? currentUser().name : '(không rõ)',
          };
          const store = CONTRACT_STORE_BY_LABEL[entityLabel];
          newCt[store.idField] = obj.id;
          if(doSupersede){
            contractList(obj, entityLabel).filter(ct=>contractStatus(ct)==='active' && contractUnitsOverlap(ct,newCt)).forEach(ct=>{ ct.supersededBy = newCt.id; });
          }
          state[store.arr].push(newCt);
          logActivity('create', entityLabel+' · Hợp đồng', `${obj.name}: thêm "${ten}"${doSupersede?' (thay thế bản cũ cùng đơn vị)':''}`);
          toast('Đã thêm hợp đồng: '+ten);
          saveState(); renderAll(); openContractsModal(obj, list, entityLabel, editable, unitFilter);
        });
      }
    });
}
function markContractSuperseded(obj, ctId, entityLabel, unitFilter){
  const ct = contractList(obj, entityLabel).find(x=>x.id===ctId);
  if(!ct) return;
  ct.supersededBy = 'manual';
  logActivity('update', entityLabel+' · Hợp đồng', `${obj.name}: đánh dấu 1 bản hợp đồng đã thay thế`);
  saveState(); renderAll(); openContractsModal(obj, contractList(obj, entityLabel), entityLabel, true, unitFilter);
}

/* ---------------------------- Yêu cầu / Trao đổi với Đối tác ----------------------------
   Dùng chung cho cả 3 khối (NCC/Ngân hàng/Bảo hiểm) — MỖI YÊU CẦU LÀ 1 BẢN GHI ĐỘC LẬP trong
   state.requests/bankRequests/insRequests (không lồng trong object NCC/NH/BH — cùng lý do với Hợp đồng ở
   trên, xem migrateContractsRequestsToRecordsV1), tự mang supplierId/bankId/insurerId:
   {id, supplierId|bankId|insurerId, status, createdAt, updatedAt, messages:[{id,text,authorName,authorRole,at}]}.
   Đối tác chỉ thấy/viết được vào đúng "obj" của mình (qua scopedObjsFor/partnerScopeFilter đã có sẵn cho
   Hợp đồng/Doanh số). Nội bộ (Admin/Quản lý/Nhân viên có quyền module) thấy & trả lời được mọi yêu cầu
   trong module đó; chỉ Admin/Quản lý đổi được trạng thái. */
const REQUEST_STATUSES = [
  {id:'moi', label:'Mới', cls:'pending'},
  {id:'dang_xu_ly', label:'Đang xử lý', cls:'muted'},
  {id:'da_xu_ly', label:'Đã xử lý', cls:'ok'},
];
const REQUEST_STORE_BY_MODULE = {
  ncc: {arr:'requests', idField:'supplierId'},
  nh: {arr:'bankRequests', idField:'bankId'},
  bh: {arr:'insRequests', idField:'insurerId'},
};
// Bộ lọc "Yêu cầu / Trao đổi" — cấp MODULE (không phải cục bộ trong hàm render) để giữ nguyên lựa chọn khi
// rời tab này rồi quay lại, giống các bộ lọc khác trong app (txUnitFilter, insTxUnitFilter...). Tách riêng
// theo từng module (ncc/nh/bh) vì 1 hàm render dùng chung cho cả 3 nhưng bộ lọc của module này không nên
// lẫn sang module khác (VD lọc theo tên 1 NCC không nên áp dụng nhầm khi xem tab Ngân hàng).
let reqFilterState = {
  ncc: {obj:'', status:''},
  nh: {obj:'', status:''},
  bh: {obj:'', status:''},
};
function requestStatusMeta(id){ return REQUEST_STATUSES.find(s=>s.id===id) || REQUEST_STATUSES[0]; }
function requestList(obj, moduleId){
  const store = REQUEST_STORE_BY_MODULE[moduleId];
  return (store && obj) ? state[store.arr].filter(r=>r[store.idField]===obj.id) : [];
}
function requestOpenCount(objs, moduleId){ return objs.reduce((sum,o)=> sum + requestList(o, moduleId).filter(r=>r.status!=='da_xu_ly').length, 0); }
function requestBadgeHTML(objs, moduleId){
  const n = requestOpenCount(objs, moduleId);
  return n>0 ? `<span class="alert-dot" title="${n} yêu cầu chưa xử lý xong">${n}</span>` : '';
}
// Gửi email báo "có tin nhắn mới" cho phía CÒN LẠI (Đối tác viết -> báo nội bộ phụ trách module đó; nội bộ
// viết -> báo đúng tài khoản Đối tác của obj này, nếu có email). Cố tình không await/throw ở nơi gọi — lỗi
// gửi email (chưa cấu hình script, mất mạng...) không được phép chặn việc gửi yêu cầu/trả lời chính.
// authorName/messageText: đính kèm luôn nội dung vừa gõ vào email — để người nhận đọc được ngay trong hộp
// thư, không phải mở app mới biết nội dung là gì.
function notifyAboutRequestMessage(obj, cfg, authorIsPartner, authorName, messageText){
  if(!driveUploadConfigured()) return;
  let toEmails = [];
  if(authorIsPartner){
    toEmails = state.accounts.filter(a=> ['Admin','Quản lý'].includes(a.role) && hasModuleAccess(cfg.moduleId, a) && a.email && a.email.trim()).map(a=>a.email.trim());
  } else {
    const partnerAcc = state.accounts.find(a=> a.role==='Đối tác' && a.partnerType===cfg.moduleId && a.partnerId===obj.id);
    if(partnerAcc && partnerAcc.email && partnerAcc.email.trim()) toEmails = [partnerAcc.email.trim()];
  }
  if(toEmails.length===0) return;
  const subject = `[QT NCC] Tin nhắn mới từ ${authorName||'(không rõ)'} — ${cfg.nameOf(obj)}`;
  const body = `${authorName||'(không rõ)'} vừa gửi 1 tin nhắn trong mục "Yêu cầu / Trao đổi" liên quan tới ${cfg.nameOf(obj)}:\n\n"${messageText||''}"\n\nVui lòng đăng nhập vào hệ thống để xem toàn bộ hội thoại và phản hồi.`;
  sendEmailNotification(toEmails, subject, body).catch(err=> console.warn('Gửi email thông báo thất bại (bỏ qua, không ảnh hưởng thao tác chính):', err));
}
// Có tin nhắn nào MỚI HƠN lần mình xem gần nhất không, và tin cuối đó không phải do chính mình gửi (tin của
// chính mình thì hiển nhiên đã biết nội dung, không tính là "chưa đọc"). req.lastSeenBy: {accountId: ISOString}.
function threadHasUnread(req){
  if(!currentUserId) return false;
  const last = req.messages[req.messages.length-1];
  if(!last || last.authorId===currentUserId) return false;
  const seenAt = (req.lastSeenBy && req.lastSeenBy[currentUserId]) || '';
  return last.at > seenAt;
}
// Modal xem/trả lời 1 thread — mở lại chính nó sau khi gửi trả lời để thấy tin nhắn mới ngay, giống cách
// modal Hợp đồng tự mở lại sau khi thêm bản mới.
function openRequestThreadModal(req, obj, cfg){
  const role = currentRole();
  const canManage = ['Admin','Quản lý'].includes(role);
  const canWrite = isPartnerAccount(currentUser()) || ['Admin','Quản lý','Nhân viên'].includes(role);
  // Đánh dấu "đã xem" ngay khi mở — chỉ ghi lại (saveState) nếu trước đó THẬT SỰ đang có tin chưa đọc, tránh
  // ghi dữ liệu vô ích mỗi lần mở lại 1 thread đã đọc từ trước.
  if(currentUserId){
    const wasUnread = threadHasUnread(req);
    if(!req.lastSeenBy) req.lastSeenBy = {};
    req.lastSeenBy[currentUserId] = new Date().toISOString();
    if(wasUnread) saveState();
  }
  const msgsHTML = req.messages.map(m=>{
    const mine = m.authorRole==='Đối tác';
    return `<div style="padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;${mine?'background:var(--gold-soft)':''}">
      <div style="font-size:11.5px;color:var(--slate);margin-bottom:4px"><b>${escHtml(m.authorName||'(không rõ)')}</b> · ${escHtml(m.authorRole||'')} · ${new Date(m.at).toLocaleString('vi-VN')}</div>
      <div style="white-space:pre-wrap;font-size:13px">${escHtml(m.text)}</div>
    </div>`;
  }).join('');
  openModal(`Yêu cầu · ${escHtml(cfg.nameOf(obj))}`,
    `Trạng thái hiện tại: <b>${requestStatusMeta(req.status).label}</b> · ${req.messages.length} tin nhắn`,
    `<div style="max-height:340px;overflow:auto;margin-bottom:12px">${msgsHTML}</div>
     ${canManage ? `<div class="field" style="margin-bottom:10px"><label>Trạng thái</label>
       <select id="reqStatusSel">${REQUEST_STATUSES.map(s=>`<option value="${s.id}" ${req.status===s.id?'selected':''}>${s.label}</option>`).join('')}</select>
     </div>` : ''}
     ${canWrite ? `<div class="field"><label>Trả lời</label><textarea id="reqReplyText" style="width:100%;min-height:70px;font-family:inherit;font-size:13px;padding:10px;border:1px solid var(--line);border-radius:8px"></textarea></div>
       <button class="btn btn-primary" id="reqReplyBtn" style="margin-top:10px">Gửi trả lời</button>` : ''}`,
    (body)=>{
      if(canManage){
        body.querySelector('#reqStatusSel').addEventListener('change', e=>{
          req.status = e.target.value; req.updatedAt = new Date().toISOString();
          logActivity('update', cfg.entityLabel, `${cfg.nameOf(obj)}: đổi trạng thái yêu cầu → ${requestStatusMeta(req.status).label}`);
          saveState(); renderAll();
        });
      }
      if(canWrite){
        const replyBtn = body.querySelector('#reqReplyBtn');
        replyBtn.addEventListener('click', ()=>{
          if(replyBtn.disabled) return; // chặn bấm nhiều lần liên tiếp tạo trùng tin nhắn
          const text = body.querySelector('#reqReplyText').value.trim();
          if(!text){ toast('Nhập nội dung trả lời trước'); return; }
          replyBtn.disabled = true; replyBtn.textContent = 'Đang gửi...';
          const u = currentUser();
          const now = new Date().toISOString();
          req.messages.push({ id: uid('msg'), text, authorName: u?u.name:'(không rõ)', authorRole: role, authorId: currentUserId, at: now });
          req.updatedAt = now;
          if(req.status==='moi' && !isPartnerAccount(u)) req.status = 'dang_xu_ly'; // nội bộ vừa trả lời -> tự chuyển khỏi "Mới"
          logActivity('update', cfg.entityLabel, `${cfg.nameOf(obj)}: có tin nhắn mới trong 1 yêu cầu`);
          saveState(); renderAll();
          notifyAboutRequestMessage(obj, cfg, isPartnerAccount(u), u?u.name:'(không rõ)', text);
          openRequestThreadModal(req, obj, cfg); // mở lại để thấy ngay tin nhắn vừa gửi (nút ở modal mới đã tự về trạng thái bình thường)
        });
      }
    });
}
// Cuộn tới đúng 1 thread trong danh sách "Yêu cầu / Trao đổi" + chớp sáng 1 nhịp để dễ nhận ra — dùng
// requestAnimationFrame để chắc chắn DOM đã vẽ xong (renderAll() tuy chạy đồng bộ nhưng để trình duyệt kịp
// tính toán layout trước khi scrollIntoView, tránh cuộn sai vị trí ở 1 số trường hợp hiếm).
function scrollToAndFlashRequest(reqId){
  requestAnimationFrame(()=>{
    const el = document.querySelector(`[data-open-req="${reqId}"]`);
    if(!el) return;
    el.scrollIntoView({behavior:'smooth', block:'center'});
    el.classList.add('flash-highlight');
    setTimeout(()=> el.classList.remove('flash-highlight'), 1800);
  });
}
// Trang "Yêu cầu / Trao đổi" dùng chung cho cả 3 module — cfg: {objs, idKey, nameOf, entityLabel, entityShort}.
function renderRequestsTab(c, cfg){
  const u = currentUser();
  const role = currentRole();
  const partner = isPartnerAccount(u);
  const scopedObjs = scopedObjsFor(cfg.idKey, cfg.objs);
  let allThreads = [];
  scopedObjs.forEach(o=> requestList(o, cfg.moduleId).forEach(r=> allThreads.push({req:r, obj:o})));
  // Nhóm "còn mở" (Mới/Đang xử lý) LÊN TRÊN, cũ nhất lên đầu (giống hàng chờ — việc tồn đọng lâu nhất phải
  // thấy trước, không bị đội mất công thao tác nhỡ tay đè lên). Nhóm "Đã xử lý" xuống dưới cùng, mới nhất lên
  // trước, chỉ để tra cứu lại — không cần ai để ý ưu tiên trong nhóm này.
  allThreads.sort((a,b)=>{
    const ra = a.req.status==='da_xu_ly' ? 1 : 0, rb = b.req.status==='da_xu_ly' ? 1 : 0;
    if(ra!==rb) return ra-rb;
    return ra===0 ? (a.req.createdAt||'').localeCompare(b.req.createdAt||'') : (b.req.updatedAt||'').localeCompare(a.req.updatedAt||'');
  });
  const openCount = allThreads.filter(t=>t.req.status!=='da_xu_ly').length;
  setTitle('Yêu cầu / Trao đổi', allThreads.length+' yêu cầu — '+openCount+' chưa xử lý xong');

  if(partner && scopedObjs.length===0){
    c.innerHTML = lockedNote('Tài khoản của bạn chưa được gán đúng '+cfg.entityShort+' — liên hệ Admin để cấu hình lại.');
    return;
  }
  const eligibleInternalEmails = state.accounts.filter(a=> ['Admin','Quản lý'].includes(a.role) && hasModuleAccess(cfg.moduleId, a) && a.email && a.email.trim());
  const noEmailWarning = (!partner && eligibleInternalEmails.length===0)
    ? `<div class="helper" style="color:var(--rust);margin-bottom:10px">⚠ Chưa có Admin/Quản lý nào của module này điền Email ở "Quản trị tài khoản" — Đối tác gửi yêu cầu sẽ KHÔNG có ai nhận được thông báo qua email (vẫn thấy được trong app như bình thường).</div>`
    : '';

  const rf = reqFilterState[cfg.moduleId]; // giữ nguyên lựa chọn lọc khi rời tab này rồi quay lại
  const hintText = partner
    ? 'Đây là nơi bạn gửi thắc mắc/đề nghị cho chúng tôi — chúng tôi sẽ trả lời trực tiếp tại đây, bạn sẽ nhận được email báo khi có phản hồi mới.'
    : 'Đối tác có thể gửi thắc mắc/đề nghị ở đây. Bạn cũng chủ động viết trước cho họ được — chọn đúng '+cfg.entityShort+' rồi gửi như bình thường.';

  c.innerHTML = `
    ${hintBannerHTML('req_intro_'+cfg.moduleId, hintText)}
    ${noEmailWarning}
    <div class="panel">
      <div class="panel-head"><div><h2>Gửi yêu cầu mới</h2>
      <div class="desc">${partner ? 'Viết nội dung bạn cần đề nghị/thắc mắc — nội bộ sẽ nhận được và phản hồi ngay tại đây.' : 'Chọn đúng '+cfg.entityShort+' liên quan — nội dung sẽ hiện cho Đối tác đó xem và trả lời.'}</div></div></div>
      <div class="panel-body">
        <div class="form-grid">
          ${partner ? '' : `<div class="field" style="grid-column:1/-1"><label>${cfg.entityLabel}</label><select id="reqf_obj">${scopedObjs.map(o=>`<option value="${o.id}">${escHtml(cfg.nameOf(o))}</option>`).join('')}</select></div>`}
          <div class="field" style="grid-column:1/-1"><label>Nội dung</label><textarea id="reqf_text" placeholder="Nội dung đề nghị/thắc mắc..." style="width:100%;min-height:80px;font-family:inherit;font-size:13px;padding:10px;border:1px solid var(--line);border-radius:8px"></textarea></div>
          <button class="btn btn-primary" id="reqSendBtn">Gửi yêu cầu</button>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <div><h2>Danh sách yêu cầu</h2></div>
        ${partner ? '' : `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <input id="reqf_filter_obj" list="reqf_filter_obj_list" placeholder="Lọc theo ${cfg.entityShort}..." value="${escAttr(rf.obj)}" style="max-width:200px">
          <datalist id="reqf_filter_obj_list">${scopedObjs.map(o=>`<option value="${escAttr(cfg.nameOf(o))}">`).join('')}</datalist>
          <select id="reqf_filter_status" style="max-width:150px">
            <option value="">Tất cả trạng thái</option>
            ${REQUEST_STATUSES.map(s=>`<option value="${s.id}" ${rf.status===s.id?'selected':''}>${s.label}</option>`).join('')}
          </select>
        </div>`}
      </div>
      <div class="panel-body flush" id="reqListBox"></div>
    </div>
  `;
  wireHintDismiss(c);
  const sendBtn = document.getElementById('reqSendBtn');
  sendBtn.addEventListener('click', ()=>{
    if(sendBtn.disabled) return; // chặn bấm nhiều lần liên tiếp tạo trùng yêu cầu
    const text = document.getElementById('reqf_text').value.trim();
    if(!text){ toast('Nhập nội dung trước'); return; }
    const obj = partner ? scopedObjs[0] : scopedObjs.find(o=>o.id===document.getElementById('reqf_obj').value);
    if(!obj){ toast('Chưa chọn được '+cfg.entityShort); return; }
    sendBtn.disabled = true; sendBtn.textContent = 'Đang gửi...';
    const now = new Date().toISOString();
    const store = REQUEST_STORE_BY_MODULE[cfg.moduleId];
    const newReq = { id: uid('req'), status: 'moi', createdAt: now, updatedAt: now,
      messages: [{ id: uid('msg'), text, authorName: u?u.name:'(không rõ)', authorRole: role, authorId: currentUserId, at: now }] };
    newReq[store.idField] = obj.id;
    state[store.arr].push(newReq);
    logActivity('create', cfg.entityLabel, `${cfg.nameOf(obj)}: yêu cầu mới từ ${u?u.name:''}`);
    toast('Đã gửi yêu cầu');
    saveState(); renderAll(); // renderAll() vẽ lại toàn trang -> nút mới tự về trạng thái bình thường, không cần tự bật lại disabled=false
    notifyAboutRequestMessage(obj, cfg, partner, u?u.name:'(không rõ)', text);
    scrollToAndFlashRequest(newReq.id); // vì danh sách sắp "còn mở: cũ nhất lên đầu", yêu cầu vừa tạo (mới nhất) có thể nằm khá xa đầu trang — cuộn tới cho người dùng thấy ngay, khỏi tự dò
  });
  if(!partner){
    document.getElementById('reqf_filter_obj').addEventListener('input', e=>{ rf.obj = e.target.value; drawReqList(); });
    document.getElementById('reqf_filter_status').addEventListener('change', e=>{ rf.status = e.target.value; drawReqList(); });
  }
  drawReqList();

  function drawReqList(){
    const listBox = document.getElementById('reqListBox');
    const visible = allThreads.filter(({req,obj})=>{
      if(rf.obj && cfg.nameOf(obj).trim().toLowerCase()!==rf.obj.trim().toLowerCase()) return false;
      if(rf.status && req.status!==rf.status) return false;
      return true;
    });
    if(allThreads.length===0){
      listBox.innerHTML = `<div class="empty"><div class="big">Chưa có yêu cầu nào</div></div>`;
      return;
    }
    if(visible.length===0){
      listBox.innerHTML = `<div class="empty"><div class="big">Không có yêu cầu nào khớp bộ lọc</div></div>`;
      return;
    }
    listBox.innerHTML = visible.map(({req,obj})=>{
      const last = req.messages[req.messages.length-1];
      const meta = requestStatusMeta(req.status);
      const snippet = last ? (last.text.length>140 ? last.text.slice(0,140)+'...' : last.text) : '';
      const unread = threadHasUnread(req);
      return `<div data-open-req="${req.id}" data-obj="${obj.id}" style="padding:14px 20px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:14px;align-items:center;${unread?'background:var(--gold-soft)':''}">
        <div style="min-width:0">
          <div style="font-weight:${unread?800:600}">${unread?'<span style="color:var(--rust)">●</span> ':''}${escHtml(cfg.nameOf(obj))}</div>
          <div class="meta-line" style="white-space:pre-wrap">${escHtml(snippet)}</div>
          <div class="meta-line">${req.messages.length} tin nhắn · Cập nhật ${new Date(req.updatedAt).toLocaleString('vi-VN')}</div>
        </div>
        <span class="stamp ${meta.cls}" style="flex:0 0 auto">${meta.label}</span>
      </div>`;
    }).join('');
    listBox.querySelectorAll('[data-open-req]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const obj = scopedObjs.find(o=>o.id===el.dataset.obj);
        const req = obj && requestList(obj, cfg.moduleId).find(r=>r.id===el.dataset.openReq);
        if(obj && req) openRequestThreadModal(req, obj, cfg);
      });
    });
  }
}

/* ---------------------------- Phân bổ chỉ tiêu theo đơn vị (áp dụng cho MỌI loại mốc: CK theo doanh số / CK cố định / Thưởng thêm) ----------------------------
   p.unitTargets = {tên đơn vị: số tiền chỉ tiêu}. Đây là MỤC TIÊU cần đạt của từng đơn vị để cùng góp đủ vào
   p.threshold chung — khác với "Ma trận NCC × Đơn vị" (renderAllocation) vốn hiển thị doanh số THỰC TẾ đã phát sinh.
   Không bắt buộc tổng chỉ tiêu phải khớp tuyệt đối với mốc — chỉ cảnh báo để người dùng tự cân đối. */
function policyTargetSum(p){
  return Object.values(p.unitTargets||{}).reduce((a,b)=>a+(Number(b)||0), 0);
}
function policyTargetBadgeHTML(p){
  const units = state.units||[];
  if(units.length===0) return `<button class="contract-badge" data-open-targets="1">📊 Chưa có đơn vị</button>`;
  const sum = policyTargetSum(p);
  if(sum===0) return `<button class="contract-badge" data-open-targets="1">📊 Chưa phân bổ</button>`;
  const diff = (p.threshold||0) - sum;
  let cls = 'st-active';
  if(Math.abs(diff) > 0.5) cls = diff>0 ? 'st-expiring' : 'st-expired';
  return `<button class="contract-badge ${cls}" data-open-targets="1">📊 ${fmt(sum)}đ / ${fmt(p.threshold)}đ</button>`;
}
function wirePolicyTargetBadges(tbl, editable){
  tbl.querySelectorAll('[data-open-targets]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.closest('tr').dataset.rowid;
      const p = state.policies.find(x=>x.id===id);
      if(p) openPolicyTargetsModal(p, editable);
    });
  });
}
function openPolicyTargetsModal(p, editable){
  const units = state.units||[];
  const s = supplierById(p.supplierId);
  const targets = p.unitTargets || {};
  const bodyHtml = units.length===0 ? `
    <div class="empty" style="padding:20px 0;"><div class="big">Chưa có đơn vị nào</div>Thêm đơn vị ở tab Cài đặt trước khi phân bổ chỉ tiêu.</div>
  ` : `
    ${editable ? '' : lockedNote('Bạn đang xem ở chế độ chỉ đọc — không sửa được số phân bổ ở đây.')}
    <div class="contract-list" style="margin-bottom:14px;">
      ${units.map(u=>{
        const actual = allTimeRevenue(p.supplierId, u);
        const target = Number(targets[u])||0;
        const pct = target>0 ? Math.round(actual/target*100) : null;
        const pctColor = pct===null ? 'var(--slate)' : pct>=100 ? 'var(--forest)' : pct>=70 ? 'var(--amber)' : 'var(--rust)';
        return `
        <div class="contract-row" style="align-items:center;">
          <div class="contract-main" style="min-width:160px;">
            <div class="c-title" style="font-weight:600; font-size:13px;">${escAttr(u)}</div>
            <div class="c-meta">Thực tế: ${fmt(actual)}đ${pct!==null?` · <b style="color:${pctColor}">${pct}%</b>`:''}</div>
          </div>
          <div class="contract-actions" style="flex:1; justify-content:flex-end;">
            <input class="field-money" data-unit-target="${escAttr(u)}" type="text" inputmode="numeric"
              value="${formatMoneyValue(targets[u]||0)}" style="max-width:180px; text-align:right;" ${editable?'':'disabled'}>
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="helper" id="targetSummaryLine" style="font-size:12.8px;"></div>
    <div class="helper" id="targetActualLine" style="font-size:12.8px;"></div>
    ${editable ? `
    <div style="display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;">
      <button class="btn btn-ghost btn-sm" id="targetSplitEvenBtn">Chia đều cho ${units.length} đơn vị</button>
      <button class="btn btn-primary btn-sm" id="targetSaveBtn">Lưu phân bổ</button>
    </div>` : ''}
  `;
  openModal(`Phân bổ chỉ tiêu · ${escHtml(p.code||p.id)}`,
    `${s?escHtml(s.name):''} — Mốc ${fmt(p.threshold)}đ${p.type==='Thưởng thêm'?' (Thưởng thêm)':''}`,
    bodyHtml,
    (body)=>{
      if(units.length===0) return;
      const inputs = Array.from(body.querySelectorAll('[data-unit-target]'));
      inputs.forEach(el=>attachMoneyFormatting(el));
      const updateSummary = ()=>{
        const sum = inputs.reduce((a,el)=>a+parseMoneyInput(el.value), 0);
        const diff = (p.threshold||0) - sum;
        const line = document.getElementById('targetSummaryLine');
        if(line){
          if(Math.abs(diff)<=0.5) line.innerHTML = `Đã phân bổ đủ: <b>${fmt(sum)}đ</b> / ${fmt(p.threshold)}đ`;
          else if(diff>0) line.innerHTML = `Đã phân bổ <b>${fmt(sum)}đ</b> / ${fmt(p.threshold)}đ — còn thiếu <b style="color:var(--rust)">${fmt(diff)}đ</b> chưa phân bổ`;
          else line.innerHTML = `Đã phân bổ <b>${fmt(sum)}đ</b> / ${fmt(p.threshold)}đ — đang vượt mốc <b style="color:var(--amber)">${fmt(-diff)}đ</b>`;
        }
        const actualTotal = units.reduce((a,u)=>a+allTimeRevenue(p.supplierId,u), 0);
        const actualLine = document.getElementById('targetActualLine');
        if(actualLine){
          const overallPct = p.threshold>0 ? Math.round(actualTotal/p.threshold*100) : null;
          const pctColor = overallPct===null ? 'var(--slate)' : overallPct>=100 ? 'var(--forest)' : overallPct>=70 ? 'var(--amber)' : 'var(--rust)';
          actualLine.innerHTML = `Thực tế toàn bộ đơn vị đã đạt: <b>${fmt(actualTotal)}đ</b> / ${fmt(p.threshold)}đ${overallPct!==null?` (<b style="color:${pctColor}">${overallPct}%</b> mốc)`:''}`;
        }
      };
      inputs.forEach(el=>el.addEventListener('input', updateSummary));
      updateSummary();
      if(editable){
        const splitBtn = body.querySelector('#targetSplitEvenBtn');
        if(splitBtn) splitBtn.addEventListener('click', ()=>{
          const each = Math.round((p.threshold||0)/units.length);
          inputs.forEach(el=>{ el.value = formatMoneyValue(each); });
          updateSummary();
        });
        const saveBtn = body.querySelector('#targetSaveBtn');
        if(saveBtn) saveBtn.addEventListener('click', ()=>{
          const newTargets = {};
          inputs.forEach(el=>{ const v = parseMoneyInput(el.value); if(v>0) newTargets[el.dataset.unitTarget] = v; });
          p.unitTargets = newTargets;
          logActivity('update','Chính sách CK', `${s?s.name:''} · ${p.code||p.id}: cập nhật phân bổ chỉ tiêu theo đơn vị`);
          toast('Đã lưu phân bổ chỉ tiêu');
          saveState(); renderAll(); closeModal();
        });
      }
    });
}

/* ---------------------------- Nhóm áp dụng theo đơn vị (unitScope trên từng dòng chính sách) ----------------------------
   Áp dụng cho cả 3 loại dòng chính sách: "CK theo doanh số"/"CK cố định" (mốc cơ bản, dùng cơ chế NHÓM +
   phần-còn-lại ở supplierPolicyGroups để không cộng trùng doanh số) và "Thưởng thêm" (tính ĐỘC LẬP theo
   từng dòng ở policyPeriodRevenue, không cần cơ chế nhóm vì các dòng thưởng vốn không tạo thành 1 "đường
   cong" cần loại trừ lẫn nhau). Để trống (mặc định) = áp dụng CHUNG, tính trên tổng doanh số toàn NCC như
   trước giờ — chỉ khi thật sự cần 1 nhóm đơn vị có mốc/thưởng riêng mới cần gán. */
function unitScopeBadgeHTML(p){
  if(!(p.type==='CK theo doanh số'||p.type==='CK cố định'||p.type==='Thưởng thêm')) return '<span style="color:var(--slate)">—</span>';
  const scope = p.unitScope||[];
  if(scope.length===0) return `<button class="contract-badge" data-open-scope="1">🏷 Chung</button>`;
  return `<button class="contract-badge st-active" data-open-scope="1" title="${escAttr(scope.join(', '))}">🏷 ${scope.length===1?escHtml(scope[0]):scope.length+' đơn vị'}</button>`;
}
function wireUnitScopeBadges(tbl, editable){
  tbl.querySelectorAll('[data-open-scope]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.closest('tr').dataset.rowid;
      const p = state.policies.find(x=>x.id===id);
      if(p) openUnitScopeModal(p, editable);
    });
  });
}
function openUnitScopeModal(p, editable){
  const units = state.units||[];
  const s = supplierById(p.supplierId);
  const scope = p.unitScope||[];
  const isBonus = p.type==='Thưởng thêm';
  const helperText = isBonus
    ? 'Để trống (không tick gì) = dòng thưởng này áp dụng CHUNG, tính trên TỔNG doanh số toàn NCC (mặc định, giữ nguyên cách tính cũ). Tick đúng các đơn vị cần tính riêng — dòng "Thưởng thêm" tính ĐỘC LẬP theo từng dòng, không ảnh hưởng tới các dòng thưởng/mốc CK khác của cùng NCC.'
    : 'Để trống (không tick gì) = mốc này áp dụng CHUNG, tính trên TỔNG doanh số toàn NCC (mặc định, giữ nguyên cách tính cũ). Chỉ tick đúng các đơn vị cần tách riêng mốc — các mốc khác của cùng NCC chưa gán nhóm nào sẽ tự gộp thành 1 nhóm "còn lại", tính trên đúng phần đơn vị chưa bị nhóm nào khác nhận (không cộng trùng doanh số).';
  const bodyHtml = units.length===0 ? `
    <div class="empty" style="padding:20px 0;"><div class="big">Chưa có đơn vị nào</div>Thêm đơn vị ở tab Cài đặt trước khi gán nhóm.</div>
  ` : `
    ${editable ? '' : lockedNote('Bạn đang xem ở chế độ chỉ đọc — không tick/sửa được nhóm áp dụng ở đây.')}
    <div class="helper" style="margin-bottom:12px">${helperText}</div>
    <div style="display:flex; flex-wrap:wrap; gap:8px 14px; padding:10px; border:1px solid var(--line); border-radius:7px; ${editable?'':'opacity:0.6'}">
      ${units.map(u=>`
        <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:400; cursor:${editable?'pointer':'not-allowed'};">
          <input type="checkbox" class="scope-unit-chk" value="${escAttr(u)}" style="width:auto;" ${scope.includes(u)?'checked':''} ${editable?'':'disabled'}>${escAttr(u)}
        </label>`).join('')}
    </div>
  `;
  openModal(`Nhóm áp dụng ${isBonus?'thưởng':'mốc CK'} · ${escHtml(p.code||p.id)}`,
    `${s?escHtml(s.name):''} — ${isBonus?`Mốc thưởng ${fmt(p.threshold)}đ, Thưởng ${fmtPct(p.bonusRate)}`:`Mốc ${fmt(p.threshold)}đ, CK ${fmtPct(p.rate)}`}`,
    bodyHtml + (editable&&units.length>0 ? `<button class="btn btn-primary btn-sm" id="scopeSaveBtn" style="margin-top:14px">Lưu nhóm áp dụng</button>` : ''),
    (body)=>{
      if(!editable) return;
      const saveBtn = body.querySelector('#scopeSaveBtn');
      if(saveBtn) saveBtn.addEventListener('click', ()=>{
        const chosen = Array.from(body.querySelectorAll('.scope-unit-chk:checked')).map(el=>el.value);
        p.unitScope = chosen;
        logActivity('update','Chính sách CK', `${s?s.name:''} · ${p.code||p.id}: đổi nhóm áp dụng → ${chosen.length?chosen.join(', '):'Chung'}`);
        const warns = isBonus ? [] : tierConflicts(p.supplierId); // Thưởng thêm tính độc lập, không tham gia kiểm tra xung đột đường cong mốc
        toast(warns.length>0 ? `Đã lưu — phát hiện ${warns.length} xung đột mốc, xem cảnh báo ở đầu trang` : 'Đã lưu nhóm áp dụng');
        saveState(); renderAll(); closeModal();
      });
    });
}

    // lại đầy đủ như trước (qua combinedActivityLog()/combinedTrash()); tài khoản chỉ được cấp 1-2 module
    // sẽ không còn tải về phần dữ liệu module khác nữa (tránh rò rỉ tên NCC/khách hàng/số tiền module khác

    activityLogNcc: [], activityLogNh: [], activityLogBh: [], activityLogShared: [],

    banks, bankPolicies, bankTransactions: [], bankReconciliations: [],

    bankYearlyTargets: [], // tương đương yearlyTargets ở trên, dành cho Ngân hàng
    nextBankNo: banks.length+1,

    insRenewalAutoSnoozeDays: 15, // quá hạn quá số ngày này mà chưa tái tục -> tự dời mốc sang đúng 1 năm sau, không cần Admin tự tay Tạm ẩn — chỉ Admin sửa được
    insAllocMonthLocks: {}, // {'YYYY-MM': {locked, lockedBy, lockedAt}} — Admin "chốt" tỷ lệ phân bổ theo tháng, xem isInsAllocMonthLocked()
    nextInsNo: insurers.length+1,
    driveUploadUrl: '', // URL Web App của Google Apps Script dùng để upload ảnh/PDF hợp đồng lên Drive — chỉ Admin sửa (Cài đặt)
    driveUploadSecret: '', // mã bí mật gửi kèm mỗi lần upload để tránh người ngoài spam vào cổng upload này
    emailNotifyEnabled: true, // chỉ để HIỂN THỊ trạng thái trong app — công tắc THẬT SỰ nằm ở Apps Script (PropertiesService), xem handleSetEmailEnabled
    editPerms: JSON.parse(JSON.stringify(DEFAULT_EDIT_PERMS)), // Admin tự cấu hình được qua "Quản trị tài khoản" — xem canEdit()
  };
}
