<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản trị mục tiêu Đối tác/NCC · Doanh số &amp; Chiết khấu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12172B;
    --ink-soft:#1E2540;
    --paper:#F6F4EF;
    --panel:#FFFFFF;
    --line:#E4DFD3;
    --gold:#B8863B;
    --gold-soft:#EFE2C6;
    --slate:#5B6472;
    --forest:#2F6B4F;
    --forest-soft:#E3EEE7;
    --rust:#B54834;
    --rust-soft:#F5E4DF;
    --amber:#9C6B12;
    /* Font chính: Inter (tải qua Google Fonts) — hỗ trợ đầy đủ dấu tiếng Việt (kể cả dấu đôi: ố, ệ, ẫ...),
       trông hiện đại/chuyên nghiệp hơn font hệ thống mặc định, phổ biến trong các app quản trị/SaaS hiện nay.
       Vẫn giữ chuỗi fallback hệ thống phía sau để app không "trắng trang" nếu mất mạng/chặn Google Fonts. */
    --font-display: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    /* Số liệu (tiền, %, KPI): dùng Inter + tabular-nums để chữ số đều hàng thẳng cột như số đếm,
       nhưng vẫn đồng bộ kiểu chữ với toàn app — thay vì để font monospace tách biệt kiểu "code". */
    --font-tabular: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    /* Chỉ dùng cho khối nhập mã/JSON (VD cấu hình Firebase) — nơi cần font monospace thật sự */
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }

  ::selection{ background:var(--gold-soft); }

  /* ---------- Layout shell ---------- */
  .shell{ display:flex; min-height:100vh; }

  .sidebar{
    width:248px; flex:0 0 248px;
    background:var(--ink);
    color:#E8E6DE;
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{
    padding:26px 22px 18px;
    border-bottom:1px solid rgba(255,255,255,0.08);
    text-align:center;
  }
  .brand .mark{
    font-family:var(--font-display);
    line-height:1.3;
    color:#F3ECD9;
  }
  .brand .mark .l1{
    display:block; font-weight:700; font-size:22px; letter-spacing:0.04em; text-transform:uppercase;
  }
  .brand .mark .l2{
    display:block; font-weight:500; font-size:16px; letter-spacing:0.01em; color:#C9CADA; margin-top:3px;
  }
  .brand .sub{
    font-size:11px; letter-spacing:0.09em; text-transform:uppercase;
    color:#9098B0; margin-top:8px;
  }

  .nav{ padding:14px 10px; flex:1; overflow-y:auto; }
  .nav-group{ margin-bottom:2px; }
  .nav-group-items{
    margin-left:15px; padding-left:9px;
    border-left:1px solid rgba(255,255,255,0.08);
  }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 12px; border-radius:8px;
    color:#C7CBDB; cursor:pointer; margin-bottom:2px;
    font-size:13.5px; letter-spacing:0.01em;
    border:1px solid transparent;
    transition:background .12s ease, color .12s ease;
  }
  .nav-item:hover{ background:var(--ink-soft); color:#F3ECD9; }
  .nav-item.active{
    background:var(--ink-soft); color:#F3ECD9;
    border-color:rgba(184,134,59,0.45);
  }
  .nav-item .dot{
    width:6px;height:6px;border-radius:50%;
    background:#57607E; flex:0 0 auto;
  }
  .nav-item.active .dot{ background:var(--gold); }
  .nav-item.long{
    font-size:11.5px; letter-spacing:-0.005em; padding-left:10px; padding-right:8px;
  }
  .nav-item .label-text{ min-width:0; }
  .nav-item.long .label-text{
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .alert-dot{
    margin-left:auto; flex:0 0 auto;
    background:var(--rust); color:#fff; font-size:10px; font-weight:700;
    min-width:16px; height:16px; border-radius:9px;
    display:inline-flex; align-items:center; justify-content:center; padding:0 4px;
  }
  .subtab-item .alert-dot{ margin-left:6px; }
  .nav-section{
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; font-weight:700;
    color:#9BA3C4; margin:4px 2px 8px; padding:14px 10px 10px;
    display:flex; align-items:center; gap:8px;
    cursor:pointer; border-radius:8px; user-select:none;
    border-top:1px solid rgba(255,255,255,0.1);
    transition:color .15s ease, background .15s ease;
    white-space:nowrap;
  }
  .nav-section .nav-section-label{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .nav-group:first-child .nav-section{ border-top:none; padding-top:2px; margin-top:0; }
  .nav-section:hover{ color:#F3ECD9; background:rgba(255,255,255,0.04); }
  .nav-section .nav-section-caret{
    font-size:9px; line-height:1; color:#8891B0;
    width:18px; height:18px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    border-radius:5px; background:rgba(255,255,255,0.07);
    transition:transform .18s ease, background .15s ease, color .15s ease;
  }
  .nav-section:hover .nav-section-caret{ background:rgba(255,255,255,0.14); color:#F3ECD9; }
  .nav-section.collapsed .nav-section-caret{ transform:rotate(-90deg); }
  .soon-tag{
    margin-left:auto; font-size:9.5px; letter-spacing:0.04em; text-transform:uppercase;
    color:#C9AA6A; background:rgba(201,170,106,0.14); border:1px solid rgba(201,170,106,0.28);
    padding:1px 6px; border-radius:5px;
  }

  .footer-note{
    padding:14px 20px 20px; font-size:11px; color:#6C7592; line-height:1.5;
    border-top:1px solid rgba(255,255,255,0.08);
  }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }

  .topbar{
    background:var(--panel); border-bottom:1px solid var(--line);
    padding:16px 32px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:5;
  }
  .topbar h1{
    font-family:var(--font-display); font-weight:600; font-size:21px; margin:0;
    letter-spacing:0.01em;
  }
  .topbar .meta{ font-size:12px; color:var(--slate); margin-top:2px; }
  .subtabs{
    display:flex; gap:6px; padding:14px 32px 0; background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .subtab-item{
    padding:9px 16px; font-size:13.5px; font-weight:600; color:var(--slate);
    cursor:pointer; border-radius:8px 8px 0 0; border:1px solid transparent; border-bottom:none;
    margin-bottom:-1px; transition:background .12s ease, color .12s ease;
  }
  .subtab-item:hover{ color:var(--ink); background:rgba(0,0,0,0.03); }
  .subtab-item.active{
    color:var(--ink); background:var(--paper); border-color:var(--line);
  }
  @media (max-width:720px){ .subtabs{ padding:12px 16px 0; } }
  .topbar-right{ display:flex; align-items:center; gap:14px; }
  .storage-pill{
    font-size:11px; padding:5px 10px; border-radius:999px;
    background:var(--forest-soft); color:var(--forest); border:1px solid rgba(47,107,79,0.25);
    display:flex; align-items:center; gap:6px;
  }
  .storage-pill.offline{ background:var(--rust-soft); color:var(--rust); border-color:rgba(181,72,52,.25); }
  .storage-pill .blip{ width:6px;height:6px;border-radius:50%; background:currentColor; }

  .content{ padding:28px 32px 60px; max-width:1400px; }

  /* ---------- Cards / KPI ---------- */
  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px; }
  @media (max-width:1100px){ .kpi-row{ grid-template-columns:repeat(2,1fr);} }
  .kpi-card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:18px 18px 16px; position:relative; overflow:hidden;
  }
  .kpi-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--gold);
  }
  .kpi-card.rust::before{ background:var(--rust); }
  .kpi-card.forest::before{ background:var(--forest); }
  .kpi-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--slate); }
  .kpi-value{ font-family:var(--font-tabular); font-variant-numeric:tabular-nums; font-size:24px; font-weight:600; margin-top:8px; letter-spacing:-0.01em; }
  .kpi-sub{ font-size:11.5px; color:var(--slate); margin-top:4px; }

  /* ---------- Dải thống kê gọn (thay cho kpi-card khi cần tiết kiệm chiều cao) ---------- */
  .stat-strip{
    display:flex; flex-wrap:wrap; gap:10px; align-items:stretch;
  }
  .stat-chip{
    display:flex; align-items:center; gap:10px;
    background:#FBFAF6; border:1px solid var(--line); border-radius:8px;
    padding:8px 14px; font-size:12.5px;
  }
  .stat-chip .stat-dot{ width:8px; height:8px; border-radius:50%; background:var(--gold); flex:0 0 auto; }
  .stat-chip.rust .stat-dot{ background:var(--rust); }
  .stat-chip.forest .stat-dot{ background:var(--forest); }
  .stat-chip b{ font-family:var(--font-tabular); font-variant-numeric:tabular-nums; font-size:13.5px; }
  .stat-chip .stat-label{ color:var(--slate); }
  .info-tip{
    display:inline-flex; align-items:center; justify-content:center;
    width:15px; height:15px; border-radius:50%; background:var(--line); color:var(--slate);
    font-size:10px; font-weight:700; cursor:help; flex:0 0 auto;
  }

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    margin-bottom:24px; overflow:hidden;
  }
  .panel-head{
    padding:16px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .panel-head h2{ font-family:var(--font-display); font-size:16px; margin:0; font-weight:700; }
  .panel-head .desc{ font-size:12px; color:var(--slate); margin-top:3px; }
  .panel-body{ padding:18px 20px 20px; }
  .panel-body.flush{ padding:0; }

  /* ---------- Tables ---------- */
  .tbl-wrap{ overflow-x:auto; }
  table.data{ width:100%; border-collapse:collapse; font-size:12.8px; }
  table.data th{
    text-align:left; font-size:10.8px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--slate); font-weight:600; padding:9px 12px; border-bottom:1px solid var(--line);
    background:#FBFAF6; white-space:nowrap; position:sticky; top:0; z-index:3;
  }
  table.data td{
    padding:9px 12px; border-bottom:1px solid #F0EDE4; vertical-align:middle; white-space:nowrap;
  }
  table.data tbody tr:hover{ background:#FBFAF3; }
  table.data td.num, table.data th.num{ font-family:var(--font-tabular); font-variant-numeric:tabular-nums; text-align:right; }
  table.data td.wrap, table.data th.wrap{ white-space:normal; min-width:180px; }
  .row-del{
    border:none; background:none; color:var(--rust); cursor:pointer; font-size:15px;
    padding:2px 6px; border-radius:5px; line-height:1;
  }
  .row-del:hover{ background:var(--rust-soft); }

  /* inline editable cell */
  td input.cell-edit, td select.cell-edit{
    width:100%; border:1px solid transparent; background:transparent; font:inherit; color:inherit;
    padding:4px 5px; border-radius:5px; font-family:inherit;
  }
  td input.cell-edit:hover, td select.cell-edit:hover{ border-color:var(--line); }
  td input.cell-edit:focus, td select.cell-edit:focus{
    outline:none; border-color:var(--gold); background:#fff; box-shadow:0 0 0 2px var(--gold-soft);
  }
  td input.cell-edit.num{ text-align:right; font-family:var(--font-tabular); font-variant-numeric:tabular-nums; }
  td input.cell-edit.money, input.field-money{
    text-align:right; font-family:var(--font-tabular); font-variant-numeric:tabular-nums;
  }
  td input.cell-edit.money{ min-width:128px; }
  th.money-col, td.money-col{ min-width:140px; }

  /* ---------- Forms ---------- */
  .form-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px 12px; align-items:end; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:10.8px; text-transform:uppercase; letter-spacing:0.06em; color:var(--slate); }
  .field input, .field select{
    padding:8px 10px; border:1px solid var(--line); border-radius:7px; font:inherit; background:#fff; color:var(--ink);
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft); }

  .btn{
    display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:7px;
    font-size:13px; font-weight:600; cursor:pointer; border:1px solid transparent; white-space:nowrap;
  }
  .btn-primary{ background:var(--ink); color:#F3ECD9; }
  .btn-primary:hover{ background:var(--ink-soft); }
  .btn-ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
  .btn-ghost:hover{ background:#FBFAF3; }
  .btn-gold{ background:var(--gold); color:#fff; }
  .btn-gold:hover{ background:var(--amber); }
  .btn-sm{ padding:5px 10px; font-size:11.5px; border-radius:6px; }
  .btn-danger-ghost{ background:transparent; color:var(--rust); border-color:var(--rust-soft); }
  .btn-danger-ghost:hover{ background:var(--rust-soft); }

  /* ---------- Đính kèm hợp đồng (modal) ---------- */
  .contract-badge{
    border:none; cursor:pointer; font:inherit; font-size:11.3px; font-weight:700;
    padding:5px 10px; border-radius:999px; display:inline-flex; align-items:center; gap:5px;
    background:#EFEDE6; color:var(--slate);
  }
  .contract-badge:hover{ filter:brightness(0.97); }
  .contract-badge.st-active{ background:var(--forest-soft); color:var(--forest); }
  .contract-badge.st-expiring{ background:var(--gold-soft); color:var(--amber); }
  .contract-badge.st-expired{ background:var(--rust-soft); color:var(--rust); }
  .contract-badge .cnt-extra{ font-weight:600; opacity:0.75; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(18,23,43,0.5); z-index:100;
    display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px;
    overflow-y:auto;
  }
  .modal-box{
    background:var(--panel); border-radius:12px; width:100%; max-width:760px;
    box-shadow:0 20px 60px rgba(0,0,0,.3); overflow:hidden;
  }
  .modal-head{
    padding:16px 22px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .modal-head h2{ font-family:var(--font-display); font-size:16px; margin:0; font-weight:700; }
  .modal-head .desc{ font-size:12px; color:var(--slate); margin-top:2px; }
  .modal-close{
    border:none; background:none; cursor:pointer; font-size:18px; color:var(--slate);
    padding:4px 8px; border-radius:6px; line-height:1;
  }
  .modal-close:hover{ background:#F0EDE4; color:var(--ink); }
  .modal-body{ padding:20px 22px 22px; max-height:74vh; overflow-y:auto; }

  .contract-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .contract-row{
    border:1px solid var(--line); border-radius:9px; padding:12px 14px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .contract-row.is-superseded{ opacity:0.6; background:#FBFAF6; }
  .contract-main{ display:flex; flex-direction:column; gap:4px; min-width:200px; }
  .contract-main .c-title{ font-weight:700; font-size:13.2px; }
  .contract-main .c-meta{ font-size:11.3px; color:var(--slate); }
  .contract-main .c-note{ font-size:11.3px; color:var(--slate); font-style:italic; }
  .contract-actions{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .contract-link{
    font-size:12px; font-weight:600; color:var(--gold); text-decoration:none;
    padding:5px 10px; border:1px solid var(--gold-soft); border-radius:6px;
  }
  .contract-link:hover{ background:var(--gold-soft); }
  .contract-link.disabled{ color:var(--slate); border-color:var(--line); pointer-events:none; }
  .contract-form-title{ font-family:var(--font-display); font-size:13.5px; font-weight:700; margin:4px 0 12px; }
  .btn[disabled]{ opacity:0.45; cursor:not-allowed; }

  /* ---------- Stamp badges ---------- */
  .stamp{
    display:inline-flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;
    padding:4px 10px; border-radius:999px; border:1.5px dashed currentColor;
    transform:rotate(-1.2deg);
  }
  .stamp.ok{ color:var(--forest); background:var(--forest-soft); }
  .stamp.warn{ color:var(--rust); background:var(--rust-soft); }
  .stamp.pending{ color:var(--amber); background:var(--gold-soft); }
  .stamp.muted{ color:var(--slate); background:#EFEDE6; border-color:#C7C2B2; }

  .mini-field{
    border:1px solid transparent; background:transparent; padding:2px 4px; border-radius:4px;
    font-size:12.5px; width:100%; color:var(--ink); font-family:inherit;
  }
  .mini-field:hover{ border-color:var(--line); background:#fff; }
  .mini-field:focus{ border-color:var(--gold); background:#fff; outline:none; }
  .mini-field.muted{ color:var(--slate); font-size:11.5px; }
  .mini-field.italic{ font-style:italic; }
  .th-compact{ display:flex; flex-direction:column; gap:1px; cursor:help; }
  .th-compact .th-main{ font-size:11px; }
  .th-compact .th-sub{ font-size:9px; font-weight:400; text-transform:none; letter-spacing:0; color:var(--slate); opacity:0.85; }
  .stack-cell{ display:flex; flex-direction:column; gap:1px; min-width:150px; }
  .stack-cell .meta-line{ font-size:11px; color:var(--slate); padding:1px 4px; }

  select.status-select{
    border:1.5px solid transparent; border-radius:999px;
    padding:5px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.02em;
    cursor:pointer; font-family:inherit;
  }
  select.status-select.st-pending{ background:var(--gold-soft); color:var(--amber); }
  select.status-select.st-approved{ background:#E4E9FA; color:#3A56C4; }
  select.status-select.st-disbursed{ background:var(--forest-soft); color:var(--forest); }
  select.status-select.st-rejected{ background:var(--rust-soft); color:var(--rust); }
  select.status-select:focus{ border-color:currentColor; outline:none; }

  .comm-cell{ font-weight:800; font-size:14px; font-variant-numeric:tabular-nums; }
  .comm-cell.has-value{ color:var(--forest); }
  .comm-cell.zero{ color:var(--slate); font-weight:600; font-size:12.5px; }
  .comm-cell.warn-empty{ color:var(--rust); font-weight:600; font-size:11.5px; }
  .ins-best-row td{ background:var(--forest-soft); }
  .ins-missing-row td{ color:var(--slate); font-style:italic; }

  .tag{
    font-size:10.5px; padding:3px 8px; border-radius:5px; background:#EFEDE6; color:var(--slate);
    display:inline-block;
  }
  .tag.gold{ background:var(--gold-soft); color:var(--amber); }

  .helper{ font-size:11.5px; color:var(--slate); line-height:1.5; margin-top:8px; }
  .helper b{ color:var(--ink); }

  .empty{
    padding:36px 20px; text-align:center; color:var(--slate);
  }
  .empty .big{ font-family:var(--font-display); font-weight:700; font-size:15.5px; color:var(--ink); margin-bottom:6px; }

  .toast{
    position:fixed; bottom:22px; right:26px; background:var(--ink); color:#F3ECD9;
    padding:11px 18px; border-radius:8px; font-size:12.5px; box-shadow:0 8px 24px rgba(0,0,0,.25);
    opacity:0; transform:translateY(8px); pointer-events:none; transition:all .25s ease; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateY(0); }

  .tabs-hidden{ display:none !important; }

  .method-toggle{ display:flex; gap:6px; }
  .method-toggle button{
    padding:5px 10px; border-radius:6px; border:1px solid var(--line); background:#fff;
    font-size:11.5px; cursor:pointer; color:var(--slate);
  }
  .method-toggle button.active{ background:var(--ink); color:#F3ECD9; border-color:var(--ink); }

  /* ---------- Bảng "Tất cả chính sách" — chống mất chữ ---------- */
  #policyTable{ width:100%; min-width:1240px; table-layout:auto; }
  #policyTable th, #policyTable td{ white-space:nowrap; }

<script>
/* =========================================================================
   SỔ CÁI NCC — Quản trị doanh số & chiết khấu
   Bản HTML app độc lập, tái hiện đúng logic đã kiểm toán & sửa trong file Excel:
   - Mốc CK tách biệt khỏi Thưởng thêm
   - 3 cách tính: hồi tố toàn bộ / chỉ phần vượt mốc / thưởng thêm (cộng dồn riêng)
   - Nhiều chính sách đồng thời (CK tháng + thưởng quý + thưởng theo hạn)
   - Cộng dồn doanh số nhiều đơn vị cho cùng 1 NCC
   - Đối soát theo đúng kỳ (Từ ngày - Đến ngày)
   ========================================================================= */

/* ---------------------------- Utilities ---------------------------- */
const fmt = n => (n===null||n===undefined||isNaN(n)) ? '—' : Math.round(n).toLocaleString('vi-VN');
const fmtPct = n => (n===null||n===undefined||isNaN(n)) ? '—' : (n*100).toLocaleString('vi-VN',{maximumFractionDigits:2})+'%';
const round2 = n => Math.round((Number(n)||0)*100)/100;

/* ---- Ô nhập số tiền có dấu phân cách nghìn (định dạng khi gõ, dễ đọc số lớn) ----
   parseMoneyInput: bỏ mọi ký tự không phải chữ số (dấu chấm ngăn cách...) -> số nguyên
   formatMoneyValue: số nguyên -> chuỗi có dấu chấm ngăn cách hàng nghìn (kiểu VN: 200.000.000)
   attachMoneyFormatting: gắn vào 1 input để tự format khi gõ, giữ nguyên vị trí con trỏ hợp lý */
function parseMoneyInput(str){
  const digits = String(str||'').replace(/[^\d]/g,'');
  return digits ? Number(digits) : 0;
}
function formatMoneyValue(n){
  const v = Number(n)||0;
  return v.toLocaleString('vi-VN');
}
function attachMoneyFormatting(el){
  if(!el) return;
  const reformat = ()=>{
    const raw = parseMoneyInput(el.value);
    const digitsBefore = el.value.slice(0, el.selectionStart||el.value.length).replace(/[^\d]/g,'').length;
    el.value = raw ? formatMoneyValue(raw) : '';
    // đặt lại con trỏ về cuối (đơn giản, đủ dùng cho ô nhập số tiền)
    const pos = el.value.length;
    try{ el.setSelectionRange(pos,pos); }catch(e){}
  };
  el.addEventListener('input', reformat);
}
const uid = (() => { let n = Date.now()%1000000; return (prefix)=> prefix+'_'+(++n).toString(36); })();
const todayISO = () => new Date().toISOString().slice(0,10);
const toDate = s => s ? new Date(s+'T00:00:00') : null;

function eomonth(d, addMonths){
  const y=d.getFullYear(), m=d.getMonth()+addMonths;
  return new Date(y, m+1, 0);
}
function monthRange(ref){ return [new Date(ref.getFullYear(),ref.getMonth(),1), eomonth(ref,0)]; }
function quarterRange(ref){
  const q = Math.floor(ref.getMonth()/3);
  return [new Date(ref.getFullYear(), q*3, 1), eomonth(ref, (q*3+3)-ref.getMonth())];
}
function ytdRange(ref, endOverrideISO){
  let to = ref;
  if(endOverrideISO){ const eo = toDate(endOverrideISO); if(eo && eo < to) to = eo; }
  return [new Date(ref.getFullYear(),0,1), to];
}
function cyclePeriod(cycle, ref, endOverrideISO){
  if(cycle==='THANG') return monthRange(ref);
  if(cycle==='QUY') return quarterRange(ref);
  if(cycle==='YTD') return ytdRange(ref, endOverrideISO);
  if(cycle==='Cố định') return [null, null];
  return null; // 'Cần xác nhận' → chưa tính được
}
function fmtRange([from,to]){
  const f = d => d ? d.toLocaleDateString('vi-VN') : '…';
  return `${f(from)} → ${f(to)}`;
}

/* ---------------------------- Persistent storage ----------------------------
   Dữ liệu nghiệp vụ (NCC, chính sách, doanh số, tài khoản, nhật ký...) dùng
   CHUNG cho mọi người. Có 2 tầng lưu trữ:
   1) Firebase Realtime Database (nếu đã kết nối) — đồng bộ REAL-TIME qua nhiều thiết
      bị/trình duyệt/mạng khác nhau, không giới hạn trong 1 trò chuyện Claude.
   2) Nếu chưa kết nối Firebase: dùng bộ nhớ dùng chung của trò chuyện Claude
      (window.storage, shared=true), rồi tới localStorage của trình duyệt,
      rồi tới bộ nhớ tạm (mất khi đóng tab) — y như trước đây.
   "Bạn đang là ai" (currentUserId) luôn lưu RIÊNG trên thiết bị/trình duyệt
   của từng người (shared=false / localStorage), không đưa lên Firebase.
---------------------------------------------------------------------------- */
const STORE_KEY = 'nccapp:state:v2';          // shared business data (tầng dự phòng)
const SESSION_KEY = 'nccapp:session:v1';      // personal: {currentUserId}
const FB_CONFIG_KEY = 'nccapp:firebaseConfig:v1'; // cấu hình Firebase (dùng chung để cả nhóm tự kết nối)
const FB_DISABLED_KEY = 'nccapp:firebaseDisabled:v1'; // đánh dấu "đã chủ động ngắt" để không tự nối lại cấu hình mặc định
const FB_PATH = 'ncc_app_data/shared_state'; // đường dẫn node trong Realtime Database
let storageMode = 'memory'; // 'firebase' | 'cloud' | 'local' | 'memory'
let storageBackend = null;  // 'window.storage' | 'localStorage' | null
let lastSavedJson = null;   // để nhận biết sự kiện Realtime Database nào là do chính mình vừa ghi

let fb = { status:'disconnected', db:null, ref:null, unsub:null, error:null, config:null }; // 'disconnected'|'connecting'|'connected'|'error'

function loadScript(src){
  return new Promise((resolve,reject)=>{
    const existing = document.querySelector(`script[src="${src}"]`);
    if(existing){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = ()=>resolve(); s.onerror = ()=>reject(new Error('Không tải được: '+src));
    document.head.appendChild(s);
  });
}
async function ensureFirebaseSDK(){
  if(window.firebase && window.firebase.database) return;
  await loadScript('https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js');
  await loadScript('https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js');
}

/* Chấp nhận dán JSON chuẩn HOẶC nguyên đoạn code "const firebaseConfig = {...}"
   copy thẳng từ Firebase Console (không phải JSON hợp lệ vì key không có ngoặc kép). */
function parseFirebaseConfigInput(raw){
  const text = (raw||'').trim();
  if(!text) return null;
  try{ return JSON.parse(text); }catch(e){}
  const start = text.indexOf('{');
  const end = text.lastIndexOf('}');
  if(start===-1||end===-1||end<=start) throw new Error('Không tìm thấy cấu hình dạng { ... }. Hãy dán nguyên object firebaseConfig.');
  const objText = text.slice(start, end+1);
  try{
    const obj = new Function('return (' + objText + ')')();
    if(obj && typeof obj==='object') return obj;
  }catch(e){}
  throw new Error('Không đọc được cấu hình — kiểm tra lại định dạng đã dán.');
}

async function connectFirebase(config){
  fb.status = 'connecting'; fb.error = null; fb.config = config;
  try{
    if(!config.databaseURL) throw new Error('Thiếu databaseURL — vào Realtime Database trên Firebase Console, copy đúng link database (dạng https://...firebasedatabase.app) và thêm vào cấu hình.');
    await ensureFirebaseSDK();
    const app = (window.firebase.apps && window.firebase.apps.length) ? window.firebase.apps[0] : window.firebase.initializeApp(config);
    const db = window.firebase.database();
    const ref = db.ref(FB_PATH);
    const snap = await ref.once('value'); // kiểm tra kết nối thực sự hoạt động (bắt lỗi rules/permission sớm)
    fb.db = db; fb.ref = ref; fb.status = 'connected';
    if(fb.unsub) fb.unsub();
    const listener = ref.on('value', snapshot=>{
      if(!snapshot.exists()) return;
      const data = snapshot.val();
      if(data && data.json && data.json !== lastSavedJson){
        try{
          const remote = JSON.parse(data.json);
          state = remote;
          lastSavedJson = data.json;
          if(currentUserId && !(state.accounts||[]).some(a=>a.id===currentUserId)) currentUserId = null;
          renderAll();
        }catch(e){ console.error('Realtime Database parse error', e); }
      }
    }, err=>{ console.error('Realtime Database listen error', err); fb.status='error'; fb.error = err.message||String(err); });
    fb.unsub = ()=>ref.off('value', listener);
    setStoragePill('firebase');
    return {ok:true, existed: snap.exists()};
  }catch(e){
    fb.status = 'error'; fb.error = (e && e.message) || String(e);
    return {ok:false, error: fb.error};
  }
}
function disconnectFirebase(){
  if(fb.unsub) fb.unsub();
  fb = {status:'disconnected', db:null, ref:null, unsub:null, error:null, config:null};
}

/* Cấu hình Firebase mặc định đi kèm sẵn với app (dự án "htp-ncc" do bạn cung cấp).
   Chỉ dùng làm giá trị KHỞI TẠO khi chưa ai lưu cấu hình nào ở tab Cài đặt — Admin vẫn có thể
   dán cấu hình khác/kết nối lại/ngắt kết nối bình thường, thay đổi đó sẽ được ưu tiên hơn. */
const DEFAULT_FIREBASE_CONFIG = {
  apiKey: "AIzaSyCd1Y23YhibjdLhMa_QUfGuL5uuVDOQg7g",
  authDomain: "htp-ncc.firebaseapp.com",
  databaseURL: "https://htp-ncc-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "htp-ncc",
  storageBucket: "htp-ncc.firebasestorage.app",
  messagingSenderId: "438281398966",
  appId: "1:438281398966:web:e3a7354db885411f8c5417",
  measurementId: "G-6J5K7WXC7R"
};

async function isFirebaseDisabled(){
  try{
    if(window.storage && typeof window.storage.get === 'function'){
      const res = await window.storage.get(FB_DISABLED_KEY, true);
      return !!(res && res.value === '1');
    }
  }catch(e){}
  try{ return localStorage.getItem(FB_DISABLED_KEY) === '1'; }catch(e){}
  return false;
}
async function setFirebaseDisabled(disabled){
  try{
    if(window.storage && typeof window.storage.set === 'function'){
      if(disabled) await window.storage.set(FB_DISABLED_KEY, '1', true);
      else if(typeof window.storage.delete==='function') await window.storage.delete(FB_DISABLED_KEY, true);
      return;
    }
  }catch(e){}
  try{
    if(disabled) localStorage.setItem(FB_DISABLED_KEY, '1');
    else localStorage.removeItem(FB_DISABLED_KEY);
  }catch(e){}
}
async function loadFirebaseConfigFromBootstrap(){
  try{
    if(window.storage && typeof window.storage.get === 'function'){
      const res = await window.storage.get(FB_CONFIG_KEY, true);
      if(res && res.value) return JSON.parse(res.value);
    }
  }catch(e){}
  try{
    const raw = localStorage.getItem(FB_CONFIG_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  if(await isFirebaseDisabled()) return null; // đã chủ động ngắt trước đó -> không tự nối lại cấu hình mặc định
  return DEFAULT_FIREBASE_CONFIG || null; // chưa ai lưu cấu hình riêng -> dùng cấu hình mặc định đi kèm
}
async function saveFirebaseConfigToBootstrap(cfg){
  await setFirebaseDisabled(!cfg); // lưu cấu hình mới -> bỏ cờ đã ngắt; xoá cấu hình -> đánh dấu đã ngắt
  try{
    if(window.storage && typeof window.storage.set === 'function'){
      if(cfg) await window.storage.set(FB_CONFIG_KEY, JSON.stringify(cfg), true);
      else if(typeof window.storage.delete==='function') await window.storage.delete(FB_CONFIG_KEY, true);
      return;
    }
  }catch(e){}
  try{
    if(cfg) localStorage.setItem(FB_CONFIG_KEY, JSON.stringify(cfg));
    else localStorage.removeItem(FB_CONFIG_KEY);
  }catch(e){}
}

async function loadShared(){
  const fbConfig = await loadFirebaseConfigFromBootstrap();
  if(fbConfig){
    const res = await connectFirebase(fbConfig);
    if(res.ok){
      try{
        const snap = await fb.ref.once('value');
        if(snap.exists()){
          const data = snap.val();
          if(data && data.json){ lastSavedJson = data.json; return JSON.parse(data.json); }
        }
      }catch(e){}
      return null; // node Realtime Database chưa có -> sẽ được tạo ở lần saveState() đầu tiên
    }
    // kết nối thất bại -> rơi xuống tầng dự phòng bên dưới, lỗi đã lưu ở fb.error để hiện ở Cài đặt
  }
  try{
    if(window.storage && typeof window.storage.get === 'function'){
      storageBackend = 'window.storage';
      const res = await window.storage.get(STORE_KEY, true);
      return res && res.value ? JSON.parse(res.value) : null;
    }
  }catch(e){ /* key not found → fall through */ }
  if(storageBackend==='window.storage') return null;
  try{
    const raw = localStorage.getItem(STORE_KEY);
    storageBackend = 'localStorage';
    return raw ? JSON.parse(raw) : null;
  }catch(e){ /* blocked */ }
  storageBackend = null;
  return null;
}
async function loadSession(){
  try{
    if(window.storage && typeof window.storage.get === 'function'){
      const res = await window.storage.get(SESSION_KEY, false);
      return res && res.value ? JSON.parse(res.value) : null;
    }
  }catch(e){}
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){}
  return null;
}

let saveTimer=null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    const json = JSON.stringify(state);
    if(fb.status==='connected' && fb.ref){
      try{
        lastSavedJson = json;
        await fb.ref.set({json, updatedAt: new Date().toISOString()});
        setStoragePill('firebase');
        return;
      }catch(e){ console.error('Firebase save failed, dùng tầng dự phòng', e); }
    }
    try{
      if(window.storage && typeof window.storage.set==='function'){
        await window.storage.set(STORE_KEY, json, true);
        setStoragePill('cloud'); return;
      }
    }catch(e){ /* fall through */ }
    try{
      localStorage.setItem(STORE_KEY, json);
      setStoragePill('local'); return;
    }catch(e){ /* fall through */ }
    setStoragePill('memory');
  }, 300);
}
async function saveSession(){
  const json = JSON.stringify({currentUserId});
  try{
    if(window.storage && typeof window.storage.set==='function'){
      await window.storage.set(SESSION_KEY, json, false); return;
    }
  }catch(e){}
  try{ localStorage.setItem(SESSION_KEY, json); }catch(e){}
}

function fbStatusLabel(){
  if(fb.status==='connected') return '🔥 Đã kết nối Firebase';
  if(fb.status==='connecting') return 'Đang kết nối...';
  if(fb.status==='error') return 'Lỗi kết nối';
  return 'Chưa kết nối';
}
function setStoragePill(mode){
  storageMode = mode;
  const pill = document.getElementById('storagePill');
  if(!pill) return;
  if(mode==='firebase'){
    pill.className='storage-pill'; pill.innerHTML='<span class="blip"></span><span>🔥 Firebase — đồng bộ real-time</span>';
  } else if(mode==='cloud'){
    pill.className='storage-pill'; pill.innerHTML='<span class="blip"></span><span>Đã lưu — dùng chung trò chuyện</span>';
  } else if(mode==='local'){
    pill.className='storage-pill'; pill.innerHTML='<span class="blip"></span><span>Đã lưu trên trình duyệt này</span>';
  } else {
    pill.className='storage-pill offline'; pill.innerHTML='<span class="blip"></span><span>Chưa lưu được — dữ liệu chỉ tồn tại trong phiên này</span>';
  }
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------------------------- Modal dùng chung (dùng cho Đính kèm hợp đồng và các popup sau này) ----------------------------
   openModal(title, desc, bodyHtml, onMount): chèn 1 overlay full-màn-hình vào <body>, đóng bằng nút X, click nền, hoặc phím Esc.
   onMount(bodyEl) chạy SAU khi HTML đã gắn vào DOM — dùng để wire sự kiện cho nội dung modal. */
function openModal(title, desc, bodyHtml, onMount){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'activeModal';
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-head">
        <div><h2>${title}</h2>${desc?`<div class="desc">${desc}</div>`:''}</div>
        <button class="modal-close" id="modalCloseBtn" title="Đóng">✕</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.addEventListener('keydown', modalEscHandler);
  if(onMount) onMount(overlay.querySelector('.modal-body'));
}
function modalEscHandler(e){ if(e.key==='Escape') closeModal(); }
function closeModal(){
  const el = document.getElementById('activeModal');
  if(el) el.remove();
  document.removeEventListener('keydown', modalEscHandler);
}

/* ---------------------------- Đính kèm hợp đồng NCC/Ngân hàng/Bảo hiểm ----------------------------
   Dùng chung cho cả 3 khối (NCC dịch vụ ô tô, Ngân hàng, Bảo hiểm) — mỗi "đối tượng" (supplier/bank/insurer)
   có mảng obj.contracts = [{id, ten, soHopDong, ngayKy, ngayHieuLuc, ngayHetHan, link, ghiChu, units, supersededBy, createdAt, createdBy}].
   units: mảng tên đơn vị (lấy từ state.units) mà hợp đồng NÀY áp dụng riêng — mảng RỖNG nghĩa là
   "áp dụng chung, không phân theo đơn vị" (mặc định, hợp lý với NCC chỉ ký 1 hợp đồng cho tất cả).
   Trạng thái KHÔNG lưu tay mà luôn tự suy ra từ contractStatus() để tránh sai lệch khi quên cập nhật. */
function contractList(obj){ return obj.contracts || []; }
function contractStatus(ct){
  if(ct.supersededBy) return 'superseded';
  if(!ct.ngayHieuLuc) return 'draft';
  if(ct.ngayHetHan && ct.ngayHetHan < todayISO()) return 'expired';
  return 'active';
}
function contractStatusMeta(status, ct){
  if(status==='active'){
    if(ct && ct.ngayHetHan){
      const daysLeft = Math.round((new Date(ct.ngayHetHan) - new Date(todayISO()))/86400000);
      if(daysLeft<=30) return {label:`Sắp hết hạn (còn ${daysLeft} ngày)`, cls:'st-expiring'};
    }
    return {label:'Hiệu lực', cls:'st-active'};
  }
  if(status==='expired') return {label:'Hết hạn', cls:'st-expired'};
  if(status==='superseded') return {label:'Đã thay thế', cls:''};
  return {label:'Nháp', cls:''};
}
/* Nhãn đơn vị áp dụng của 1 hợp đồng — dùng ở cả dòng trong modal và bộ lọc. */
function contractUnitsLabel(ct){
  return (ct.units && ct.units.length) ? ct.units.join(', ') : 'Áp dụng chung (mọi đơn vị)';
}
/* Hai hợp đồng có "đụng" đơn vị hay không — mảng rỗng nghĩa là áp dụng chung nên luôn coi là đụng với bất kỳ ai.
   Dùng để xác định hợp đồng mới thêm chỉ nên "thay thế" đúng những bản cũ cùng phạm vi đơn vị,
   thay vì thay thế nhầm cả hợp đồng của đơn vị khác không liên quan. */
function contractUnitsOverlap(a, b){
  const ua = a.units||[], ub = b.units||[];
  if(ua.length===0 || ub.length===0) return true;
  return ua.some(u=>ub.includes(u));
}
/* Hợp đồng "đại diện" hiển thị trên badge của bảng danh sách: ưu tiên hiển thị bản có trạng thái ĐÁNG CHÚ Ý
   nhất trong số các bản chưa bị thay thế (hết hạn > sắp hết hạn > nháp > hiệu lực bình thường) — để nếu
   1 trong nhiều đơn vị bị hết hạn hợp đồng, người quản trị nhìn bảng tổng là thấy ngay, không phải mở modal mới biết. */
function representativeContract(obj){
  const list = contractList(obj).filter(ct=>contractStatus(ct)!=='superseded');
  if(list.length===0) return null;
  const rank = ct=>{
    const st = contractStatus(ct);
    if(st==='expired') return 0;
    if(st==='active' && contractStatusMeta(st,ct).cls==='st-expiring') return 1;
    if(st==='draft') return 2;
    return 3;
  };
  return [...list].sort((a,b)=> rank(a)-rank(b))[0];
}
function contractBadgeHTML(obj){
  const all = contractList(obj);
  if(all.length===0) return `<button class="contract-badge" data-open-contracts="1">📎 Chưa có hợp đồng</button>`;
  const rep = representativeContract(obj);
  const nonSup = all.filter(ct=>contractStatus(ct)!=='superseded');
  if(!rep) return `<button class="contract-badge" data-open-contracts="1">📎 Chỉ còn bản đã thay thế <span class="cnt-extra">${all.length} bản</span></button>`;
  const status = contractStatus(rep);
  const meta = contractStatusMeta(status, rep);
  const distinctScopes = new Set(nonSup.map(ct=> (ct.units&&ct.units.length) ? ct.units.slice().sort().join('|') : '__ALL__'));
  const unitHint = distinctScopes.size>1 ? ' · nhiều đơn vị' : '';
  const extra = all.length>1 ? `<span class="cnt-extra">+${all.length-1} bản${unitHint}</span>` : '';
  return `<button class="contract-badge ${meta.cls}" data-open-contracts="1">📎 ${meta.label} ${extra}</button>`;
}
/* Gắn sự kiện mở modal hợp đồng cho mọi nút [data-open-contracts] bên trong 1 bảng.
   getObj(id) trả về object (supplier/bank/insurer) theo id đã gắn ở data-id trên <tr>. */
function wireContractBadges(tbl, list, entityLabel, editable){
  tbl.querySelectorAll('[data-open-contracts]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.closest('tr').dataset.rowid;
      const obj = list.find(x=>x.id===id);
      if(obj) openContractsModal(obj, list, entityLabel, editable);
    });
  });
}
/* unitFilter: '' = xem tất cả đơn vị; tên đơn vị cụ thể = chỉ hiện hợp đồng áp dụng chung HOẶC có chứa đơn vị đó. */
function contractRowsHTML(obj, editable, unitFilter){
  const items = [...contractList(obj)]
    .filter(ct=> !unitFilter || !ct.units || ct.units.length===0 || ct.units.includes(unitFilter))
    .sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  if(items.length===0) return `<div class="empty" style="padding:20px 0;"><div class="big">Chưa có hợp đồng nào${unitFilter?' cho đơn vị này':''}</div></div>`;
  return items.map(ct=>{
    const status = contractStatus(ct);
    const meta = contractStatusMeta(status, ct);
    const range = ct.ngayHieuLuc ? `${ct.ngayHieuLuc}${ct.ngayHetHan?' → '+ct.ngayHetHan:' → vô thời hạn'}` : 'Chưa có ngày hiệu lực';
    return `
    <div class="contract-row ${status==='superseded'?'is-superseded':''}" data-cid="${ct.id}">
      <div class="contract-main">
        <div class="c-title">${escAttr(ct.ten||'(chưa đặt tên)')} <span class="tag ${meta.cls==='st-active'?'gold':''}">${meta.label}</span></div>
        <div class="c-meta">${ct.soHopDong?'Số: '+escAttr(ct.soHopDong)+' · ':''}${range}</div>
        <div class="c-meta">Đơn vị: ${escAttr(contractUnitsLabel(ct))}</div>
        ${ct.ghiChu?`<div class="c-note">${escAttr(ct.ghiChu)}</div>`:''}
      </div>
      <div class="contract-actions">
        ${ct.link ? `<a class="contract-link" href="${escAttr(ct.link)}" target="_blank" rel="noopener">Mở link</a>` : `<span class="contract-link disabled">Chưa có link</span>`}
        ${editable ? `
          ${status==='active' ? `<button class="btn btn-ghost btn-sm" data-mark-superseded="${ct.id}">Đánh dấu đã thay thế</button>` : ''}
          <button class="btn btn-danger-ghost btn-sm" data-del-contract="${ct.id}">Xoá</button>
        ` : ''}
      </div>
    </div>`;
  }).join('');
}
function openContractsModal(obj, list, entityLabel, editable, unitFilter){
  unitFilter = unitFilter || '';
  const hasUnits = state.units && state.units.length>0;
  const filterHtml = hasUnits ? `
    <div class="field" style="max-width:260px; margin-bottom:14px;">
      <label>Lọc theo đơn vị</label>
      <select id="ctUnitFilter">
        <option value="">— Tất cả đơn vị —</option>
        ${state.units.map(u=>`<option value="${escAttr(u)}" ${unitFilter===u?'selected':''}>${escAttr(u)}</option>`).join('')}
      </select>
    </div>` : '';

  const hasActive = contractList(obj).some(ct=>contractStatus(ct)==='active');
  const unitChecklistHtml = hasUnits ? `
      <div class="field" style="grid-column:1/-1;">
        <label>Đơn vị áp dụng</label>

        </div>

  const formHtml = editable ? `
    <div class="contract-form-title">+ Thêm hợp đồng/phụ lục mới</div>
    <div class="form-grid" id="contractForm">
      <div class="field"><label>Tên hợp đồng</label><input id="ct_ten" placeholder="HĐ nguyên tắc 2026..."></div>
      <div class="field"><label>Số hợp đồng</label><input id="ct_so" placeholder="Không bắt buộc"></div>
      <div class="field"><label>Ngày ký</label><input id="ct_ngayky" type="date"></div>
      <div class="field"><label>Ngày hiệu lực</label><input id="ct_hieuluc" type="date"></div>
      <div class="field"><label>Ngày hết hạn</label><input id="ct_hethan" type="date"></div>
      <div class="field"><label>Link (Drive...)</label><input id="ct_link" placeholder="Dán link tài liệu"></div>
      <div class="field" style="grid-column:1/-1;"><label>Ghi chú</label><input id="ct_note" placeholder="Không bắt buộc"></div>
      ${unitChecklistHtml}
      ${hasActive ? `
      <div class="field" style="flex-direction:row; align-items:center; gap:8px;">
        <input id="ct_supersede" type="checkbox" style="width:auto;" checked>
        <label style="text-transform:none; font-size:12.5px;">Bản này thay thế hợp đồng đang hiệu lực (cùng đơn vị)</label>
      </div>` : ''}
      <button class="btn btn-primary" id="ctAddBtn">+ Thêm hợp đồng</button>
    </div>
  ` : '';

  openModal(`Hợp đồng · ${escAttr(obj.name)}`, `${entityLabel} — ${contractList(obj).length} bản trong lịch sử`,
    `${filterHtml}<div class="contract-list" id="ctListBox">${contractRowsHTML(obj, editable, unitFilter)}</div>${formHtml}`,
    (body)=>{
      const wireListButtons = ()=>{
        body.querySelectorAll('[data-mark-superseded]').forEach(b=>b.addEventListener('click', ()=>{
          markContractSuperseded(obj, b.dataset.markSuperseded, entityLabel, unitFilter);
        }));
        body.querySelectorAll('[data-del-contract]').forEach(b=>b.addEventListener('click', ()=>{
          if(!confirm('Xoá bản hợp đồng này khỏi lịch sử?')) return;
          obj.contracts = contractList(obj).filter(ct=>ct.id!==b.dataset.delContract);
          logActivity('delete', entityLabel+' · Hợp đồng', `${obj.name}: xoá 1 bản hợp đồng`);
          saveState(); renderAll(); openContractsModal(obj, list, entityLabel, editable, unitFilter);
        }));
      };
      wireListButtons();
      const filterSel = body.querySelector('#ctUnitFilter');
      if(filterSel) filterSel.addEventListener('change', ()=>{
        document.getElementById('ctListBox').innerHTML = contractRowsHTML(obj, editable, filterSel.value);
        wireListButtons();
      });
      if(editable){
        const allUnitsChk = body.querySelector('#ct_all_units');
        const unitsBox = body.querySelector('#ct_units_box');
        if(allUnitsChk) allUnitsChk.addEventListener('change', ()=>{
          unitsBox.style.display = allUnitsChk.checked ? 'none' : 'flex';
          if(allUnitsChk.checked) unitsBox.querySelectorAll('.ct-unit-chk').forEach(c=>c.checked=false);
        });
        const addBtn = body.querySelector('#ctAddBtn');
        if(addBtn) addBtn.addEventListener('click', ()=>{
          const ten = document.getElementById('ct_ten').value.trim();
          if(!ten){ toast('Nhập tên hợp đồng trước đã'); return; }
          const supersedeChk = document.getElementById('ct_supersede');
          const doSupersede = supersedeChk && supersedeChk.checked;
          const chosenUnits = allUnitsChk && !allUnitsChk.checked
            ? Array.from(body.querySelectorAll('.ct-unit-chk:checked')).map(c=>c.value)
            : [];
          const newCt = {
            id: uid('ctr'), ten,
            soHopDong: document.getElementById('ct_so').value.trim(),
            ngayKy: document.getElementById('ct_ngayky').value,
            ngayHieuLuc: document.getElementById('ct_hieuluc').value,
            ngayHetHan: document.getElementById('ct_hethan').value,
            link: document.getElementById('ct_link').value.trim(),
            ghiChu: document.getElementById('ct_note').value.trim(),
            units: chosenUnits,
            supersededBy: null,
            createdAt: new Date().toISOString(),
            createdBy: currentUser() ? currentUser().name : '(không rõ)',
          };
          if(!obj.contracts) obj.contracts = [];
          if(doSupersede){
            obj.contracts.filter(ct=>contractStatus(ct)==='active' && contractUnitsOverlap(ct,newCt)).forEach(ct=>{ ct.supersededBy = newCt.id; });
          }
          obj.contracts.push(newCt);
          logActivity('create', entityLabel+' · Hợp đồng', `${obj.name}: thêm "${ten}"${doSupersede?' (thay thế bản cũ cùng đơn vị)':''}`);
          toast('Đã thêm hợp đồng: '+ten);
          saveState(); renderAll(); openContractsModal(obj, list, entityLabel, editable, unitFilter);
        });
      }
    });
}
function markContractSuperseded(obj, ctId, entityLabel, unitFilter){
  const ct = contractList(obj).find(x=>x.id===ctId);
  if(!ct) return;
  ct.supersededBy = 'manual';
  logActivity('update', entityLabel+' · Hợp đồng', `${obj.name}: đánh dấu 1 bản hợp đồng đã thay thế`);
  saveState(); renderAll(); openContractsModal(obj, contractList(obj), entityLabel, true, unitFilter);
}

/* ---------------------------- Phân bổ chỉ tiêu theo đơn vị (áp dụng cho MỌI loại mốc: CK theo doanh số / CK cố định / Thưởng thêm) ----------------------------
   p.unitTargets = {tên đơn vị: số tiền chỉ tiêu}. Đây là MỤC TIÊU cần đạt của từng đơn vị để cùng góp đủ vào
   p.threshold chung — khác với "Ma trận NCC × Đơn vị" (renderAllocation) vốn hiển thị doanh số THỰC TẾ đã phát sinh.
   Không bắt buộc tổng chỉ tiêu phải khớp tuyệt đối với mốc — chỉ cảnh báo để người dùng tự cân đối. */
function policyTargetSum(p){
  return Object.values(p.unitTargets||{}).reduce((a,b)=>a+(Number(b)||0), 0);
}
function policyTargetBadgeHTML(p){
  const units = state.units||[];
  if(units.length===0) return `<button class="contract-badge" data-open-targets="1">📊 Chưa có đơn vị</button>`;
  const sum = policyTargetSum(p);
  if(sum===0) return `<button class="contract-badge" data-open-targets="1">📊 Chưa phân bổ</button>`;
  const diff = (p.threshold||0) - sum;
  let cls = 'st-active';
  if(Math.abs(diff) > 0.5) cls = diff>0 ? 'st-expiring' : 'st-expired';
  return `<button class="contract-badge ${cls}" data-open-targets="1">📊 ${fmt(sum)}đ / ${fmt(p.threshold)}đ</button>`;
}
function wirePolicyTargetBadges(tbl, editable){
  tbl.querySelectorAll('[data-open-targets]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.closest('tr').dataset.rowid;
      const p = state.policies.find(x=>x.id===id);
      if(p) openPolicyTargetsModal(p, editable);
    });
  });
}
function openPolicyTargetsModal(p, editable){
  const units = state.units||[];
  const s = supplierById(p.supplierId);
  const targets = p.unitTargets || {};
  const bodyHtml = units.length===0 ? `
    <div class="empty" style="padding:20px 0;"><div class="big">Chưa có đơn vị nào</div>Thêm đơn vị ở tab Cài đặt trước khi phân bổ chỉ tiêu.</div>
  ` : `
    <div class="contract-list" style="margin-bottom:14px;">
      ${units.map(u=>{
        const actual = allTimeRevenue(p.supplierId, u);
        const target = Number(targets[u])||0;
        const pct = target>0 ? Math.round(actual/target*100) : null;
        const pctColor = pct===null ? 'var(--slate)' : pct>=100 ? 'var(--forest)' : pct>=70 ? 'var(--amber)' : 'var(--rust)';
        return `
        <div class="contract-row" style="align-items:center;">
          <div class="contract-main" style="min-width:160px;">
            <div class="c-title" style="font-weight:600; font-size:13px;">${escAttr(u)}</div>
            <div class="c-meta">Thực tế: ${fmt(actual)}đ${pct!==null?` · <b style="color:${pctColor}">${pct}%</b>`:''}</div>
          </div>
          <div class="contract-actions" style="flex:1; justify-content:flex-end;">
            <input class="field-money" data-unit-target="${escAttr(u)}" type="text" inputmode="numeric"
              value="${formatMoneyValue(targets[u]||0)}" style="max-width:180px; text-align:right;" ${editable?'':'disabled'}>
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="helper" id="targetSummaryLine" style="font-size:12.8px;"></div>
    <div class="helper" id="targetActualLine" style="font-size:12.8px;"></div>
    ${editable ? `
    <div style="display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;">
      <button class="btn btn-ghost btn-sm" id="targetSplitEvenBtn">Chia đều cho ${units.length} đơn vị</button>
      <button class="btn btn-primary btn-sm" id="targetSaveBtn">Lưu phân bổ</button>
    </div>` : ''}
  `;
  openModal(`Phân bổ chỉ tiêu · ${escAttr(p.code||p.id)}`,
    `${s?escAttr(s.name):''} — Mốc ${fmt(p.threshold)}đ${p.type==='Thưởng thêm'?' (Thưởng thêm)':''}`,
    bodyHtml,
    (body)=>{
      if(units.length===0) return;
      const inputs = Array.from(body.querySelectorAll('[data-unit-target]'));
      inputs.forEach(el=>attachMoneyFormatting(el));
      const updateSummary = ()=>{
        const sum = inputs.reduce((a,el)=>a+parseMoneyInput(el.value), 0);
        const diff = (p.threshold||0) - sum;
        const line = document.getElementById('targetSummaryLine');
        if(line){
          if(Math.abs(diff)<=0.5) line.innerHTML = `Đã phân bổ đủ: <b>${fmt(sum)}đ</b> / ${fmt(p.threshold)}đ`;
          else if(diff>0) line.innerHTML = `Đã phân bổ <b>${fmt(sum)}đ</b> / ${fmt(p.threshold)}đ — còn thiếu <b style="color:var(--rust)">${fmt(diff)}đ</b> chưa phân bổ`;
          else line.innerHTML = `Đã phân bổ <b>${fmt(sum)}đ</b> / ${fmt(p.threshold)}đ — đang vượt mốc <b style="color:var(--amber)">${fmt(-diff)}đ</b>`;
        }
        const actualTotal = units.reduce((a,u)=>a+allTimeRevenue(p.supplierId,u), 0);
        const actualLine = document.getElementById('targetActualLine');
        if(actualLine){
          const overallPct = p.threshold>0 ? Math.round(actualTotal/p.threshold*100) : null;
          const pctColor = overallPct===null ? 'var(--slate)' : overallPct>=100 ? 'var(--forest)' : overallPct>=70 ? 'var(--amber)' : 'var(--rust)';
          actualLine.innerHTML = `Thực tế toàn bộ đơn vị đã đạt: <b>${fmt(actualTotal)}đ</b> / ${fmt(p.threshold)}đ${overallPct!==null?` (<b style="color:${pctColor}">${overallPct}%</b> mốc)`:''}`;
        }
      };
      inputs.forEach(el=>el.addEventListener('input', updateSummary));
      updateSummary();
      if(editable){
        const splitBtn = body.querySelector('#targetSplitEvenBtn');
        if(splitBtn) splitBtn.addEventListener('click', ()=>{
          const each = Math.round((p.threshold||0)/units.length);
          inputs.forEach(el=>{ el.value = formatMoneyValue(each); });
          updateSummary();
        });
        const saveBtn = body.querySelector('#targetSaveBtn');
        if(saveBtn) saveBtn.addEventListener('click', ()=>{
          const newTargets = {};
          inputs.forEach(el=>{ const v = parseMoneyInput(el.value); if(v>0) newTargets[el.dataset.unitTarget] = v; });
          p.unitTargets = newTargets;
          logActivity('update','Chính sách CK', `${s?s.name:''} · ${p.code||p.id}: cập nhật phân bổ chỉ tiêu theo đơn vị`);
          toast('Đã lưu phân bổ chỉ tiêu');
          saveState(); renderAll(); closeModal();
        });
      }
    });
}

}

  const u = currentUser();

function supplierById(id){ return state.suppliers.find(s=>s.id===id); }

/* Tạo đơn vị mới "theo thực tế" nếu tên nhập vào chưa có trong danh sách đơn vị.
   Dùng cho ô "Đơn vị phụ trách" — gõ tên đơn vị thật của bạn, không bị bó buộc
   theo danh sách dựng sẵn A-T. Trả về tên đơn vị đã chuẩn hoá (hoặc '' nếu bỏ trống). */
function ensureUnit(rawName){
  const name = (rawName||'').trim();
  if(!name) return '';
  const existing = state.units.find(u=>u.toLowerCase()===name.toLowerCase());
  if(existing) return existing;
  state.units.push(name);
  return name;
}
function unitDatalistHTML(id){
  return `<datalist id="${id}">${state.units.map(u=>`<option value="${escAttr(u)}">`).join('')}</datalist>`;

function supplierDatalistHTML(id){
  return `<datalist id="${id}">${state.suppliers.map(s=>`<option value="${escAttr(s.name)}">`).join('')}</datalist>`;
}
function findSupplierByName(rawName){
  const name = (rawName||'').trim().toLowerCase();
  if(!name) return null;
  return state.suppliers.find(s=>s.name.trim().toLowerCase()===name) || null;
}

function sumRevenue(supplierId, from, to, unit){
  let total=0;
  for(const t of state.transactions){
    if(t.supplierId!==supplierId) continue;
    if(unit && t.unit!==unit) continue;
    const d = toDate(t.date);
    if(from && d<from) continue;
    if(to && d>to) continue;
    total += (Number(t.gross)||0) - (Number(t.returns)||0);
  }
  return total;
}
function allTimeRevenue(supplierId, unit){ return sumRevenue(supplierId, null, null, unit); }

function baseTierPolicies(supplierId, asOfDate){
  const ref = asOfDate || toDate(state.reportDate) || new Date();
  return state.policies.filter(p=>p.supplierId===supplierId
    && (p.type==='CK theo doanh số'||p.type==='CK cố định')
    && (!p.startDate || toDate(p.startDate) <= ref)
    && (!p.endDate || toDate(p.endDate) >= ref));
}
function bonusPolicies(supplierId, asOfDate){
  const ref = asOfDate || toDate(state.reportDate) || new Date();
  return state.policies.filter(p=>p.supplierId===supplierId && p.type==='Thưởng thêm'
    && (!p.startDate || toDate(p.startDate) <= ref)
    && (!p.endDate || toDate(p.endDate) >= ref));
}
function currentTier(supplierId, revenue, asOfDate){
  const t = baseTierPolicies(supplierId, asOfDate).filter(p=>p.threshold<=revenue).sort((a,b)=>b.threshold-a.threshold);
  return t[0]||null;
}
function nextTier(supplierId, revenue, asOfDate){
  const t = baseTierPolicies(supplierId, asOfDate).filter(p=>p.threshold>revenue).sort((a,b)=>a.threshold-b.threshold);
  return t[0]||null;
}
function calcMethodOf(supplierId, asOfDate){
  const found = baseTierPolicies(supplierId, asOfDate).find(p=>p.method);
  return (found && found.method) || 'Hồi tố toàn bộ';
}
function incrementalDiscount(supplierId, revenue, asOfDate){
  const tiers = baseTierPolicies(supplierId, asOfDate).slice().sort((a,b)=>a.threshold-b.threshold);
  let total=0;
  for(let i=0;i<tiers.length;i++){
    const t = tiers[i];
    if(revenue < t.threshold) continue;
    const nextThreshold = tiers[i+1] ? tiers[i+1].threshold : revenue;
    const upper = Math.min(revenue, nextThreshold);
    total += Math.max(0, upper - t.threshold) * t.rate;
  }
  return total;
}

/* Phát hiện xung đột cấu hình mốc CK cơ bản của 1 NCC:
   - Trùng mốc doanh số giữa 2 dòng đang hiệu lực (hệ thống sẽ chọn ngẫu nhiên theo thứ tự nhập)
   - Đường cong tỷ lệ CK đi ngược: mốc thấp hơn nhưng % CK cao hơn mốc cao hơn nó
   Trả về mảng chuỗi mô tả xung đột (rỗng nếu không có gì bất thường). */
function tierConflicts(supplierId, asOfDate){
  const tiers = baseTierPolicies(supplierId, asOfDate).slice().sort((a,b)=>a.threshold-b.threshold);
  const warnings = [];
  const seenThreshold = new Map();
  for(const t of tiers){
    if(seenThreshold.has(t.threshold)){
      warnings.push(`Trùng mốc ${fmt(t.threshold)}đ giữa "${seenThreshold.get(t.threshold)}" và "${t.code||t.id}" — hệ thống sẽ chỉ áp dụng 1 dòng theo thứ tự nhập, dòng còn lại vô nghĩa.`);
    } else seenThreshold.set(t.threshold, t.code||t.id);
  }
  for(let i=1;i<tiers.length;i++){
    if(tiers[i].rate < tiers[i-1].rate){
      warnings.push(`Mốc "${tiers[i-1].code||tiers[i-1].id}" (${fmt(tiers[i-1].threshold)}đ) đang có tỷ lệ CK ${fmtPct(tiers[i-1].rate)} cao hơn mốc "${tiers[i].code||tiers[i].id}" (${fmt(tiers[i].threshold)}đ, ${fmtPct(tiers[i].rate)}) — đường cong CK bị đi ngược, kiểm tra lại số liệu đàm phán.`);
    }
  }
  return warnings;
}

function policyPeriodRevenue(p, ref){
  const period = cyclePeriod(p.cycle, ref, p.endDate);
  if(!period) return null;
  return sumRevenue(p.supplierId, period[0], period[1]);
}
function bonusAmount(supplierId, ref){
  let total=0;
  for(const p of bonusPolicies(supplierId, ref)){
    const rev = policyPeriodRevenue(p, ref);
    if(rev===null) continue;
    if(rev >= p.threshold) total += rev * p.bonusRate;
  }
  return total;
}
function supplierPeriodRevenue(supplierId, ref){
  const cycle = state.monitoring[supplierId] || 'Cần xác nhận';
  const period = cyclePeriod(cycle, ref);
  if(!period) return {revenue:null, cycle};
  return {revenue: sumRevenue(supplierId, period[0], period[1]), cycle, period};
}
function fullSupplierCalc(supplierId){
  const ref = toDate(state.reportDate) || new Date();
  const {revenue, cycle, period} = supplierPeriodRevenue(supplierId, ref);
  const tiers = baseTierPolicies(supplierId, ref);
  const conflicts = tierConflicts(supplierId, ref);
  if(revenue===null){
    return {revenue:null, cycle, tiers, cur:null, next:null, base:null, bonus: bonusAmount(supplierId,ref), total:null, method:calcMethodOf(supplierId, ref), conflicts};
  }
  const cur = currentTier(supplierId, revenue, ref);
  const nxt = nextTier(supplierId, revenue, ref);
  const method = calcMethodOf(supplierId, ref);
  const base = method==='Chỉ phần vượt mốc' ? incrementalDiscount(supplierId, revenue, ref) : (cur ? revenue*cur.rate : 0);
  const baseRetro = cur ? revenue*cur.rate : 0;
  const bonus = bonusAmount(supplierId, ref);
  const targetVND = nxt ? nxt.threshold*nxt.rate : baseRetro;
  const opportunity = Math.max(0, targetVND - baseRetro);
  return {revenue, period, cycle, tiers, cur, next:nxt, base, baseRetro, bonus, total: base+bonus, method, opportunity, missing: nxt? Math.max(0,nxt.threshold-revenue):0, conflicts};
}

const COLLAPSE_KEY = 'qt_ncc_collapsed_sections';

try{
  const raw = localStorage.getItem(COLLAPSE_KEY);
  if(raw) collapsedSections = new Set(JSON.parse(raw));
}catch(e){}
function toggleSection(name){
  if(collapsedSections.has(name)) collapsedSections.delete(name);
  else collapsedSections.add(name);
  try{ localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...collapsedSections])); }catch(e){}

function visibleTabs(){
  const role = currentRole();
  return TABS.filter(t=> !t.roles || t.roles.includes(role));

function sidebarActiveId(){
  const t = TABS.find(x=>x.id===activeTab);
  return (t && t.parent) ? t.parent : activeTab;
}

function renderNav(){
  const nav = document.getElementById('navList');
  const activeId = sidebarActiveId();
  const tabs = visibleTabs().filter(t=>!t.hidden);
  let html=''; let i=0;
  while(i<tabs.length){
    const section = tabs[i].section;
    const collapsed = collapsedSections.has(section);
    html += `<div class="nav-group"><div class="nav-section${collapsed?' collapsed':''}" data-section="${escAttr(section)}"><span class="nav-section-label">${section}</span><span class="nav-section-caret">▾</span></div>`;
    if(!collapsed){
      html += `<div class="nav-group-items">`;
      while(i<tabs.length && tabs[i].section===section){
        const t = tabs[i];
        const longCls = t.label.length>18 ? ' long' : '';
        const badge = t.id==='bh_transactions' ? insAlertBadgeHTML() : '';
        html += `<div class="nav-item${longCls} ${t.id===activeId?'active':''}" data-tab="${t.id}"><span class="dot"></span><span class="label-text">${t.label}</span>${t.comingSoon?'<span class="soon-tag">Sắp có</span>':''}${badge}</div>`;
        i++;
      }
      html += `</div>`;
    } else {
      while(i<tabs.length && tabs[i].section===section) i++;
    }
    html += `</div>`;
  }
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{ activeTab = el.dataset.tab; renderAll(); });
  });
  nav.querySelectorAll('.nav-section').forEach(el=>{

function statusStamp(calc){
  if(calc.revenue===null) return `<span class="stamp warn">Cần xác nhận</span>`;
  if(!calc.next) return `<span class="stamp ok">Đã đạt mốc cao nhất</span>`;
  if(calc.revenue>=calc.next.threshold) return `<span class="stamp ok">Đã đạt</span>`;
  return `<span class="stamp pending">Chưa đạt mốc</span>`;
}

function escAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
/* Ô tiêu đề cột đơn vị trong ma trận NCC/Ngân hàng/Bảo hiểm × Đơn vị — tên dài tự ellipsis 2 dòng, xem đầy đủ qua tooltip.
   Dùng chung cho renderAllocation, renderBankAllocation, renderInsAllocation để tránh bảng bị kéo quá rộng. */
function matrixUnitHeaderCell(unitName){
  const short = String(unitName||'').replace('Đơn vị ','');
  return `<th class="num unit-col" title="${escAttr(short)}"><span class="unit-col-inner">${short}</span></th>`;
}
/* Ô tên hãng/NCC/ngân hàng ở cột đầu ma trận — cũng giới hạn chiều rộng + tooltip, tránh chiếm quá nhiều chỗ cố định */
function matrixRowLabelCell(name){
  return `<td class="row-label" title="${escAttr(name)}">${name}</td>`;
}
/* Colgroup GỢI Ý độ rộng (không ép cứng vì table-layout vẫn auto): cột tên + các cột tổng hợp cuối bảng
   (Tổng, Tỷ trọng, Đơn vị chính, Gợi ý...) được gợi ý % để không bị trình duyệt giãn quá rộng; các cột
   đơn vị (số liệu tiền, độ dài thay đổi theo dữ liệu) CỐ TÌNH để trống width — browser tự giãn theo đúng
   độ dài số thực tế, tránh số bị ép hẹp rồi tràn/đè chữ sang ô bên cạnh (lỗi đã gặp khi ép % cứng + fixed).
   trailingPcts: mảng % cho từng cột cố định ở cuối bảng, theo đúng thứ tự xuất hiện. */
function matrixColgroupHTML(unitCount, trailingPcts){
  const namePct = 16;
  let cols = `<col style="width:${namePct}%">`;
  for(let i=0;i<unitCount;i++) cols += `<col>`;
  trailingPcts.forEach(p=> cols += `<col style="width:${p}%">`);
  return `<colgroup>${cols}</colgroup>`;
}
/* Gim (sticky) đúng cách cho bảng có NHIỀU hàng tiêu đề (VD: hàng "Người phụ trách" phụ trong Ma trận NCC × Đơn vị).
   CSS chỉ đặt top:0 cho mọi <th>, nên hàng tiêu đề thứ 2 trở đi cần được JS đo chiều cao hàng phía trên rồi
   gán top offset tương ứng — nếu không sẽ đè lên nhau khi cuộn dọc (đúng lỗi trong ảnh người dùng gửi). */
function wireStickyHeaderRows(tbl){
  const rows = tbl.querySelectorAll('thead tr');
  let offset = 0;
  rows.forEach(row=>{
    row.querySelectorAll('th').forEach(th=>{ th.style.top = offset+'px'; });
    offset += row.getBoundingClientRect().height;
  });
}
/* Ô tiêu đề cột gọn cho các bảng dữ liệu (không phải ma trận): tên viết tắt + phụ đề nhỏ bên dưới,
   tooltip hiện đầy đủ ý nghĩa khi rê chuột — tránh header dài tràn ngang bảng. */
function thCompact(main, sub, fullTip, numeric){
  return `<th class="${numeric?'num':''}" title="${escAttr(fullTip||main)}"><span class="th-compact"><span class="th-main">${main}</span>${sub?`<span class="th-sub">${sub}</span>`:''}</span></th>`;
}
/* wireCellEdits: gắn sự kiện sửa trực tiếp trên bảng + ghi Nhật ký hoạt động.
   labelFn(item) trả về tên hiển thị của dòng để ghi log cho dễ đọc. */
function wireCellEdits(tbl, arr, entityName, labelFn){
  tbl.querySelectorAll('[data-field]').forEach(el=>{
    if(el.classList.contains('money')) attachMoneyFormatting(el);
    el.addEventListener('change', ()=>{
      const item = arr.find(x=>x.id===el.dataset.id);
      if(!item) return;
      let val = el.value;
      if(el.classList.contains('money')) val = parseMoneyInput(val);
      else if(el.classList.contains('pct')) val = (Number(val)||0)/100;
      else if(el.classList.contains('num')) val = Number(val)||0;
      const before = item[el.dataset.field];
      item[el.dataset.field] = val;
      if(el.classList.contains('money')) el.value = formatMoneyValue(val);
      if(el.classList.contains('pct')) el.value = round2(val*100);
      if(entityName) logActivity('update', entityName, `${labelFn?labelFn(item):item.id}: ${el.dataset.field} "${before}" → "${val}"`);
      saveState();
      if(['name','supplierId','type','threshold','rate','startDate','endDate'].includes(el.dataset.field)) renderAll();
    });
  });
}

      cycle: type==='Thưởng thêm' ? document.getElementById('pf_cycle').value : 'Cần xác nhận',
      threshold: parseMoneyInput(document.getElementById('pf_threshold').value),
      rate: (Number(document.getElementById('pf_rate').value)||0)/100,
      bonusRate: (Number(document.getElementById('pf_bonus').value)||0)/100,
      startDate: document.getElementById('pf_start').value||'', endDate: document.getElementById('pf_end').value||'',
      method: document.getElementById('pf_method').value,
      condition: document.getElementById('pf_condition').value.trim(),
      status:'Cần xác nhận', note:''
    };
    state.policies.push(p);
    const s = supplierById(supplierId);
    logActivity('create','Chính sách CK', `Thêm CS "${p.code}" (${p.type}) cho ${s?s.name:''}`);
    const warns = (p.type==='CK theo doanh số'||p.type==='CK cố định') ? tierConflicts(supplierId) : [];
