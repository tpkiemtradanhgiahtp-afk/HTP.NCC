/* ---------------------------- Phân quyền theo MODULE (mức giao diện) ----------------------------
   Độc lập với vai trò: quyết định tài khoản đó có THẤY (được dùng) module nào trong 3 module lớn hay
   không — dùng cho trường hợp 1 người chỉ làm Ngân hàng, không nên thấy/thao tác nhầm sang NCC/Bảo hiểm.
   - account.modules = mảng con của MODULES id, ví dụ ['ncc','nh'].
   - Tài khoản CHƯA có trường modules (tạo từ trước khi có tính năng này) mặc định coi như được cấp ĐỦ cả 3
     module, để không ai bị mất quyền đột ngột ngay sau khi cập nhật app.
   - Admin luôn thấy đủ mọi module, không bị giới hạn bởi danh sách này, để luôn quản lý được toàn hệ thống.
   - Đây là chặn Ở GIAO DIỆN (client-side) để tránh nhầm lẫn thao tác nội bộ — KHÔNG phải bảo mật dữ liệu
     tuyệt đối, vì dữ liệu mọi module vẫn được tải chung về mọi tài khoản đã đăng nhập (theo cơ chế lưu trữ
     hiện tại). Muốn chặn thật ở mức server cần tách dữ liệu theo module + Firebase Security Rules riêng. */
const MODULES = [
  {id:'ncc', label:'NCC Dịch vụ Ô tô - Xe máy'},
  {id:'nh',  label:'Ngân hàng'},
  {id:'bh',  label:'Bảo hiểm'},
];
function accountModules(a){
  if(!a || !Array.isArray(a.modules)) return MODULES.map(m=>m.id); // chưa gán -> mặc định đủ cả 3
  return a.modules;
}
function hasModuleAccess(moduleId, account){
  const a = account || currentUser();
  if(!a) return false;
  if(a.role==='Admin') return true;
  return accountModules(a).includes(moduleId);
}
function partnerEntityLabel(a){
  if(!a || !a.partnerType || !a.partnerId) return '';
  if(a.partnerType==='ncc'){ const s = supplierById(a.partnerId); return s?s.name:'(đã xoá)'; }
  if(a.partnerType==='nh'){ const b = bankById(a.partnerId); return b?b.name:'(đã xoá)'; }
  if(a.partnerType==='bh'){ const i = insurerById(a.partnerId); return i?i.name:'(đã xoá)'; }
  return '';
}
function partnerEntityOptions(partnerType){
  if(partnerType==='ncc') return state.suppliers.map(s=>({id:s.id, name:s.name}));
  if(partnerType==='nh') return state.banks.map(b=>({id:b.id, name:b.name}));
  if(partnerType==='bh') return state.insurers.map(i=>({id:i.id, name:i.name}));
  return [];
}

/* ---------------------------- Tài khoản Đối tác (NCC/NH/Bảo hiểm tự đăng nhập) ----------------------------
   account.role === 'Đối tác' + account.partnerType ('ncc'|'nh'|'bh') + account.partnerId (id của đúng
   NCC/Ngân hàng/NCC bảo hiểm trong state.suppliers/banks/insurers) -> tài khoản đó CHỈ thấy đúng module
   partnerType, và trong module đó chỉ thấy Chính sách + Doanh số/Đối soát CK của ĐÚNG đối tác mình — không
   thấy Danh mục (danh sách toàn bộ đối tác), Dashboard, Theo dõi mốc CK, Phân bổ đơn vị (đều là các tab so
   sánh/liệt kê NHIỀU đối tác cùng lúc, không lọc gọn về "chỉ 1 dòng" được).
   Ngoại lệ duy nhất được SỬA: ô "xác nhận" hoa hồng của chính họ ở Đối soát CK (xử lý riêng tại từng bảng),
   mọi thứ khác luôn chỉ xem — vẫn là "hàng rào mềm" ở giao diện như các cơ chế phân quyền khác trong app. */
function isPartnerAccount(a){ return !!(a && a.role==='Đối tác'); }
// Trả về hàm lọc theo đúng đối tác đang đăng nhập (hoặc null nếu không phải tài khoản Đối tác -> không lọc gì).
function partnerScopeFilter(idField){
  const u = currentUser();
  if(!isPartnerAccount(u) || !u.partnerId) return null;
  return (row)=> row[idField]===u.partnerId;
}
// Lọc 1 mảng object (suppliers/banks/insurers) theo đúng phạm vi Đối tác đang đăng nhập — trả nguyên mảng
// nếu là tài khoản nội bộ (không giới hạn gì). idKey: 'supplierId'|'bankId'|'insurerId' khớp với field id
// tương ứng NẰM TRÊN CHÍNH object đó (supplier.id, bank.id, insurer.id) nên truyền {[idKey]: o.id} để tái
// dùng đúng partnerScopeFilter (vốn được thiết kế lọc theo dòng dữ liệu có field idKey, không phải chính object).
function scopedObjsFor(idKey, objs){
  const pf = partnerScopeFilter(idKey);
  return pf ? objs.filter(o=>pf({[idKey]:o.id})) : objs;
}
function currentUser(){ return state.accounts.find(a=>a.id===currentUserId) || null; }

/* ---------------------------- Tìm kiếm toàn hệ thống ----------------------------
   Tìm trên tên NCC/NH/Bảo hiểm, tên khách hàng, số chứng từ/hồ sơ/đơn bảo hiểm, mã chính sách — chỉ trong
   phạm vi module + đối tác mà tài khoản hiện tại được phép xem (dùng đúng hasModuleAccess/partnerScopeFilter
   đã có sẵn, không lộ dữ liệu người dùng không được xem). Giới hạn 30 kết quả để không quá tải màn hình. */
function performGlobalSearch(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const u = currentUser();
  const results = [];
  const push = (type, label, tab, applyFilter)=> results.push({type, label, tab, applyFilter});

  if(hasModuleAccess('ncc', u)){
    const pf = partnerScopeFilter('supplierId');
    (pf ? state.suppliers.filter(s=>pf({supplierId:s.id})) : state.suppliers).forEach(s=>{
      if(s.name.toLowerCase().includes(q)) push('NCC', s.name, 'suppliers');
    });
    (pf ? state.transactions.filter(pf) : state.transactions).forEach(t=>{
      const s = supplierById(t.supplierId);
      const hay = [t.doc, t.category, s?s.name:''].join(' ').toLowerCase();
      if(hay.includes(q)) push('Doanh số NCC', `${t.doc||'(không số CT)'} — ${s?s.name:''} — ${fmt(t.gross)}đ — ${t.date}`, 'transactions', ()=>{ txSupplierFilter = s?s.name:''; txUnitFilter=''; });
    });
    (pf ? state.policies.filter(pf) : state.policies).forEach(p=>{
      const s = supplierById(p.supplierId);
      if((p.code||'').toLowerCase().includes(q)) push('Chính sách CK', `${p.code} — ${s?s.name:''} (${p.type})`, 'policies');
    });
    (pf ? state.contracts.filter(pf) : state.contracts).forEach(ct=>{
      const s = supplierById(ct.supplierId);
      const hay = [ct.ten, ct.soHopDong, s?s.name:''].join(' ').toLowerCase();
      if(hay.includes(q)) push('Hợp đồng NCC', `${ct.ten||'(chưa đặt tên)'} — ${s?s.name:''}`, 'suppliers');
    });
    (pf ? state.requests.filter(pf) : state.requests).forEach(r=>{
      const s = supplierById(r.supplierId);
      const hay = [s?s.name:'', ...(r.messages||[]).map(m=>m.text)].join(' ').toLowerCase();
      if(hay.includes(q)) push('Yêu cầu (NCC)', `${s?s.name:''} — ${requestStatusMeta(r.status).label}`, 'ncc_requests', ()=>{ reqFilterState.ncc.obj = s?s.name:''; reqFilterState.ncc.status=''; });
    });
  }
  if(hasModuleAccess('nh', u)){
    const pf = partnerScopeFilter('bankId');
    (pf ? state.banks.filter(b=>pf({bankId:b.id})) : state.banks).forEach(b=>{
      if(b.name.toLowerCase().includes(q)) push('Ngân hàng', b.name, 'nh_suppliers');
    });
    (pf ? state.bankTransactions.filter(pf) : state.bankTransactions).forEach(t=>{
      const b = bankById(t.bankId);
      const hay = [t.customer, t.phone, t.vehicle, t.refCode, b?b.name:''].join(' ').toLowerCase();
      if(hay.includes(q)) push('Doanh số NH', `${t.customer||'(chưa có tên KH)'} — ${b?b.name:''} — ${fmt(t.loanAmount)}đ — ${t.date}`, 'nh_transactions', ()=>{ bankTxBankFilter = b?b.name:''; bankTxUnitFilter=''; });
    });
    (pf ? state.bankContracts.filter(pf) : state.bankContracts).forEach(ct=>{
      const b = bankById(ct.bankId);
      const hay = [ct.ten, ct.soHopDong, b?b.name:''].join(' ').toLowerCase();
      if(hay.includes(q)) push('Hợp đồng NH', `${ct.ten||'(chưa đặt tên)'} — ${b?b.name:''}`, 'nh_suppliers');
    });
    (pf ? state.bankRequests.filter(pf) : state.bankRequests).forEach(r=>{
      const b = bankById(r.bankId);
      const hay = [b?b.name:'', ...(r.messages||[]).map(m=>m.text)].join(' ').toLowerCase();
      if(hay.includes(q)) push('Yêu cầu (NH)', `${b?b.name:''} — ${requestStatusMeta(r.status).label}`, 'nh_requests', ()=>{ reqFilterState.nh.obj = b?b.name:''; reqFilterState.nh.status=''; });
    });
  }
  if(hasModuleAccess('bh', u)){
    const pf = partnerScopeFilter('insurerId');
    (pf ? state.insurers.filter(i=>pf({insurerId:i.id})) : state.insurers).forEach(i=>{
      if(i.name.toLowerCase().includes(q)) push('NCC bảo hiểm', i.name, 'bh_suppliers');
    });
    (pf ? state.insTransactions.filter(pf) : state.insTransactions).forEach(t=>{
      const ins = insurerById(t.insurerId);
      const hay = [t.customer, t.phone, t.vehicle, t.policyNo, ins?ins.name:''].join(' ').toLowerCase();
      if(hay.includes(q)) push('Doanh số Bảo hiểm', `${t.customer||'(chưa có tên KH)'} — ${ins?ins.name:''} — ${fmt(t.premiumAmount)}đ — ${t.date}`, 'bh_transactions', ()=>{ insTxInsurerFilter = ins?ins.name:''; insTxUnitFilter=''; });
    });
    (pf ? state.insContracts.filter(pf) : state.insContracts).forEach(ct=>{
      const ins = insurerById(ct.insurerId);
      const hay = [ct.ten, ct.soHopDong, ins?ins.name:''].join(' ').toLowerCase();
      if(hay.includes(q)) push('Hợp đồng Bảo hiểm', `${ct.ten||'(chưa đặt tên)'} — ${ins?ins.name:''}`, 'bh_suppliers');
    });
    (pf ? state.insRequests.filter(pf) : state.insRequests).forEach(r=>{
      const ins = insurerById(r.insurerId);
      const hay = [ins?ins.name:'', ...(r.messages||[]).map(m=>m.text)].join(' ').toLowerCase();
      if(hay.includes(q)) push('Yêu cầu (Bảo hiểm)', `${ins?ins.name:''} — ${requestStatusMeta(r.status).label}`, 'bh_requests', ()=>{ reqFilterState.bh.obj = ins?ins.name:''; reqFilterState.bh.status=''; });
    });
  }
  return results.slice(0, 30);
}
function openGlobalSearch(){
  openModal('Tìm kiếm toàn hệ thống', 'Gõ tên khách hàng, NCC/Ngân hàng/Bảo hiểm, số chứng từ, mã chính sách...',
    `<div class="field" style="margin-bottom:10px"><input id="gs_input" placeholder="Gõ để tìm..." autocomplete="off"></div>
     <div id="gs_results"></div>`,
    (body)=>{
      const input = body.querySelector('#gs_input');
      const box = body.querySelector('#gs_results');
      function run(){
        const q = input.value;
        const list = q.trim() ? performGlobalSearch(q) : [];
        if(!q.trim()){ box.innerHTML=''; return; }
        box.innerHTML = list.length
          ? list.map((r,i)=>`<div class="gs-result" data-i="${i}" style="padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:baseline"><span class="tag" style="flex:0 0 auto">${escHtml(r.type)}</span><span class="wrap">${escHtml(r.label)}</span></div>`).join('')
          : `<div class="empty" style="padding:20px 0"><div class="big">Không tìm thấy kết quả</div></div>`;
        box.querySelectorAll('[data-i]').forEach(el=>{
          el.addEventListener('click', ()=>{
            const r = list[Number(el.dataset.i)];
            if(r.applyFilter) r.applyFilter();
            activeTab = r.tab;
            closeModal();
            renderAll();
          });
        });
      }
      let gsDebounceTimer = null;
      input.addEventListener('input', ()=>{
        clearTimeout(gsDebounceTimer);
        if(!input.value.trim()){ box.innerHTML=''; return; } // xoá trắng ô -> dọn kết quả ngay, không cần chờ
        gsDebounceTimer = setTimeout(run, 300); // đợi ngừng gõ 300ms rồi mới tìm, tránh quét lại toàn bộ dữ liệu sau mỗi phím gõ
      });
      input.focus();
    });
}

function currentRole(){ const u = currentUser(); return u ? u.role : null; }
function canEdit(area){
  const role = currentRole();
  if(!role) return false;
  // "Admin" luôn được sửa mọi khu vực, kể cả khi dữ liệu cấu hình lỡ bị thiếu/hỏng — không phụ thuộc
  // state.editPerms để tránh trường hợp Admin tự khoá nhầm chính mình khỏi mọi thứ.
  if(role==='Admin') return true;
  const allowed = (state.editPerms && state.editPerms[area]) || DEFAULT_EDIT_PERMS[area] || [];
  return allowed.includes(role);
}

/* ---------------------------- Thùng rác (xoá mềm — khôi phục được) ----------------------------
   Thay vì xoá thẳng khỏi mảng, chuyển qua đúng nhánh Thùng rác của module tương ứng (trashNcc/trashNh/
   trashBh/trashShared) kèm tên mảng gốc + toàn bộ dữ liệu — khôi phục lại là đẩy nguyên object đó trở lại
   đúng mảng cũ. Tự động dọn các mục quá 30 ngày (xem renderTrash). Chỉ Admin xem được Thùng rác (Admin
   luôn có đủ cả 4 nhánh nên gộp lại xem đầy đủ; tài khoản module khác không tải các nhánh này về nữa). */
// Ghi lại các id vừa xoá TRONG PHIÊN LÀM VIỆC NÀY (bộ nhớ tạm, không đồng bộ) — dùng để tránh hợp nhất
// xung đột (xem mergeBranchBeforeWrite) vô tình "hồi sinh" 1 bản ghi mình vừa chủ động xoá, chỉ vì trên
// server (do người khác chưa kịp nhận được thông báo xoá) vẫn còn thấy bản ghi đó.
const recentlyDeletedIds = new Set();
function moduleOfArrName(arrName){
  if(['suppliers','policies','transactions','reconciliations'].includes(arrName)) return 'ncc';
  if(['banks','bankPolicies','bankTransactions','bankReconciliations'].includes(arrName)) return 'nh';
  if(['insurers','insRates','insTransactions','insReconciliations'].includes(arrName)) return 'bh';
  return 'shared'; // accounts, hoặc mảng nào khác không thuộc riêng module nào
}
function trashKeyFor(module){ return module==='ncc'?'trashNcc':module==='nh'?'trashNh':module==='bh'?'trashBh':'trashShared'; }
function softDelete(arrName, item, entityLabel){
  if(!item || !Array.isArray(state[arrName])) return null;
  const idx = state[arrName].findIndex(x=>x.id===item.id);
  if(idx===-1) return null;
  state[arrName].splice(idx,1);
  recentlyDeletedIds.add(item.id);
  const key = trashKeyFor(moduleOfArrName(arrName));
  if(!Array.isArray(state[key])) state[key] = [];
  const trashId = uid('trash');
  state[key].unshift({
    trashId, arrName, entityLabel,
    deletedAt: new Date().toISOString(), deletedBy: currentUserId,
    data: item,
  });
  if(state[key].length>300) state[key].length = 300; // chặn phình vô hạn, ưu tiên giữ mục mới xoá gần đây
  return trashId; // trả về để nơi gọi gắn được nút "Hoàn tác" ngay trên toast (xem toastUndo)
}
const TRASH_KEYS = ['trashNcc','trashNh','trashBh','trashShared'];
function restoreFromTrash(trashId){
  for(const key of TRASH_KEYS){
    const arr = state[key];
    if(!Array.isArray(arr)) continue;
    const idx = arr.findIndex(t=>t.trashId===trashId);
    if(idx===-1) continue;
    const entry = arr[idx];
    arr.splice(idx,1);
    recentlyDeletedIds.add(trashId); // vừa chủ động lấy mục này RA KHỎI thùng rác -> không để hồi sinh nhầm nếu có xung đột
    if(!Array.isArray(state[entry.arrName])) state[entry.arrName] = [];
    state[entry.arrName].push(entry.data);
    recentlyDeletedIds.delete(entry.data.id); // chủ động khôi phục -> không còn coi là "đã xoá" nữa
    return entry;
  }
  return null;
}
function purgeTrashEntry(trashId){
  for(const key of TRASH_KEYS){
    const arr = state[key];
    if(!Array.isArray(arr)) continue;
    const idx = arr.findIndex(t=>t.trashId===trashId);
    if(idx!==-1){ arr.splice(idx,1); recentlyDeletedIds.add(trashId); return; }
  }
}

/* ---------------------------- Dò & dọn dữ liệu trùng lặp ----------------------------
   Do lỗi đồng bộ Firebase cũ (đã sửa), 1 số bản ghi có thể bị nhân bản thành nhiều dòng NỘI DUNG GIỐNG
   HỆT NHAU, chỉ khác đúng field .id (mã nội bộ) — đây là dấu hiệu chắc chắn của lỗi kỹ thuật, không phải
   2 bản ghi thật khác nhau tình cờ giống nhau (2 bản ghi thật, dù giống tên, hầu như không bao giờ giống
   TUYỆT ĐỐI mọi field khác — ngày tháng, số tiền, ghi chú...). Công cụ này CHỈ QUÉT, không tự xoá gì —
   Admin phải bấm xác nhận riêng, và bản ghi thừa được XOÁ MỀM (vào Thùng rác, khôi phục lại được). */
const DEDUP_TARGETS = [
  {field:'suppliers', label:'NCC', entity:'NCC'},
  {field:'policies', label:'Chính sách CK (NCC)', entity:'Chính sách CK'},
  {field:'transactions', label:'Doanh số (NCC)', entity:'Doanh số'},
  {field:'reconciliations', label:'Đối soát CK (NCC)', entity:'Đối soát CK'},
  {field:'banks', label:'Ngân hàng', entity:'NH'},
  {field:'bankPolicies', label:'Chính sách CK (NH)', entity:'Chính sách CK (NH)'},
  {field:'bankTransactions', label:'Doanh số (NH)', entity:'Doanh số (NH)'},
  {field:'bankReconciliations', label:'Đối soát CK (NH)', entity:'Đối soát CK (NH)'},
  {field:'insurers', label:'NCC bảo hiểm', entity:'NCC Bảo hiểm'},
  {field:'insRates', label:'Biểu phí Bảo hiểm', entity:'Biểu phí Bảo hiểm'},
  {field:'insTransactions', label:'Doanh số (Bảo hiểm)', entity:'Doanh số (Bảo hiểm)'},
  {field:'insReconciliations', label:'Đối soát CK (Bảo hiểm)', entity:'Đối soát CK (Bảo hiểm)'},
];
// Nhóm các bản ghi có nội dung GIỐNG HỆT NHAU (bỏ qua field .id) trong 1 mảng — trả về danh sách nhóm có
// từ 2 bản ghi trở lên, mỗi nhóm {keep, extra} — keep là bản ghi giữ lại (ưu tiên tạo sớm nhất nếu có
// createdAt), extra là các bản ghi THỪA nên xoá.
function findDuplicateGroups(arr){
  const groups = new Map();
  (arr||[]).forEach(item=>{
    if(!item || typeof item!=='object') return;
    // Bỏ qua .id (mã nội bộ, luôn khác nhau) VÀ .createdAt khi so khớp nội dung — bản ghi trùng do lỗi
    // đồng bộ có thể bị tạo lại ở các thời điểm khác nhau (createdAt khác) dù mọi field nghiệp vụ khác
    // giống hệt nhau; .createdAt vẫn được dùng riêng để chọn bản ghi GIỮ LẠI (ưu tiên bản tạo sớm nhất).
    const {id, createdAt, ...rest} = item;
    const key = JSON.stringify(rest);
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(item);
  });
  const result = [];
  groups.forEach(items=>{
    if(items.length<2) return;
    const sorted = items.slice().sort((a,b)=>{
      if(a.createdAt && b.createdAt) return a.createdAt.localeCompare(b.createdAt);
      return 0;
    });
    result.push({ keep: sorted[0], extra: sorted.slice(1) });
  });
  return result;
}
function scanAllDuplicates(){
  return DEDUP_TARGETS.map(t=>{
    const groups = findDuplicateGroups(state[t.field]);
    const extraCount = groups.reduce((s,g)=>s+g.extra.length, 0);
    return {...t, groups, extraCount};
  }).filter(r=>r.extraCount>0);
}
function removeDuplicateGroup(field, entity, group){
  group.extra.forEach(item=>{ softDelete(field, item, entity); });
}

/* ---------------------------- Calc engine ---------------------------- */
function supplierById(id){ return state.suppliers.find(s=>s.id===id); }

/* Tạo đơn vị mới "theo thực tế" nếu tên nhập vào chưa có trong danh sách đơn vị.
   Dùng cho ô "Đơn vị phụ trách" — gõ tên đơn vị thật của bạn, không bị bó buộc
   theo danh sách dựng sẵn A-T. Trả về tên đơn vị đã chuẩn hoá (hoặc '' nếu bỏ trống). */
function ensureUnit(rawName){
  const name = (rawName||'').trim();
  if(!name) return '';
  const existing = state.units.find(u=>u.toLowerCase()===name.toLowerCase());
  if(existing) return existing;
  state.units.push(name);
  return name;
}
function unitDatalistHTML(id){
  return `<datalist id="${id}">${state.units.map(u=>`<option value="${escAttr(u)}">`).join('')}</datalist>`;
}
/* Trả về MẢNG đơn vị phụ trách của 1 tài khoản — tương thích ngược với cấu hình cũ (acc.unit
   là 1 chuỗi đơn) lẫn cấu hình mới (acc.units là mảng, dùng khi 1 tài khoản được phân bổ xem
   nhiều hơn 1 đơn vị cùng lúc). Luôn dùng hàm này để đọc thay vì đọc thẳng acc.unit/acc.units. */
function accountUnits(acc){
  if(!acc) return [];
  if(Array.isArray(acc.units) && acc.units.length) return acc.units.filter(Boolean);
  return acc.unit ? [acc.unit] : [];
}
/* Gán lại danh sách đơn vị phụ trách cho 1 tài khoản. Luôn đồng bộ ngược acc.unit = đơn vị đầu
   tiên trong danh sách, để những chỗ code cũ còn đọc thẳng acc.unit (hiển thị, xuất Excel, khoá
   đơn vị khi Nhân viên chỉ có đúng 1 đơn vị...) vẫn chạy đúng như trước — không phá cấu hình cũ. */
function setAccountUnits(acc, arr){
  const list = Array.from(new Set((arr||[]).map(x=>ensureUnit(x)).filter(Boolean)));
  acc.units = list;
  acc.unit = list[0] || '';
}
function supplierDatalistHTML(id){
  return `<datalist id="${id}">${state.suppliers.map(s=>`<option value="${escAttr(s.name)}">`).join('')}</datalist>`;
}
function findSupplierByName(rawName){
  const name = (rawName||'').trim().toLowerCase();
  if(!name) return null;
  return state.suppliers.find(s=>s.name.trim().toLowerCase()===name) || null;
}

function sumRevenue(supplierId, from, to, unitFilter, excludeUnits){
  let total=0;
  const allowSet = Array.isArray(unitFilter) ? new Set(unitFilter) : null;
  const excludeSet = Array.isArray(excludeUnits) ? new Set(excludeUnits) : null;
  for(const t of state.transactions){
    if(t.supplierId!==supplierId) continue;
    if(typeof unitFilter==='string' && unitFilter && t.unit!==unitFilter) continue;
    if(allowSet && !allowSet.has(t.unit)) continue;
    if(excludeSet && excludeSet.has(t.unit)) continue;
    const d = toDate(t.date);
    if(from && d<from) continue;
    if(to && d>to) continue;
    total += (Number(t.gross)||0) - (Number(t.returns)||0);
  }
  return total;
}
function allTimeRevenue(supplierId, unit){ return sumRevenue(supplierId, null, null, unit); }

/* Ước tính nhanh số CK cho 1 danh sách chứng từ NCC đang hiển thị (VD: đúng theo Bộ lọc Đơn vị/NCC ở
   tab Doanh số) — gom theo từng NCC, áp đúng tỷ lệ mốc/phương pháp tính hiện hành (currentTier/
   incrementalDiscount, y hệt cơ chế Đối soát CK dùng) lên đúng tổng doanh số ĐANG HIỂN THỊ của NCC đó.
   LƯU Ý: đây là số ước tính nhanh trên đúng danh sách đang lọc — có thể lệch với số CHÍNH THỨC ở tab
   "Đối soát CK" của từng NCC, vì Đối soát CK còn tính thêm Thưởng thêm, tôn trọng đúng khoảng Từ ngày–
   Đến ngày của cả kỳ (không phải bộ lọc tuỳ ý ở đây) và tách riêng theo từng Nhóm áp dụng nếu NCC có
   chia nhóm mốc theo đơn vị. Số ở đây chỉ để tham khảo nhanh, không dùng để chốt kỳ đối soát. */
function estimatedCkForTxList(list){
  const bySupplier = {};
  list.forEach(t=>{
    const net = (Number(t.gross)||0) - (Number(t.returns)||0);
    bySupplier[t.supplierId] = (bySupplier[t.supplierId]||0) + net;
  });
  const ref = toDate(state.reportDate) || new Date();
  let total = 0;
  Object.keys(bySupplier).forEach(supplierId=>{
    const rev = bySupplier[supplierId];
    if(rev<=0) return;
    const method = calcMethodOf(supplierId, ref);
    if(method==='Chỉ phần vượt mốc'){
      total += incrementalDiscount(supplierId, rev, ref);
    } else {
      const tier = currentTier(supplierId, rev, ref);
      total += tier ? rev*tier.rate : 0;
    }
  });
  return total;
}

/* ---------------------------- Nhóm áp dụng mốc CK theo đơn vị (tuỳ chọn, mặc định KHÔNG dùng) ----------------------------
   Bình thường 1 NCC chỉ có 1 đường mốc CK duy nhất, tính trên TỔNG doanh số mọi đơn vị — hành vi này giữ
   NGUYÊN VẸN cho mọi NCC không dùng tính năng này (p.unitScope để trống = mặc định).
   Nếu 1 NCC cần áp mốc CK RIÊNG cho 1 nhóm đơn vị cụ thể (VD "Khối Xe máy" có mốc khác "Toyota HTP"), gắn
   p.unitScope = ['Khối Xe máy', ...] vào ĐÚNG các dòng mốc dành cho nhóm đó — các dòng còn lại (không gắn gì)
   sẽ tự động gộp thành 1 nhóm "còn lại" tính trên đúng phần đơn vị chưa bị nhóm nào khác nhận, để không bao
   giờ cộng trùng doanh số của 1 đơn vị vào 2 nhóm cùng lúc. */
function policyGroupKey(p){
  return (p.unitScope && p.unitScope.length) ? JSON.stringify(p.unitScope.slice().sort()) : '';
}
// Trả về danh sách nhóm của 1 NCC: [{groupKey, label, units}]. units=null nghĩa là "không chia nhóm, dùng
// đúng tổng doanh số như trước giờ" — CHỈ xảy ra khi NCC đó có <=1 nhóm (tức chưa ai gắn unitScope nào).
function supplierPolicyGroups(supplierId, asOfDate){
  const allBase = baseTierPolicies(supplierId, asOfDate); // không truyền groupKey -> lấy đủ mọi nhóm
  const keys = Array.from(new Set(allBase.map(policyGroupKey)));
  if(keys.length<=1){
    return [{groupKey:'', label:'', units:null}];
  }
  const namedKeys = keys.filter(k=>k!=='');
  const namedUnitsAll = new Set();
  const groups = namedKeys.map(k=>{
    const units = JSON.parse(k);
    units.forEach(u=>namedUnitsAll.add(u));
    return {groupKey:k, label: units.join(', '), units};
  });
  if(keys.includes('')){
    const remaining = (state.units||[]).filter(u=>!namedUnitsAll.has(u));
    groups.push({groupKey:'', label:'Còn lại (chưa gán nhóm)', units:remaining});
  }
  return groups;
}
function revenueForGroupPeriod(supplierId, group, from, to){
  if(!group || group.units===null) return sumRevenue(supplierId, from, to); // không chia nhóm -> y hệt hành vi cũ, không lọc gì
  return sumRevenue(supplierId, from, to, group.units);
}
// Tổng "CK phải hưởng" của 1 NCC trong 1 khoảng thời gian, CỘNG DỒN ĐÚNG theo từng nhóm (nếu có chia nhóm)
// — dùng cho Đối soát CK, nơi cần ra đúng 1 con số tổng cho cả kỳ, không cần hiện chi tiết từng nhóm.
function groupedDiscountForPeriod(supplierId, from, to, asOfDate){
  const groups = supplierPolicyGroups(supplierId, asOfDate);
  let totalRevenue=0, totalDiscount=0;
  groups.forEach(g=>{
    const rev = revenueForGroupPeriod(supplierId, g, from, to);
    totalRevenue += rev;
    const method = calcMethodOf(supplierId, asOfDate, g.groupKey);
    const tier = currentTier(supplierId, rev, asOfDate, g.groupKey);
    const disc = method==='Chỉ phần vượt mốc' ? incrementalDiscount(supplierId, rev, asOfDate, g.groupKey) : (tier ? rev*tier.rate : 0);
    totalDiscount += disc;
  });
  return {revenue: totalRevenue, discount: totalDiscount, rate: totalRevenue>0 ? totalDiscount/totalRevenue : 0, groupCount: groups.length};
}

function baseTierPolicies(supplierId, asOfDate, groupKey){
  const ref = asOfDate || toDate(state.reportDate) || new Date();
  let list = state.policies.filter(p=>p.supplierId===supplierId
    && (p.type==='CK theo doanh số'||p.type==='CK cố định')
    && (!p.startDate || toDate(p.startDate) <= ref)
    && (!p.endDate || toDate(p.endDate) >= ref));
  if(groupKey!==undefined) list = list.filter(p=>policyGroupKey(p)===groupKey);
  return list;
}
function bonusPolicies(supplierId, asOfDate){
  const ref = asOfDate || toDate(state.reportDate) || new Date();
  return state.policies.filter(p=>p.supplierId===supplierId && p.type==='Thưởng thêm'
    && (!p.startDate || toDate(p.startDate) <= ref)
    && (!p.endDate || toDate(p.endDate) >= ref));
}
// Mốc hiệu lực dùng để CHỌN/XẾP HẠNG mốc CK cơ bản: với "CK cố định" luôn coi như mốc = 0 (luôn đạt), bất kể
// số gõ ở cột "Mốc" là bao nhiêu — vì bản chất "cố định" là hưởng đúng tỷ lệ đó dù doanh thu bao nhiêu, không
// phải một bậc thang cần đạt tới. "CK theo doanh số" vẫn dùng đúng số đã cấu hình như bình thường.
function tierThreshold(p){ return p.type==='CK cố định' ? 0 : (Number(p.threshold)||0); }
function currentTier(supplierId, revenue, asOfDate, groupKey){
  const t = baseTierPolicies(supplierId, asOfDate, groupKey).filter(p=>tierThreshold(p)<=revenue).sort((a,b)=>tierThreshold(b)-tierThreshold(a));
  return t[0]||null;
}
function nextTier(supplierId, revenue, asOfDate, groupKey){
  const t = baseTierPolicies(supplierId, asOfDate, groupKey).filter(p=>tierThreshold(p)>revenue).sort((a,b)=>tierThreshold(a)-tierThreshold(b));
  return t[0]||null;
}
function calcMethodOf(supplierId, asOfDate, groupKey){
  const found = baseTierPolicies(supplierId, asOfDate, groupKey).find(p=>p.method);
  return (found && found.method) || 'Hồi tố toàn bộ';
}
function incrementalDiscount(supplierId, revenue, asOfDate, groupKey){
  const tiers = baseTierPolicies(supplierId, asOfDate, groupKey).slice().sort((a,b)=>tierThreshold(a)-tierThreshold(b));
  let total=0;
  for(let i=0;i<tiers.length;i++){
    const t = tiers[i];
    const tThresh = tierThreshold(t);
    if(revenue < tThresh) continue;
    const nextThreshold = tiers[i+1] ? tierThreshold(tiers[i+1]) : revenue;
    const upper = Math.min(revenue, nextThreshold);
    total += Math.max(0, upper - tThresh) * t.rate;
  }
  return total;
}

/* Phát hiện xung đột cấu hình mốc CK cơ bản của 1 NCC (tính RIÊNG trong từng nhóm áp dụng nếu có chia nhóm
   — 2 nhóm khác nhau có đường mốc độc lập, không so sánh chéo với nhau):
   - Trùng mốc doanh số giữa 2 dòng đang hiệu lực (hệ thống sẽ chọn ngẫu nhiên theo thứ tự nhập)
   - Đường cong tỷ lệ CK đi ngược: mốc thấp hơn nhưng % CK cao hơn mốc cao hơn nó
   Trả về mảng chuỗi mô tả xung đột (rỗng nếu không có gì bất thường). */
function tierConflicts(supplierId, asOfDate){
  const groups = supplierPolicyGroups(supplierId, asOfDate);
  const warnings = [];
  groups.forEach(g=>{
    const prefix = g.label ? `[Nhóm ${g.label}] ` : '';
    const tiers = baseTierPolicies(supplierId, asOfDate, g.groupKey).slice().sort((a,b)=>tierThreshold(a)-tierThreshold(b));
    const seenThreshold = new Map();
    for(const t of tiers){
      const th = tierThreshold(t);
      if(seenThreshold.has(th)){
        warnings.push(`${prefix}Trùng mốc hiệu lực ${fmt(th)}đ giữa "${seenThreshold.get(th)}" và "${t.code||t.id}" — hệ thống sẽ chỉ áp dụng 1 dòng theo thứ tự nhập, dòng còn lại vô nghĩa.`);
      } else seenThreshold.set(th, t.code||t.id);
    }
    for(let i=1;i<tiers.length;i++){
      if(tiers[i].rate < tiers[i-1].rate){
        warnings.push(`${prefix}Mốc "${tiers[i-1].code||tiers[i-1].id}" (${fmt(tierThreshold(tiers[i-1]))}đ) đang có tỷ lệ CK ${fmtPct(tiers[i-1].rate)} cao hơn mốc "${tiers[i].code||tiers[i].id}" (${fmt(tierThreshold(tiers[i]))}đ, ${fmtPct(tiers[i].rate)}) — đường cong CK bị đi ngược, kiểm tra lại số liệu đàm phán.`);
      } else if(tiers[i-1].rate>0 && tiers[i].rate >= tiers[i-1].rate*3){
        // Bước nhảy % quá lớn giữa 2 mốc liền kề (gấp ≥3 lần) — không sai quy tắc (mốc cao hơn, % cao hơn,
        // đúng chiều tăng dần) nhưng RẤT hiếm khi 1 bước đàm phán thật lại nhảy vọt như vậy — nhiều khả năng
        // là lỗi gõ nhầm số (VD gõ 70 thay vì 7), nên cảnh báo để người nhập tự kiểm tra lại, không chặn lưu.
        warnings.push(`${prefix}Mốc "${tiers[i].code||tiers[i].id}" có tỷ lệ CK ${fmtPct(tiers[i].rate)} — cao gấp ${Math.round(tiers[i].rate/tiers[i-1].rate)} lần mốc liền trước "${tiers[i-1].code||tiers[i-1].id}" (${fmtPct(tiers[i-1].rate)}). Bước nhảy lớn bất thường — kiểm tra lại có phải gõ nhầm số không (VD nhập 70 thay vì 7).`);
      }
    }
  });
  return warnings;
}

function policyPeriodRevenue(p, ref){
  const period = cyclePeriod(p.cycle, ref, p.endDate);
  if(!period) return null;
  // "Thưởng thêm" tính ĐỘC LẬP theo từng dòng (không cần cơ chế nhóm+phần-còn-lại như CK cơ bản) — nếu dòng
  // này có gán unitScope thì chỉ tính doanh số đúng các đơn vị đó, để trống = tính trên tổng NCC như cũ.
  const unitFilter = (p.unitScope && p.unitScope.length) ? p.unitScope : undefined;
  return sumRevenue(p.supplierId, period[0], period[1], unitFilter);
}
function bonusAmount(supplierId, ref){
  let total=0;
  for(const p of bonusPolicies(supplierId, ref)){
    const rev = policyPeriodRevenue(p, ref);
    if(rev===null) continue;
    if(rev >= p.threshold) total += rev * p.bonusRate;
  }
  return total;
}
function supplierPeriodRevenue(supplierId, ref, group){
  const cycle = state.monitoring[supplierId] || 'Cần xác nhận';
  const period = cyclePeriod(cycle, ref);
  if(!period) return {revenue:null, cycle};
  const revenue = group ? revenueForGroupPeriod(supplierId, group, period[0], period[1]) : sumRevenue(supplierId, period[0], period[1]);
  return {revenue, cycle, period};
}
function fullSupplierCalc(supplierId, group){
  const ref = toDate(state.reportDate) || new Date();
  const {revenue, cycle, period} = supplierPeriodRevenue(supplierId, ref, group);
  const groupKey = group ? group.groupKey : undefined;
  const tiers = baseTierPolicies(supplierId, ref, groupKey);
  const conflicts = tierConflicts(supplierId, ref); // đã tự tách theo từng nhóm bên trong, không cần truyền group ở đây
  const includeBonus = !group || group.includeBonus!==false;
  if(revenue===null){
    return {revenue:null, cycle, tiers, cur:null, next:null, base:null, bonus: includeBonus?bonusAmount(supplierId,ref):0, total:null, method:calcMethodOf(supplierId, ref, groupKey), conflicts, group};
  }
  const cur = currentTier(supplierId, revenue, ref, groupKey);
  const nxt = nextTier(supplierId, revenue, ref, groupKey);
  const method = calcMethodOf(supplierId, ref, groupKey);
  const incremental = incrementalDiscount(supplierId, revenue, ref, groupKey); // luôn tính song song để so sánh, dù method là gì
  const base = method==='Chỉ phần vượt mốc' ? incremental : (cur ? revenue*cur.rate : 0);
  const baseRetro = cur ? revenue*cur.rate : 0;
  // "Hồi tố toàn bộ" tính lại TOÀN BỘ doanh số theo tỷ lệ mốc mới nhất — retroDelta là phần tiền CHÊNH LỆCH
  // THÊM so với nếu chỉ tính % trên đúng phần doanh số vượt qua từng mốc (incremental) — giúp người xem hiểu
  // vì sao số CK tăng vọt khi vừa qua 1 mốc mới, không phải bị tính sai.
  const retroDelta = method==='Hồi tố toàn bộ' ? Math.max(0, base - incremental) : 0;
  const bonus = includeBonus ? bonusAmount(supplierId, ref) : 0;
  const targetVND = nxt ? nxt.threshold*nxt.rate : baseRetro;
  const opportunity = Math.max(0, targetVND - baseRetro);
  return {revenue, period, cycle, tiers, cur, next:nxt, base, baseRetro, retroDelta, bonus, total: base+bonus, method, opportunity, missing: nxt? Math.max(0,nxt.threshold-revenue):0, conflicts, group};
}
// Tách 1 NCC thành danh sách CÁC NHÓM để tính riêng (nếu có chia nhóm) — NCC bình thường (chưa dùng tính
// năng này) trả về đúng 1 phần tử duy nhất, gọi y hệt fullSupplierCalc(supplierId) như trước giờ, KHÔNG
// đổi hành vi gì cả. Chỉ khi NCC có ≥2 nhóm mới trả về nhiều phần tử — mỗi phần tử là 1 dòng riêng khi hiển
// thị ở "Theo dõi mốc CK"/Dashboard. Thưởng thêm chỉ cộng vào ĐÚNG 1 nhóm đầu tiên để không bị cộng trùng.
function supplierCalcGroups(supplierId){
  const ref = toDate(state.reportDate) || new Date();
  const groups = supplierPolicyGroups(supplierId, ref);
  if(groups.length<=1){
    return [{ groupKey:'', label:'', calc: fullSupplierCalc(supplierId) }];
  }
  return groups.map((g,i)=>({ groupKey:g.groupKey, label:g.label, calc: fullSupplierCalc(supplierId, {...g, includeBonus: i===0}) }));
}

// Bộ lọc Tháng/Năm dùng CHUNG cho cả 3 module (nút 📅 trên đầu trang) — chọn 1 lần, áp dụng cho Doanh số
// ở mọi module, giữ nguyên lựa chọn khi chuyển tab. Rỗng = không lọc gì theo thời gian.
let globalYearFilter = '';  // '' hoặc 'YYYY'
let globalMonthFilter = ''; // '' hoặc 'MM' (chỉ có nghĩa khi đã chọn globalYearFilter)
function periodFilterMatches(dateStr){
  if(!globalYearFilter) return true;
  if(!dateStr || !dateStr.startsWith(globalYearFilter)) return false;
  if(globalMonthFilter && dateStr.slice(5,7)!==globalMonthFilter) return false;
  return true;
}
// Khoảng ngày [from,to] (chuỗi 'YYYY-MM-DD') mà bộ lọc Tháng/Năm đang chọn tương ứng — null,null nếu
// không lọc gì. Dùng cho Đối soát CK (mỗi kỳ là 1 khoảng Từ ngày–Đến ngày, không phải 1 ngày đơn lẻ).
function periodFilterRange(){
  if(!globalYearFilter) return {from:null, to:null};
  if(globalMonthFilter){
    const y = Number(globalYearFilter), m = Number(globalMonthFilter);
    const lastDay = new Date(y, m, 0).getDate();
    return {from: `${globalYearFilter}-${globalMonthFilter}-01`, to: `${globalYearFilter}-${globalMonthFilter}-${String(lastDay).padStart(2,'0')}`};
  }
  return {from: `${globalYearFilter}-01-01`, to: `${globalYearFilter}-12-31`};
}
// 1 kỳ đối soát [fromDate,toDate] có GIAO NHAU với khoảng đang lọc không (kỳ dài hơn 1 tháng vẫn hiện ra
// nếu có phần nằm trong tháng/năm đang lọc) — so sánh chuỗi ISO 'YYYY-MM-DD' vẫn đúng thứ tự thời gian.
function periodFilterMatchesRange(fromDate, toDate){
  const {from, to} = periodFilterRange();
  if(!from) return true;
  if(!fromDate || !toDate) return false;
  return fromDate<=to && toDate>=from;
}
function periodFilterLabelText(){
  if(!globalYearFilter) return 'Tất cả thời gian';
  return globalMonthFilter ? `Tháng ${Number(globalMonthFilter)}/${globalYearFilter}` : `Năm ${globalYearFilter}`;
}
function periodFilterDescText(){
  if(!globalYearFilter) return '';
  return globalMonthFilter ? `tháng ${Number(globalMonthFilter)}/${globalYearFilter}` : `năm ${globalYearFilter}`;
}
// Các năm THỰC SỰ có dữ liệu (trong phạm vi module tài khoản hiện tại được tải) — dùng cho dropdown Năm.
function periodFilterAvailableYears(){
  const dates = [
    ...(state.transactions||[]).map(t=>t.date),
    ...(state.bankTransactions||[]).map(t=>t.date),
    ...(state.insTransactions||[]).map(t=>t.date),
  ].filter(Boolean);
  return Array.from(new Set(dates.map(d=>d.slice(0,4)))).sort().reverse();
}
function renderPeriodFilterMenu(){

        ${Array.from({length:12},(_,i)=>{ const m=String(i+1).padStart(2,'0'); return `<option value="${m}" ${globalMonthFilter===m?'selected':''}>Tháng ${i+1}</option>`; }).join('')}

  `;
  document.getElementById('pf_year').addEventListener('change', e=>{

    globalYearFilter=''; globalMonthFilter='';
    menu.classList.remove('open');
    renderAll();
  });
}

const COLLAPSE_KEY = 'qt_ncc_collapsed_sections';
let collapsedSections = new Set();
try{
  const raw = localStorage.getItem(COLLAPSE_KEY);
  if(raw) collapsedSections = new Set(JSON.parse(raw));
}catch(e){}
function toggleSection(name){
  if(collapsedSections.has(name)) collapsedSections.delete(name);
  else collapsedSections.add(name);
  try{ localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...collapsedSections])); }catch(e){}
  renderNav();
}

  const role = currentRole();

  let tabs = TABS.filter(t=> (!t.roles || t.roles.includes(role)) && (!t.module || hasModuleAccess(t.module, acc)));
  if(isPartnerAccount(acc)) tabs = tabs.filter(t=>t.partnerVisible===true);
  return tabs;
}

// vốn là tab con ẩn (parent:'suppliers') được hiện lên thành mục gốc, vì "suppliers" (Danh mục toàn bộ đối
// tác) không hiển thị với họ nên nếu vẫn giữ ẩn thì họ sẽ không có lối vào trang Chính sách CK của mình).

function renderNav(){
  recomputeBadgeCacheIfNeeded();
  const nav = document.getElementById('navList');
  const activeId = sidebarActiveId();
  const tabs = navTabs();
  let html=''; let i=0;
  while(i<tabs.length){
    const section = tabs[i].section;
    const collapsed = collapsedSections.has(section);
    html += `<div class="nav-group"><div class="nav-section${collapsed?' collapsed':''}" data-section="${escAttr(section)}"><span class="nav-section-label">${section}</span><span class="nav-section-caret">▾</span></div>`;
    if(!collapsed){
      html += `<div class="nav-group-items">`;
      while(i<tabs.length && tabs[i].section===section){
        const t = tabs[i];
        const badge = t.id==='bh_transactions' ? badgeCache.insAlert
          : t.id==='bh_renewal' ? badgeCache.renewal
          : t.id==='ncc_requests' ? badgeCache.nccRequests
          : t.id==='nh_requests' ? badgeCache.nhRequests
          : t.id==='bh_requests' ? badgeCache.bhRequests
          : '';
        html += `<div class="nav-item ${t.id===activeId?'active':''}" data-tab="${t.id}" title="${escAttr(t.label)}"><span class="dot"></span><span class="label-text">${t.label}</span>${t.comingSoon?'<span class="soon-tag">Sắp có</span>':''}${badge}</div>`;
        i++;
      }
      html += `</div>`;
    } else {
      while(i<tabs.length && tabs[i].section===section) i++;
    }
    html += `</div>`;
  }
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{ activeTab = el.dataset.tab; renderAll(); });
  });
  nav.querySelectorAll('.nav-section').forEach(el=>{
    el.addEventListener('click', ()=>{ toggleSection(el.dataset.section); });
  });
}

function subTabsHTML(){
  recomputeBadgeCacheIfNeeded();
  const group = SUBTAB_GROUPS[activeTab];
  if(!group) return '';
  const visibleIds = new Set(visibleTabs().map(t=>t.id));
  const filtered = group.filter(g=>visibleIds.has(g.id));
  if(filtered.length<2) return ''; // chỉ còn 0-1 subtab (vd Đối tác bị ẩn bớt) thì khỏi hiện thanh subtab
  return `<div class="subtabs">${filtered.map(g=>`<div class="subtab-item ${g.id===activeTab?'active':''}" data-subtab="${g.id}">${g.label}${g.id==='bh_allocation'?badgeCache.insAlert:''}</div>`).join('')}</div>`;
}
function bindSubTabs(c){
  c.querySelectorAll('[data-subtab]').forEach(el=>{
    el.addEventListener('click', ()=>{ activeTab = el.dataset.subtab; renderAll(); });
  });
}

function renderUserChip(){
  const chip = document.getElementById('userChip');

  const initials = u.name.trim().split(/\s+/).slice(-1)[0].slice(0,1).toUpperCase();

/* Đổi mật khẩu cho chính tài khoản đang đăng nhập (mọi vai trò đều dùng được, kể cả Admin).
   Nếu tài khoản CHƯA có mật khẩu, không yêu cầu nhập mật khẩu hiện tại — chỉ cần đặt mật khẩu mới. */
function openChangePasswordModal(accId){
  const acc = state.accounts.find(a=>a.id===accId);
  if(!acc) return;
  const hasCurrentPw = accountHasPassword(acc);
  openModal('Đổi mật khẩu', `Tài khoản "${escHtml(acc.name)}" — mật khẩu mới sẽ dùng ngay từ lần đăng nhập sau.`,
    `<div class="form-grid">
       ${hasCurrentPw ? `<div class="field" style="grid-column:1/-1"><label>Mật khẩu hiện tại</label><input id="cp_old" type="password" placeholder="Nhập mật khẩu hiện tại"></div>` : ''}
       <div class="field" style="grid-column:1/-1"><label>Mật khẩu mới</label><input id="cp_new" type="password" placeholder="Để trống nếu muốn BỎ mật khẩu"></div>
       <div class="field" style="grid-column:1/-1"><label>Nhập lại mật khẩu mới</label><input id="cp_new2" type="password" placeholder="Gõ lại mật khẩu mới"></div>
       <div class="login-error" id="cp_err" style="display:none"></div>
       <button class="btn btn-primary" id="cpSubmitBtn" style="grid-column:1/-1">Lưu mật khẩu mới</button>
     </div>`,
    (body)=>{
      const oldInp = body.querySelector('#cp_old');
      const newInp = body.querySelector('#cp_new');
      const new2Inp = body.querySelector('#cp_new2');
      const err = body.querySelector('#cp_err');
      const showErr = (msg)=>{ err.textContent = msg; err.style.display='block'; };
      const submit = async ()=>{
        err.style.display='none';
        if(hasCurrentPw && !(await verifyAccountPassword(acc, oldInp.value))){ showErr('Sai mật khẩu hiện tại.'); oldInp.focus(); return; }
        if(newInp.value !== new2Inp.value){ showErr('Hai ô mật khẩu mới không khớp.'); new2Inp.focus(); return; }
        await setAccountPassword(acc, newInp.value);
        logActivity('update','Tài khoản', `Tự đổi mật khẩu tài khoản "${acc.name}" (${newInp.value ? 'đặt mật khẩu mới' : 'bỏ mật khẩu'})`);
        toast(newInp.value ? 'Đã đổi mật khẩu' : 'Đã bỏ mật khẩu cho tài khoản này');
        closeModal();
        renderAll();
      };
      body.querySelector('#cpSubmitBtn').addEventListener('click', submit);
      [oldInp, newInp, new2Inp].forEach(inp=> inp && inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); }));
      (oldInp||newInp).focus();
    });
}

  else if(activeTab==='transactions') renderTransactions(c);
  else if(activeTab==='allocation') renderAllocation(c);
  else if(activeTab==='reconcile') renderReconcile(c);
  else if(activeTab==='nh_suppliers') renderBankSuppliers(c);
  else if(activeTab==='nh_policies') renderBankPolicies(c);

function renderLoginScreen(){
  document.querySelector('.shell').style.display='none';
  let screen = document.getElementById('loginScreen');
  if(screen && screen.dataset.built==='1'){
    // Màn đăng nhập đã dựng xong rồi — KHÔNG dựng lại từ đầu nữa. Quan trọng: renderAll() giờ được gọi
    // rất nhiều lần liên tiếp ngay lúc mở trang (mỗi bản ghi tải về qua child_added là 1 lần) — nếu dựng
    // lại `screen.innerHTML` mỗi lần như vậy, sẽ XOÁ SẠCH chữ người dùng đang gõ dở (tên đăng nhập/mật
    // khẩu), dẫn tới gõ thiếu/sai và báo "Không tìm thấy tài khoản". Không cần dựng lại để "thấy" dữ liệu
    // mới — nút Đăng nhập đọc TRỰC TIẾP state.accounts (không bắt biến riêng) ngay tại thời điểm bấm, nên
    // luôn thấy đúng dữ liệu tài khoản mới nhất dù state.accounts có bị thay hẳn bằng mảng mới hay không,
    // không cần vẽ lại màn hình mới thấy được.
    return;
  }
  if(!screen){
    screen = document.createElement('div');
    screen.id = 'loginScreen';
    document.body.appendChild(screen);
  }
  screen.dataset.built = '1';
  screen.className = 'login-screen';
  screen.innerHTML = `

        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 3v16a2 2 0 0 0 2 2h16" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M7 15l4-4 3 3 6-7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="mark"><span class="l1">Quản trị</span><span class="l2">Mục tiêu Đối tác/NCC</span></div>
      <div class="sub">Đăng nhập bằng tên tài khoản để tiếp tục — mọi thao tác sẽ được ghi vào Nhật ký hoạt động.</div>
      <div class="login-form">
        <div class="login-field">
          <label>Tên đăng nhập</label>
          <input id="li_username" placeholder="Nhập tên tài khoản" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>
        <div class="login-field">
          <label>Mật khẩu</label>
          <input id="li_password" type="password" placeholder="Nhập mật khẩu (nếu tài khoản có đặt)" autocomplete="current-password">
        </div>
        <div class="login-error" id="li_error"></div>
        <button class="login-submit" id="li_submit" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 17l5-5-5-5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M15 12H3" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Đăng nhập
        </button>
      </div>
      <div class="helper" style="margin-top:22px">Chưa có tài khoản? Chỉ <b>Admin</b> mới tạo được tài khoản mới — liên hệ Admin để được tạo ở tab "Quản trị tài khoản". Tài khoản nào được Admin đặt mật khẩu thì cần nhập đúng mật khẩu, tài khoản không đặt mật khẩu thì để trống ô mật khẩu cũng đăng nhập được.</div>
    </div>
  `;
  const userInput = screen.querySelector('#li_username');
  const pwInput = screen.querySelector('#li_password');

  const showErr = (msg)=>{ errBox.textContent = msg; errBox.classList.add('show'); };
  const clearErr = ()=>{ errBox.classList.remove('show'); };
  const submit = async ()=>{
    clearErr();
    const typed = userInput.value.trim().toLowerCase();
    if(!typed){ showErr('Nhập tên đăng nhập trước đã.'); userInput.focus(); return; }
    // So khớp theo "Tài khoản" (username) — tài khoản cũ chưa được gán username riêng thì tự dùng
    // Tên hiển thị làm tên đăng nhập, để tương thích ngược với dữ liệu tạo trước khi có trường này.

    const acc = state.accounts.find(a=> (a.username ? a.username.trim().toLowerCase() : a.name.trim().toLowerCase()) === typed);
    if(!acc){ showErr('Không tìm thấy tài khoản này. Kiểm tra lại tên hoặc liên hệ Admin.'); return; }
    const ok = await verifyAccountPassword(acc, pwInput.value);
    if(!ok){ showErr('Sai mật khẩu.'); pwInput.value=''; pwInput.focus(); return; }
    currentUserId = acc.id;
    saveSession();
    resetInactivityTimer(); // bắt đầu đếm 10 phút không thao tác kể từ lúc đăng nhập
    await syncBranchesForCurrentUser(); // tải thêm đúng nhánh module của tài khoản vừa đăng nhập (nếu đang dùng Firebase)
    screen.remove();
    renderAll();
  };
  screen.querySelector('#li_submit').addEventListener('click', submit);
  [userInput, pwInput].forEach(inp=> inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); }));
  userInput.focus();
}

/* ---------------------------- Dashboard · biểu đồ xu hướng nhỏ theo góc từng khối ----------------------------
   Chỉ để MINH HOẠ xu hướng 6 tháng gần nhất (theo lịch, không phụ thuộc bộ lọc Kỳ theo dõi/Tháng-Năm của
   Dashboard) — vẽ trực tiếp bằng SVG nhỏ, không cần thư viện chart ngoài, đặt ở góc phải tiêu đề mỗi khối. */
function lastNMonthKeys(n){
  const out=[]; const now=new Date();
  for(let i=n-1;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); }
  return out;
}
function dashMonthlySums(list, dateField, valueFn, monthKeys){
  const map = {}; monthKeys.forEach(mk=>map[mk]=0);
  list.forEach(item=>{
    const mk = String(item[dateField]||'').slice(0,7);
    if(mk in map) map[mk] += valueFn(item);
  });
  return monthKeys.map(mk=>Math.max(0, map[mk]));
}
function dashTrendSVG(values, colorVar){
  const w=104, h=30, n=values.length || 1;
  const max = Math.max(1, ...values);
  const gap = 3;
  const barW = (w-(n-1)*gap)/n;
  const bars = values.map((v,i)=>{
    const bh = Math.max(2, round2((v/max)*h));
    const x = round2(i*(barW+gap));
    const y = round2(h-bh);
    const isLast = i===n-1;
    return `<rect x="${x}" y="${y}" width="${round2(barW)}" height="${bh}" rx="1.5" fill="${colorVar}" opacity="${isLast?1:0.32}"/>`;
  }).join('');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${bars}</svg>`;
}
// title: nhãn ngắn; values: mảng số theo tháng (cũ -> mới); colorVar: màu CSS var dùng cho cột.
function dashTrendWidgetHTML(title, values, colorVar){
  const prev = values[values.length-2], last = values[values.length-1];
  const delta = (prev>0) ? (last-prev)/prev : null;
  const deltaHTML = delta===null ? '<span style="color:var(--slate)">—</span>'
    : `<span style="color:${delta>=0?'var(--forest)':'var(--rust)'};font-weight:700">${delta>=0?'▲':'▼'} ${fmtPct(Math.abs(delta))}</span>`;
  return `<div class="dash-trend" title="Xu hướng 6 tháng gần nhất (theo lịch), so tháng này với tháng trước">
    ${dashTrendSVG(values, colorVar)}
    <div><div class="dash-trend-label">${escHtml(title)}</div><div class="dash-trend-delta">${deltaHTML}</div></div>
  </div>`;
}

function renderDashboard(c){
  const acc = currentUser();
  const showNcc = hasModuleAccess('ncc', acc);
  const showNh = hasModuleAccess('nh', acc);
  const showBh = hasModuleAccess('bh', acc);
  const {from: pfFrom, to: pfTo} = periodFilterDateObjects();
  const dashMonthKeys = lastNMonthKeys(6);
  const dashMonthShortLabel = 'T'+Number(dashMonthKeys[0].slice(5,7))+'–T'+Number(dashMonthKeys[dashMonthKeys.length-1].slice(5,7));
  setTitle('Dashboard', 'Tổng quan doanh số & chiết khấu toàn hệ thống'+(globalYearFilter?' — đang lọc theo '+periodFilterDescText()+' (riêng Doanh số/CK dự kiến của NCC vẫn theo đúng Chu kỳ theo dõi riêng, không theo bộ lọc này)':' — ngày báo cáo '+(toDate(state.reportDate)||new Date()).toLocaleDateString('vi-VN')));

  let blocks = '';

  /* ---------------- Khối NCC Dịch vụ Ô tô - Xe máy ---------------- */
  let nccTop = [];
  if(showNcc){
    let totalRevenue=0, totalDiscount=0, totalOpportunity=0, needConfirm=0;
    const rows = [];
    state.suppliers.forEach(s=>{
      const groups = supplierCalcGroups(s.id);
      let supplierNeedsConfirm = false;
      groups.forEach(g=>{
        const calc = g.calc;
        if(calc.revenue===null) supplierNeedsConfirm = true;
        else { totalRevenue += calc.revenue; totalDiscount += calc.total; totalOpportunity += (calc.opportunity||0); }
        rows.push({s, calc, groupLabel: groups.length>1 ? g.label : ''});
      });
      if(supplierNeedsConfirm) needConfirm++;
    });

/* ---------------------------- Mục tiêu năm (NCC / Ngân hàng / Bảo hiểm) ----------------------------
   Theo dõi % đạt doanh số năm của từng đối tác, ĐỘC LẬP với hệ thống mốc CK theo tháng/quý hiện có (không
   đụng gì tới baseTierPolicies()/currentTier() đang chạy). Riêng NCC có thể "gắn kèm CK": tick chọn sẽ tự
   tạo 1 dòng Chính sách CK (cycle YTD, threshold = đúng mục tiêu năm) để nhập tiếp tỷ lệ % thưởng — Ngân
   hàng/Bảo hiểm KHÔNG có cấu trúc "mốc doanh số" tương đương (hoa hồng 2 module này là bảng tỷ lệ cố định/
   theo tháng, không theo mốc luỹ kế), nên chỉ theo dõi tiến độ thuần, không có tuỳ chọn gắn CK. */
let ytYear = String(new Date().getFullYear());
// Cách tính "Dự kiến cả năm" — áp dụng chung cho mọi thẻ đang hiện (chọn ở panel đầu trang):
// 'linear'  = bình quân tuyến tính từ đầu năm (mặc định cũ, không phân biệt mùa vụ)
// 'pace30/60/90' = theo đà N ngày gần nhất (bắt xu hướng gần đây, không bị pha loãng bởi tháng đầu năm chậm)
// 'yoy'     = so cùng kỳ năm trước: hệ số tăng trưởng = Cả năm trước ÷ Cùng kỳ năm trước, nhân vào luỹ kế năm nay
const YT_PROJECTION_METHODS = [
  {id:'linear', label:'Bình quân từ đầu năm'},
  {id:'pace30', label:'Theo đà 30 ngày gần nhất'},
  {id:'pace60', label:'Theo đà 60 ngày gần nhất'},
  {id:'pace90', label:'Theo đà 90 ngày gần nhất'},
  {id:'yoy',    label:'So sánh cùng kỳ năm trước'},
];
let ytProjectionMethod = 'linear';
function yearlyTargetModuleConfig(moduleId){
  if(moduleId==='ncc') return {
    id:'ncc', label:'NCC Dịch vụ Ô tô - Xe máy', partnerLabel:'NCC',
    partners: ()=> state.suppliers, partnerById: id=> supplierById(id),
    fieldKey:'yearlyTargets',
    revenueFn: (partnerId, from, to)=> sumRevenue(partnerId, from, to),
    supportsLinkedCK: true,
    linkedPolicyById: id=> state.policies.find(p=>p.id===id),
    logLabel:'Mục tiêu năm (NCC)',
  };
  if(moduleId==='nh') return {
    id:'nh', label:'Ngân hàng', partnerLabel:'Ngân hàng',
    partners: ()=> state.banks, partnerById: id=> bankById(id),
    fieldKey:'bankYearlyTargets',
    revenueFn: (partnerId, from, to)=> bankLoanSum(partnerId, from, to),
    supportsLinkedCK:false,
    logLabel:'Mục tiêu năm (NH)',
  };
  if(moduleId==='bh') return {
    id:'bh', label:'Bảo hiểm', partnerLabel:'NCC Bảo hiểm',
    partners: ()=> state.insurers, partnerById: id=> insurerById(id),
    fieldKey:'insYearlyTargets',
    revenueFn: (partnerId, from, to)=> insPremiumSum(partnerId, from, to),
    supportsLinkedCK:false,
    logLabel:'Mục tiêu năm (Bảo hiểm)',
  };
  return null;
}
// Khoảng ngày dùng để tính "doanh số luỹ kế" của 1 năm: năm hiện tại thì tính tới đúng Ngày báo cáo (đồng
// bộ với mọi chỗ khác trong app đang dùng field này); năm đã qua thì tính trọn 01/01 -> 31/12.
function yearlyTargetRange(year){
  const y = Number(year);
  const from = new Date(y,0,1);
  const now = toDate(state.reportDate) || new Date();
  const isCurrentYear = y===now.getFullYear();
  const to = isCurrentYear ? now : new Date(y,11,31);
  return {from, to, isCurrentYear};
}
// % thời gian đã trôi qua trong năm (so với 31/12) — dùng để so sánh "đang bám tiến độ" hay "có nguy cơ
// trễ". Năm đã qua luôn coi như 100% thời gian đã trôi qua (đã chốt sổ, không còn "tiến độ" để bám nữa).
function yearElapsedFraction(year){
  const {from, to, isCurrentYear} = yearlyTargetRange(year);
  if(!isCurrentYear) return 1;
  const yearEnd = new Date(Number(year),11,31);
  const totalDays = (yearEnd - from)/86400000 + 1;
  const elapsedDays = (to - from)/86400000 + 1;
  return Math.max(0, Math.min(1, elapsedDays/totalDays));
}
// Tính "Dự kiến cả năm" theo đúng phương pháp đang chọn (ytProjectionMethod). Năm đã đóng sổ (không phải
// năm hiện tại) thì khỏi cần dự phóng gì — luỹ kế CHÍNH LÀ số cuối cùng. fallbackUsed=true nghĩa là chọn
// "So sánh cùng kỳ năm trước" nhưng năm trước chưa có đủ dữ liệu (đối tác mới, hoặc năm trước = 0đ) —
// tự động rơi về bình quân tuyến tính để vẫn ra được 1 con số, có báo rõ trên thẻ.
function projectedRevenueFor(cfg, target, revenue, from, to, isCurrentYear, timeFrac){
  if(!isCurrentYear) return {projected: revenue, fallbackUsed:false};
  const year = Number(target.year);
  const yearEnd = new Date(year,11,31);
  const remainingDays = Math.max(0, Math.round((yearEnd - to)/86400000));
  const linear = timeFrac>0 ? revenue/timeFrac : revenue;

  if(ytProjectionMethod==='pace30' || ytProjectionMethod==='pace60' || ytProjectionMethod==='pace90'){
    const days = ytProjectionMethod==='pace30'?30:ytProjectionMethod==='pace60'?60:90;
    let paceFrom = new Date(to); paceFrom.setDate(paceFrom.getDate()-days+1);
    if(paceFrom < from) paceFrom = from; // không lùi về trước 01/01 (năm mới bắt đầu, chưa đủ N ngày)
    const paceDays = Math.max(1, Math.round((to - paceFrom)/86400000)+1);
    const paceRevenue = cfg.revenueFn(target.partnerId, paceFrom, to);
    const dailyRate = paceRevenue/paceDays;
    return {projected: revenue + dailyRate*remainingDays, fallbackUsed:false};
  }
  if(ytProjectionMethod==='yoy'){
    const prevYear = year-1;
    const prevFrom = new Date(prevYear,0,1);
    const prevSameDayTo = new Date(prevYear, to.getMonth(), to.getDate());
    const prevFullTo = new Date(prevYear,11,31);
    const prevPartial = cfg.revenueFn(target.partnerId, prevFrom, prevSameDayTo);
    const prevFull = cfg.revenueFn(target.partnerId, prevFrom, prevFullTo);
    if(prevPartial>0 && prevFull>0){
      return {projected: revenue*(prevFull/prevPartial), fallbackUsed:false};
    }
    return {projected: linear, fallbackUsed:true}; // thiếu dữ liệu năm trước -> tạm dùng bình quân tuyến tính
  }
  return {projected: linear, fallbackUsed:false}; // 'linear' (mặc định)
}
function yearlyTargetCalc(cfg, target){
  const {from, to, isCurrentYear} = yearlyTargetRange(target.year);
  const revenue = cfg.revenueFn(target.partnerId, from, to);
  const pct = target.targetAmount>0 ? revenue/target.targetAmount : 0;
  const timeFrac = yearElapsedFraction(target.year);
  const {projected, fallbackUsed} = projectedRevenueFor(cfg, target, revenue, from, to, isCurrentYear, timeFrac);
  let status, statusClass;
  if(pct>=1){ status='Đã đạt'; statusClass='ok'; }
  else if(pct >= timeFrac - 0.05){ status='Đang bám tiến độ'; statusClass='ok'; }
  else if(pct >= timeFrac - 0.15){ status='Cần chú ý'; statusClass='pending'; }
  else { status='Có nguy cơ trễ'; statusClass='warn'; }
  return {revenue, pct, projected, fallbackUsed, status, statusClass};
}
// Danh sách năm hiện ở dropdown: năm hiện tại LUÔN có mặt, cộng thêm mọi năm đã từng tạo mục tiêu (ở cả 3
// module) — để vẫn xem lại được mục tiêu của năm cũ dù đang ở năm mới.
function yearsWithTargetsOrCurrent(){
  const years = new Set([String(new Date().getFullYear())]);
  ['ncc','nh','bh'].forEach(m=>{
    const cfg = yearlyTargetModuleConfig(m);
    (state[cfg.fieldKey]||[]).forEach(t=> years.add(String(t.year)));
  });
  return Array.from(years).sort().reverse();
}

  const cfg = yearlyTargetModuleConfig(moduleId);
  // Tài khoản Đối tác chỉ thấy đúng mục tiêu của chính mình (partnerId của họ), không thấy đối tác khác —
  // dùng lại đúng partnerScopeFilter đã có sẵn cho mọi tab khác (Chính sách CK, Doanh số...).
  const pf = partnerScopeFilter('partnerId');
  const targets = (state[cfg.fieldKey]||[]).filter(t=>String(t.year)===String(ytYear) && (!pf || pf(t)));
  const partnersWithoutTarget = cfg.partners().filter(p=> !targets.some(t=>t.partnerId===p.id));

  el.innerHTML = `

      <div class="panel-head"><div><h2>${escHtml(cfg.label)}</h2><div class="desc">${targets.length} mục tiêu năm ${escHtml(ytYear)}</div></div>
        ${editable && partnersWithoutTarget.length>0 ? `<button class="btn btn-primary" data-yt-add="${moduleId}">+ Thêm mục tiêu</button>` : ''}
      </div>
      ${targets.length===0 ? `<div class="panel-body"><div class="empty">Chưa có mục tiêu năm nào cho ${escHtml(cfg.partnerLabel)} trong năm ${escHtml(ytYear)}.${editable&&partnersWithoutTarget.length>0?' Bấm "+ Thêm mục tiêu" để bắt đầu.':''}</div></div>` : `
      <div class="panel-body flush"><div class="tbl-wrap" style="max-height:360px;overflow-y:auto"><table class="data">
        <thead><tr>
          <th class="wrap">${escHtml(cfg.partnerLabel)}</th>
          <th class="num">Mục tiêu</th>
          <th class="num">Luỹ kế</th>
          <th>Tiến độ</th>
          <th class="num">Dự kiến cả năm</th>
          <th>Trạng thái</th>
          ${cfg.supportsLinkedCK?'<th>CK gắn kèm</th>':''}

        </tr></thead>
        <tbody>${targets.map(t=>{
          const p = cfg.partnerById(t.partnerId);
          const calc = yearlyTargetCalc(cfg, t);
          const pctShow = Math.min(100, Math.round(calc.pct*1000)/10);
          const barColor = calc.statusClass==='ok'?'var(--forest)':calc.statusClass==='pending'?'var(--amber)':'var(--rust)';
          const linkedPolicy = (cfg.supportsLinkedCK && t.linkedPolicyId) ? cfg.linkedPolicyById(t.linkedPolicyId) : null;
          return `<tr>
            <td class="wrap">${escHtml(p?p.name:'(đã xoá)')}${t.note?`<div class="meta-line">${escHtml(t.note)}</div>`:''}</td>
            <td class="num">${fmt(t.targetAmount)}</td>
            <td class="num">${fmt(calc.revenue)}</td>
            <td>
              <div style="display:flex;align-items:center;gap:6px">
                <div style="width:52px;height:6px;border-radius:4px;background:var(--paper);overflow:hidden;flex:none"><div style="height:100%;width:${pctShow}%;background:${barColor}"></div></div>
                <span style="font-size:12px;color:var(--slate)">${pctShow}%</span>
              </div>
            </td>
            <td class="num">${fmt(calc.projected)}${calc.fallbackUsed?' <span title="Thiếu dữ liệu cùng kỳ năm trước để so sánh — tạm dùng bình quân tuyến tính" style="color:var(--amber);cursor:help">*</span>':''}</td>
            <td><span class="stamp ${calc.statusClass}">${calc.status}</span></td>

        }).join('')}</tbody>

      `}
    </div>`;

  if(editable){
    const addBtn = el.querySelector('[data-yt-add]');
    if(addBtn) addBtn.addEventListener('click', ()=> openYearlyTargetModal(moduleId, null));
    el.querySelectorAll('[data-yt-edit]').forEach(btn=>{
      btn.addEventListener('click', ()=> openYearlyTargetModal(btn.dataset.ytModule, btn.dataset.ytEdit));
    });
    el.querySelectorAll('[data-yt-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>{

    });
  }
  el.querySelectorAll('[data-goto-policy]').forEach(tag=>{
    tag.addEventListener('click', ()=>{ activeTab='policies'; renderAll(); });
  });

function openYearlyTargetModal(moduleId, targetId){
  const cfg = yearlyTargetModuleConfig(moduleId);
  const existing = targetId ? (state[cfg.fieldKey]||[]).find(t=>t.id===targetId) : null;
  const availablePartners = cfg.partners().filter(p=> existing ? p.id===existing.partnerId : !(state[cfg.fieldKey]||[]).some(t=>t.partnerId===p.id && String(t.year)===String(ytYear)));
  if(!existing && availablePartners.length===0){ toast('Mọi '+cfg.partnerLabel+' đều đã có mục tiêu cho năm '+ytYear); return; }

  openModal(existing?'Sửa mục tiêu năm':'Thêm mục tiêu năm', cfg.label+' · năm '+(existing?existing.year:ytYear), `
    <div class="form-grid">
      <div class="field"><label>${cfg.partnerLabel}</label>
        <select id="yt_partner" ${existing?'disabled':''}>${availablePartners.map(p=>`<option value="${p.id}" ${existing&&existing.partnerId===p.id?'selected':''}>${escHtml(p.name)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Mục tiêu doanh số năm (VNĐ)</label><input id="yt_amount" class="field-money" type="text" inputmode="numeric" value="${existing?fmt(existing.targetAmount):''}"></div>
      <div class="field" style="grid-column:1/-1"><label>Ghi chú</label><input id="yt_note" value="${existing?escAttr(existing.note||''):''}"></div>
      ${cfg.supportsLinkedCK && !existing ? `
      <div class="field" style="grid-column:1/-1">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="yt_link_ck" style="width:auto"> Gắn kèm chiết khấu (tự tạo 1 mốc CK theo YTD = đúng mục tiêu năm)</label>
      </div>
      <div class="field" id="yt_link_rate_wrap" style="display:none"><label>Tỷ lệ CK khi đạt mục tiêu (%)</label><input id="yt_link_rate" type="number" step="0.1" placeholder="VD: 10"></div>
      ` : ''}
      ${cfg.supportsLinkedCK && existing && existing.linkedPolicyId ? `<div class="helper" style="grid-column:1/-1">Mục tiêu này đã gắn kèm 1 mốc CK — vào tab "Chính sách CK" để sửa tỷ lệ hoặc gỡ liên kết.</div>` : ''}
      <button class="btn btn-primary" id="yt_save_btn" style="grid-column:1/-1">${existing?'Lưu':'+ Thêm mục tiêu'}</button>
    </div>
  `, body=>{
    attachMoneyFormatting(document.getElementById('yt_amount'));
    const linkChk = document.getElementById('yt_link_ck');
    if(linkChk){
      linkChk.addEventListener('change', ()=>{
        document.getElementById('yt_link_rate_wrap').style.display = linkChk.checked ? '' : 'none';
      });
    }
    document.getElementById('yt_save_btn').addEventListener('click', ()=>{
      const partnerId = existing ? existing.partnerId : document.getElementById('yt_partner').value;
      if(!partnerId){ toast('Cần chọn '+cfg.partnerLabel); return; }
      const year = existing ? existing.year : Number(ytYear);
      const targetAmount = parseMoneyInput(document.getElementById('yt_amount').value);
      if(!targetAmount || targetAmount<=0){ toast('Nhập mục tiêu doanh số năm hợp lệ'); return; }
      const note = document.getElementById('yt_note').value.trim();
      const p = cfg.partnerById(partnerId);
      if(existing){
        existing.targetAmount = targetAmount;
        existing.note = note;
        logActivity('update', cfg.logLabel, `Sửa mục tiêu năm ${existing.year} của "${p?p.name:''}" → ${fmt(targetAmount)}đ`);
        toast('Đã lưu mục tiêu năm');
      } else {
        const t = {id:uid('yt'), partnerId, year, targetAmount, note, linkedPolicyId:null, createdBy: currentUserId, createdAt: todayISO()};
        const wantLink = cfg.supportsLinkedCK && document.getElementById('yt_link_ck') && document.getElementById('yt_link_ck').checked;
        if(wantLink){
          const rate = (Number(document.getElementById('yt_link_rate').value)||0)/100;
          const pol = {id:uid('p'), supplierId:partnerId, code:'MTN-'+year, type:'CK theo doanh số', cycle:'YTD', threshold:targetAmount, rate, bonusRate:0, startDate:`${year}-01-01`, endDate:`${year}-12-31`, method:'Hồi tố toàn bộ', condition:`Mục tiêu năm ${year}`, status:'Đã đàm phán', note:'Tự tạo từ Mục tiêu năm', unitScope:[]};
          state.policies.push(pol);
          t.linkedPolicyId = pol.id;
        }
        state[cfg.fieldKey].push(t);
        logActivity('create', cfg.logLabel, `Thêm mục tiêu năm ${year} cho "${p?p.name:''}" → ${fmt(targetAmount)}đ${wantLink?' (đã gắn kèm CK)':''}`);
        toast('Đã thêm mục tiêu năm'+(wantLink?' và mốc CK liên kết':''));
      }
      closeModal();
      renderAll();
    });
  });
}

/* ---------------------------- Theo dõi mốc CK ---------------------------- */
function statusStamp(calc){
  if(calc.revenue===null) return `<span class="stamp warn">Cần xác nhận</span>`;
  if(!calc.next) return `<span class="stamp ok">Đã đạt mốc cao nhất</span>`;
  if(calc.revenue>=calc.next.threshold) return `<span class="stamp ok">Đã đạt</span>`;
  return `<span class="stamp pending">Chưa đạt mốc</span>`;
}

        const doDelete = ()=>{
          const trashId = softDelete('suppliers', sup, 'NCC');
          delete state.monitoring[id];
          logActivity('delete','NCC', `Xoá NCC "${sup?sup.name:id}"`);
          toastUndo('Đã xoá NCC "'+(sup?sup.name:id)+'"', trashId);
          renderAll();
        };
        if(hasDeps) confirmModal('NCC này đang có chính sách/doanh số liên quan. Xoá NCC sẽ không xoá các dữ liệu đó nhưng chúng sẽ mất liên kết. Vẫn xoá?', doDelete);
        else doDelete();
      });
    });
  }
}
function escAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
// Escape đầy đủ để chèn AN TOÀN vào nội dung HTML dạng chữ thuần (không phải bên trong value="..." của input).
// Khác escAttr ở chỗ escape thêm "<" và ">" — bắt buộc dùng cho mọi dữ liệu tự do (tên NCC/NH/BH, ghi chú,
// chi tiết Nhật ký hoạt động...) khi hiển thị trực tiếp làm text trên trang, để chặn XSS lưu trữ.
function escHtml(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
/* Ô tiêu đề cột đơn vị trong ma trận NCC/Ngân hàng/Bảo hiểm × Đơn vị — tên dài tự ellipsis 2 dòng, xem đầy đủ qua tooltip.
   Dùng chung cho renderAllocation, renderBankAllocation, renderInsAllocation để tránh bảng bị kéo quá rộng. */
function matrixUnitHeaderCell(unitName){
  const short = String(unitName||'').replace('Đơn vị ','');
  return `<th class="num unit-col" title="${escAttr(short)}"><span class="unit-col-inner">${escHtml(short)}</span></th>`;
}
/* Ô tên hãng/NCC/ngân hàng ở cột đầu ma trận — cũng giới hạn chiều rộng + tooltip, tránh chiếm quá nhiều chỗ cố định */
function matrixRowLabelCell(name){
  return `<td class="row-label" title="${escAttr(name)}">${escHtml(name)}</td>`;
}
/* Colgroup GỢI Ý độ rộng (không ép cứng vì table-layout vẫn auto): cột tên + các cột tổng hợp cuối bảng
   (Tổng, Tỷ trọng, Đơn vị chính, Gợi ý...) được gợi ý % để không bị trình duyệt giãn quá rộng; các cột
   đơn vị (số liệu tiền, độ dài thay đổi theo dữ liệu) CỐ TÌNH để trống width — browser tự giãn theo đúng
   độ dài số thực tế, tránh số bị ép hẹp rồi tràn/đè chữ sang ô bên cạnh (lỗi đã gặp khi ép % cứng + fixed).
   trailingPcts: mảng % cho từng cột cố định ở cuối bảng, theo đúng thứ tự xuất hiện. */
function matrixColgroupHTML(unitCount, trailingPcts){
  const namePct = 16;
  let cols = `<col style="width:${namePct}%">`;
  for(let i=0;i<unitCount;i++) cols += `<col>`;
  trailingPcts.forEach(p=> cols += `<col style="width:${p}%">`);
  return `<colgroup>${cols}</colgroup>`;
}
/* Gim (sticky) đúng cách cho bảng có NHIỀU hàng tiêu đề (VD: hàng "Người phụ trách" phụ trong Ma trận NCC × Đơn vị).
   CSS chỉ đặt top:0 cho mọi <th>, nên hàng tiêu đề thứ 2 trở đi cần được JS đo chiều cao hàng phía trên rồi
   gán top offset tương ứng — nếu không sẽ đè lên nhau khi cuộn dọc (đúng lỗi trong ảnh người dùng gửi). */
function wireStickyHeaderRows(tbl){
  const rows = tbl.querySelectorAll('thead tr');
  let offset = 0;
  rows.forEach(row=>{
    row.querySelectorAll('th').forEach(th=>{ th.style.top = offset+'px'; });
    offset += row.getBoundingClientRect().height;
  });
}
/* Ô tiêu đề cột gọn cho các bảng dữ liệu (không phải ma trận): tên viết tắt + phụ đề nhỏ bên dưới,
   tooltip hiện đầy đủ ý nghĩa khi rê chuột — tránh header dài tràn ngang bảng. */
function thCompact(main, sub, fullTip, numeric){
  return `<th class="${numeric?'num':''}" title="${escAttr(fullTip||main)}"><span class="th-compact"><span class="th-main">${main}</span>${sub?`<span class="th-sub">${sub}</span>`:''}</span></th>`;
}
/* wireCellEdits: gắn sự kiện sửa trực tiếp trên bảng + ghi Nhật ký hoạt động.
   labelFn(item) trả về tên hiển thị của dòng để ghi log cho dễ đọc. */
function wireCellEdits(tbl, arr, entityName, labelFn){
  tbl.querySelectorAll('[data-field]').forEach(el=>{
    if(el.classList.contains('money')) attachMoneyFormatting(el);
    el.addEventListener('change', ()=>{
      const item = arr.find(x=>x.id===el.dataset.id);
      if(!item) return;
      let val = el.value;
      if(el.classList.contains('money')) val = parseMoneyInput(val);
      else if(el.classList.contains('pct')) val = (Number(val)||0)/100;
      else if(el.classList.contains('num')) val = Number(val)||0;
      else if(el.dataset.field==='vehicle') val = formatVehicleField(val);
      const before = item[el.dataset.field];
      // Chặn Ngày kết thúc sớm hơn Ngày bắt đầu khi sửa trực tiếp trong bảng (áp dụng cho mọi bảng có cả
      // 2 field này — Chính sách CK/Chính sách NH/Biểu phí bảo hiểm — không ảnh hưởng bảng khác vì chúng
      // dùng tên field khác, vd fromDate/toDate).
      if((el.dataset.field==='startDate'||el.dataset.field==='endDate') && 'startDate' in item && 'endDate' in item){
        const newStart = el.dataset.field==='startDate' ? val : item.startDate;
        const newEnd = el.dataset.field==='endDate' ? val : item.endDate;
        if(newStart && newEnd && newEnd < newStart){
          toast('Ngày kết thúc không được sớm hơn Ngày bắt đầu');
          el.value = before||'';
          return;
        }
      }
      item[el.dataset.field] = val;
      if(el.classList.contains('money')) el.value = formatMoneyValue(val);
      if(el.classList.contains('pct')) el.value = round2(val*100);
      if(el.dataset.field==='vehicle') el.value = val;
      if(entityName) logActivity('update', entityName, `${labelFn?labelFn(item):item.id}: ${el.dataset.field} "${before}" → "${val}"`);
      saveState();
      if(['name','supplierId','type','threshold','rate','startDate','endDate','confirmed','product'].includes(el.dataset.field)) renderAll();
    });
  });
}

/* ---------------------------- Doanh số ----------------------------
   Luật xoá dùng chung cho cả 3 sổ Doanh số (NCC/Ngân hàng/Bảo hiểm): Admin/Quản lý luôn xoá được (miễn
   không bị khoá bởi kỳ đối soát đã chốt). Nhân viên chỉ được xoá ĐÚNG bản ghi do mình nhập, và CHỈ trong
   vòng 24 giờ kể từ lúc nhập — quá 24h thì nút xoá tự ẩn với Nhân viên (kể cả bản ghi của chính họ), muốn
   xoá phải nhờ Quản lý/Admin. Bản ghi cũ chưa từng có `createdAt` (tạo trước khi có luật này) được coi như
   đã quá hạn 24h, để không vô tình mở lại quyền xoá dữ liệu cũ cho Nhân viên. */
const DELETE_WINDOW_MS = 24*3600*1000;
function canDeleteTxGeneric(t, reconList, idField){
  if(isRecordLockedForMe(t, reconList, idField)) return false;
  if(['Admin','Quản lý'].includes(currentRole())) return true;
  if(t.createdBy!==currentUserId) return false;
  if(!t.createdAt) return false;
  return (Date.now() - new Date(t.createdAt).getTime()) <= DELETE_WINDOW_MS;
}
function canDeleteTx(t){ return canDeleteTxGeneric(t, state.reconciliations, 'supplierId'); }
function canDeleteBankTx(t){ return canDeleteTxGeneric(t, state.bankReconciliations, 'bankId'); }
function canDeleteInsTx(t){ return canDeleteTxGeneric(t, state.insReconciliations, 'insurerId'); }

  setTitle('Doanh số', state.transactions.length+' chứng từ — mỗi dòng là 1 hoá đơn/chứng từ theo đơn vị & NCC');
  const editable = canEdit('transactions'); // Admin, Quản lý, Nhân viên đều được ghi nhận doanh số

function getFilteredTx(){
  const unitFilter = (txUnitFilter||'').trim().toLowerCase();
  const supFilter = (txSupplierFilter||'').trim().toLowerCase();
  const me = currentUser();
  const lockedUnits = (me && me.role==='Nhân viên') ? accountUnits(me) : [];
  const pf = partnerScopeFilter('supplierId');
  const all = (pf ? state.transactions.filter(pf) : state.transactions).slice().sort((a,b)=> b.date.localeCompare(a.date));
  return all.filter(t=>{
    if(lockedUnits.length && !lockedUnits.includes(t.unit)) return false; // Nhân viên chỉ thấy đúng (các) đơn vị được phân bổ, dù bộ lọc trên màn hình là gì
    if(unitFilter && !(t.unit||'').trim().toLowerCase().includes(unitFilter)) return false;
    if(supFilter){
      const s = supplierById(t.supplierId);
      if(!s || !s.name.trim().toLowerCase().includes(supFilter)) return false;
    }
    if(!periodFilterMatches(t.date)) return false;
    return true;
  });
}

    tbl.outerHTML = `<div class="empty"><div class="big">Chưa có chứng từ nào</div>${editable?'Ghi nhận doanh số đầu tiên ở form phía trên.':''}</div>`; return;

    tbl.insertAdjacentHTML('afterend', `<div class="empty"><div class="big">Không có chứng từ nào khớp bộ lọc hiện tại</div></div>`);

  tbl.innerHTML = `
    <thead><tr><th>Ngày</th><th>Đơn vị</th><th class="wrap">NCC</th><th>Số CT</th><th>Nhóm hàng</th>
      <th class="num">Trước VAT</th><th class="num">Trả hàng</th><th class="num">DS tính CK</th><th>Người nhập</th><th>Hoá đơn</th><th></th></tr></thead>
    <tbody>${sorted.map(t=>{
      const s = supplierById(t.supplierId);
      const net = (Number(t.gross)||0)-(Number(t.returns)||0);

      return `<tr>
        <td>${new Date(t.date+'T00:00:00').toLocaleDateString('vi-VN')}</td>

  wireInvoiceAttachColumn(tbl, state.transactions, 'Doanh số', t=>{ const s=supplierById(t.supplierId); return 'Doanh số NCC · '+(s?s.name:''); });
  wireLockToggle(tbl);
  tbl.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const t = state.transactions.find(x=>x.id===btn.dataset.del);

      const s = t ? supplierById(t.supplierId) : null;

      logActivity('delete','Doanh số', `Xoá chứng từ ${t?t.doc||'':''} (${s?s.name:''}, ${t?fmt(t.gross):''}đ)`);
      toastUndo('Đã xoá chứng từ', trashId);
      renderAll();
    });
  });
}

function periodFilterDateObjects(){
  const {from, to} = periodFilterRange();
  return { from: from ? toDate(from) : null, to: to ? toDate(to) : null };
}

        <div style="display:flex;flex-wrap:wrap;gap:8px">
          ${state.units.map(u=>`

              ${canManageUnits ? `<button class="row-del" data-del-unit-alloc="${escAttr(u)}" title="Xoá đơn vị ${escAttr(u)}" style="padding:0 4px">✕</button>` : ''}
            </span>`).join('')}
        </div>`}
      </div>
    </div>`}
    <div class="panel">
      <div class="panel-head"><div><h2>${partnerAcc?'Doanh số theo Đơn vị':'Ma trận NCC × Đơn vị'}</h2>
      <div class="desc">${state.units.length} đơn vị hiện có${partnerAcc?'':' · sửa danh sách đơn vị ở tab Cài đặt · % dưới mỗi ô là % hoàn thành chỉ tiêu đơn vị so với mốc đã phân bổ (xem/chỉnh ở nút "Phân bổ đơn vị" trong tab Chính sách CK; mốc chưa phân bổ chỉ tiêu sẽ không hiện %)'}</div></div></div>
      <div class="panel-body flush"><div class="matrix-scroll"><table class="data matrix-fixed" id="allocTable"></table></div></div>
    </div>
  `;
  if(canEdit('accounts')) document.getElementById('gotoAccountsBtn').addEventListener('click', ()=>{ activeTab='accounts'; renderAll(); });
  if(canManageUnits) document.querySelectorAll('[data-del-unit-alloc]').forEach(btn=>{

      const usage = unitUsage(u);
      const msg = usage.total>0

      confirmModal(msg, ()=>{

  const tbl = document.getElementById('allocTable');
  const pf = partnerScopeFilter('supplierId');

  if(supplierScope.length===0){
    tbl.outerHTML = `<div class="empty"><div class="big">Chưa có NCC</div></div>`; return;
  }
  // Mốc dùng để tính % hoàn thành theo đơn vị: CHỈ xét trong số các mốc ĐÃ ĐƯỢC PHÂN BỔ chỉ tiêu
  // (bỏ qua các mốc chưa cấu hình unitTargets, dù threshold gần hơn) — vì mốc chưa phân bổ gì thì
  // không có cơ sở tính %, và người dùng thường chỉ chủ động phân bổ đúng 1 mốc họ đang thực sự theo dõi.
  // Trong số các mốc đã phân bổ: ưu tiên mốc GẦN NHẤT CHƯA ĐẠT; nếu không còn mốc nào phía trên,
  // lấy mốc đã phân bổ có threshold cao nhất (đã đạt) để vẫn có % tham chiếu.
  function matrixTargetPolicyFor(supplierId, total){
    const withTargets = state.policies.filter(p=>p.supplierId===supplierId && p.unitTargets && Object.keys(p.unitTargets).length>0);

  }
  const {from: pfFrom, to: pfTo} = periodFilterDateObjects();
  const rows = supplierScope.map(s=>{
    const perUnit = state.units.map(u=>sumRevenue(s.id, pfFrom, pfTo, u));
    const total = perUnit.reduce((a,b)=>a+b,0);
    const max = Math.max(0,...perUnit);
    const share = total>0 ? max/total : 0;
    const topIdx = perUnit.indexOf(max);
    const targetPolicy = matrixTargetPolicyFor(s.id, total);
    return {s, perUnit, total, share, topUnit: total>0?state.units[topIdx]:'—', targetPolicy};
  });
  tbl.innerHTML = `
    ${matrixColgroupHTML(state.units.length, partnerAcc ? [20, 20] : [8, 11, 13, 16])}

    </tr>
    </thead>
    <tbody>${rows.map(r=>`
      <tr>
        ${matrixRowLabelCell(r.s.name)}

          const u = state.units[i];
          const target = (r.targetPolicy && r.targetPolicy.unitTargets) ? Number(r.targetPolicy.unitTargets[u])||0 : 0;
          const pct = target>0 ? Math.round(v/target*100) : null;
          const pctColor = pct===null ? '' : pct>=100 ? 'var(--forest)' : pct>=70 ? 'var(--amber)' : 'var(--rust)';
          return `<td class="num">${v>0?fmt(v):'—'}${pct!==null?`<div style="font-size:10px;font-weight:700;color:${pctColor}">${pct}%</div>`:''}</td>`;
