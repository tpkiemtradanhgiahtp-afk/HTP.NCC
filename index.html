<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản trị mục tiêu Đối tác/NCC · Doanh số &amp; Chiết khấu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12172B;
    --ink-soft:#1E2540;
    --paper:#F6F4EF;
    --panel:#FFFFFF;
    --line:#E4DFD3;
    --gold:#B8863B;
    --gold-soft:#EFE2C6;
    --slate:#5B6472;
    --forest:#2F6B4F;
    --forest-soft:#E3EEE7;
    --rust:#B54834;
    --rust-soft:#F5E4DF;
    --amber:#9C6B12;
    /* Font chính: Inter (tải qua Google Fonts) — hỗ trợ đầy đủ dấu tiếng Việt (kể cả dấu đôi: ố, ệ, ẫ...),
       trông hiện đại/chuyên nghiệp hơn font hệ thống mặc định, phổ biến trong các app quản trị/SaaS hiện nay.
       Vẫn giữ chuỗi fallback hệ thống phía sau để app không "trắng trang" nếu mất mạng/chặn Google Fonts. */
    --font-display: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    /* Số liệu (tiền, %, KPI): dùng Inter + tabular-nums để chữ số đều hàng thẳng cột như số đếm,
       nhưng vẫn đồng bộ kiểu chữ với toàn app — thay vì để font monospace tách biệt kiểu "code". */
    --font-tabular: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    /* Chỉ dùng cho khối nhập mã/JSON (VD cấu hình Firebase) — nơi cần font monospace thật sự */
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace;
    /* Chỉ dùng cho tiêu đề màn hình đăng nhập — font serif đậm tạo điểm nhấn "thương hiệu" khác biệt
       so với phần còn lại của app (vẫn dùng Inter). */
    --font-login-title: 'Playfair Display', Georgia, 'Times New Roman', serif;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }

  ::selection{ background:var(--gold-soft); }

  /* ---------- Layout shell ---------- */
  .shell{ display:flex; min-height:100vh; }

  .sidebar{
    width:288px; flex:0 0 288px;
    background:var(--ink);
    color:#E8E6DE;
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{
    padding:26px 22px 18px;
    border-bottom:1px solid rgba(255,255,255,0.08);
    text-align:center;
  }
  .brand .mark{
    font-family:var(--font-display);
    line-height:1.3;
    color:#F3ECD9;
  }
  .brand .mark .l1{
    display:block; font-weight:700; font-size:22px; letter-spacing:0.04em; text-transform:uppercase;
  }
  .brand .mark .l2{
    display:block; font-weight:500; font-size:16px; letter-spacing:0.01em; color:#C9CADA; margin-top:3px;
  }
  .brand .sub{
    font-size:11px; letter-spacing:0.09em; text-transform:uppercase;
    color:#9098B0; margin-top:8px;
  }

  .nav{ padding:14px 10px; flex:1; overflow-y:auto; }
  /* Mỗi khối module giờ có nền hơi khác 1 chút + bo góc + khoảng cách rõ ràng với khối kế tiếp, để mắt
     phân vùng nhanh giữa các module (Tổng quan / NCC / Ngân hàng / Bảo hiểm / Hệ thống) mà không cần đọc
     hết chữ — thay cho cách cũ chỉ có 1 đường kẻ mảnh phía trên mỗi khối. */
  .nav-group{
    margin-bottom:10px; padding:4px 0 6px; border-radius:10px;
    background:rgba(255,255,255,0.022);
  }
  .nav-group-items{
    margin-left:15px; padding-left:9px;
    border-left:1px solid rgba(255,255,255,0.08);
  }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:8px 12px; border-radius:8px;
    color:#C7CBDB; cursor:pointer; margin-bottom:1px;
    font-size:13.5px; letter-spacing:0.01em;
    border:1px solid transparent;
    transition:background .12s ease, color .12s ease;
  }
  .nav-item:hover{ background:var(--ink-soft); color:#F3ECD9; }
  .nav-item.active{
    background:var(--ink-soft); color:#F3ECD9;
    border-color:rgba(184,134,59,0.45);
  }
  .nav-item .dot{
    width:6px;height:6px;border-radius:50%;
    background:#57607E; flex:0 0 auto;
  }
  .nav-item.active .dot{ background:var(--gold); }
  .nav-item .label-text{ min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .alert-dot{
    margin-left:auto; flex:0 0 auto;
    background:var(--rust); color:#fff; font-size:10px; font-weight:700;
    min-width:16px; height:16px; border-radius:9px;
    display:inline-flex; align-items:center; justify-content:center; padding:0 4px;
  }
  .subtab-item .alert-dot{ margin-left:6px; }
  /* Chớp sáng 1 nhịp để chỉ đúng dòng vừa tạo — dùng cho "Yêu cầu / Trao đổi" sau khi gửi yêu cầu mới,
     tránh người dùng phải tự dò tìm trong danh sách (đặc biệt khi nó không nằm ở đầu danh sách). */
  @keyframes flashHighlight{ 0%{ background:var(--gold-soft); } 100%{ background:transparent; } }
  .flash-highlight{ animation: flashHighlight 1.8s ease-out; }
  /* Nhấp nháy liên tục cho các dòng "Quá hạn"/"Sắp đến hạn" trong Lịch tái tục — vì bảng đã tự sắp lên đầu
     theo số ngày còn lại (daysLeft tăng dần, quá hạn luôn âm nên luôn đứng trước), hiệu ứng này chỉ để
     mắt bắt được ngay cả khi không nhìn thẳng vào bảng. Tôn trọng prefers-reduced-motion cho người dùng
     nhạy cảm với hiệu ứng nhấp nháy. */
  @keyframes renewalPulseOverdue{ 0%,100%{ background:transparent; } 50%{ background:var(--rust-soft); } }
  @keyframes renewalPulseSoon{ 0%,100%{ background:transparent; } 50%{ background:var(--gold-soft); } }
  tr.renewal-pulse-overdue{ animation: renewalPulseOverdue 1.6s ease-in-out infinite; }
  tr.renewal-pulse-soon{ animation: renewalPulseSoon 1.9s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){
    tr.renewal-pulse-overdue{ animation:none; background:var(--rust-soft); }
    tr.renewal-pulse-soon{ animation:none; background:var(--gold-soft); }
  }
  /* Spinner nhỏ dùng cho các trạng thái "đang xử lý" (upload, gửi email...) — cho người dùng thấy rõ hệ
     thống đang chạy chứ không phải bị đứng, nhất là khi mạng chậm và phải chờ lâu. */
  @keyframes miniSpin{ to{ transform:rotate(360deg); } }
  .mini-spinner{
    display:inline-block; width:12px; height:12px; margin-right:6px; vertical-align:-2px;
    border:2px solid var(--line); border-top-color:var(--slate); border-radius:50%;
    animation:miniSpin .7s linear infinite;
  }
  .hint-banner{
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    background:var(--gold-soft); border:1px solid var(--gold); border-radius:10px;
    padding:12px 14px; margin-bottom:16px; font-size:13px; line-height:1.5;
  }
  .hint-banner .hint-dismiss{
    border:none; background:none; cursor:pointer; color:var(--slate); font-size:14px;
    flex:0 0 auto; padding:0 2px;
  }
  .hint-banner .hint-dismiss:hover{ color:var(--ink); }
  .info-toggle{
    background:none; border:1px solid var(--line); border-radius:6px; padding:3px 10px;
    font-size:11.5px; color:var(--slate); cursor:pointer;
  }
  .info-toggle:hover{ background:#FBFAF3; color:var(--ink); }
  .nav-section{
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; font-weight:700;
    color:#9BA3C4; margin:0 2px 8px; padding:8px 10px 8px;
    display:flex; align-items:center; gap:8px;
    cursor:pointer; border-radius:8px; user-select:none;
    transition:color .15s ease, background .15s ease;
    white-space:nowrap;
  }
  .nav-section .nav-section-label{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .nav-section:hover{ color:#F3ECD9; background:rgba(255,255,255,0.04); }
  .nav-section .nav-section-caret{
    font-size:9px; line-height:1; color:#8891B0;
    width:18px; height:18px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    border-radius:5px; background:rgba(255,255,255,0.07);
    transition:transform .18s ease, background .15s ease, color .15s ease;
  }
  .nav-section:hover .nav-section-caret{ background:rgba(255,255,255,0.14); color:#F3ECD9; }
  .nav-section.collapsed .nav-section-caret{ transform:rotate(-90deg); }
  .soon-tag{
    margin-left:auto; font-size:9.5px; letter-spacing:0.04em; text-transform:uppercase;
    color:#C9AA6A; background:rgba(201,170,106,0.14); border:1px solid rgba(201,170,106,0.28);
    padding:1px 6px; border-radius:5px;
  }

  .footer-note{
    padding:14px 20px 20px; font-size:11px; color:#6C7592; line-height:1.5;
    border-top:1px solid rgba(255,255,255,0.08);
  }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }

  .topbar{
    background:var(--panel); border-bottom:1px solid var(--line);
    padding:16px 32px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:5;
  }
  .topbar h1{
    font-family:var(--font-display); font-weight:600; font-size:21px; margin:0;
    letter-spacing:0.01em;
  }
  .topbar .meta{ font-size:12px; color:var(--slate); margin-top:2px; }
  .subtabs{
    display:flex; gap:6px; padding:14px 32px 0; background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .subtab-item{
    padding:9px 16px; font-size:13.5px; font-weight:600; color:var(--slate);
    cursor:pointer; border-radius:8px 8px 0 0; border:1px solid transparent; border-bottom:none;
    margin-bottom:-1px; transition:background .12s ease, color .12s ease;
  }
  .subtab-item:hover{ color:var(--ink); background:rgba(0,0,0,0.03); }
  .subtab-item.active{
    color:var(--ink); background:var(--paper); border-color:var(--line);
  }
  @media (max-width:720px){ .subtabs{ padding:12px 16px 0; } }
  .topbar-right{ display:flex; align-items:center; gap:14px; }
  .storage-pill{
    font-size:11px; padding:5px 10px; border-radius:999px;
    background:var(--forest-soft); color:var(--forest); border:1px solid rgba(47,107,79,0.25);
    display:flex; align-items:center; gap:6px;
  }
  .storage-pill.offline{ background:var(--rust-soft); color:var(--rust); border-color:rgba(181,72,52,.25); }
  .storage-pill .blip{ width:6px;height:6px;border-radius:50%; background:currentColor; }

  .content{ padding:28px 32px 60px; max-width:1400px; }

  /* ---------- Cards / KPI (thu gọn — chỉ Dashboard dùng .kpi-*, an toàn khi chỉnh riêng ở đây) ---------- */
  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; }
  @media (max-width:1100px){ .kpi-row{ grid-template-columns:repeat(2,1fr);} }
  .kpi-card{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:12px 14px 10px; position:relative; overflow:hidden;
  }
  .kpi-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--gold);
  }
  .kpi-card.rust::before{ background:var(--rust); }
  .kpi-card.forest::before{ background:var(--forest); }
  .kpi-card.amber::before{ background:var(--amber); }
  .kpi-label{ font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--slate); line-height:1.35; }
  .kpi-value{ font-family:var(--font-tabular); font-variant-numeric:tabular-nums; font-size:18px; font-weight:600; margin-top:3px; letter-spacing:-0.01em; }
  .kpi-sub{ font-size:10.5px; color:var(--slate); margin-top:2px; line-height:1.4; }
  .mini-stats-row{ display:flex; gap:22px; align-items:center; }
  .mini-stat{ text-align:right; }
  .mini-stat-label{ font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--slate); white-space:nowrap; }
  .mini-stat-value{ font-family:var(--font-tabular); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; margin-top:2px; white-space:nowrap; }
  @media (max-width:900px){ .mini-stats-row{ width:100%; justify-content:flex-start; } .mini-stat{ text-align:left; } }
  .section-divider{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--slate);
  }
  /* Hàng tiêu đề khối Dashboard: tên khối bên trái + biểu đồ cột nhỏ xu hướng 6 tháng bên phải (góc tương
     ứng của từng khối NCC/Ngân hàng/Bảo hiểm), thay cho .section-divider tự mang margin/border trước đây. */
  .section-head-row{
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
    margin:20px 0 10px; padding-top:16px; border-top:1px solid var(--line);
  }
  .section-head-row:first-child{ margin-top:0; padding-top:0; border-top:none; }
  .section-head-row .section-divider{ margin:0; padding:0; border:none; }
  .dash-trend{ display:flex; align-items:center; gap:8px; }
  .dash-trend svg{ display:block; flex:0 0 auto; }
  .dash-trend-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--slate); white-space:nowrap; }
  .dash-trend-delta{ font-size:12px; margin-top:1px; white-space:nowrap; }

  /* ---------- Dải thống kê gọn (thay cho kpi-card khi cần tiết kiệm chiều cao) ---------- */
  .stat-strip{
    display:flex; flex-wrap:wrap; gap:10px; align-items:stretch;
  }
  .stat-chip{
    display:flex; align-items:center; gap:10px;
    background:#FBFAF6; border:1px solid var(--line); border-radius:8px;
    padding:8px 14px; font-size:12.5px;
  }
  .stat-chip .stat-dot{ width:8px; height:8px; border-radius:50%; background:var(--gold); flex:0 0 auto; }
  .stat-chip.rust .stat-dot{ background:var(--rust); }
  .stat-chip.forest .stat-dot{ background:var(--forest); }
  .stat-chip b{ font-family:var(--font-tabular); font-variant-numeric:tabular-nums; font-size:13.5px; }
  .stat-chip .stat-label{ color:var(--slate); }
  .info-tip{
    display:inline-flex; align-items:center; justify-content:center;
    width:15px; height:15px; border-radius:50%; background:var(--line); color:var(--slate);
    font-size:10px; font-weight:700; cursor:help; flex:0 0 auto;
  }

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    margin-bottom:24px; overflow:hidden;
  }
  .panel-head{
    padding:16px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .panel-head h2{ font-family:var(--font-display); font-size:16px; margin:0; font-weight:700; }
  .panel-head .desc{ font-size:12px; color:var(--slate); margin-top:3px; }
  .panel-body{ padding:18px 20px 20px; }
  .panel-body.flush{ padding:0; }

  /* ---------- Tables ---------- */
  .tbl-wrap{ overflow-x:auto; }
  /* Bảng Sổ chứng từ/hợp đồng/hồ sơ vay — có thể rất dài theo thời gian. Thay vì để cả trang cuộn dài vô tận,
     giới hạn chiều cao và cho bảng tự cuộn dọc RIÊNG bên trong khung của chính nó, kèm tiêu đề cột dán cứng.
     Dùng position:sticky trong PHẠM VI khung cuộn riêng này (không phải cuộn trang) nên không lặp lại lỗi đã
     từng gặp ở table.data th (nhiều bảng cùng dán cứng theo cuộn TRANG khiến tiêu đề đè lên nhau) — mỗi bảng
     .tbl-wrap-tall có khung cuộn độc lập của riêng nó. */
  .tbl-wrap-tall{ max-height:64vh; overflow:auto; }
  .tbl-wrap-tall table.data thead th{ position:sticky; top:0; z-index:3; }
  table.data{ width:100%; border-collapse:collapse; font-size:12.8px; }
  table.data th{
    text-align:left; font-size:10.8px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--slate); font-weight:600; padding:9px 12px; border-bottom:1px solid var(--line);
    background:#FBFAF6; white-space:nowrap;
    /* Đã THỬ dán cứng (position:sticky) để không mất tiêu đề khi cuộn bảng dài, nhưng khi trang có NHIỀU
       bảng liên tiếp (VD "Bảng theo dõi mốc CK" + "Tất cả NCC"), mỗi bảng tự dán ở cùng 1 mốc pixel khiến
       tiêu đề của bảng dưới đè chồng lên giữa các dòng dữ liệu của chính nó hoặc bảng khác — che mất dữ
       liệu thật, TỆ HƠN hẳn so với việc chỉ mất tiêu đề khi cuộn. Đã hoàn tác về cách cũ (không dán cứng)
       vì che mất dữ liệu là lỗi nghiêm trọng hơn nhiều so với bất tiện thiếu tiêu đề khi cuộn. */
  }
  table.data td{
    padding:9px 12px; border-bottom:1px solid #F0EDE4; vertical-align:middle; white-space:nowrap;
  }
  table.data tbody tr:hover{ background:#FBFAF3; }
  table.data td.num, table.data th.num{ font-family:var(--font-tabular); font-variant-numeric:tabular-nums; text-align:right; }
  table.data td.wrap, table.data th.wrap{ white-space:normal; min-width:180px; }
  /* Bảng "Lịch tái tục" — ít cột, mỗi cột thường chỉ vài chữ ngắn, nên nếu để mặc định width:100% + padding
     như các bảng nhiều cột khác thì bị dàn quá thưa, nhìn trống trải. Giảm padding dòng/cột + không ép full
     width để các cột tự co theo đúng nội dung, đỡ "loãng". */
  #renewalTable{ width:auto; }
  #renewalTable th, #renewalTable td{ padding:6px 16px 6px 0; }
  #renewalTable th:first-child, #renewalTable td:first-child{ padding-left:0; }
  #renewalTable th.wrap, #renewalTable td.wrap{ min-width:0; } /* bỏ min-width:180px mặc định để header 2 dòng + ô Biển số thật sự co gọn được */
  /* Cột "Nguồn" (Qua khoản vay / BH độc lập) — chữ nhỏ hơn 1 chút + giãn letter-spacing để đọc vẫn rõ,
     đồng thời không bao giờ tự xuống dòng dù cột bị co hẹp do các cột khác giành chỗ. */
  #renewalTable td:first-child{ font-size:12.3px; letter-spacing:0.015em; white-space:nowrap; }
  /* Cố định 2 cột đầu (Ngân hàng, Gói vay) khi cuộn ngang bảng Chính sách CK NH — ÉP CỨNG chiều rộng
     (không dùng min-width/wrap co giãn) để mốc "left" của cột 2 luôn khớp chính xác với chiều rộng thật
     của cột 1, tránh lặp lại lỗi từng gặp khi ước lượng pixel không chính xác (dán cứng dòng tiêu đề). */
  .sticky-cols-2 th:nth-child(1), .sticky-cols-2 td:nth-child(1){
    position:sticky; left:0; z-index:2; width:150px; max-width:150px; min-width:150px;
    white-space:normal; background:var(--panel); border-right:1px solid var(--line);
  }
  .sticky-cols-2 th:nth-child(2), .sticky-cols-2 td:nth-child(2){
    position:sticky; left:150px; z-index:2; width:150px; max-width:150px; min-width:150px;
    white-space:normal; background:var(--panel); border-right:1px solid var(--line);
  }
  .sticky-cols-2 th:nth-child(1), .sticky-cols-2 th:nth-child(2){ background:#FBFAF6; z-index:3; }
  /* Cố định 4 cột đầu (NCC, Mã CS, Loại, Chu kỳ) khi cuộn ngang bảng Chính sách CK NCC — cùng nguyên tắc
     ép cứng chiều rộng như .sticky-cols-2 ở trên, để mốc "left" từng cột luôn khớp chính xác tuyệt đối. */
  .sticky-cols-4 th:nth-child(1), .sticky-cols-4 td:nth-child(1){
    position:sticky; left:0; z-index:2; width:170px; max-width:170px; min-width:170px;
    white-space:normal; background:var(--panel);
  }
  .sticky-cols-4 th:nth-child(2), .sticky-cols-4 td:nth-child(2){
    position:sticky; left:170px; z-index:2; width:90px; max-width:90px; min-width:90px;
    white-space:normal; background:var(--panel);
  }
  .sticky-cols-4 th:nth-child(3), .sticky-cols-4 td:nth-child(3){
    position:sticky; left:260px; z-index:2; width:150px; max-width:150px; min-width:150px;
    white-space:normal; background:var(--panel);
  }
  .sticky-cols-4 th:nth-child(4), .sticky-cols-4 td:nth-child(4){
    position:sticky; left:410px; z-index:2; width:120px; max-width:120px; min-width:120px;
    white-space:normal; background:var(--panel); border-right:1px solid var(--line);
  }
  .sticky-cols-4 th:nth-child(1), .sticky-cols-4 th:nth-child(2), .sticky-cols-4 th:nth-child(3), .sticky-cols-4 th:nth-child(4){ background:#FBFAF6; z-index:3; }
  .row-del{

    padding:2px 6px; border-radius:5px; line-height:1;
  }
  .row-del:hover{ background:var(--rust-soft); }

  /* inline editable cell */

    padding:4px 5px; border-radius:5px; font-family:inherit;

  /* ---------- Forms ---------- */
  .form-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px 12px; align-items:end; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:10.8px; text-transform:uppercase; letter-spacing:0.06em; color:var(--slate); }
  .field input, .field select{

  .field input:focus, .field select:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft); }

  .btn{

    font-size:13px; font-weight:600; cursor:pointer; border:1px solid transparent; white-space:nowrap;

  .btn-primary{ background:var(--ink); color:#F3ECD9; }
  .btn-primary:hover{ background:var(--ink-soft); }
  .btn-ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
  .btn-ghost:hover{ background:#FBFAF3; }
  .btn-gold{ background:var(--gold); color:#fff; }
  .btn-gold:hover{ background:var(--amber); }
  .btn-sm{ padding:5px 10px; font-size:11.5px; border-radius:6px; }
  .btn-danger-ghost{ background:transparent; color:var(--rust); border-color:var(--rust-soft); }
  .btn-danger-ghost:hover{ background:var(--rust-soft); }

  /* ---------- Đính kèm hợp đồng (modal) ---------- */
  .contract-badge{

    background:#EFEDE6; color:var(--slate);

  .contract-badge.st-active{ background:var(--forest-soft); color:var(--forest); }
  .contract-badge.st-expiring{ background:var(--gold-soft); color:var(--amber); }
  .contract-badge.st-expired{ background:var(--rust-soft); color:var(--rust); }
  .contract-badge .cnt-extra{ font-weight:600; opacity:0.75; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(18,23,43,0.5); z-index:10000;
    display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px;
    overflow-y:auto;
  }
  .modal-box{
    background:var(--panel); border-radius:12px; width:100%; max-width:760px;
    box-shadow:0 20px 60px rgba(0,0,0,.3); overflow:hidden;

  .modal-head{
    padding:16px 22px; border-bottom:1px solid var(--line);

  }
  .modal-head h2{ font-family:var(--font-display); font-size:16px; margin:0; font-weight:700; }
  .modal-head .desc{ font-size:12px; color:var(--slate); margin-top:2px; }
  .modal-close{

  }
  .modal-close:hover{ background:#F0EDE4; color:var(--ink); }
  .modal-body{ padding:20px 22px 22px; max-height:74vh; overflow-y:auto; }

  .contract-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .contract-row{
    border:1px solid var(--line); border-radius:9px; padding:12px 14px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .contract-row.is-superseded{ opacity:0.6; background:#FBFAF6; }
  .contract-main{ display:flex; flex-direction:column; gap:4px; min-width:200px; }
  .contract-main .c-title{ font-weight:700; font-size:13.2px; }
  .contract-main .c-meta{ font-size:11.3px; color:var(--slate); }
  .contract-main .c-note{ font-size:11.3px; color:var(--slate); font-style:italic; }
  .contract-actions{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .contract-link{
    font-size:12px; font-weight:600; color:var(--gold); text-decoration:none;
    padding:5px 10px; border:1px solid var(--gold-soft); border-radius:6px;
  }
  .contract-link:hover{ background:var(--gold-soft); }
  .contract-link.disabled{ color:var(--slate); border-color:var(--line); pointer-events:none; }
  .contract-form-title{ font-family:var(--font-display); font-size:13.5px; font-weight:700; margin:4px 0 12px; }
  .btn[disabled]{ opacity:0.45; cursor:not-allowed; }

  /* ---------- Stamp badges ---------- */
  .stamp{
    display:inline-flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;
    padding:4px 10px; border-radius:999px; border:1.5px dashed currentColor;
    transform:rotate(-1.2deg);
  }
  .stamp.ok{ color:var(--forest); background:var(--forest-soft); }
  .stamp.warn{ color:var(--rust); background:var(--rust-soft); }
  .stamp.pending{ color:var(--amber); background:var(--gold-soft); }
  .stamp.muted{ color:var(--slate); background:#EFEDE6; border-color:#C7C2B2; }

  .mini-field{
    border:1px solid transparent; background:transparent; padding:2px 4px; border-radius:4px;
    font-size:12.5px; width:100%; color:var(--ink); font-family:inherit;
  }
  .mini-field:hover{ border-color:var(--line); background:#fff; }
  .mini-field:focus{ border-color:var(--gold); background:#fff; outline:none; }
  .mini-field.muted{ color:var(--slate); font-size:11.5px; }
  .mini-field.italic{ font-style:italic; }
  .th-compact{ display:flex; flex-direction:column; gap:1px; cursor:help; }
  .th-compact .th-main{ font-size:11px; }
  .th-compact .th-sub{ font-size:9px; font-weight:400; text-transform:none; letter-spacing:0; color:var(--slate); opacity:0.85; }
  .stack-cell{ display:flex; flex-direction:column; gap:1px; min-width:150px; }
  .stack-cell .meta-line{ font-size:11px; color:var(--slate); padding:1px 4px; }

  select.status-select{
    border:1.5px solid transparent; border-radius:999px;
    padding:5px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.02em;
    cursor:pointer; font-family:inherit;
  }
  select.status-select.st-pending{ background:var(--gold-soft); color:var(--amber); }
  select.status-select.st-approved{ background:#E4E9FA; color:#3A56C4; }
  select.status-select.st-disbursed{ background:var(--forest-soft); color:var(--forest); }
  select.status-select.st-rejected{ background:var(--rust-soft); color:var(--rust); }
  select.status-select:focus{ border-color:currentColor; outline:none; }

  .comm-cell{ font-weight:800; font-size:14px; font-variant-numeric:tabular-nums; }
  .comm-cell.has-value{ color:var(--forest); }
  .comm-cell.zero{ color:var(--slate); font-weight:600; font-size:12.5px; }
  .comm-cell.warn-empty{ color:var(--rust); font-weight:600; font-size:11.5px; }
  .ins-best-row td{ background:var(--forest-soft); }
  .ins-missing-row td{ color:var(--slate); font-style:italic; }

  .tag{
    font-size:10.5px; padding:3px 8px; border-radius:5px; background:#EFEDE6; color:var(--slate);
    display:inline-block;
  }
  .tag.gold{ background:var(--gold-soft); color:var(--amber); }

  .helper{ font-size:11.5px; color:var(--slate); line-height:1.5; margin-top:8px; }
  .helper b{ color:var(--ink); }

  .empty{
    padding:36px 20px; text-align:center; color:var(--slate);
  }
  .empty .big{ font-family:var(--font-display); font-weight:700; font-size:15.5px; color:var(--ink); margin-bottom:6px; }

  .toast{
    position:fixed; bottom:22px; right:26px; background:var(--ink); color:#F3ECD9;
    padding:11px 18px; border-radius:8px; font-size:12.5px; box-shadow:0 8px 24px rgba(0,0,0,.25);
    opacity:0; transform:translateY(8px); pointer-events:none; transition:all .25s ease; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .toast-undo-btn{
    margin-left:10px; background:none; border:1px solid rgba(243,236,217,0.45); color:#F3ECD9;
    border-radius:5px; padding:3px 10px; font-size:11.5px; cursor:pointer; font-weight:600;
  }
  .toast-undo-btn:hover{ background:rgba(243,236,217,0.15); }

  .tabs-hidden{ display:none !important; }

  .method-toggle{ display:flex; gap:6px; }
  .method-toggle button{
    padding:5px 10px; border-radius:6px; border:1px solid var(--line); background:#fff;
    font-size:11.5px; cursor:pointer; color:var(--slate);
  }
  .method-toggle button.active{ background:var(--ink); color:#F3ECD9; border-color:var(--ink); }

  /* ---------- Bảng "Tất cả chính sách" — chống mất chữ ---------- */
  #policyTable{ width:100%; min-width:1240px; table-layout:auto; }
  #policyTable th, #policyTable td{ white-space:nowrap; }
  #policyTable th:nth-child(1), #policyTable td:nth-child(1){ min-width:170px; white-space:normal; }
  #policyTable th:nth-child(2), #policyTable td:nth-child(2){ min-width:90px; }
  #policyTable th:nth-child(3), #policyTable td:nth-child(3){ min-width:170px; }
  #policyTable th:nth-child(4), #policyTable td:nth-child(4){ min-width:120px; }
  #policyTable th:nth-child(5), #policyTable td:nth-child(5){ min-width:150px; }
  #policyTable th:nth-child(6), #policyTable td:nth-child(6){ min-width:100px; }
  #policyTable th:nth-child(7), #policyTable td:nth-child(7){ min-width:110px; }
  #policyTable th:nth-child(8), #policyTable td:nth-child(8){ min-width:160px; }
  #policyTable th:nth-child(9), #policyTable td:nth-child(9){ min-width:175px; }
  #policyTable th:nth-child(10), #policyTable td:nth-child(10){ min-width:210px; white-space:normal; }
  #policyTable th:nth-child(11), #policyTable td:nth-child(11){ min-width:44px; }
  #policyTable td select.cell-edit, #policyTable td input.cell-edit{ min-width:0; }

  .matrix-scroll{ max-height:520px; overflow:auto; }
  .matrix-scroll table.data th:first-child{
    position:sticky; left:0; background:#FBFAF6; z-index:5; /* góc trên-trái: cần z-index cao nhất vì gim cả top lẫn left */
  }
  .matrix-scroll table.data td:first-child{
    position:sticky; left:0; background:var(--panel); font-weight:600; z-index:2;
  }
  /* Hàng tiêu đề PHỤ (VD "Người phụ trách" trong Ma trận NCC × Đơn vị): gim dưới hàng tiêu đề chính
     thay vì đè top:0 lên nhau — độ lệch top được JS đo và gán tự động sau khi render (xem wireStickyHeaderRows). */
  .matrix-scroll table.data thead tr:not(:first-child) th{ z-index:4; }
  .matrix-scroll table.data thead tr:not(:first-child) th:first-child{ z-index:5; }
  /* Tiêu đề/tên dài trong ma trận NCC/Ngân hàng/Bảo hiểm × Đơn vị: giới hạn chiều rộng, xuống 2 dòng có ellipsis,
     đầy đủ tên xem qua tooltip (title) khi rê chuột — tránh bảng bị kéo quá rộng làm mất phần hiển thị.
     max-width chỉ nên đủ LỚN để không ép chữ xuống dòng oan uổng khi bảng có ít cột đơn vị (VD tài khoản Đối
     tác chỉ có đúng 1 dòng NCC) — mốc 128px cũ quá chật khiến cả bảng bị "co lại" giữa trang dù panel còn
     rất nhiều khoảng trống thừa bên phải; nới lên 220px để cột tự giãn lấp khoảng trống đó khi có ít cột,
     đồng thời vẫn còn min-width + ellipsis 2 dòng để không phá layout khi có NHIỀU đơn vị/tên rất dài. */
  .matrix-scroll table.data th.unit-col{
    max-width:220px; min-width:100px; white-space:normal; line-height:1.35; font-size:10px;
    vertical-align:bottom; text-align:center;
  }
  .matrix-scroll table.data th.unit-col .unit-col-inner{
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; text-overflow:ellipsis;
  }
  /* Cột tên NCC/Ngân hàng/Hãng bảo hiểm (cột đầu, cố định khi cuộn ngang): rộng rãi hơn và
     xuống dòng đầy đủ (không ellipsis) để không bao giờ bị cắt mất tên — chấp nhận hàng cao hơn
     thay vì mất chữ, vì đây là thông tin chính của bảng chứ không phải nhãn cột phụ. */
  .matrix-scroll table.data td.row-label{
    max-width:280px; min-width:190px; white-space:normal; line-height:1.35; word-break:break-word;
  }
  /* Bảng ma trận có colgroup gợi ý độ rộng: chỉ ĐỊNH HƯỚNG cho cột tên + các cột tổng hợp cuối bảng,
     KHÔNG ép cứng layout (table-layout vẫn để auto) — để các cột số liệu theo đơn vị luôn giãn đúng theo
     độ dài số thực tế, tránh tình trạng số bị ép hẹp quá mức rồi tràn/đè chữ sang ô bên cạnh. */
  .matrix-scroll table.matrix-fixed{ width:100%; }
  /* Bảng doanh thu bảo hiểm theo hãng: dùng độ rộng cột cố định (colgroup) thay vì để trình duyệt
     tự giãn cột theo input — tránh cột "Phân bổ"/"DV" bị kéo quá rộng so với nhu cầu thực tế. */
  #insRevenueTable{ table-layout:fixed; width:100%; }
  #insRevenueTable input.cell-edit.money{ min-width:0; }
  #insRevenueTable input.cell-edit{ font-size:12.5px; }

  @media (max-width:900px){
    .content{ padding:18px 14px 40px; }
    .topbar{ padding:14px 16px; }
    .sidebar-toggle-btn{ display:inline-flex; }
    .sidebar{
      position:fixed; inset:0 auto 0 0; z-index:600; width:292px;
      transform:translateX(-100%); transition:transform .22s ease;
      box-shadow:20px 0 40px rgba(0,0,0,0.25);
    }
    .sidebar.mobile-open{ transform:translateX(0); }
    .sidebar-backdrop{
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:590;
    }
    .sidebar-backdrop.show{ display:block; }
    /* Tăng kích thước vùng chạm cho ngón tay — chỉ áp dụng ở màn hình nhỏ, không đổi gì trên máy tính. */
    .btn{ padding:10px 16px; min-height:40px; }
    .row-del{ padding:6px 9px; font-size:16px; }
    .nav-item{ padding:11px 12px; }
  }
  .sidebar-toggle-btn{
    display:none; align-items:center; justify-content:center;
    width:38px; height:38px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel); cursor:pointer; font-size:18px; flex:0 0 auto; margin-right:10px;
  }
  /* Ẩn hẳn ở MỌI kích thước màn hình theo mặc định — chỉ khối @media bên dưới mới cho hiện lại đúng lúc cần
     (trên di động, khi bấm ☰). Thiếu dòng này thì trên máy tính, div rỗng này vô tình thành 1 flex-item lạc
     trong .shell (vì .shell là display:flex) — vô hại về mặt hiển thị nhưng sai về cấu trúc, nên vá cho đúng. */
  .sidebar-backdrop{ display:none; }

  /* ---------- Login gate (dark theme) ---------- */

<script>
/* =========================================================================
   SỔ CÁI NCC — Quản trị doanh số & chiết khấu
   Bản HTML app độc lập, tái hiện đúng logic đã kiểm toán & sửa trong file Excel:
   - Mốc CK tách biệt khỏi Thưởng thêm
   - 3 cách tính: hồi tố toàn bộ / chỉ phần vượt mốc / thưởng thêm (cộng dồn riêng)
   - Nhiều chính sách đồng thời (CK tháng + thưởng quý + thưởng theo hạn)
   - Cộng dồn doanh số nhiều đơn vị cho cùng 1 NCC
   - Đối soát theo đúng kỳ (Từ ngày - Đến ngày)
   ========================================================================= */

/* ---------------------------- Utilities ---------------------------- */
const fmt = n => (n===null||n===undefined||isNaN(n)) ? '—' : Math.round(n).toLocaleString('vi-VN');
const fmtPct = n => (n===null||n===undefined||isNaN(n)) ? '—' : (n*100).toLocaleString('vi-VN',{maximumFractionDigits:2})+'%';
const round2 = n => Math.round((Number(n)||0)*100)/100;

/* ---- Ô nhập số tiền có dấu phân cách nghìn (định dạng khi gõ, dễ đọc số lớn) ----
   parseMoneyInput: bỏ mọi ký tự không phải chữ số (dấu chấm ngăn cách...) -> số nguyên
   formatMoneyValue: số nguyên -> chuỗi có dấu chấm ngăn cách hàng nghìn (kiểu VN: 200.000.000)
   attachMoneyFormatting: gắn vào 1 input để tự format khi gõ, giữ nguyên vị trí con trỏ hợp lý */
function parseMoneyInput(str){
  const digits = String(str||'').replace(/[^\d]/g,'');
  return digits ? Number(digits) : 0;
}
function formatMoneyValue(n){
  const v = Number(n)||0;
  return v.toLocaleString('vi-VN');
}
function attachMoneyFormatting(el){
  if(!el) return;
  const reformat = ()=>{
    const raw = parseMoneyInput(el.value);
    const digitsBefore = el.value.slice(0, el.selectionStart||el.value.length).replace(/[^\d]/g,'').length;
    el.value = raw ? formatMoneyValue(raw) : '';
    // đặt lại con trỏ về cuối (đơn giản, đủ dùng cho ô nhập số tiền)
    const pos = el.value.length;
    try{ el.setSelectionRange(pos,pos); }catch(e){}
  };
  el.addEventListener('input', reformat);
}
const uid = (() => { let n = Date.now()%1000000; return (prefix)=> prefix+'_'+(++n).toString(36); })();
const todayISO = () => new Date().toISOString().slice(0,10);
// Trì hoãn gọi `fn` cho tới khi ngừng gọi debounced() liên tục trong `wait`ms — dùng cho ô tìm kiếm/lọc
// dạng gõ chữ (input) trên bảng có thể có hàng nghìn dòng, để không vẽ lại toàn bộ bảng trên MỖI phím bấm
// (gây đơ máy khi dữ liệu lớn, ví dụ sau khi nhập Excel hàng loạt).
function debounce(fn, wait){
  let timer;
  return (...args)=>{ clearTimeout(timer); timer = setTimeout(()=>fn(...args), wait); };
}
// Bỏ dấu tiếng Việt + chuẩn hoá thành gợi ý "tên tài khoản" (username) không dấu, không khoảng trắng,
// dùng khi Admin để trống ô Tài khoản lúc thêm mới — Admin vẫn có thể sửa lại tuỳ ý.
function slugifyUsername(str){
  return String(str||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/đ/gi, d=> d==='đ'?'d':'D')
    .trim().toLowerCase()
    .replace(/[^a-z0-9]+/g,'.')
    .replace(/^\.+|\.+$/g,'');
}
const toDate = s => s ? new Date(s+'T00:00:00') : null;
// Kiểm tra 1 chuỗi ngày (VD t.date của hợp đồng/hồ sơ) có thật sự hợp lệ hay không — bắt cả trường hợp rỗng
// (chưa từng nhập) lẫn chuỗi có vẻ có giá trị nhưng parse ra "Invalid Date" (dữ liệu cũ lỗi từ trước).
function isValidDateStr(s){
  if(!s) return false;
  const d = toDate(s);
  return !!d && !isNaN(d.getTime());
}

function eomonth(d, addMonths){
  const y=d.getFullYear(), m=d.getMonth()+addMonths;
  return new Date(y, m+1, 0);
}
function monthRange(ref){ return [new Date(ref.getFullYear(),ref.getMonth(),1), eomonth(ref,0)]; }
function quarterRange(ref){
  const q = Math.floor(ref.getMonth()/3);
  return [new Date(ref.getFullYear(), q*3, 1), eomonth(ref, (q*3+3)-ref.getMonth())];
}
function ytdRange(ref, endOverrideISO){
  let to = ref;
  if(endOverrideISO){ const eo = toDate(endOverrideISO); if(eo && eo < to) to = eo; }
  return [new Date(ref.getFullYear(),0,1), to];
}
function cyclePeriod(cycle, ref, endOverrideISO){
  if(cycle==='THANG') return monthRange(ref);
  if(cycle==='QUY') return quarterRange(ref);
  if(cycle==='YTD') return ytdRange(ref, endOverrideISO);
  if(cycle==='Cố định') return [null, null];
  return null; // 'Cần xác nhận' → chưa tính được
}
function fmtRange([from,to]){
  const f = d => d ? d.toLocaleDateString('vi-VN') : '…';
  return `${f(from)} → ${f(to)}`;
}

/* ---------------------------- Persistent storage ----------------------------
   Dữ liệu nghiệp vụ (NCC, chính sách, doanh số, tài khoản, nhật ký...) dùng
   CHUNG cho mọi người. Có 2 tầng lưu trữ:
   1) Firebase Realtime Database (nếu đã kết nối) — đồng bộ REAL-TIME qua nhiều thiết
      bị/trình duyệt/mạng khác nhau, không giới hạn trong 1 trò chuyện Claude.
   2) Nếu chưa kết nối Firebase: dùng bộ nhớ dùng chung của trò chuyện Claude
      (window.storage, shared=true), rồi tới localStorage của trình duyệt,
      rồi tới bộ nhớ tạm (mất khi đóng tab) — y như trước đây.
   "Bạn đang là ai" (currentUserId) luôn lưu RIÊNG trên thiết bị/trình duyệt
   của từng người (shared=false / localStorage), không đưa lên Firebase.
---------------------------------------------------------------------------- */
const STORE_KEY = 'nccapp:state:v2';          // shared business data (tầng dự phòng)
const SESSION_KEY = 'nccapp:session:v1';      // personal: {currentUserId}
const FB_CONFIG_KEY = 'nccapp:firebaseConfig:v1'; // cấu hình Firebase (dùng chung để cả nhóm tự kết nối)
const FB_DISABLED_KEY = 'nccapp:firebaseDisabled:v1'; // đánh dấu "đã chủ động ngắt" để không tự nối lại cấu hình mặc định
const FB_ROOT = 'ncc_app_data'; // đường dẫn gốc trong Realtime Database — bên trong tách thành các nhánh /ncc /nh /bh /shared
const FB_ROOT_LEGACY_PATH = 'ncc_app_data/shared_state'; // đường dẫn CŨ (trước khi tách nhánh) — chỉ dùng để di chuyển dữ liệu 1 lần, xem migrateToPerRecordV1()
// Mật khẩu "hàng rào mềm" khi chọn danh tính đăng nhập — LƯU Ý: đây KHÔNG phải bảo mật thật sự,
// vì app chạy tĩnh trên trình duyệt (không có server) nên ai xem được mã nguồn trang cũng đọc được giá trị này.
// Chỉ nhằm chặn việc bấm nhầm/chọn nhầm danh tính của người dùng thông thường trong nội bộ.
// - ADMIN_PASSWORD: mật khẩu mặc định dùng cho tài khoản Admin gốc (u_admin) khi tài khoản đó CHƯA được
//   gán mật khẩu riêng ở trường account.password (tương thích ngược với dữ liệu cũ trước khi có tính năng này).
// - Mọi tài khoản (Admin, Quản lý, Nhân viên) đều có thể được gán một mật khẩu riêng ở tab "Quản trị tài khoản"
//   (trường account.password). Nếu account.password để trống → đăng nhập không cần mật khẩu, như trước đây.
const ADMIN_PASSWORD = 'Hungthinh123';

/* ---------------------------- Băm mật khẩu (SHA-256 + salt riêng từng tài khoản) ----------------------------
   Mục đích: tránh lộ mật khẩu dạng chữ rõ ràng khi mở Console (F12) hoặc khi nhìn thẳng dữ liệu đồng bộ trên
   Firebase. KHÔNG phải bảo mật tuyệt đối — mọi logic vẫn chạy trên trình duyệt, không có server xác thực,
   nên vẫn có thể bỏ qua đăng nhập bằng cách tự set currentUserId qua Console (không liên quan gì đến mật
   khẩu). Đây chỉ là lớp che chắn để mắt thường/Console không đọc được mật khẩu gốc.
   account.passwordHash + account.passwordSalt thay cho account.password (chữ thô) trước đây. */
function randomSalt(){
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  return Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hashPassword(password, salt){
  const data = new TextEncoder().encode(salt+':'+password);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
// Đặt/đổi mật khẩu cho 1 tài khoản — luôn băm ngay, không giữ lại chữ thô. password='' -> bỏ mật khẩu hẳn
// (đăng nhập không cần mật khẩu, như trước đây khi để trống).
async function setAccountPassword(acc, password){
  delete acc.password; // dọn field cũ (chữ thô) nếu tài khoản này từng có, không giữ song song 2 kiểu lưu
  if(!password){
    delete acc.passwordHash; delete acc.passwordSalt;
    acc.noPasswordSet = true; // đã CHỦ ĐỘNG bỏ mật khẩu -> không rơi về ADMIN_PASSWORD mặc định nữa dù là Admin
    return;
  }
  acc.noPasswordSet = false;
  const salt = randomSalt();
  acc.passwordSalt = salt;
  acc.passwordHash = await hashPassword(password, salt);
}
// So khớp mật khẩu người dùng vừa gõ với tài khoản — ưu tiên dùng bản đã băm, có tương thích ngược cho
// dữ liệu cũ (account.password chữ thô, hoặc Admin gốc chưa từng đặt mật khẩu riêng -> dùng ADMIN_PASSWORD).
async function verifyAccountPassword(acc, typed){
  if(acc.passwordHash){
    if(!acc.passwordSalt) return false;
    return (await hashPassword(typed||'', acc.passwordSalt)) === acc.passwordHash;
  }
  if(acc.noPasswordSet) return !typed; // đã chủ động bỏ mật khẩu -> không yêu cầu gì nữa, kể cả với Admin
  const legacyPw = acc.password || (acc.role==='Admin' ? ADMIN_PASSWORD : '');
  if(!legacyPw) return !typed; // tài khoản không đặt mật khẩu -> chỉ hợp lệ khi cũng để trống
  return typed===legacyPw;
}
// Tài khoản hiện có đang yêu cầu mật khẩu hay không (để quyết định có hỏi "mật khẩu hiện tại" khi đổi MK).
function accountHasPassword(acc){
  if(acc.passwordHash) return true;
  if(acc.noPasswordSet) return false;
  return !!(acc.password || acc.role==='Admin');
}

let storageMode = 'memory'; // 'firebase' | 'cloud' | 'local' | 'memory'
let storageBackend = null;  // 'window.storage' | 'localStorage' | null
let lastSavedJsonByBranch = {}; // chỉ còn dùng cho tầng dự phòng (__local) — xem saveState()
let lastSavedRecords = {}; // 'branch/field' -> Map(id -> jsonString bản ghi đó) — theo dõi TỪNG BẢN GHI khi đồng bộ qua Firebase
let lastSavedMeta = {};    // 'branch' -> jsonString của khối "meta" (field nhỏ, ít đổi) của nhánh đó
function recordFieldKey(branch, field){ return branch+'/'+field; }
// Khoá định danh của 1 bản ghi khi lưu theo node con riêng trên Firebase — hầu hết dùng .id, riêng các
// mục trong Thùng rác dùng .trashId (không có field .id ở cấp ngoài cùng).
function recordKeyOf(item){ return item && (item.id!==undefined ? item.id : item.trashId); }

let fb = { status:'disconnected', db:null, refs:{}, unsubs:{}, loaded:{}, error:null, config:null }; // 'disconnected'|'connecting'|'connected'|'error'
// fb.refs[branch] = true NGAY khi bắt đầu subscribe (chặn gọi trùng) — nhưng dữ liệu THẬT của nhánh đó
// (state[field] thay từ seed sang dữ liệu Firebase thật, cùng bộ nhớ "đã lưu lần trước" lastSavedRecords)
// chỉ xong SAU một loạt await bên trong subscribeBranch(). fb.loaded[branch] chỉ được bật lên true ở CUỐI
// subscribeBranch(), khi mọi field của nhánh đã tải xong hoàn toàn — dùng để saveState() biết nhánh nào
// AN TOÀN để so sánh/ghi lên Firebase, tránh ghi nhầm dữ liệu mẫu (seed) đang tạm nằm trong state khi
// renderAll()/saveState() lỡ chạy đúng vào khoảng đang tải dở (bug cũ: mỗi lần đăng nhập lại ghi thêm
// đúng lô chính sách mẫu ban đầu vì lúc đó fb.refs[branch] đã true nhưng dữ liệu thật + known map chưa kịp có).
// Field nào của mỗi nhánh là "tập hợp bản ghi" (khớp theo id) — được tách thành node con riêng trên
// Firebase, lắng nghe bằng child_added/child_changed/child_removed để CHỈ tải đúng bản ghi vừa đổi, KHÔNG
// tải lại nguyên khối mỗi khi có ai đó thao tác — quan trọng khi dữ liệu tích luỹ nhiều theo thời gian
// (VD: 5.000 chứng từ mà chỉ 1 người vừa thêm 1 dòng, mọi người khác chỉ tải đúng 1 dòng đó, không phải cả 5.000).
const BRANCH_RECORD_FIELDS = {
  ncc:    ['suppliers','policies','transactions','reconciliations','contracts','requests','activityLogNcc','trashNcc','yearlyTargets'],
  nh:     ['banks','bankPolicies','bankTransactions','bankReconciliations','bankContracts','bankRequests','activityLogNh','trashNh','bankYearlyTargets'],
  bh:     ['insurers','insRates','insTransactions','insReconciliations','insMonthlyRevenue','insContracts','insRequests','activityLogBh','trashBh','insYearlyTargets'],
  shared: ['accounts','activityLogShared','trashShared'],
};
// Field còn lại: nhỏ, ít đổi, không phình to theo lượng chứng từ/thời gian — vẫn đọc/ghi gộp chung 1 khối
// "meta" đơn giản, không cần tối ưu theo bản ghi.
const BRANCH_META_FIELDS = {
  ncc:    ['nextSupplierNo','monitoring','reportDate'],
  nh:     ['nextBankNo'],
  bh:     ['insAllocAlertThreshold','nextInsNo','insRenewalAlertDays','insRenewalAutoSnoozeDays','insAllocMonthLocks'],
  shared: ['units','driveUploadUrl','driveUploadSecret','emailNotifyEnabled','editPerms'],
};
// Toàn bộ field của 1 nhánh (gộp cả 2 loại trên) — dùng ở những chỗ chỉ cần biết "nhánh này có field gì"
// mà không cần phân biệt loại (VD: reset dữ liệu khi unsubscribe, kiểm tra tên module hợp lệ, sao lưu).
const BRANCHES = {
  ncc:    [...BRANCH_RECORD_FIELDS.ncc, ...BRANCH_META_FIELDS.ncc],
  nh:     [...BRANCH_RECORD_FIELDS.nh, ...BRANCH_META_FIELDS.nh],
  bh:     [...BRANCH_RECORD_FIELDS.bh, ...BRANCH_META_FIELDS.bh],
  shared: [...BRANCH_RECORD_FIELDS.shared, ...BRANCH_META_FIELDS.shared],
};

function loadScript(src){
  return new Promise((resolve,reject)=>{
    const existing = document.querySelector(`script[src="${src}"]`);
    if(existing){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = ()=>resolve(); s.onerror = ()=>reject(new Error('Không tải được: '+src));
    document.head.appendChild(s);
  });
}
async function ensureXLSX(){
  if(window.XLSX) return;
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
}
// Xuất 1 hoặc nhiều bảng (mảng object phẳng) ra file Excel .xlsx, mỗi bảng 1 sheet riêng.
// sheets: [{name:'Doanh số', rows:[{...},...]}, ...] — rows là mảng object thường (key = tên cột).
async function exportToExcel(filename, sheets){
  try{
    await ensureXLSX();
    const wb = window.XLSX.utils.book_new();
    sheets.forEach(({name, rows})=>{
      const ws = window.XLSX.utils.json_to_sheet(rows && rows.length ? rows : [{ }]);
      window.XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31)); // tên sheet Excel giới hạn 31 ký tự
    });
    window.XLSX.writeFile(wb, filename);
  }catch(e){ console.error('Xuất Excel thất bại', e); toast('Xuất Excel thất bại — kiểm tra kết nối mạng rồi thử lại'); }
}
// Đọc 1 file Excel người dùng chọn -> trả về mảng object (mỗi phần tử = 1 dòng dữ liệu, key = đúng tên cột
// ở hàng tiêu đề, dòng trống ở giữa file bị bỏ qua). cellDates:true để Excel tự trả Date thay vì số serial
// khi ô đó được định dạng ngày tháng — parseImportDate() bên dưới xử lý tiếp mọi kiểu còn lại.
async function readExcelRows(file){
  await ensureXLSX();
  const buf = await file.arrayBuffer();
  const wb = window.XLSX.read(buf, {type:'array', cellDates:true});
  const ws = wb.Sheets[wb.SheetNames[0]];
  if(!ws) return [];
  return window.XLSX.utils.sheet_to_json(ws, {defval:''}).filter(row=>
    Object.values(row).some(v=> String(v).trim()!==''));
}
// Chuẩn hoá 1 ô "ngày" đọc từ Excel về dạng 'YYYY-MM-DD' — chấp nhận Date (Excel định dạng ngày sẵn), số
// serial ngày Excel (ô bị lưu dạng số thô), hoặc chuỗi kiểu YYYY-MM-DD / DD/MM/YYYY / DD-MM-YYYY người dùng
// gõ tay. Trả về '' nếu không đọc được, để nơi gọi tự quyết định báo lỗi hay dùng ngày mặc định.
function parseImportDate(val){
  if(val==null || val==='') return '';
  if(val instanceof Date && !isNaN(val)) return val.toISOString().slice(0,10);
  if(typeof val === 'number'){
    if(window.XLSX && window.XLSX.SSF){
      const d = window.XLSX.SSF.parse_date_code(val);
      if(d) return `${String(d.y).padStart(4,'0')}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
    }
    return '';
  }
  const s = String(val).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})/);
  if(m) return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  return '';
}
// Hiện modal xem trước kết quả đọc file Excel trước khi thực sự ghi vào dữ liệu — luôn bắt xác nhận tay,

    </table></div>${summaryRows.length>200 ? `<div class="helper">... và ${summaryRows.length-200} dòng khác (vẫn được nhập đủ khi xác nhận)</div>` : ''}` : ''}
    ${errors.length ? `<div class="helper" style="margin-top:10px;color:var(--rust)">Dòng bị bỏ qua:<br>${errors.slice(0,50).map(e=>escHtml(e)).join('<br>')}${errors.length>50?`<br>... và ${errors.length-50} lỗi khác`:''}</div>` : ''}

   trong mã nguồn rồi tự viết script gọi thẳng vào) — KHÔNG chặn được người dùng nội bộ tự bypass phân

   Để trống/giữ nguyên placeholder = bỏ qua bước này (app hoạt động như trước, chưa có lớp chặn này). */
const APP_CHECK_SITE_KEY = 'DÁN_SITE_KEY_RECAPTCHA_V3_VÀO_ĐÂY';

/* Chấp nhận dán JSON chuẩn HOẶC nguyên đoạn code "const firebaseConfig = {...}"
   copy thẳng từ Firebase Console (không phải JSON hợp lệ vì key không có ngoặc kép). */
function parseFirebaseConfigInput(raw){
  const text = (raw||'').trim();
  if(!text) return null;
  try{ return JSON.parse(text); }catch(e){}
  const start = text.indexOf('{');
  const end = text.lastIndexOf('}');
  if(start===-1||end===-1||end<=start) throw new Error('Không tìm thấy cấu hình dạng { ... }. Hãy dán nguyên object firebaseConfig.');
  const objText = text.slice(start, end+1);
  try{
    const obj = new Function('return (' + objText + ')')();
    if(obj && typeof obj==='object') return obj;
  }catch(e){}
  throw new Error('Không đọc được cấu hình — kiểm tra lại định dạng đã dán.');
}

// Di chuyển dữ liệu từ cấu trúc CŨ (1 node gộp chung ncc_app_data/shared_state) sang cấu trúc nhánh MỚI
// (ncc_app_data/ncc, /nh, /bh, /shared) — chỉ chạy đúng 1 lần cho cả dự án Firebase (không phải 1 lần/máy):
// hễ nhánh 'shared' mới đã tồn tại thì coi như đã di chuyển xong, các máy khác mở lên sau sẽ tự thấy dữ
// liệu ở cấu trúc mới, không migrate lại. An toàn khi nhiều người cùng mở app lúc chưa migrate (idempotent).
// Di chuyển dữ liệu từ các cấu trúc CŨ (1 khối gộp chung ban đầu, hoặc "mỗi nhánh module 1 khối" ở giữa)
// sang cấu trúc MỚI NHẤT — mỗi bản ghi 1 node con riêng theo id (xem BRANCH_RECORD_FIELDS). Chỉ chạy 1
// lần cho cả dự án Firebase: hễ nhánh 'shared/meta' đã tồn tại thì coi như đã ở cấu trúc mới, bỏ qua. An
// toàn khi nhiều người cùng mở app lúc chưa migrate (idempotent, không ghi đè nếu đã có).
async function migrateToPerRecordV1(db){
  try{
    const metaSnap = await db.ref(FB_ROOT+'/shared/meta').once('value');
    if(metaSnap.exists()) return; // đã ở cấu trúc mới rồi
    const updates = {};
    let foundAnything = false;

    // Trường hợp A: đang ở cấu trúc "mỗi nhánh module 1 khối" (bản ngay trước thay đổi này)
    for(const branch of Object.keys(BRANCHES)){
      const snap = await db.ref(FB_ROOT+'/'+branch).once('value');
      if(!snap.exists()) continue;
      const blob = snap.val();
      foundAnything = true;
      const metaObj = {};
      (BRANCH_META_FIELDS[branch]||[]).forEach(k=>{ if(blob[k]!==undefined) metaObj[k]=blob[k]; });
      updates[FB_ROOT+'/'+branch+'/meta'] = metaObj;
      (BRANCH_RECORD_FIELDS[branch]||[]).forEach(field=>{
        const arr = blob[field];
        if(!Array.isArray(arr)) return;
        arr.forEach(item=>{
          const key = recordKeyOf(item);
          if(key===undefined || key===null) return;
          updates[FB_ROOT+'/'+branch+'/'+field+'/'+key] = item;
        });
      });
    }

    // Trường hợp B: chưa từng có "mỗi nhánh 1 khối" -> thử tìm dữ liệu CŨ HƠN NỮA (1 khối gộp chung duy
    // nhất, từ trước khi có khái niệm nhánh theo module).
    if(!foundAnything){
      const oldSnap = await db.ref(FB_ROOT_LEGACY_PATH).once('value');
      if(oldSnap.exists() && oldSnap.val() && oldSnap.val().json){
        const oldState = JSON.parse(oldSnap.val().json);
        for(const [branch] of Object.entries(BRANCHES)){
          const metaObj = {};
          (BRANCH_META_FIELDS[branch]||[]).forEach(k=>{ if(oldState[k]!==undefined) metaObj[k]=oldState[k]; });
          updates[FB_ROOT+'/'+branch+'/meta'] = metaObj;
          (BRANCH_RECORD_FIELDS[branch]||[]).forEach(field=>{
            const arr = oldState[field];
            if(!Array.isArray(arr)) return;
            arr.forEach(item=>{
              const key = recordKeyOf(item);
              if(key===undefined || key===null) return;
              updates[FB_ROOT+'/'+branch+'/'+field+'/'+key] = item;
            });
          });
        }
      }
    }

    if(Object.keys(updates).length===0){
      // Không tìm thấy dữ liệu cũ nào (cài đặt hoàn toàn mới) -> vẫn tạo nhánh shared/meta rỗng để đánh
      // dấu "đã kiểm tra migration", tránh quét lại toàn bộ các nhánh mỗi lần kết nối sau này.
      updates[FB_ROOT+'/shared/meta'] = {};
    }
    await db.ref().update(updates);
  }catch(e){ console.error('Di chuyển dữ liệu sang cấu trúc theo bản ghi thất bại', e); }
}
// Tải (nếu chưa có) + lắng nghe real-time đúng 1 nhánh. Gọi lại nhiều lần với cùng branch là an toàn
// (không subscribe trùng) vì đã kiểm tra fb.refs[branch] trước. Phần "meta" (field nhỏ) vẫn tải/lắng nghe
// gộp 1 khối như trước; phần "tập hợp bản ghi" lắng nghe theo TỪNG BẢN GHI (child_added/changed/removed) —
// child_added tự bắn ra cho MỌI bản ghi đã có ngay khi vừa gắn listener, nên cũng đồng thời đóng vai trò
// "tải lần đầu", không cần gọi once('value') riêng cho các field này nữa.
async function subscribeBranch(branch){
  if(!fb.db || fb.refs[branch]) return;
  fb.refs[branch] = true; // đánh dấu ĐANG subscribe nhánh này (chặn gọi trùng) — ref thật nằm trong closure bên dưới
  fb.unsubs[branch] = [];
  const branchPath = FB_ROOT+'/'+branch;

  const metaRef = fb.db.ref(branchPath+'/meta');
  try{
    const snap = await metaRef.once('value');
    if(snap.exists()){
      const data = snap.val();
      lastSavedMeta[branch] = JSON.stringify(data);
      Object.assign(state, data);
    }
  }catch(e){ console.error('Lỗi tải meta nhánh "'+branch+'"', e); }
  const metaListener = metaRef.on('value', snapshot=>{
    if(!snapshot.exists()) return;
    const data = snapshot.val();
    const json = JSON.stringify(data);
    if(json===lastSavedMeta[branch]) return; // echo của chính mình vừa ghi -> bỏ qua
    lastSavedMeta[branch] = json;
    Object.assign(state, data);
    badgeCacheDirty = true; // ngưỡng cảnh báo (VD insRenewalAlertDays) đổi từ nơi khác cũng có thể đổi số đếm badge
    renderAll();
  }, err=>{ console.error('Lỗi lắng nghe meta nhánh "'+branch+'"', err); fb.status='error'; fb.error = err.message||String(err); });
  fb.unsubs[branch].push(()=>metaRef.off('value', metaListener));

  await Promise.all((BRANCH_RECORD_FIELDS[branch]||[]).map(async field=>{
    if(!Array.isArray(state[field])) state[field] = [];
    const fieldRef = fb.db.ref(branchPath+'/'+field);
    const fkey = recordFieldKey(branch, field);
    const known = lastSavedRecords[fkey] || (lastSavedRecords[fkey] = new Map());

    // Lấy 1 lần snapshot đầy đủ hiện có -> THAY THẾ HẲN dữ liệu mẫu mặc định (seedState()) đang có sẵn
    // trong bộ nhớ bằng đúng dữ liệu thật trên Firebase. Bắt buộc phải làm bước này: nếu chỉ dựa vào
    // child_added, những bản ghi MẪU không hề tồn tại thật trên Firebase (VD tên NCC trùng tên mẫu do
    // người dùng tự nhập) sẽ không bao giờ được dọn đi, nằm mãi song song với dữ liệu thật, gây hiện trùng
    // lặp. Việc này chỉ tốn thêm 1 lượt tải "đầy đủ" duy nhất mỗi lần đăng nhập/mở nhánh (đúng như đã nói
    // trước — lần tải đầu vẫn cần tải đủ dữ liệu), không ảnh hưởng gì tới lợi ích tiết kiệm băng thông
    // trong lúc đang dùng (các thay đổi SAU đó vẫn chỉ nhận đúng bản ghi thay đổi qua child_added/changed).
    // Chạy song song cho mọi field (Promise.all) thay vì tuần tự, tránh làm chậm lần tải đầu.
    try{
      const snap = await fieldRef.once('value');
      const obj = snap.exists() ? snap.val() : {};
      const list = [];
      Object.keys(obj).forEach(id=>{ known.set(id, JSON.stringify(obj[id])); list.push(obj[id]); });
      state[field] = list;
      badgeCacheDirty = true; // vừa tải thêm 1 nhánh dữ liệu mới giữa phiên làm việc -> cần tính lại badge
    }catch(e){ console.error('Lỗi tải nhánh bản ghi "'+fkey+'"', e); }

    const onAdded = fieldRef.on('child_added', snap=>{
      const id = snap.key;
      if(recentlyDeletedIds.has(id)) return; // mình vừa chủ động xoá bản ghi này trong phiên này -> không hồi sinh nhầm
      const data = snap.val();
      const json = JSON.stringify(data);
      if(known.get(id)===json) return; // đã biết đúng bản ghi này rồi (echo của chính mình, hoặc trùng)
      known.set(id, json);
      // GHI ĐÈ nếu id đã có sẵn (VD trùng với dữ liệu mẫu seedState() dùng id cố định như 'u_admin'), chứ
      // KHÔNG bỏ qua — nếu chỉ kiểm tra "đã có chưa" rồi bỏ qua, dữ liệu THẬT từ Firebase sẽ không bao giờ
      // thay được dữ liệu MẪU đang có sẵn (VD tài khoản Admin đổi tên đăng nhập thật sẽ không áp dụng được,
      // hoặc NCC trùng tên với dữ liệu mẫu bị hiện lặp) — phải cùng logic "thay thế nếu có, thêm nếu chưa"
      // giống hệt child_changed bên dưới.
      const idx = state[field].findIndex(x=>recordKeyOf(x)===id);
      if(idx!==-1) state[field][idx] = data; else state[field].push(data);
      badgeCacheDirty = true; // dữ liệu vừa đổi do đồng bộ real-time từ nơi khác, không đi qua saveState() của chính máy này
      renderAll();
    }, err=>{ console.error('Lỗi lắng nghe (added) '+fkey, err); });

    const onChanged = fieldRef.on('child_changed', snap=>{
      const id = snap.key;
      if(recentlyDeletedIds.has(id)) return;
      const data = snap.val();
      const json = JSON.stringify(data);
      if(known.get(id)===json) return;
      known.set(id, json);
      const idx = state[field].findIndex(x=>recordKeyOf(x)===id);
      if(idx!==-1) state[field][idx] = data; else state[field].push(data);
      if(branch==='shared' && field==='accounts' && currentUserId && !(state.accounts||[]).some(a=>a.id===currentUserId)) currentUserId = null;
      badgeCacheDirty = true; // như trên — đồng bộ real-time từ nơi khác
      renderAll();
    }, err=>{ console.error('Lỗi lắng nghe (changed) '+fkey, err); });

    const onRemoved = fieldRef.on('child_removed', snap=>{
      const id = snap.key;
      known.delete(id);
      const idx = state[field].findIndex(x=>recordKeyOf(x)===id);
      if(idx!==-1) state[field].splice(idx,1);
      badgeCacheDirty = true; // như trên — đồng bộ real-time từ nơi khác
      renderAll();
    }, err=>{ console.error('Lỗi lắng nghe (removed) '+fkey, err); });

    fb.unsubs[branch].push(()=>{
      fieldRef.off('child_added', onAdded);
      fieldRef.off('child_changed', onChanged);
      fieldRef.off('child_removed', onRemoved);
    });
  }));
  // Chỉ đúng lúc này — SAU khi meta + MỌI field bản ghi của nhánh đã tải xong dữ liệu thật (state[field]
  // đã thay từ seed sang dữ liệu Firebase, known map đã có đủ) — mới đánh dấu nhánh này an toàn để ghi.
  fb.loaded[branch] = true;
}
function unsubscribeBranch(branch){
  if(fb.unsubs[branch]){ fb.unsubs[branch].forEach(fn=>fn()); delete fb.unsubs[branch]; }
  delete fb.refs[branch];
  delete fb.loaded[branch];
  // Xoá luôn dữ liệu nhánh đó khỏi bộ nhớ (không chỉ ngừng lắng nghe) — quan trọng khi dùng chung 1 máy/
  // trình duyệt: nếu Admin đăng xuất rồi 1 tài khoản bị giới hạn module hơn đăng nhập vào (không tải lại
  // trang), mà không xoá thì dữ liệu module cũ (Admin từng tải) vẫn nằm sẵn trong bộ nhớ của người sau.
  const seed = seedState();
  (BRANCHES[branch]||[]).forEach(k=>{ state[k] = seed[k]; });
  // Dọn cache theo-bản-ghi của nhánh này — lần subscribe lại sau sẽ tải mới hoàn toàn sạch, không lẫn cache cũ.
  (BRANCH_RECORD_FIELDS[branch]||[]).forEach(field=>{ delete lastSavedRecords[recordFieldKey(branch,field)]; });
  delete lastSavedMeta[branch];
}
// Nhánh nào cần tải cho tài khoản ĐANG đăng nhập hiện tại — 'shared' luôn cần (đăng nhập, đơn vị, nhật ký);
// Admin luôn cần đủ cả 3 module; tài khoản khác chỉ cần đúng module được cấp (accountModules đã có sẵn).
function branchesForCurrentUser(){
  const u = currentUser();
  if(!u) return ['shared'];
  if(u.role==='Admin') return ['shared','ncc','nh','bh'];
  const mods = accountModules(u).filter(m=>BRANCHES[m]);
  return ['shared', ...mods];
}
// Đồng bộ lại đúng tập nhánh cần thiết cho tài khoản hiện tại — gọi sau khi đăng nhập/đăng xuất, hoặc
// ngay sau khi kết nối Firebase thủ công ở tab Cài đặt. Tải thêm nhánh còn thiếu, huỷ lắng nghe nhánh
// không còn cần (vd sau khi đăng xuất, hoặc chuyển sang tài khoản có ít module hơn).
async function syncBranchesForCurrentUser(){
  if(fb.status!=='connected' || !fb.db) return;
  const needed = branchesForCurrentUser();
  await Promise.all(needed.map(b=>subscribeBranch(b)));
  Object.keys(fb.refs).forEach(b=>{ if(!needed.includes(b)) unsubscribeBranch(b); });
  if(currentRole()==='Admin') maybeCreateDailyBackup(); // fire-and-forget, không chặn luồng chính
}
// Tạo 1 bản backup đầy đủ (cả 4 nhánh) cho ĐÚNG ngày hôm nay nếu chưa có — mỗi ngày chỉ tạo 1 lần, tự
// động ngay khi Admin mở app trong ngày đó (không cần thao tác gì). Giữ tối đa 30 ngày gần nhất, tự xoá
// bản cũ hơn để không phình dung lượng Firebase vô hạn theo thời gian.
async function maybeCreateDailyBackup(){
  if(!fb.db) return;
  const dateStr = todayISO();
  try{
    const backupRef = fb.db.ref(FB_ROOT+'/backups/'+dateStr);
    const snap = await backupRef.once('value');
    if(snap.exists()) return; // hôm nay đã có backup rồi
    const data = {};
    Object.keys(BRANCHES).forEach(branch=>{
      const obj = {};
      BRANCHES[branch].forEach(k=>{ obj[k]=state[k]; });
      data[branch] = obj;
    });
    await backupRef.set({ createdAt: new Date().toISOString(), createdBy: currentUserId, data });
    const allSnap = await fb.db.ref(FB_ROOT+'/backups').once('value');
    if(allSnap.exists()){
      const dates = Object.keys(allSnap.val()).sort();
      const toDelete = dates.slice(0, Math.max(0, dates.length-30));
      if(toDelete.length){
        const delUpdates = {};
        toDelete.forEach(d=>{ delUpdates[FB_ROOT+'/backups/'+d] = null; });
        await fb.db.ref().update(delUpdates);
      }
    }
  }catch(e){ console.error('Tạo backup hàng ngày thất bại', e); }
}
// Lấy danh sách các ngày đã có backup (mới nhất trước), dùng cho tab Cài đặt.
async function listBackups(){
  if(!fb.db) return [];
  try{
    const snap = await fb.db.ref(FB_ROOT+'/backups').once('value');
    if(!snap.exists()) return [];
    const obj = snap.val();
    return Object.keys(obj).sort().reverse().map(date=>({date, createdAt: obj[date].createdAt}));
  }catch(e){ console.error('Không tải được danh sách backup', e); return []; }
}
async function fetchBackup(dateStr){
  if(!fb.db) return null;
  try{
    const snap = await fb.db.ref(FB_ROOT+'/backups/'+dateStr).once('value');
    return snap.exists() ? snap.val() : null;
  }catch(e){ console.error('Không tải được backup', e); return null; }
}
async function connectFirebase(config){
  fb.status = 'connecting'; fb.error = null; fb.config = config;
  try{
    if(!config.databaseURL) throw new Error('Thiếu databaseURL — vào Realtime Database trên Firebase Console, copy đúng link database (dạng https://...firebasedatabase.app) và thêm vào cấu hình.');
    await ensureFirebaseSDK();
    const app = (window.firebase.apps && window.firebase.apps.length) ? window.firebase.apps[0] : window.firebase.initializeApp(config);
    await ensureAppCheckActivated(); // phải bật TRƯỚC khi gọi database() để "con dấu" áp dụng cho mọi request sau đó
    fb.db = window.firebase.database();
    fb.status = 'connected';
    await migrateToPerRecordV1(fb.db); // chuyển dữ liệu cũ sang cấu trúc theo bản ghi nếu cần, chỉ chạy 1 lần cho cả dự án
    await subscribeBranch('shared'); // luôn cần — đồng thời việc tải này xác nhận kết nối/rules đang hoạt động
    setStoragePill('firebase');
    return {ok:true};
  }catch(e){
    fb.status = 'error'; fb.error = (e && e.message) || String(e);
    return {ok:false, error: fb.error};
  }
}
function disconnectFirebase(){
  Object.keys(fb.unsubs).forEach(unsubscribeBranch);
  fb = {status:'disconnected', db:null, refs:{}, unsubs:{}, loaded:{}, error:null, config:null};
}

async function isFirebaseDisabled(){
  try{
    if(window.storage && typeof window.storage.get === 'function'){
      const res = await window.storage.get(FB_DISABLED_KEY, true);
      return !!(res && res.value === '1');
    }
  }catch(e){}
  try{ return localStorage.getItem(FB_DISABLED_KEY) === '1'; }catch(e){}
  return false;
}
async function setFirebaseDisabled(disabled){
  try{
    if(window.storage && typeof window.storage.set === 'function'){
      if(disabled) await window.storage.set(FB_DISABLED_KEY, '1', true);
      else if(typeof window.storage.delete==='function') await window.storage.delete(FB_DISABLED_KEY, true);
      return;
    }
  }catch(e){}
  try{
    if(disabled) localStorage.setItem(FB_DISABLED_KEY, '1');
    else localStorage.removeItem(FB_DISABLED_KEY);
  }catch(e){}
}
async function loadFirebaseConfigFromBootstrap(){
  try{
    if(window.storage && typeof window.storage.get === 'function'){
      const res = await window.storage.get(FB_CONFIG_KEY, true);
      if(res && res.value) return JSON.parse(res.value);
    }
  }catch(e){}
  try{
    const raw = localStorage.getItem(FB_CONFIG_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  if(await isFirebaseDisabled()) return null; // đã chủ động ngắt trước đó -> không tự nối lại cấu hình mặc định
  return DEFAULT_FIREBASE_CONFIG || null; // chưa ai lưu cấu hình riêng -> dùng cấu hình mặc định đi kèm
}
async function saveFirebaseConfigToBootstrap(cfg){
  await setFirebaseDisabled(!cfg); // lưu cấu hình mới -> bỏ cờ đã ngắt; xoá cấu hình -> đánh dấu đã ngắt
  try{
    if(window.storage && typeof window.storage.set === 'function'){
      if(cfg) await window.storage.set(FB_CONFIG_KEY, JSON.stringify(cfg), true);
      else if(typeof window.storage.delete==='function') await window.storage.delete(FB_CONFIG_KEY, true);
      return;
    }
  }catch(e){}
  try{
    if(cfg) localStorage.setItem(FB_CONFIG_KEY, JSON.stringify(cfg));
    else localStorage.removeItem(FB_CONFIG_KEY);
  }catch(e){}
}

async function loadShared(){
  const fbConfig = await loadFirebaseConfigFromBootstrap();
  if(fbConfig){
    const res = await connectFirebase(fbConfig);
    // Với Firebase: connectFirebase() đã tự tải + gộp thẳng nhánh 'shared' vào `state` (qua subscribeBranch)
    // rồi, nên không cần trả dữ liệu riêng ở đây nữa — chỉ cần báo hiệu "đã có dữ liệu dùng chung" để init()
    // biết không cần lấy dữ liệu mẫu (seedState) đè lên. Nhánh module (ncc/nh/bh) sẽ được tải THÊM sau,
    // ngay khi biết tài khoản đang đăng nhập là ai (xem syncBranchesForCurrentUser trong init()).
    if(res.ok) return 'firebase';
    // kết nối thất bại -> rơi xuống tầng dự phòng bên dưới, lỗi đã lưu ở fb.error để hiện ở Cài đặt
  }
  try{
    if(window.storage && typeof window.storage.get === 'function'){
      storageBackend = 'window.storage';
      const res = await window.storage.get(STORE_KEY, true);
      return res && res.value ? JSON.parse(res.value) : null;
    }
  }catch(e){ /* key not found → fall through */ }
  if(storageBackend==='window.storage') return null;
  try{
    const raw = localStorage.getItem(STORE_KEY);
    storageBackend = 'localStorage';
    return raw ? JSON.parse(raw) : null;
  }catch(e){ /* blocked */ }
  storageBackend = null;
  return null;
}

      const res = await window.storage.get(SESSION_KEY, false);
      return res && res.value ? JSON.parse(res.value) : null;
    }
  }catch(e){}
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){}
