// Xác định module ('ncc'|'nh'|'bh'|'shared') của 1 dòng Nhật ký hoạt động, dựa theo nhãn "entity" đã gán
// sẵn ở từng nơi gọi logActivity() — tra theo bảng cố định thay vì đoán, để không lệ thuộc cách đặt tên.
const LOG_ENTITY_MODULE = {
  'NCC':'ncc', 'Chính sách CK':'ncc', 'Doanh số':'ncc', 'Đối soát CK':'ncc', 'Theo dõi mốc CK':'ncc',
  'NH':'nh', 'Chính sách CK (NH)':'nh', 'Doanh số (NH)':'nh', 'Đối soát CK (NH)':'nh',
  'NCC Bảo hiểm':'bh', 'Biểu phí Bảo hiểm':'bh', 'Doanh số (Bảo hiểm)':'bh', 'Đối soát CK (Bảo hiểm)':'bh',
  'DT dịch vụ (Bảo hiểm)':'bh', 'Tỷ lệ phân bổ (Bảo hiểm)':'bh', 'Cài đặt (Bảo hiểm)':'bh',
  'Tài khoản':'shared', 'Cài đặt':'shared', 'Lỗi hệ thống':'shared',
};
function moduleOfLogEntity(entity){ return LOG_ENTITY_MODULE[entity] || 'shared'; }
function activityLogKeyFor(module){ return module==='ncc'?'activityLogNcc':module==='nh'?'activityLogNh':module==='bh'?'activityLogBh':'activityLogShared'; }
function logActivity(action, entity, detail){
  const u = currentUser();
  const key = activityLogKeyFor(moduleOfLogEntity(entity));
  if(!Array.isArray(state[key])) state[key] = [];
  state[key].unshift({
    id: uid('log'),
    ts: new Date().toISOString(),
    userId: currentUserId,
    userName: u ? u.name : '(không rõ)',
    role: u ? u.role : '—',
    action, // 'create' | 'update' | 'delete'
    entity, // vd: 'NCC', 'Chính sách CK', 'Doanh số', 'Đối soát CK', 'Tài khoản', 'Cài đặt'
    detail,
  });
  if(state[key].length>500) state[key].length = 500;
}
// Gộp Nhật ký hoạt động từ cả 4 nhánh để hiển thị (chỉ Admin xem tab này, và Admin luôn có đủ cả 4 nhánh
// nên luôn thấy đầy đủ như trước khi tách) — sắp xếp mới nhất trước.
function combinedActivityLog(){
  return [...(state.activityLogNcc||[]), ...(state.activityLogNh||[]), ...(state.activityLogBh||[]), ...(state.activityLogShared||[])]
    .sort((a,b)=> (b.ts||'').localeCompare(a.ts||''));
}

/* ---------------------------- Thùng rác (xoá mềm — khôi phục được) ----------------------------
   Thay vì xoá thẳng khỏi mảng, chuyển qua đúng nhánh Thùng rác của module tương ứng (trashNcc/trashNh/
   trashBh/trashShared) kèm tên mảng gốc + toàn bộ dữ liệu — khôi phục lại là đẩy nguyên object đó trở lại
   đúng mảng cũ. Tự động dọn các mục quá 30 ngày (xem renderTrash). Chỉ Admin xem được Thùng rác (Admin
   luôn có đủ cả 4 nhánh nên gộp lại xem đầy đủ; tài khoản module khác không tải các nhánh này về nữa). */
// Ghi lại các id vừa xoá TRONG PHIÊN LÀM VIỆC NÀY (bộ nhớ tạm, không đồng bộ) — dùng để tránh hợp nhất
// xung đột (xem mergeBranchBeforeWrite) vô tình "hồi sinh" 1 bản ghi mình vừa chủ động xoá, chỉ vì trên
// server (do người khác chưa kịp nhận được thông báo xoá) vẫn còn thấy bản ghi đó.
const recentlyDeletedIds = new Set();
function moduleOfArrName(arrName){
  if(['suppliers','policies','transactions','reconciliations'].includes(arrName)) return 'ncc';
  if(['banks','bankPolicies','bankTransactions','bankReconciliations'].includes(arrName)) return 'nh';
  if(['insurers','insRates','insTransactions','insReconciliations'].includes(arrName)) return 'bh';
  return 'shared'; // accounts, hoặc mảng nào khác không thuộc riêng module nào
}
function trashKeyFor(module){ return module==='ncc'?'trashNcc':module==='nh'?'trashNh':module==='bh'?'trashBh':'trashShared'; }
function softDelete(arrName, item, entityLabel){
  if(!item || !Array.isArray(state[arrName])) return;
  const idx = state[arrName].findIndex(x=>x.id===item.id);
  if(idx===-1) return;
  state[arrName].splice(idx,1);
  recentlyDeletedIds.add(item.id);
  const key = trashKeyFor(moduleOfArrName(arrName));
  if(!Array.isArray(state[key])) state[key] = [];
  state[key].unshift({
    trashId: uid('trash'), arrName, entityLabel,
    deletedAt: new Date().toISOString(), deletedBy: currentUserId,
    data: item,
  });
  if(state[key].length>300) state[key].length = 300; // chặn phình vô hạn, ưu tiên giữ mục mới xoá gần đây
}
const TRASH_KEYS = ['trashNcc','trashNh','trashBh','trashShared'];
function restoreFromTrash(trashId){
  for(const key of TRASH_KEYS){
    const arr = state[key];
    if(!Array.isArray(arr)) continue;
    const idx = arr.findIndex(t=>t.trashId===trashId);
    if(idx===-1) continue;
    const entry = arr[idx];
    arr.splice(idx,1);
    recentlyDeletedIds.add(trashId); // vừa chủ động lấy mục này RA KHỎI thùng rác -> không để hồi sinh nhầm nếu có xung đột
    if(!Array.isArray(state[entry.arrName])) state[entry.arrName] = [];
    state[entry.arrName].push(entry.data);
    recentlyDeletedIds.delete(entry.data.id); // chủ động khôi phục -> không còn coi là "đã xoá" nữa
    return entry;
  }
  return null;
}
function purgeTrashEntry(trashId){
  for(const key of TRASH_KEYS){
    const arr = state[key];
    if(!Array.isArray(arr)) continue;
    const idx = arr.findIndex(t=>t.trashId===trashId);
    if(idx!==-1){ arr.splice(idx,1); recentlyDeletedIds.add(trashId); return; }
  }
}

/* ---------------------------- Calc engine ---------------------------- */
function supplierById(id){ return state.suppliers.find(s=>s.id===id); }

/* Tạo đơn vị mới "theo thực tế" nếu tên nhập vào chưa có trong danh sách đơn vị.
   Dùng cho ô "Đơn vị phụ trách" — gõ tên đơn vị thật của bạn, không bị bó buộc
   theo danh sách dựng sẵn A-T. Trả về tên đơn vị đã chuẩn hoá (hoặc '' nếu bỏ trống). */
function ensureUnit(rawName){
  const name = (rawName||'').trim();
  if(!name) return '';
  const existing = state.units.find(u=>u.toLowerCase()===name.toLowerCase());
  if(existing) return existing;
  state.units.push(name);
  return name;
}
function unitDatalistHTML(id){
  return `<datalist id="${id}">${state.units.map(u=>`<option value="${escAttr(u)}">`).join('')}</datalist>`;
}
function supplierDatalistHTML(id){
  return `<datalist id="${id}">${state.suppliers.map(s=>`<option value="${escAttr(s.name)}">`).join('')}</datalist>`;
}
function findSupplierByName(rawName){
  const name = (rawName||'').trim().toLowerCase();
  if(!name) return null;
  return state.suppliers.find(s=>s.name.trim().toLowerCase()===name) || null;
}

function sumRevenue(supplierId, from, to, unit){
  let total=0;
  for(const t of state.transactions){
    if(t.supplierId!==supplierId) continue;
    if(unit && t.unit!==unit) continue;
    const d = toDate(t.date);
    if(from && d<from) continue;
    if(to && d>to) continue;
    total += (Number(t.gross)||0) - (Number(t.returns)||0);
  }
  return total;
}
function allTimeRevenue(supplierId, unit){ return sumRevenue(supplierId, null, null, unit); }

function baseTierPolicies(supplierId, asOfDate){
  const ref = asOfDate || toDate(state.reportDate) || new Date();
  return state.policies.filter(p=>p.supplierId===supplierId
    && (p.type==='CK theo doanh số'||p.type==='CK cố định')
    && (!p.startDate || toDate(p.startDate) <= ref)
    && (!p.endDate || toDate(p.endDate) >= ref));
}
function bonusPolicies(supplierId, asOfDate){
  const ref = asOfDate || toDate(state.reportDate) || new Date();
  return state.policies.filter(p=>p.supplierId===supplierId && p.type==='Thưởng thêm'
    && (!p.startDate || toDate(p.startDate) <= ref)
    && (!p.endDate || toDate(p.endDate) >= ref));
}
// Mốc hiệu lực dùng để CHỌN/XẾP HẠNG mốc CK cơ bản: với "CK cố định" luôn coi như mốc = 0 (luôn đạt), bất kể
// số gõ ở cột "Mốc" là bao nhiêu — vì bản chất "cố định" là hưởng đúng tỷ lệ đó dù doanh thu bao nhiêu, không
// phải một bậc thang cần đạt tới. "CK theo doanh số" vẫn dùng đúng số đã cấu hình như bình thường.
function tierThreshold(p){ return p.type==='CK cố định' ? 0 : (Number(p.threshold)||0); }
function currentTier(supplierId, revenue, asOfDate){
  const t = baseTierPolicies(supplierId, asOfDate).filter(p=>tierThreshold(p)<=revenue).sort((a,b)=>tierThreshold(b)-tierThreshold(a));
  return t[0]||null;
}
function nextTier(supplierId, revenue, asOfDate){
  const t = baseTierPolicies(supplierId, asOfDate).filter(p=>tierThreshold(p)>revenue).sort((a,b)=>tierThreshold(a)-tierThreshold(b));
  return t[0]||null;
}
function calcMethodOf(supplierId, asOfDate){
  const found = baseTierPolicies(supplierId, asOfDate).find(p=>p.method);
  return (found && found.method) || 'Hồi tố toàn bộ';
}
function incrementalDiscount(supplierId, revenue, asOfDate){
  const tiers = baseTierPolicies(supplierId, asOfDate).slice().sort((a,b)=>tierThreshold(a)-tierThreshold(b));
  let total=0;
  for(let i=0;i<tiers.length;i++){
    const t = tiers[i];
    const tThresh = tierThreshold(t);
    if(revenue < tThresh) continue;
    const nextThreshold = tiers[i+1] ? tierThreshold(tiers[i+1]) : revenue;
    const upper = Math.min(revenue, nextThreshold);
    total += Math.max(0, upper - tThresh) * t.rate;
  }
  return total;
}

/* Phát hiện xung đột cấu hình mốc CK cơ bản của 1 NCC:
   - Trùng mốc doanh số giữa 2 dòng đang hiệu lực (hệ thống sẽ chọn ngẫu nhiên theo thứ tự nhập)
   - Đường cong tỷ lệ CK đi ngược: mốc thấp hơn nhưng % CK cao hơn mốc cao hơn nó
   Trả về mảng chuỗi mô tả xung đột (rỗng nếu không có gì bất thường). */
function tierConflicts(supplierId, asOfDate){
  const tiers = baseTierPolicies(supplierId, asOfDate).slice().sort((a,b)=>tierThreshold(a)-tierThreshold(b));
  const warnings = [];
  const seenThreshold = new Map();
  for(const t of tiers){
    const th = tierThreshold(t);
    if(seenThreshold.has(th)){
      warnings.push(`Trùng mốc hiệu lực ${fmt(th)}đ giữa "${seenThreshold.get(th)}" và "${t.code||t.id}" — hệ thống sẽ chỉ áp dụng 1 dòng theo thứ tự nhập, dòng còn lại vô nghĩa.`);
    } else seenThreshold.set(th, t.code||t.id);
  }
  for(let i=1;i<tiers.length;i++){
    if(tiers[i].rate < tiers[i-1].rate){
      warnings.push(`Mốc "${tiers[i-1].code||tiers[i-1].id}" (${fmt(tierThreshold(tiers[i-1]))}đ) đang có tỷ lệ CK ${fmtPct(tiers[i-1].rate)} cao hơn mốc "${tiers[i].code||tiers[i].id}" (${fmt(tierThreshold(tiers[i]))}đ, ${fmtPct(tiers[i].rate)}) — đường cong CK bị đi ngược, kiểm tra lại số liệu đàm phán.`);
    }
  }
  return warnings;
}

function policyPeriodRevenue(p, ref){
  const period = cyclePeriod(p.cycle, ref, p.endDate);
  if(!period) return null;
  return sumRevenue(p.supplierId, period[0], period[1]);
}
function bonusAmount(supplierId, ref){
  let total=0;
  for(const p of bonusPolicies(supplierId, ref)){
    const rev = policyPeriodRevenue(p, ref);
    if(rev===null) continue;
    if(rev >= p.threshold) total += rev * p.bonusRate;
  }
  return total;
}
function supplierPeriodRevenue(supplierId, ref){
  const cycle = state.monitoring[supplierId] || 'Cần xác nhận';
  const period = cyclePeriod(cycle, ref);
  if(!period) return {revenue:null, cycle};
  return {revenue: sumRevenue(supplierId, period[0], period[1]), cycle, period};
}
function fullSupplierCalc(supplierId){
  const ref = toDate(state.reportDate) || new Date();
  const {revenue, cycle, period} = supplierPeriodRevenue(supplierId, ref);
  const tiers = baseTierPolicies(supplierId, ref);
  const conflicts = tierConflicts(supplierId, ref);
  if(revenue===null){
    return {revenue:null, cycle, tiers, cur:null, next:null, base:null, bonus: bonusAmount(supplierId,ref), total:null, method:calcMethodOf(supplierId, ref), conflicts};
  }
  const cur = currentTier(supplierId, revenue, ref);
  const nxt = nextTier(supplierId, revenue, ref);
  const method = calcMethodOf(supplierId, ref);
  const base = method==='Chỉ phần vượt mốc' ? incrementalDiscount(supplierId, revenue, ref) : (cur ? revenue*cur.rate : 0);
  const baseRetro = cur ? revenue*cur.rate : 0;
  const bonus = bonusAmount(supplierId, ref);
  const targetVND = nxt ? nxt.threshold*nxt.rate : baseRetro;
  const opportunity = Math.max(0, targetVND - baseRetro);
  return {revenue, period, cycle, tiers, cur, next:nxt, base, baseRetro, bonus, total: base+bonus, method, opportunity, missing: nxt? Math.max(0,nxt.threshold-revenue):0, conflicts};
}

// ở mọi module, giữ nguyên lựa chọn khi chuyển tab. Rỗng = không lọc gì theo thời gian.
let globalYearFilter = '';  // '' hoặc 'YYYY'
let globalMonthFilter = ''; // '' hoặc 'MM' (chỉ có nghĩa khi đã chọn globalYearFilter)
function periodFilterMatches(dateStr){
  if(!globalYearFilter) return true;
  if(!dateStr || !dateStr.startsWith(globalYearFilter)) return false;
  if(globalMonthFilter && dateStr.slice(5,7)!==globalMonthFilter) return false;
  return true;
}
// Khoảng ngày [from,to] (chuỗi 'YYYY-MM-DD') mà bộ lọc Tháng/Năm đang chọn tương ứng — null,null nếu
// không lọc gì. Dùng cho Đối soát CK (mỗi kỳ là 1 khoảng Từ ngày–Đến ngày, không phải 1 ngày đơn lẻ).
function periodFilterRange(){
  if(!globalYearFilter) return {from:null, to:null};
  if(globalMonthFilter){
    const y = Number(globalYearFilter), m = Number(globalMonthFilter);
    const lastDay = new Date(y, m, 0).getDate();
    return {from: `${globalYearFilter}-${globalMonthFilter}-01`, to: `${globalYearFilter}-${globalMonthFilter}-${String(lastDay).padStart(2,'0')}`};
  }
  return {from: `${globalYearFilter}-01-01`, to: `${globalYearFilter}-12-31`};
}
// 1 kỳ đối soát [fromDate,toDate] có GIAO NHAU với khoảng đang lọc không (kỳ dài hơn 1 tháng vẫn hiện ra
// nếu có phần nằm trong tháng/năm đang lọc) — so sánh chuỗi ISO 'YYYY-MM-DD' vẫn đúng thứ tự thời gian.
function periodFilterMatchesRange(fromDate, toDate){
  const {from, to} = periodFilterRange();
  if(!from) return true;
  if(!fromDate || !toDate) return false;
  return fromDate<=to && toDate>=from;
}
function periodFilterLabelText(){
  if(!globalYearFilter) return 'Tất cả thời gian';
  return globalMonthFilter ? `Tháng ${Number(globalMonthFilter)}/${globalYearFilter}` : `Năm ${globalYearFilter}`;
}
function periodFilterDescText(){
  if(!globalYearFilter) return '';
  return globalMonthFilter ? `tháng ${Number(globalMonthFilter)}/${globalYearFilter}` : `năm ${globalYearFilter}`;
}
// Các năm THỰC SỰ có dữ liệu (trong phạm vi module tài khoản hiện tại được tải) — dùng cho dropdown Năm.

  ].filter(Boolean);

}

  `;

const COLLAPSE_KEY = 'qt_ncc_collapsed_sections';
let collapsedSections = new Set();
try{
  const raw = localStorage.getItem(COLLAPSE_KEY);
  if(raw) collapsedSections = new Set(JSON.parse(raw));
}catch(e){}
function toggleSection(name){
  if(collapsedSections.has(name)) collapsedSections.delete(name);
  else collapsedSections.add(name);
  try{ localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...collapsedSections])); }catch(e){}
  renderNav();
}

function visibleTabs(){
  const role = currentRole();
  const acc = currentUser();
  let tabs = TABS.filter(t=> (!t.roles || t.roles.includes(role)) && (!t.module || hasModuleAccess(t.module, acc)));
  if(isPartnerAccount(acc)) tabs = tabs.filter(t=>t.partnerVisible===true);
  return tabs;
}

// vốn là tab con ẩn (parent:'suppliers') được hiện lên thành mục gốc, vì "suppliers" (Danh mục toàn bộ đối
// tác) không hiển thị với họ nên nếu vẫn giữ ẩn thì họ sẽ không có lối vào trang Chính sách CK của mình).
function navTabs(){
  const partner = isPartnerAccount(currentUser());
  return visibleTabs().filter(t=> !t.hidden || (partner && t.partnerTopLevel));
}

function sidebarActiveId(){
  const t = TABS.find(x=>x.id===activeTab);
  if(!t) return activeTab;
  if(t.parent && isPartnerAccount(currentUser()) && t.partnerTopLevel) return t.id; // hiện như mục gốc với Đối tác
  return t.parent ? t.parent : activeTab;
}

function renderNav(){
  const nav = document.getElementById('navList');
  const activeId = sidebarActiveId();
  const tabs = navTabs();
  let html=''; let i=0;
  while(i<tabs.length){
    const section = tabs[i].section;
    const collapsed = collapsedSections.has(section);
    html += `<div class="nav-group"><div class="nav-section${collapsed?' collapsed':''}" data-section="${escAttr(section)}"><span class="nav-section-label">${section}</span><span class="nav-section-caret">▾</span></div>`;
    if(!collapsed){
      html += `<div class="nav-group-items">`;
      while(i<tabs.length && tabs[i].section===section){
        const t = tabs[i];
        const longCls = t.label.length>18 ? ' long' : '';
        const badge = t.id==='bh_transactions' ? insAlertBadgeHTML() : '';
        html += `<div class="nav-item${longCls} ${t.id===activeId?'active':''}" data-tab="${t.id}"><span class="dot"></span><span class="label-text">${t.label}</span>${t.comingSoon?'<span class="soon-tag">Sắp có</span>':''}${badge}</div>`;
        i++;
      }
      html += `</div>`;
    } else {
      while(i<tabs.length && tabs[i].section===section) i++;
    }
    html += `</div>`;
  }
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{ activeTab = el.dataset.tab; renderAll(); });
  });
  nav.querySelectorAll('.nav-section').forEach(el=>{
    el.addEventListener('click', ()=>{ toggleSection(el.dataset.section); });
  });
}

  bh_suppliers: [{id:'bh_suppliers', label:'Danh sách NCC'}, {id:'bh_policies', label:'Biểu phí bảo hiểm'}],
  bh_transactions: [{id:'bh_transactions', label:'Doanh số'}, {id:'bh_reconcile', label:'Đối soát CK'}, {id:'bh_allocation', label:'Phân bổ đơn vị'}],
};
SUBTAB_GROUPS.policies = SUBTAB_GROUPS.suppliers;
SUBTAB_GROUPS.reconcile = SUBTAB_GROUPS.transactions;
SUBTAB_GROUPS.allocation = SUBTAB_GROUPS.transactions;
SUBTAB_GROUPS.nh_policies = SUBTAB_GROUPS.nh_suppliers;
SUBTAB_GROUPS.nh_reconcile = SUBTAB_GROUPS.nh_transactions;
SUBTAB_GROUPS.nh_allocation = SUBTAB_GROUPS.nh_transactions;
SUBTAB_GROUPS.bh_policies = SUBTAB_GROUPS.bh_suppliers;
SUBTAB_GROUPS.bh_reconcile = SUBTAB_GROUPS.bh_transactions;
SUBTAB_GROUPS.bh_allocation = SUBTAB_GROUPS.bh_transactions;

function subTabsHTML(){
  const group = SUBTAB_GROUPS[activeTab];
  if(!group) return '';
  const visibleIds = new Set(visibleTabs().map(t=>t.id));
  const filtered = group.filter(g=>visibleIds.has(g.id));
  if(filtered.length<2) return ''; // chỉ còn 0-1 subtab (vd Đối tác bị ẩn bớt) thì khỏi hiện thanh subtab
  return `<div class="subtabs">${filtered.map(g=>`<div class="subtab-item ${g.id===activeTab?'active':''}" data-subtab="${g.id}">${g.label}${g.id==='bh_allocation'?insAlertBadgeHTML():''}</div>`).join('')}</div>`;
}
function bindSubTabs(c){
  c.querySelectorAll('[data-subtab]').forEach(el=>{
    el.addEventListener('click', ()=>{ activeTab = el.dataset.subtab; renderAll(); });
  });
}

function renderUserChip(){
  const chip = document.getElementById('userChip');
  const menu = document.getElementById('userMenu');
  const u = currentUser();
  if(!u){ chip.innerHTML=''; menu.innerHTML=''; menu.classList.remove('open'); return; }
  const initials = u.name.trim().split(/\s+/).slice(-1)[0].slice(0,1).toUpperCase();
  chip.innerHTML = `<span class="user-avatar">${escHtml(initials)}</span><span>${escHtml(u.name)}${u.unit?' <span class="role-tag">· '+escHtml(u.unit)+'</span>':''}</span><span class="role-badge ${roleBadgeClass(u.role)}">${escHtml(u.role)}</span>`;
  chip.title = 'Bấm để xem tuỳ chọn tài khoản';
  menu.innerHTML = `
    <button type="button" id="menuChangePw">🔑 Đổi mật khẩu</button>
    <div class="menu-divider"></div>
    <button type="button" id="menuLogout" class="danger">↩ Đăng xuất</button>
  `;
  chip.onclick = (e)=>{ e.stopPropagation(); menu.classList.toggle('open'); };
  menu.querySelector('#menuChangePw').onclick = (e)=>{ e.stopPropagation(); menu.classList.remove('open'); openChangePasswordModal(u.id); };
  menu.querySelector('#menuLogout').onclick = (e)=>{ e.stopPropagation(); menu.classList.remove('open'); currentUserId = null; saveSession(); syncBranchesForCurrentUser(); renderAll(); };
}

/* Đổi mật khẩu cho chính tài khoản đang đăng nhập (mọi vai trò đều dùng được, kể cả Admin).
   Nếu tài khoản CHƯA có mật khẩu, không yêu cầu nhập mật khẩu hiện tại — chỉ cần đặt mật khẩu mới. */
function openChangePasswordModal(accId){
  const acc = state.accounts.find(a=>a.id===accId);
  if(!acc) return;
  const hasCurrentPw = accountHasPassword(acc);
  openModal('Đổi mật khẩu', `Tài khoản "${escHtml(acc.name)}" — mật khẩu mới sẽ dùng ngay từ lần đăng nhập sau.`,
    `<div class="form-grid">
       ${hasCurrentPw ? `<div class="field" style="grid-column:1/-1"><label>Mật khẩu hiện tại</label><input id="cp_old" type="password" placeholder="Nhập mật khẩu hiện tại"></div>` : ''}
       <div class="field" style="grid-column:1/-1"><label>Mật khẩu mới</label><input id="cp_new" type="password" placeholder="Để trống nếu muốn BỎ mật khẩu"></div>
       <div class="field" style="grid-column:1/-1"><label>Nhập lại mật khẩu mới</label><input id="cp_new2" type="password" placeholder="Gõ lại mật khẩu mới"></div>
       <div class="login-error" id="cp_err" style="display:none"></div>
       <button class="btn btn-primary" id="cpSubmitBtn" style="grid-column:1/-1">Lưu mật khẩu mới</button>
     </div>`,
    (body)=>{
      const oldInp = body.querySelector('#cp_old');
      const newInp = body.querySelector('#cp_new');
      const new2Inp = body.querySelector('#cp_new2');
      const err = body.querySelector('#cp_err');
      const showErr = (msg)=>{ err.textContent = msg; err.style.display='block'; };
      const submit = async ()=>{
        err.style.display='none';
        if(hasCurrentPw && !(await verifyAccountPassword(acc, oldInp.value))){ showErr('Sai mật khẩu hiện tại.'); oldInp.focus(); return; }
        if(newInp.value !== new2Inp.value){ showErr('Hai ô mật khẩu mới không khớp.'); new2Inp.focus(); return; }
        await setAccountPassword(acc, newInp.value);
        logActivity('update','Tài khoản', `Tự đổi mật khẩu tài khoản "${acc.name}" (${newInp.value ? 'đặt mật khẩu mới' : 'bỏ mật khẩu'})`);
        toast(newInp.value ? 'Đã đổi mật khẩu' : 'Đã bỏ mật khẩu cho tài khoản này');
        closeModal();
        renderAll();
      };
      body.querySelector('#cpSubmitBtn').addEventListener('click', submit);
      [oldInp, newInp, new2Inp].forEach(inp=> inp && inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); }));
      (oldInp||newInp).focus();
    });
}

function renderAll(){
  // chưa chọn danh tính → hiện màn hình đăng nhập, chặn toàn bộ nội dung
  if(!currentUser()){ renderLoginScreen(); return; }
  // đã có danh tính → dọn màn hình đăng nhập cũ nếu còn sót lại trong DOM
  const staleLoginScreen = document.getElementById('loginScreen');
  if(staleLoginScreen) staleLoginScreen.remove();
  // nếu đang ở tab mà vai trò/module hiện tại không được xem, đưa về tab đầu tiên họ thực sự thấy được
  if(!visibleTabs().find(t=>t.id===activeTab)){
    const first = navTabs()[0];
    activeTab = first ? first.id : 'dashboard';
  }

  document.querySelector('.shell').style.display='';
  renderUserChip();
  const periodLabelEl = document.getElementById('periodFilterLabel');
  if(periodLabelEl) periodLabelEl.textContent = periodFilterLabelText();
  renderNav();
  const subBar = document.getElementById('subTabBar');
  subBar.innerHTML = subTabsHTML();
  bindSubTabs(subBar);
  const c = document.getElementById('content');
  c.innerHTML = '';
  if(activeTab==='dashboard') renderDashboard(c);
  else if(activeTab==='monitor') renderMonitor(c);
  else if(activeTab==='suppliers') renderSuppliers(c);
  else if(activeTab==='policies') renderPolicies(c);
  else if(activeTab==='transactions') renderTransactions(c);
  else if(activeTab==='allocation') renderAllocation(c);
  else if(activeTab==='reconcile') renderReconcile(c);
  else if(activeTab==='nh_suppliers') renderBankSuppliers(c);
  else if(activeTab==='nh_policies') renderBankPolicies(c);
  else if(activeTab==='nh_transactions') renderBankTransactions(c);
  else if(activeTab==='nh_allocation') renderBankAllocation(c);
  else if(activeTab==='nh_reconcile') renderBankReconcile(c);
  else if(activeTab==='bh_suppliers') renderInsSuppliers(c);
  else if(activeTab==='bh_policies') renderInsPolicies(c);
  else if(activeTab==='bh_transactions') renderInsTransactions(c);
  else if(activeTab==='bh_allocation') renderInsAllocation(c);
  else if(activeTab==='bh_reconcile') renderInsReconcile(c);
  else if(activeTab==='accounts') renderAccounts(c);
  else if(activeTab==='activityLog') renderActivityLog(c);
  else if(activeTab==='settings') renderSettings(c);
  else if(activeTab==='trash') renderTrash(c);
  else{
    const t = TABS.find(x=>x.id===activeTab);
    if(t && t.comingSoon) renderComingSoon(c, t);
  }
  saveState();
}

/* ---------------------------- Màn hình đăng nhập (username + mật khẩu) ---------------------------- */
function renderLoginScreen(){
  document.querySelector('.shell').style.display='none';
  let screen = document.getElementById('loginScreen');
  if(!screen){
    screen = document.createElement('div');
    screen.id = 'loginScreen';
    document.body.appendChild(screen);
  }
  screen.className = 'login-screen';
  const accounts = state.accounts;
  screen.innerHTML = `
    <div class="login-card">
      <div class="login-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 3v16a2 2 0 0 0 2 2h16" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M7 15l4-4 3 3 6-7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="mark"><span class="l1">Quản trị</span><span class="l2">Mục tiêu Đối tác/NCC</span></div>
      <div class="sub">Đăng nhập bằng tên tài khoản để tiếp tục — mọi thao tác sẽ được ghi vào Nhật ký hoạt động.</div>
      <div class="login-form">
        <div class="login-field">
          <label>Tên đăng nhập</label>
          <input id="li_username" placeholder="Nhập tên tài khoản" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>
        <div class="login-field">
          <label>Mật khẩu</label>
          <input id="li_password" type="password" placeholder="Nhập mật khẩu (nếu tài khoản có đặt)" autocomplete="current-password">
        </div>
        <div class="login-error" id="li_error"></div>
        <button class="login-submit" id="li_submit" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 17l5-5-5-5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M15 12H3" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Đăng nhập
        </button>
      </div>
      <div class="helper" style="margin-top:22px">Chưa có tài khoản? Chỉ <b>Admin</b> mới tạo được tài khoản mới — liên hệ Admin để được tạo ở tab "Quản trị tài khoản". Tài khoản nào được Admin đặt mật khẩu thì cần nhập đúng mật khẩu, tài khoản không đặt mật khẩu thì để trống ô mật khẩu cũng đăng nhập được.</div>
    </div>
  `;
  const userInput = screen.querySelector('#li_username');
  const pwInput = screen.querySelector('#li_password');
  const errBox = screen.querySelector('#li_error');
  const showErr = (msg)=>{ errBox.textContent = msg; errBox.classList.add('show'); };
  const clearErr = ()=>{ errBox.classList.remove('show'); };
  const submit = async ()=>{
    clearErr();
    const typed = userInput.value.trim().toLowerCase();
    if(!typed){ showErr('Nhập tên đăng nhập trước đã.'); userInput.focus(); return; }
    // So khớp theo "Tài khoản" (username) — tài khoản cũ chưa được gán username riêng thì tự dùng
    // Tên hiển thị làm tên đăng nhập, để tương thích ngược với dữ liệu tạo trước khi có trường này.
    const acc = accounts.find(a=> (a.username ? a.username.trim().toLowerCase() : a.name.trim().toLowerCase()) === typed);
    if(!acc){ showErr('Không tìm thấy tài khoản này. Kiểm tra lại tên hoặc liên hệ Admin.'); return; }
    const ok = await verifyAccountPassword(acc, pwInput.value);
    if(!ok){ showErr('Sai mật khẩu.'); pwInput.value=''; pwInput.focus(); return; }
    currentUserId = acc.id;
    saveSession();
    await syncBranchesForCurrentUser(); // tải thêm đúng nhánh module của tài khoản vừa đăng nhập (nếu đang dùng Firebase)
    screen.remove();
    renderAll();
  };
  screen.querySelector('#li_submit').addEventListener('click', submit);
  [userInput, pwInput].forEach(inp=> inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); }));
  userInput.focus();
}
/* ---------------------------- Dashboard ---------------------------- */
function renderDashboard(c){
  setTitle('Dashboard', 'Tổng quan doanh số & chiết khấu toàn hệ thống — ngày báo cáo '+ (toDate(state.reportDate)||new Date()).toLocaleDateString('vi-VN'));

  let totalRevenue=0, totalDiscount=0, totalOpportunity=0, needConfirm=0;
  const rows = state.suppliers.map(s=>{
    const calc = fullSupplierCalc(s.id);
    if(calc.revenue===null) needConfirm++;
    else { totalRevenue += calc.revenue; totalDiscount += calc.total; totalOpportunity += (calc.opportunity||0); }
    return {s, calc};
  });

  const reconTotals = state.reconciliations.reduce((acc,r)=>{
    const rc = reconCalc(r);
    acc.due += rc.totalDue; acc.confirmed += Number(r.confirmed)||0; acc.received += rc.received;
    acc.owed += rc.stillOwed;
    return acc;
  }, {due:0, confirmed:0, received:0, owed:0});

  c.innerHTML = `
    <div class="kpi-row">
      <div class="kpi-card">
        <div class="kpi-label">Tổng doanh số kỳ theo dõi</div>
        <div class="kpi-value">${fmt(totalRevenue)}</div>
        <div class="kpi-sub">${state.suppliers.length} NCC · ${needConfirm} NCC cần xác nhận chu kỳ</div>
      </div>
      <div class="kpi-card forest">
        <div class="kpi-label">CK / Thưởng dự kiến</div>
        <div class="kpi-value">${fmt(totalDiscount)}</div>
        <div class="kpi-sub">Gồm CK theo mốc + Thưởng thêm đã đạt</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Cơ hội tăng thêm (nếu lên mốc kế tiếp)</div>
        <div class="kpi-value">${fmt(totalOpportunity)}</div>
        <div class="kpi-sub">So với mốc CK cơ bản tiếp theo</div>
      </div>
      <div class="kpi-card rust">
        <div class="kpi-label">CK còn phải thu (đối soát)</div>
        <div class="kpi-value">${fmt(reconTotals.owed)}</div>
        <div class="kpi-sub">Đã nhận ${fmt(reconTotals.received)} / phải hưởng ${fmt(reconTotals.due)}</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div>
          <h2>Top NCC có cơ hội tăng CK</h2>
          <div class="desc">Xếp hạng tự động theo khoảng cách tới mốc kế tiếp — không giới hạn số lượng NCC</div>
        </div>
      </div>
      <div class="panel-body flush">
        <div class="tbl-wrap">
          <table class="data" id="dashTopTable"></table>
        </div>
      </div>
    </div>
  `;

  const top = rows.filter(r=>r.calc.revenue!==null && r.calc.next).sort((a,b)=>b.calc.opportunity-a.calc.opportunity).slice(0,15);
  const tbl = document.getElementById('dashTopTable');
  if(top.length===0){
    tbl.outerHTML = `<div class="empty"><div class="big">Chưa có cơ hội nào để xếp hạng</div>Hãy khai báo Chu kỳ theo dõi ở tab "Theo dõi mốc CK" và nhập doanh số.</div>`;
    return;
  }
  tbl.innerHTML = `
    <thead><tr>
      <th>NCC</th><th class="num">DS kỳ</th><th class="num">Mốc tiếp theo</th><th class="num">Còn thiếu</th>
      <th class="num">CK hiện tại</th><th class="num">CK mục tiêu</th><th class="num">Cơ hội tăng thêm</th>
    </tr></thead>
    <tbody>${top.map(r=>`
      <tr>
        <td class="wrap">${escHtml(r.s.name)}</td>
        <td class="num">${fmt(r.calc.revenue)}</td>
        <td class="num">${r.calc.next?fmt(r.calc.next.threshold):'—'}</td>
        <td class="num">${fmt(r.calc.missing)}</td>
        <td class="num">${fmtPct(r.calc.cur?r.calc.cur.rate:0)}</td>
        <td class="num">${r.calc.next?fmtPct(r.calc.next.rate):'—'}</td>
        <td class="num" style="color:var(--amber);font-weight:600">${fmt(r.calc.opportunity)}</td>
      </tr>`).join('')}
    </tbody>`;
}

/* ---------------------------- Theo dõi mốc CK ---------------------------- */
function statusStamp(calc){
  if(calc.revenue===null) return `<span class="stamp warn">Cần xác nhận</span>`;
  if(!calc.next) return `<span class="stamp ok">Đã đạt mốc cao nhất</span>`;
  if(calc.revenue>=calc.next.threshold) return `<span class="stamp ok">Đã đạt</span>`;
  return `<span class="stamp pending">Chưa đạt mốc</span>`;
}

function escAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
// Escape đầy đủ để chèn AN TOÀN vào nội dung HTML dạng chữ thuần (không phải bên trong value="..." của input).
// Khác escAttr ở chỗ escape thêm "<" và ">" — bắt buộc dùng cho mọi dữ liệu tự do (tên NCC/NH/BH, ghi chú,
// chi tiết Nhật ký hoạt động...) khi hiển thị trực tiếp làm text trên trang, để chặn XSS lưu trữ.
function escHtml(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
/* Ô tiêu đề cột đơn vị trong ma trận NCC/Ngân hàng/Bảo hiểm × Đơn vị — tên dài tự ellipsis 2 dòng, xem đầy đủ qua tooltip.
   Dùng chung cho renderAllocation, renderBankAllocation, renderInsAllocation để tránh bảng bị kéo quá rộng. */
function matrixUnitHeaderCell(unitName){
  const short = String(unitName||'').replace('Đơn vị ','');
  return `<th class="num unit-col" title="${escAttr(short)}"><span class="unit-col-inner">${escHtml(short)}</span></th>`;
}
/* Ô tên hãng/NCC/ngân hàng ở cột đầu ma trận — cũng giới hạn chiều rộng + tooltip, tránh chiếm quá nhiều chỗ cố định */
function matrixRowLabelCell(name){
  return `<td class="row-label" title="${escAttr(name)}">${escHtml(name)}</td>`;
}
/* Colgroup GỢI Ý độ rộng (không ép cứng vì table-layout vẫn auto): cột tên + các cột tổng hợp cuối bảng
   (Tổng, Tỷ trọng, Đơn vị chính, Gợi ý...) được gợi ý % để không bị trình duyệt giãn quá rộng; các cột
   đơn vị (số liệu tiền, độ dài thay đổi theo dữ liệu) CỐ TÌNH để trống width — browser tự giãn theo đúng
   độ dài số thực tế, tránh số bị ép hẹp rồi tràn/đè chữ sang ô bên cạnh (lỗi đã gặp khi ép % cứng + fixed).
   trailingPcts: mảng % cho từng cột cố định ở cuối bảng, theo đúng thứ tự xuất hiện. */
function matrixColgroupHTML(unitCount, trailingPcts){
  const namePct = 16;
  let cols = `<col style="width:${namePct}%">`;
  for(let i=0;i<unitCount;i++) cols += `<col>`;
  trailingPcts.forEach(p=> cols += `<col style="width:${p}%">`);
  return `<colgroup>${cols}</colgroup>`;
}
/* Gim (sticky) đúng cách cho bảng có NHIỀU hàng tiêu đề (VD: hàng "Người phụ trách" phụ trong Ma trận NCC × Đơn vị).
   CSS chỉ đặt top:0 cho mọi <th>, nên hàng tiêu đề thứ 2 trở đi cần được JS đo chiều cao hàng phía trên rồi
   gán top offset tương ứng — nếu không sẽ đè lên nhau khi cuộn dọc (đúng lỗi trong ảnh người dùng gửi). */
function wireStickyHeaderRows(tbl){
  const rows = tbl.querySelectorAll('thead tr');
  let offset = 0;
  rows.forEach(row=>{
    row.querySelectorAll('th').forEach(th=>{ th.style.top = offset+'px'; });
    offset += row.getBoundingClientRect().height;
  });
}
/* Ô tiêu đề cột gọn cho các bảng dữ liệu (không phải ma trận): tên viết tắt + phụ đề nhỏ bên dưới,
   tooltip hiện đầy đủ ý nghĩa khi rê chuột — tránh header dài tràn ngang bảng. */
function thCompact(main, sub, fullTip, numeric){
  return `<th class="${numeric?'num':''}" title="${escAttr(fullTip||main)}"><span class="th-compact"><span class="th-main">${main}</span>${sub?`<span class="th-sub">${sub}</span>`:''}</span></th>`;
}
/* wireCellEdits: gắn sự kiện sửa trực tiếp trên bảng + ghi Nhật ký hoạt động.
   labelFn(item) trả về tên hiển thị của dòng để ghi log cho dễ đọc. */
function wireCellEdits(tbl, arr, entityName, labelFn){
  tbl.querySelectorAll('[data-field]').forEach(el=>{
    if(el.classList.contains('money')) attachMoneyFormatting(el);
    el.addEventListener('change', ()=>{
      const item = arr.find(x=>x.id===el.dataset.id);
      if(!item) return;
      let val = el.value;
      if(el.classList.contains('money')) val = parseMoneyInput(val);
      else if(el.classList.contains('pct')) val = (Number(val)||0)/100;
      else if(el.classList.contains('num')) val = Number(val)||0;
      const before = item[el.dataset.field];
      // Chặn Ngày kết thúc sớm hơn Ngày bắt đầu khi sửa trực tiếp trong bảng (áp dụng cho mọi bảng có cả
      // 2 field này — Chính sách CK/Chính sách NH/Biểu phí bảo hiểm — không ảnh hưởng bảng khác vì chúng
      // dùng tên field khác, vd fromDate/toDate).
      if((el.dataset.field==='startDate'||el.dataset.field==='endDate') && 'startDate' in item && 'endDate' in item){
        const newStart = el.dataset.field==='startDate' ? val : item.startDate;
        const newEnd = el.dataset.field==='endDate' ? val : item.endDate;
        if(newStart && newEnd && newEnd < newStart){
          toast('Ngày kết thúc không được sớm hơn Ngày bắt đầu');
          el.value = before||'';
          return;
        }
      }
      item[el.dataset.field] = val;
      if(el.classList.contains('money')) el.value = formatMoneyValue(val);
      if(el.classList.contains('pct')) el.value = round2(val*100);
      if(entityName) logActivity('update', entityName, `${labelFn?labelFn(item):item.id}: ${el.dataset.field} "${before}" → "${val}"`);
      saveState();
      if(['name','supplierId','type','threshold','rate','startDate','endDate','confirmed'].includes(el.dataset.field)) renderAll();
    });
  });
}

function getFilteredTx(){
  const unitFilter = (txUnitFilter||'').trim().toLowerCase();
  const supFilter = (txSupplierFilter||'').trim().toLowerCase();
  const pf = partnerScopeFilter('supplierId');
  const all = (pf ? state.transactions.filter(pf) : state.transactions).slice().sort((a,b)=> b.date.localeCompare(a.date));
  return all.filter(t=>{
    if(unitFilter && !(t.unit||'').trim().toLowerCase().includes(unitFilter)) return false;
    if(supFilter){
      const s = supplierById(t.supplierId);
      if(!s || !s.name.trim().toLowerCase().includes(supFilter)) return false;
    }
    if(!periodFilterMatches(t.date)) return false;
    return true;
  });
}

    <tbody>${sorted.map(t=>{

        <td>${new Date(t.date+'T00:00:00').toLocaleDateString('vi-VN')}</td>

        <td>${escHtml(t.doc||'')}</td>

  wireLockToggle(tbl);
  tbl.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{

      if(t && isRecordLockedForMe(t, state.reconciliations, 'supplierId')){ toast('Chứng từ thuộc kỳ đối soát đã chốt — chỉ Admin được xoá'); return; }
      const s = t ? supplierById(t.supplierId) : null;
      softDelete('transactions', t, 'Doanh số');
      logActivity('delete','Doanh số', `Xoá chứng từ ${t?t.doc||'':''} (${s?s.name:''}, ${t?fmt(t.gross):''}đ)`);
      renderAll();
    });
  });

function periodFilterDateObjects(){
  const {from, to} = periodFilterRange();
  return { from: from ? toDate(from) : null, to: to ? toDate(to) : null };
}
function renderAllocation(c){
  setTitle('Phân bổ đơn vị', 'Đóng góp doanh số của từng đơn vị cho từng NCC'+(globalYearFilter?' — '+periodFilterDescText():' — cộng dồn toàn thời gian'));
  const unitOwners = {};
  state.units.forEach(u=>{ unitOwners[u] = state.accounts.filter(a=>a.unit===u).map(a=>a.name); });
  const unassignedCount = state.units.filter(u=>unitOwners[u].length===0).length;
  const canManageUnits = canEdit('settings');
  c.innerHTML = `
    <div class="panel">
      <div class="panel-head"><div><h2>Người phụ trách theo đơn vị</h2>
      <div class="desc">Lấy từ Đơn vị phụ trách ở tab Quản trị tài khoản — ${unassignedCount>0?unassignedCount+' đơn vị chưa gán ai':'mọi đơn vị đều đã có người phụ trách'}${canManageUnits?' · bấm ✕ trên thẻ để xoá đơn vị':''}</div></div>
      ${canEdit('accounts') ? `<button class="btn btn-ghost" id="gotoAccountsBtn">Đi tới Quản trị tài khoản</button>` : ''}
      </div>
      <div class="panel-body">
        ${state.units.length===0 ? `<div class="helper">Chưa có đơn vị nào. Đơn vị sẽ tự tạo khi bạn gán "Đơn vị phụ trách" cho tài khoản, hoặc thêm thủ công ở tab Cài đặt.</div>` : `
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          ${state.units.map(u=>`
            <span class="tag ${unitOwners[u].length?'gold':''}" style="display:inline-flex;align-items:center;gap:6px" title="${escAttr(unitOwners[u].join(', ')||'Chưa gán')}">
              ${escHtml(u.replace('Đơn vị ',''))}: ${unitOwners[u].length? escHtml(unitOwners[u].join(', ')) : '<em>chưa gán</em>'}
              ${canManageUnits ? `<button class="row-del" data-del-unit-alloc="${escAttr(u)}" title="Xoá đơn vị ${escAttr(u)}" style="padding:0 4px">✕</button>` : ''}
            </span>`).join('')}
        </div>`}
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><div><h2>Ma trận NCC × Đơn vị</h2>
      <div class="desc">${state.units.length} đơn vị hiện có · sửa danh sách đơn vị ở tab Cài đặt · % dưới mỗi ô là % hoàn thành chỉ tiêu đơn vị so với mốc đã phân bổ (xem/chỉnh ở nút "Phân bổ đơn vị" trong tab Chính sách CK; mốc chưa phân bổ chỉ tiêu sẽ không hiện %)</div></div></div>
      <div class="panel-body flush"><div class="matrix-scroll"><table class="data matrix-fixed" id="allocTable"></table></div></div>
    </div>
  `;
  if(canEdit('accounts')) document.getElementById('gotoAccountsBtn').addEventListener('click', ()=>{ activeTab='accounts'; renderAll(); });
  if(canManageUnits) document.querySelectorAll('[data-del-unit-alloc]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const u = btn.dataset.delUnitAlloc;
      const usage = unitUsage(u);
      const msg = usage.total>0
        ? `Đơn vị "${u}" đang được ${usage.accountsUsing} tài khoản phụ trách và có ${usage.txUsing} chứng từ ghi nhận. Xoá khỏi danh sách sẽ gỡ liên kết khỏi các tài khoản đó (chứng từ cũ vẫn giữ nguyên). Vẫn xoá?`
        : `Xoá đơn vị "${u}" khỏi danh sách?`;
      if(!confirm(msg)) return;
      deleteUnit(u);
      toast('Đã xoá đơn vị "'+u+'"');
      renderAll();
    });
  });
  const tbl = document.getElementById('allocTable');
  if(state.suppliers.length===0){
    tbl.outerHTML = `<div class="empty"><div class="big">Chưa có NCC</div></div>`; return;
  }
  // Mốc dùng để tính % hoàn thành theo đơn vị: CHỈ xét trong số các mốc ĐÃ ĐƯỢC PHÂN BỔ chỉ tiêu
  // (bỏ qua các mốc chưa cấu hình unitTargets, dù threshold gần hơn) — vì mốc chưa phân bổ gì thì
  // không có cơ sở tính %, và người dùng thường chỉ chủ động phân bổ đúng 1 mốc họ đang thực sự theo dõi.
  // Trong số các mốc đã phân bổ: ưu tiên mốc GẦN NHẤT CHƯA ĐẠT; nếu không còn mốc nào phía trên,
  // lấy mốc đã phân bổ có threshold cao nhất (đã đạt) để vẫn có % tham chiếu.
  function matrixTargetPolicyFor(supplierId, total){
    const withTargets = state.policies.filter(p=>p.supplierId===supplierId && p.unitTargets && Object.keys(p.unitTargets).length>0);
    if(withTargets.length===0) return null;
    const unmet = withTargets.filter(p=>p.threshold>total).sort((a,b)=>a.threshold-b.threshold);
    if(unmet.length) return unmet[0];
    return withTargets.slice().sort((a,b)=>b.threshold-a.threshold)[0];
  }
  const {from: pfFrom, to: pfTo} = periodFilterDateObjects();
  const rows = state.suppliers.map(s=>{
    const perUnit = state.units.map(u=>sumRevenue(s.id, pfFrom, pfTo, u));
    const total = perUnit.reduce((a,b)=>a+b,0);
    const max = Math.max(0,...perUnit);
    const share = total>0 ? max/total : 0;
    const topIdx = perUnit.indexOf(max);
    const targetPolicy = matrixTargetPolicyFor(s.id, total);

/* ---------------------------- Đối soát CK ---------------------------- */
const RECON_PAY_METHODS = ['Chuyển khoản','Tiền mặt','Trừ công nợ','Khác'];

/* Chuẩn hoá 1 kỳ đối soát sang mô hình "Sổ nhận tiền" (nhiều dòng thanh toán) thay vì 1 số "Đã nhận" gõ tay.
   Nếu kỳ cũ (từ trước khi có tính năng này) đã có sẵn r.received > 0, tự chuyển thành 1 dòng thanh toán
   đầu tiên để không mất dữ liệu đã nhập trước đó. */
function ensureReconciliationPayments(r){
  if(!Array.isArray(r.payments)){
    const legacy = Number(r.received)||0;
    r.payments = legacy>0 ? [{
      id: uid('pay'), date: r.toDate||todayISO(), amount: legacy,
      method:'Chuyển khoản', note:'Chuyển từ dữ liệu "Đã nhận" cũ', createdBy: null,
    }] : [];
  }
  return r.payments;
}
function reconReceivedTotal(r){
  return ensureReconciliationPayments(r).reduce((sum,p)=> sum+(Number(p.amount)||0), 0);
}
/* Trạng thái đối soát giờ SUY RA tự động từ số tiền đã nhận thực tế so với CK phải hưởng,
   không cho chọn tay nữa — tránh tình trạng Trạng thái nói một đằng, số liệu nói một nẻo. */
function reconStatus(totalDue, receivedTotal){
  if(totalDue<=0) return {label:'Chưa có CK', cls:'muted'};
  if(receivedTotal<=0) return {label:'Chưa đối soát', cls:'muted'};
  if(receivedTotal < totalDue) return {label:'Đang xử lý', cls:'pending'};
  if(receivedTotal > totalDue) return {label:'Nhận vượt', cls:'warn'};
  return {label:'Đã nhận đủ', cls:'ok'};
}

/* ---------------------------- Chốt kỳ đối soát (khoá sửa/xoá hồ sơ nguồn) ----------------------------
   Dùng chung cho cả 3 module: NCC (idField:'supplierId', list: state.reconciliations),
   Ngân hàng ('bankId', state.bankReconciliations), Bảo hiểm ('insurerId', state.insReconciliations).
   Sau khi "Chốt" 1 kỳ: số liệu quan trọng được SNAPSHOT (đóng băng) vào chính kỳ đó, đồng thời mọi hồ sơ
   nguồn (Doanh số / Sổ hồ sơ vay / Sổ hợp đồng bảo hiểm) cùng đối tác và có ngày nằm trong khoảng
   Từ ngày–Đến ngày của kỳ sẽ bị KHOÁ sửa/xoá với mọi vai trò TRỪ Admin. Chỉ Admin được sửa hồ sơ đã khoá,
   và chỉ Admin được "Mở khoá" (gỡ khoá áp dụng cho CẢ KỲ, không mở lẻ từng hồ sơ). */
function isDateInRange(dateStr, fromStr, toStr){
  const d = toDate(dateStr), from = toDate(fromStr), to = toDate(toStr);
  if(!d || !from || !to) return false;
  return d>=from && d<=to;
}
// Tìm kỳ đối soát ĐÃ CHỐT đang khoá 1 hồ sơ cụ thể (nếu có).
function lockingReconOf(t, reconList, idField){
  if(!Array.isArray(reconList) || !t) return null;
  return reconList.find(r=> r.locked && r[idField]===t[idField] && isDateInRange(t.date, r.fromDate, r.toDate)) || null;
}
// Hồ sơ có đang bị khoá sửa/xoá với vai trò hiện tại không (Admin luôn được sửa hồ sơ đã khoá).
function isRecordLockedForMe(t, reconList, idField){
  if(currentRole()==='Admin') return false;
  return !!lockingReconOf(t, reconList, idField);
}
function lockReconciliation(r, snapshot, entityName, label){
  r.locked = true; r.lockedAt = new Date().toISOString(); r.lockedBy = currentUserId; r.lockSnapshot = snapshot;
  logActivity('update', entityName, `🔒 Chốt kỳ "${label}" — khoá sửa/xoá hồ sơ nguồn trong kỳ`);
}
function unlockReconciliation(r, entityName, label){
  r.locked = false; r.unlockedAt = new Date().toISOString(); r.unlockedBy = currentUserId;
  logActivity('update', entityName, `🔓 Mở khoá kỳ "${label}" — cho phép sửa/xoá hồ sơ trở lại`);
}
// Ghi chú cảnh báo khi số liệu hiện tại (tính lại real-time) đã lệch so với lúc chốt — chỉ hiện khi đã chốt.
function lockMismatchNote(r, liveDue){
  if(!r.locked || !r.lockSnapshot) return '';
  const before = Math.round(Number(r.lockSnapshot.totalDue)||0);
  const after = Math.round(Number(liveDue)||0);
  if(before===after) return '';
  return `<div style="font-size:10px;font-weight:400;color:var(--rust)">⚠ Lệch so với lúc chốt (${fmt(before)}đ) — Admin đã sửa hồ sơ sau khi chốt</div>`;
}

// moduleKey dùng để nút "Mở khoá" trên hồ sơ biết phải mở kỳ nào, thuộc mảng nào.

// Gắn sự kiện cho các icon 🔒 mở khoá trên bảng hồ sơ (Admin bấm để mở khoá cả kỳ đang khoá dòng đó).
function wireLockToggle(tbl){
  const MODULES = {
    ncc: {list: ()=>state.reconciliations, entity:'Đối soát CK'},
    nh:  {list: ()=>state.bankReconciliations, entity:'Đối soát CK (NH)'},
    bh:  {list: ()=>state.insReconciliations, entity:'Đối soát CK (Bảo hiểm)'},
  };
  tbl.querySelectorAll('[data-unlock-tx]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [moduleKey, reconId] = btn.dataset.unlockTx.split('|');
      const cfg = MODULES[moduleKey]; if(!cfg) return;
      const list = cfg.list();
      const r = list.find(x=>x.id===reconId); if(!r) return;
      if(!confirm(`Hồ sơ này thuộc kỳ đối soát "${r.period}" đã chốt. Mở khoá CẢ KỲ này để sửa/xoá hồ sơ?`)) return;
      unlockReconciliation(r, cfg.entity, r.period);
      toast('Đã mở khoá kỳ "'+r.period+'"');
      renderAll();
    });
  });
}

function reconCalc(r){
  const from = toDate(r.fromDate), to = toDate(r.toDate);
  if(!r.supplierId || !from || !to) return {revenue:0, rate:0, discount:0, bonus:0, totalDue:0, diff:0, stillOwed:0};
  const revenue = sumRevenue(r.supplierId, from, to);
  // Dùng đúng "Phương pháp áp dụng" (hồi tố toàn bộ / chỉ phần vượt mốc) và tôn trọng "Ngày kết thúc"
  // của từng mốc — đánh giá hiệu lực mốc TẠI THỜI ĐIỂM CUỐI KỲ đối soát (to), không phải hôm nay,
  // để đối soát 1 kỳ trong quá khứ vẫn đúng ngay cả khi mốc đó đã hết hạn ở hiện tại.
  const method = calcMethodOf(r.supplierId, to);
  const tier = currentTier(r.supplierId, revenue, to);
  const rate = tier ? tier.rate : 0;
  const discount = method==='Chỉ phần vượt mốc' ? incrementalDiscount(r.supplierId, revenue, to) : revenue*rate;
  const ref = toDate(state.reportDate) || new Date();
  const bonus = bonusAmount(r.supplierId, ref);
  const totalDue = discount + bonus;
  const confirmed = Number(r.confirmed)||0;
  const received = reconReceivedTotal(r);
  return {revenue, rate, discount, bonus, totalDue, diff: received-totalDue, stillOwed: Math.max(0, totalDue-received), received, method};
}

/* ============================================================================
   MODULE NGÂN HÀNG — Danh mục NH · Chính sách CK (điều kiện vay) · Doanh số
   (hồ sơ vay/giải ngân) · Phân bổ đơn vị · Đối soát CK (hoa hồng)
   Cùng cấu trúc thao tác với module "NCC Dịch vụ Ô tô - Xe máy" nhưng dùng
   state.banks/bankPolicies/bankTransactions/bankReconciliations riêng, vì
   chính sách ngân hàng đổi theo THÁNG (không theo mốc doanh số luỹ kế) và
   Hoa hồng tính trực tiếp trên số tiền GIẢI NGÂN, không có luỹ kế mốc.
   ============================================================================ */
function bankById(id){ return state.banks.find(b=>b.id===id); }
function insurerById(id){ return state.insurers.find(x=>x.id===id); }
function monthKey(dateStr){ return (dateStr||todayISO()).slice(0,7); }
function monthLabel(mk){
  if(!mk) return '—';
  const [y,m] = mk.split('-');
  return 'Tháng '+Number(m)+'/'+y;
}
/* Chính sách áp dụng cho 1 NH tại 1 ngày = dòng chính sách CÙNG THÁNG hoặc THÁNG GẦN NHẤT
   trước đó (chính sách tháng trước vẫn có hiệu lực cho tới khi có chính sách tháng mới hơn). */
function activeBankPolicy(bankId, dateStr){
  const mk = monthKey(dateStr);
  const rows = state.bankPolicies.filter(p=>p.bankId===bankId && p.month<=mk).sort((a,b)=> b.month.localeCompare(a.month));
  return rows[0] || null;
}
function bankTxCommission(t){
  if(t.status!=='Đã giải ngân') return 0;
  const pol = activeBankPolicy(t.bankId, t.date);
  if(!pol) return 0;
  return (Number(t.loanAmount)||0) * (Number(pol.commissionRate)||0);
}
function bankLoanSum(bankId, from, to, unit){
  let total=0;
  for(const t of state.bankTransactions){
    if(t.bankId!==bankId || t.status!=='Đã giải ngân') continue;
    if(unit && t.unit!==unit) continue;
    const d = toDate(t.date);
    if(from && d<from) continue;
    if(to && d>to) continue;
    total += Number(t.loanAmount)||0;
  }
  return total;
}
// Đếm số hồ sơ vay THỰC SỰ khớp điều kiện (đúng NH + trạng thái "Đã giải ngân" + trong khoảng ngày) —
// dùng để hiện chú thích chẩn đoán ngay trong bảng Đối soát CK, giúp thấy ngay lý do 1 kỳ ra 0đ
// (VD: đúng ngân hàng nhưng chưa hồ sơ nào "Đã giải ngân" trong khoảng ngày đó → 0 hồ sơ khớp).
function bankTxMatchCount(bankId, from, to, unit){
  let n=0;
  for(const t of state.bankTransactions){
    if(t.bankId!==bankId || t.status!=='Đã giải ngân') continue;
    if(unit && t.unit!==unit) continue;
    const d = toDate(t.date);
    if(from && d<from) continue;
    if(to && d>to) continue;
    n++;
  }
  return n;
}
function bankCommissionSum(bankId, from, to, unit){
  let total=0;
  for(const t of state.bankTransactions){
    if(t.bankId!==bankId || t.status!=='Đã giải ngân') continue;
    if(unit && t.unit!==unit) continue;
    const d = toDate(t.date);
    if(from && d<from) continue;
    if(to && d>to) continue;
    total += bankTxCommission(t);
  }
  return total;
}
function allTimeBankLoan(bankId, unit){ return bankLoanSum(bankId,null,null,unit); }
function allTimeBankCommission(bankId, unit){ return bankCommissionSum(bankId,null,null,unit); }
function bankReconCalc(r){
  const from=toDate(r.fromDate), to=toDate(r.toDate);
  if(!r.bankId||!from||!to) return {loan:0, totalDue:0, dueForCalc:0, received:0, diff:0, stillOwed:0, matchCount:0, totalTxForBank:0};
  const loan = bankLoanSum(r.bankId, from, to);
  const totalDue = bankCommissionSum(r.bankId, from, to); // số hệ thống TỰ TÍNH từ Doanh số × Chính sách CK
  const matchCount = bankTxMatchCount(r.bankId, from, to);
  // Tổng số hồ sơ (mọi trạng thái, mọi ngày) đang gán cho đúng ngân hàng này — để phân biệt 2 tình huống:
  // "ngân hàng này chưa có hồ sơ nào cả" (totalTxForBank=0, nhiều khả năng ghi nhầm module/NH khác)
  // với "có hồ sơ nhưng không khớp trạng thái/khoảng ngày của kỳ đối soát" (totalTxForBank>0, matchCount=0).
  const totalTxForBank = state.bankTransactions.filter(t=>t.bankId===r.bankId).length;
  const confirmed = Number(r.confirmed)||0;
  // "NH xác nhận": nếu ngân hàng đã xác nhận 1 số hoa hồng cụ thể (có thể lệch với số hệ thống tự tính do
  // phí, làm tròn, điều chỉnh...) thì ƯU TIÊN dùng số NH xác nhận làm chuẩn để tính Chênh lệch/Còn phải thu.
  // Nếu NH chưa xác nhận (để 0), vẫn dùng số hệ thống tự tính như trước.
  const dueForCalc = confirmed>0 ? confirmed : totalDue;
  const received = reconReceivedTotal(r);
  return {loan, totalDue, dueForCalc, received, diff:received-dueForCalc, stillOwed:Math.max(0,dueForCalc-received), matchCount, totalTxForBank};
}

        const lockR = lockingReconOf({bankId:bank.id, date:btxDate}, state.bankReconciliations, 'bankId');

      });

      document.getElementById('btf_phone').value=''; document.getElementById('btf_vehicle').value='';

      bankTxUnitFilter = unit; bankTxBankFilter = bank.name;

    });
    exportToExcel('DoanhSo_NganHang_'+todayISO()+'.xlsx', [{name:'Doanh số NH', rows}]);

  renderBankTxTable(editable);
}
function getFilteredBankTx(){
  const unitFilter = (bankTxUnitFilter||'').trim().toLowerCase();
  const bankFilter = (bankTxBankFilter||'').trim().toLowerCase();
  const pf = partnerScopeFilter('bankId');
  const all = (pf ? state.bankTransactions.filter(pf) : state.bankTransactions).slice().sort((a,b)=> b.date.localeCompare(a.date));
  return all.filter(t=>{
    if(unitFilter && !(t.unit||'').trim().toLowerCase().includes(unitFilter)) return false;
    if(bankFilter){ const b = bankById(t.bankId); if(!b || !b.name.trim().toLowerCase().includes(bankFilter)) return false; }
    if(!periodFilterMatches(t.date)) return false;
    return true;
  });
}
function renderBankTxTable(editable){
  const tbl = document.getElementById('btxTable');
  if(!tbl) return;
  const note = document.getElementById('btxFilterNote');
  const unitFilter = (bankTxUnitFilter||'').trim().toLowerCase();
  const bankFilter = (bankTxBankFilter||'').trim().toLowerCase();
  const pf = partnerScopeFilter('bankId');
  const all = (pf ? state.bankTransactions.filter(pf) : state.bankTransactions).slice().sort((a,b)=> b.date.localeCompare(a.date));
  const sorted = getFilteredBankTx();
  if(note){
    const parts = [];
    if(unitFilter) parts.push(`đơn vị <b>${escAttr(bankTxUnitFilter)}</b>`);
    if(bankFilter) parts.push(`ngân hàng <b>${escAttr(bankTxBankFilter)}</b>`);
    if(globalYearFilter) parts.push(`<b>${escAttr(periodFilterDescText())}</b>`);
    note.innerHTML = parts.length
      ? `Đang lọc theo ${parts.join(' · ')} (${sorted.length}/${all.length} hồ sơ) · <a href="#" id="btxClearFilter" style="color:var(--gold)">Xem tất cả</a>`
      : `Đang xem tất cả (${all.length} hồ sơ)`;
    const clearBtn = document.getElementById('btxClearFilter');
    if(clearBtn) clearBtn.addEventListener('click', e=>{
      e.preventDefault();
      bankTxUnitFilter=''; bankTxBankFilter='';
      renderAll(); // vẽ lại cả trang để đồng bộ luôn ô Bộ lọc phía trên

    tbl.outerHTML = `<div class="empty"><div class="big">Chưa có hồ sơ vay nào</div>${editable?'Ghi nhận hồ sơ đầu tiên ở form phía trên.':''}</div>`; return;

    tbl.innerHTML = `<thead><tr><th>Hồ sơ</th><th>Khách hàng</th><th class="num">Số tiền vay</th><th>Trạng thái</th><th class="num">Hoa hồng</th><th>Người nhập</th><th></th></tr></thead>`;

    <thead><tr><th>Hồ sơ</th><th>Khách hàng</th><th class="num">Số tiền vay</th><th>Trạng thái</th><th class="num">Hoa hồng</th><th>Người nhập</th><th></th></tr></thead>
    <tbody>${sorted.map(t=>{
      const b = bankById(t.bankId);
      const creator = state.accounts.find(a=>a.id===t.createdBy);
      const pol = t.status==='Đã giải ngân' ? activeBankPolicy(t.bankId, t.date) : null;
      const comm = bankTxCommission(t);
      const commCell = t.status!=='Đã giải ngân'
        ? '<span class="comm-cell zero">—</span>'
        : (pol ? `<span class="comm-cell has-value">${fmt(comm)}</span>` : `<span class="comm-cell warn-empty" title="Chưa có chính sách cho ${monthLabel(monthKey(t.date))}">0đ · chưa có CS</span>`);
      const lockR = lockingReconOf(t, state.bankReconciliations, 'bankId');
      const lockedForMe = !!lockR && currentRole()!=='Admin';
      const dis = (editable && !lockedForMe)?'':'disabled';
      const canDelRow = editable && !lockedForMe;
      return `<tr>
        <td>
          <div class="stack-cell">
            ${editable
              ? `<input class="cell-edit mini-field" data-field="date" data-id="${t.id}" type="date" value="${t.date}" ${dis}>`
              : `<div class="mini-field">${new Date(t.date+'T00:00:00').toLocaleDateString('vi-VN')}</div>`}
            <div class="meta-line">${escHtml(t.unit)} → ${b?escHtml(b.name):'<em>(đã xoá)</em>'} ${lockIconHTML(lockR,'nh')}</div>
            ${editable
              ? `<input class="cell-edit mini-field muted" data-field="refCode" data-id="${t.id}" value="${escAttr(t.refCode||'')}" ${dis} placeholder="Mã hồ sơ NH">`
              : (t.refCode?`<div class="meta-line">Mã HS: ${escAttr(t.refCode)}</div>`:'')}
          </div>
        </td>
        <td>
          <div class="stack-cell">
            <input class="cell-edit mini-field" data-field="customer" data-id="${t.id}" value="${escAttr(t.customer||'')}" ${dis} placeholder="Tên khách hàng" style="font-weight:600">
            <input class="cell-edit mini-field muted" data-field="phone" data-id="${t.id}" type="tel" value="${escAttr(t.phone||'')}" ${dis} placeholder="SĐT">
            <input class="cell-edit mini-field muted italic" data-field="vehicle" data-id="${t.id}" value="${escAttr(t.vehicle||'')}" ${dis} placeholder="Biển số / xe">
          </div>
        </td>
        <td class="num"><input class="cell-edit num money mini-field" data-field="loanAmount" data-id="${t.id}" type="text" inputmode="numeric" value="${formatMoneyValue(t.loanAmount)}" ${dis} style="text-align:right;font-weight:600;min-width:120px"></td>
        <td>${(editable && !lockedForMe)
          ? `<select class="cell-edit status-select ${statusClass(t.status)}" data-status-id="${t.id}">${BANK_TX_STATUSES.map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select>`
          : `<span class="stamp ${t.status==='Đã giải ngân'?'ok':(t.status==='Từ chối'?'warn':'pending')}">${t.status}</span>`}</td>
        <td class="num">${commCell}</td>
        <td class="meta-line">${creator?escHtml(creator.name):'<em>—</em>'}</td>
        <td>${canDelRow?`<button class="row-del" data-del="${t.id}">✕</button>`:''}</td>
      </tr>`;
    }).join('')}</tbody>`;
  if(editable){
    wireCellEdits(tbl, state.bankTransactions, 'Doanh số (NH)', t=>{ const b=bankById(t.bankId); return `${t.unit} → ${b?b.name:''}`; });
    tbl.querySelectorAll('[data-field="date"]').forEach(el=>{
      el.addEventListener('change', ()=>{ renderBankTxTable(editable); }); // đổi ngày có thể đổi chính sách áp dụng -> cần vẽ lại Hoa hồng
    });
    tbl.querySelectorAll('[data-status-id]').forEach(sel=>{
      sel.addEventListener('change', e=>{
        const t = state.bankTransactions.find(x=>x.id===sel.dataset.statusId);
        if(!t) return;
        const before = t.status;
        t.status = e.target.value;
        const b = bankById(t.bankId);
        logActivity('update','Doanh số (NH)', `${t.unit} → ${b?b.name:''}: đổi trạng thái "${before}" → "${t.status}"`);
        saveState();
        renderBankTxTable(editable);
      });
    });
  }
  wireLockToggle(tbl);
  tbl.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const t = state.bankTransactions.find(x=>x.id===btn.dataset.del);
      if(t && isRecordLockedForMe(t, state.bankReconciliations, 'bankId')){ toast('Hồ sơ thuộc kỳ đối soát đã chốt — chỉ Admin được xoá'); return; }
      const b = t ? bankById(t.bankId) : null;
      softDelete('bankTransactions', t, 'Doanh số (NH)');
      logActivity('delete','Doanh số (NH)', `Xoá hồ sơ (${b?b.name:''}, ${t?fmt(t.loanAmount):''}đ)`);
      renderAll();
    });
  });
}

/* ---------------------------- Ngân hàng · Phân bổ đơn vị ---------------------------- */
function renderBankAllocation(c){
  setTitle('Phân bổ đơn vị', 'Đóng góp số tiền vay giải ngân của từng đơn vị cho từng ngân hàng'+(globalYearFilter?' — '+periodFilterDescText():' — cộng dồn toàn thời gian'));
  const unitOwners = {};
  state.units.forEach(u=>{ unitOwners[u] = state.accounts.filter(a=>a.unit===u).map(a=>a.name); });
  const tbl0 = `<div class="panel"><div class="panel-head"><div><h2>Ma trận Ngân hàng × Đơn vị (số tiền giải ngân)</h2>
    <div class="desc">${state.units.length} đơn vị hiện có · chỉ tính hồ sơ trạng thái "Đã giải ngân"${globalYearFilter?' · đang lọc theo '+escHtml(periodFilterDescText()):''}</div></div></div>
    <div class="panel-body flush"><div class="matrix-scroll"><table class="data matrix-fixed" id="bankAllocTable"></table></div></div></div>`;
  c.innerHTML = tbl0;
  const tbl = document.getElementById('bankAllocTable');
  if(state.banks.length===0){ tbl.outerHTML = `<div class="empty"><div class="big">Chưa có ngân hàng</div></div>`; return; }
  const {from: pfFrom, to: pfTo} = periodFilterDateObjects();
  const rows = state.banks.map(b=>{
    const perUnit = state.units.map(u=>bankLoanSum(b.id, pfFrom, pfTo, u));
    const total = perUnit.reduce((a,x)=>a+x,0);
    const commTotal = bankCommissionSum(b.id, pfFrom, pfTo);
    const max = Math.max(0,...perUnit);
    const share = total>0 ? max/total : 0;
    const topIdx = perUnit.indexOf(max);
    return {b, perUnit, total, commTotal, share, topUnit: total>0?state.units[topIdx]:'—'};
  });
  tbl.innerHTML = `
    ${matrixColgroupHTML(state.units.length, [11, 11, 13])}
    <thead>
    <tr>
      <th>Ngân hàng</th>${state.units.map(u=>matrixUnitHeaderCell(u)).join('')}
      <th class="num">Tổng giải ngân</th><th class="num">Hoa hồng luỹ kế</th><th>Đơn vị chính</th>

/* ---------------------------- Module đang xây dựng (Ngân hàng / Bảo hiểm) ---------------------------- */
/* ============================================================================
   BẢO HIỂM (NCC bán bảo hiểm xe: BHVC/BHDS)
   Thiết kế dữ liệu:
   - insurers: danh mục hãng/đại lý bảo hiểm — hoa hồng chuẩn BHVC (vật chất xe) & BHDS (dân sự),
     điều khoản nổi bật (mã BS) để tra nhanh quyền lợi đặc thù.
   - insRates: BIỂU PHÍ — mỗi dòng = 1 khoảng "Giá trị xe" của 1 NCC, có sẵn 4 cột tỷ lệ phí (%)
     theo "Tuổi xe" (<3 / 3-6 / 6-10 / ≥10 năm). Để trống ô nào nghĩa là NCC đó CHƯA báo giá mốc tuổi đó
     — khoa học ở chỗ: 1 dòng khớp đúng 1 hàng trong bảng Excel gốc, không tách vụn theo từng ô,
     nên thêm/sửa/xoá cả 1 khoảng giá trị chỉ cần đúng 1 thao tác.
   - valueOrder (triệu đồng): mốc dưới của khoảng, dùng để bảng tự sắp xếp & công cụ "So sánh phí"
     tự dò đúng khoảng theo giá trị xe nhập vào — không phải dò tay từng dòng.
   ========================================================================= */
const AGE_BANDS = [
  {key:'lt3', label:'Dưới 3 năm'},
  {key:'y3to6', label:'Từ 3 – dưới 6 năm'},
  {key:'y6to10', label:'Từ 6 – dưới 10 năm'},
  {key:'gte10', label:'Từ 10 năm trở lên'},
];
function ageBandKey(years){
  const y = Number(years)||0;
  if(y<3) return 'lt3';
  if(y<6) return 'y3to6';
  if(y<10) return 'y6to10';
  return 'gte10';
}
function insRateRowsFor(insurerId){
  return state.insRates.filter(r=>r.insurerId===insurerId).sort((a,b)=>a.valueOrder-b.valueOrder);
}// Dò đúng khoảng "Giá trị xe" theo valueOrder, rồi lấy đúng cột tuổi xe tương ứng.
function findInsRate(insurerId, valueTrieu, ageYears){
  const rows = insRateRowsFor(insurerId);
  if(!rows.length) return null;
  let match = null;
  for(let i=0;i<rows.length;i++){
    const cur = rows[i], next = rows[i+1];
    if(valueTrieu>=cur.valueOrder && (!next || valueTrieu<next.valueOrder)){ match = cur; break; }
  }
  if(!match) return null;
  const ageKey = ageBandKey(ageYears);
  return {row:match, ageKey, rate: match[ageKey]};
}

/* ---------------------------- Bảo hiểm · Doanh số (hợp đồng đã bán) ---------------------------- */
const INS_TX_STATUSES = ['Đang xử lý','Đã duyệt','Đã cấp đơn','Huỷ'];
const INS_PRODUCTS = ['BHVC','BHDS'];
let insTxUnitFilter = '';
let insTxInsurerFilter = '';
let insReconExpanded = new Set();

// Hoa hồng chỉ tính khi hợp đồng đã "Đã cấp đơn", theo đúng tỷ lệ BHVC/BHDS của NCC đó
// (khác Ngân hàng: hoa hồng bảo hiểm không đổi theo tháng, chỉ đổi theo loại sản phẩm).
function insTxCommission(t){
  if(t.status!=='Đã cấp đơn') return 0;
  const ins = insurerById(t.insurerId);
  if(!ins) return 0;
  const rate = t.product==='BHDS' ? ins.bhds : ins.bhvc;
  return (Number(t.premiumAmount)||0) * (Number(rate)||0);
}
function insPremiumSum(insurerId, from, to, unit){
  let total=0;
  for(const t of state.insTransactions){
    if(t.insurerId!==insurerId || t.status!=='Đã cấp đơn') continue;
    if(unit && t.unit!==unit) continue;
    const d = toDate(t.date);
    if(from && d<from) continue;
    if(to && d>to) continue;
    total += Number(t.premiumAmount)||0;
  }
  return total;
}
function insCommissionSum(insurerId, from, to, unit){
  let total=0;
  for(const t of state.insTransactions){
    if(t.insurerId!==insurerId || t.status!=='Đã cấp đơn') continue;
    if(unit && t.unit!==unit) continue;
    const d = toDate(t.date);
    if(from && d<from) continue;
    if(to && d>to) continue;
    total += insTxCommission(t);
  }
  return total;
}
function allTimeInsPremium(insurerId, unit){ return insPremiumSum(insurerId,null,null,unit); }
function allTimeInsCommission(insurerId, unit){ return insCommissionSum(insurerId,null,null,unit); }

/* ---- DT dịch vụ/sửa chữa theo hãng theo tháng (nhập tay) + đề xuất tỷ lệ bán tháng sau ---- */
function currentMonthISO(){ return todayISO().slice(0,7); }
function insMonthBounds(monthStr){
  // monthStr dạng 'YYYY-MM' -> {from,to} phủ trọn tháng đó (đặt tên riêng, tránh trùng với monthRange(ref) dùng cho chu kỳ theo dõi)
  const [y,m] = String(monthStr||'').split('-').map(Number);
  if(!y||!m) return {from:null,to:null};
  const from = toDate(`${monthStr}-01`);
  const lastDay = new Date(y, m, 0).getDate();
  const to = toDate(`${monthStr}-${String(lastDay).padStart(2,'0')}`);
  return {from,to};
}
function insBRForMonth(insurerId, month){
  const {from,to} = insMonthBounds(month);
  return insPremiumSum(insurerId, from, to);
}
function insMonthlyRevenueEntry(insurerId, month){
  return (state.insMonthlyRevenue||[]).find(x=>x.insurerId===insurerId && x.month===month) || null;
}
function insDVForMonth(insurerId, month){
  const e = insMonthlyRevenueEntry(insurerId, month);
  return e ? (Number(e.serviceAmount)||0) : 0;
}
function upsertInsMonthlyRevenue(insurerId, month, amount){
  if(!state.insMonthlyRevenue) state.insMonthlyRevenue = [];
  let e = insMonthlyRevenueEntry(insurerId, month);
  if(!e){
    e = {id:uid('imr'), insurerId, month, serviceAmount:0, allocationRate:null, note:'', updatedBy:currentUserId, updatedAt:new Date().toISOString()};
    state.insMonthlyRevenue.push(e);
  }
  e.serviceAmount = Math.max(0, Number(amount)||0);
  e.updatedBy = currentUserId; e.updatedAt = new Date().toISOString();
  return e;
}
function prevMonthISO(month){
  const [y,m] = String(month||'').split('-').map(Number);
  if(!y||!m) return currentMonthISO();
  const d = new Date(y, m-2, 1); // m-1 = tháng hiện tại (0-idx), -1 nữa để lùi 1 tháng
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
/* Tỷ lệ phân bổ tháng (%) — kế hoạch bán ra được Admin/Quản lý nhập định kỳ mỗi tháng cho từng hãng,
   thường căn cứ theo "Đề xuất tỷ lệ bán tháng sau" đã tính ở tháng liền trước. Lưu dạng phân số (0-1). */
function insAllocationRateForMonth(insurerId, month){
  const e = insMonthlyRevenueEntry(insurerId, month);
  return e && e.allocationRate!=null ? Number(e.allocationRate) : null;
}
function upsertInsAllocationRate(insurerId, month, ratePct){
  if(!state.insMonthlyRevenue) state.insMonthlyRevenue = [];
  let e = insMonthlyRevenueEntry(insurerId, month);
  if(!e){
    e = {id:uid('imr'), insurerId, month, serviceAmount:0, allocationRate:null, note:'', updatedBy:currentUserId, updatedAt:new Date().toISOString()};
    state.insMonthlyRevenue.push(e);
  }
  e.allocationRate = (ratePct===null || ratePct==='') ? null : Math.max(0, Number(ratePct)||0)/100;
  e.updatedBy = currentUserId; e.updatedAt = new Date().toISOString();
  return e;
}
/* Áp dụng "Đề xuất tỷ lệ bán tháng sau" đã tính ở tháng liền trước làm Tỷ lệ phân bổ cho tháng đang xem — áp dụng hàng loạt cho mọi hãng */
function applyPrevMonthSuggestionToAllocation(month){
  const prev = prevMonthISO(month);
  const {rows} = insAllocRows(prev);
  let applied = 0;
  rows.forEach(r=>{
    if(r.hasData){ upsertInsAllocationRate(r.ins.id, month, round2(r.proposedRate*100)); applied++; }
  });
  return {prev, applied};
}
/* Tổng hợp DT bán ra (BR) + DT dịch vụ (DV) của TOÀN hệ thống trong 1 tháng, cộng dồn mọi hãng bảo hiểm */
function insSystemTotalsForMonth(month){
  let br=0, dv=0;
  state.insurers.forEach(ins=>{ br += insBRForMonth(ins.id, month); dv += insDVForMonth(ins.id, month); });
  return {br, dv, total: br+dv};
}
function insAlertThreshold(){ return Number(state.insAllocAlertThreshold ?? 0.05) || 0.05; }
/* Tính bảng so sánh Thực tế tỷ lệ bán vs Tỷ lệ phân bổ tháng (kế hoạch) cho 1 tháng, sắp theo mức lệch |diff| giảm dần.
   Chênh lệch = Thực tế tỷ lệ bán − Tỷ lệ phân bổ tháng.
   status: 'over' (đang bán VƯỢT kế hoạch phân bổ — nên giảm), 'under' (đang bán DƯỚI kế hoạch — nên tăng),
           'noplan' (chưa đặt tỷ lệ phân bổ tháng nên chưa so sánh được), 'nodata' (chưa có BR/DV), 'ok' (trong ngưỡng) */
function insAllocRows(month){
  const sys = insSystemTotalsForMonth(month);
  const th = insAlertThreshold();
  const rows = state.insurers.map(ins=>{
    const br = insBRForMonth(ins.id, month);
    const dv = insDVForMonth(ins.id, month);
    const scBr = br>0 ? dv/br : (dv>0 ? Infinity : null);
    const actualRate = sys.br>0 ? br/sys.br : 0;
    const proposedRate = sys.dv>0 ? dv/sys.dv : 0; // đề xuất tỷ lệ bán THÁNG SAU = tỷ trọng DT dịch vụ của hãng trong TỔNG DT dịch vụ toàn hệ thống — luôn cộng lại đúng 100% giữa các hãng, dùng làm căn cứ chia % bán ra tháng sau (không dùng để tính chênh lệch/cảnh báo tháng này)
    const hasData = br>0 || dv>0;
    const allocationRate = insAllocationRateForMonth(ins.id, month);
    const hasPlan = allocationRate!=null;
    const diff = hasPlan ? (actualRate - allocationRate) : null; // Chênh lệch = Thực tế − Phân bổ tháng
    let status = 'ok';
    if(!hasData) status = 'nodata';
    else if(!hasPlan) status = 'noplan';
    else if(Math.abs(diff) > th) status = diff>0 ? 'over' : 'under';
    return {ins, br, dv, scBr, actualRate, proposedRate, diff, hasData, hasPlan, status, allocationRate};
  });
  rows.sort((a,b)=> Math.abs(b.diff||0)-Math.abs(a.diff||0));
  return {rows, sys, threshold:th};
}
/* Số hãng đang vượt ngưỡng cảnh báo trong tháng hiện tại — dùng để gắn chấm đỏ trên menu (nhắc nhở mỗi lần mở app) */
function insAllocAlertCount(){
  if(!state.insurers || state.insurers.length===0) return 0;
  const {rows} = insAllocRows(currentMonthISO());
  return rows.filter(r=>r.status==='over'||r.status==='under').length;
}
function insReconCalc(r){
  const from=toDate(r.fromDate), to=toDate(r.toDate);
  if(!r.insurerId||!from||!to) return {premium:0, totalDue:0, received:0, diff:0, stillOwed:0};
  const premium = insPremiumSum(r.insurerId, from, to);
  const totalDue = insCommissionSum(r.insurerId, from, to);
  const received = reconReceivedTotal(r);
  return {premium, totalDue, received, diff:received-totalDue, stillOwed:Math.max(0,totalDue-received)};
}

function getFilteredInsTx(){
  const unitFilter = (insTxUnitFilter||'').trim().toLowerCase();
  const insFilter = (insTxInsurerFilter||'').trim().toLowerCase();
  const pf = partnerScopeFilter('insurerId');
  const all = (pf ? state.insTransactions.filter(pf) : state.insTransactions).slice().sort((a,b)=> b.date.localeCompare(a.date));
  return all.filter(t=>{
    if(unitFilter && !(t.unit||'').trim().toLowerCase().includes(unitFilter)) return false;
    if(insFilter){ const ins = insurerById(t.insurerId); if(!ins || !ins.name.trim().toLowerCase().includes(insFilter)) return false; }
    if(!periodFilterMatches(t.date)) return false;
    return true;
  });
}

      saveState();
      renderInsRevenueTable(editable);
      renderNav(); // cập nhật lại chấm cảnh báo trên menu nếu ngưỡng đổi làm thay đổi số hãng vượt ngưỡng
    });
  }
  renderInsRevenueTable(editable);

  const tbl = document.getElementById('insAllocTable');
  if(state.insurers.length===0){ tbl.outerHTML = `<div class="empty"><div class="big">Chưa có NCC bảo hiểm</div></div>`; return; }
  const {from: pfFrom, to: pfTo} = periodFilterDateObjects();
  const rows = state.insurers.map(ins=>{
    const perUnit = state.units.map(u=>insPremiumSum(ins.id, pfFrom, pfTo, u));
    const total = perUnit.reduce((a,x)=>a+x,0);
    const commTotal = insCommissionSum(ins.id, pfFrom, pfTo);
    const max = Math.max(0,...perUnit);
    const topIdx = perUnit.indexOf(max);
    return {ins, perUnit, total, commTotal, topUnit: total>0?state.units[topIdx]:'—'};
  });
  tbl.innerHTML = `
    ${matrixColgroupHTML(state.units.length, [11, 11, 13])}
    <thead>
    <tr>
      <th>NCC bảo hiểm</th>${state.units.map(u=>matrixUnitHeaderCell(u)).join('')}

    </tr>
    </thead>

      <tr>

        <td class="num">${fmt(r.commTotal)}</td>
        <td>${escHtml(r.topUnit)}</td>
      </tr>`).join('')}</tbody>`;
  wireStickyHeaderRows(tbl);
}

      ${thCompact('BR', 'bán ra', 'DT bán ra (BR) — phí bảo hiểm thu, tự tính từ hợp đồng "Đã cấp đơn" trong tháng', true)}

      ${thCompact('SC/BR', 'DV÷BR', 'Tỷ lệ DT dịch vụ/sửa chữa so với DT bán ra (DV÷BR)', true)}
      ${thCompact('Thực tế', '% bán', 'Thực tế tỷ lệ bán — % đóng góp BR của hãng trong tổng BR toàn hệ thống tháng này', true)}

        const r = state.insReconciliations.find(x=>x.id===id);
        if(!r) return;
        const amount = parseMoneyInput(document.getElementById('irpay_amount_'+id).value);
        if(amount<=0){ toast('Nhập số tiền đã nhận'); return; }
        const date = document.getElementById('irpay_date_'+id).value || todayISO();
        const method = document.getElementById('irpay_method_'+id).value;
        const note = document.getElementById('irpay_note_'+id).value.trim();
        ensureReconciliationPayments(r).push({id:uid('pay'), date, amount, method, note, createdBy:currentUserId});
        const ins = insurerById(r.insurerId);
        logActivity('create','Đối soát CK (Bảo hiểm)', `Ghi nhận thanh toán ${fmt(amount)}đ (${method}) cho kỳ "${r.period}" — ${ins?ins.name:''}`);
        toast('Đã ghi nhận thanh toán');
        saveState();
        renderInsReconTable(editable);
      });
    });
    tbl.querySelectorAll('[data-del-pay]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const [rid, pid] = btn.dataset.delPay.split('|');
        const r = state.insReconciliations.find(x=>x.id===rid);
        if(!r) return;
        if(!confirm('Xoá lần thanh toán này khỏi Sổ nhận tiền?')) return;
        r.payments = ensureReconciliationPayments(r).filter(p=>p.id!==pid);
        logActivity('delete','Đối soát CK (Bảo hiểm)', `Xoá 1 lần thanh toán ở kỳ "${r.period}"`);
        saveState();
        renderInsReconTable(editable);
      });
    });
    tbl.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const r = state.insReconciliations.find(x=>x.id===btn.dataset.del);
        if(r && r.locked && currentRole()!=='Admin'){ toast('Kỳ đã chốt — chỉ Admin được xoá'); return; }
        const ins = r ? insurerById(r.insurerId) : null;
        if(!confirm(`Xoá kỳ "${r?r.period:''}"${r&&r.locked?' (đã chốt)':''}?`)) return;
        softDelete('insReconciliations', r, 'Đối soát CK (Bảo hiểm)');
        logActivity('delete','Đối soát CK (Bảo hiểm)', `Xoá kỳ "${r?r.period:''}" (${ins?ins.name:''})`);
        renderAll();
      });
    });
  }
}

/* ---------------------------- Cài đặt ---------------------------- */
function unitUsage(u){
  const accountsUsing = state.accounts.filter(a=>a.unit===u).length;
  const txUsing = state.transactions.filter(t=>t.unit===u).length;
  return {accountsUsing, txUsing, total: accountsUsing+txUsing};
}
function deleteUnit(u){
  state.units = state.units.filter(x=>x!==u);
  // gỡ gán khỏi các tài khoản đang phụ trách đơn vị này (không xoá tài khoản, chỉ gỡ liên kết)
  state.accounts.forEach(a=>{ if(a.unit===u) a.unit=''; });
  logActivity('delete','Cài đặt', `Xoá đơn vị "${u}" khỏi danh sách (gỡ liên kết khỏi các tài khoản đang phụ trách)`);
}

          state = Object.assign(seedState(), ...Object.values(backup.data));
