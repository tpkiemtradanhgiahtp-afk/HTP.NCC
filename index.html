  if(isAdmin){
    document.getElementById('fbConnectBtn').addEventListener('click', async ()=>{
      const raw = document.getElementById('fbConfigArea').value;
      let cfg;
      try{ cfg = parseFirebaseConfigInput(raw); }
      catch(e){ toast(e.message); return; }
      if(!cfg || !cfg.projectId){ toast('Cấu hình thiếu projectId — kiểm tra lại'); return; }
      toast('Đang kết nối Firebase...');
      const res = await connectFirebase(cfg);
      if(res.ok){
        await saveFirebaseConfigToBootstrap(cfg);
        logActivity('update','Cài đặt', 'Kết nối Firebase thành công (projectId: '+cfg.projectId+')');
        toast('Đã kết nối Firebase — đồng bộ real-time');
        saveState(); // đẩy dữ liệu hiện có lên Realtime Database nếu node còn trống
      } else {
        toast('Kết nối Firebase thất bại: '+res.error);
      }
      renderAll();
    });
    if(fb.status==='connected') document.getElementById('fbDisconnectBtn').addEventListener('click', ()=>{
      if(!confirm('Ngắt kết nối Firebase? App sẽ quay lại lưu trong trò chuyện Claude / trình duyệt này.')) return;
      disconnectFirebase();
      saveFirebaseConfigToBootstrap(null);
      logActivity('update','Cài đặt', 'Ngắt kết nối Firebase');
      setStoragePill(storageMode==='firebase'?'memory':storageMode);
      toast('Đã ngắt kết nối Firebase');
      renderAll();
    });
  }
  if(canUnits){
    document.getElementById('addUnitBtn').addEventListener('click', ()=>{
      const input = document.getElementById('newUnitInput');
      const name = input.value.trim();
      if(!name){ toast('Nhập tên đơn vị trước'); return; }
      const before = state.units.length;
      const unit = ensureUnit(name);
      if(state.units.length===before){ toast('Đơn vị này đã có trong danh sách'); return; }
      logActivity('create','Cài đặt', `Thêm đơn vị "${unit}"`);
      toast('Đã thêm đơn vị "'+unit+'"');
      renderAll();
    });
    document.querySelectorAll('[data-del-unit]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const u = btn.dataset.delUnit;
        const usage = unitUsage(u);
        const msg = usage.total>0
          ? `Đơn vị "${u}" đang được ${usage.accountsUsing} tài khoản phụ trách và có ${usage.txUsing} chứng từ ghi nhận. Xoá khỏi danh sách sẽ gỡ liên kết khỏi các tài khoản đó (chứng từ cũ vẫn giữ nguyên). Vẫn xoá?`
          : `Xoá đơn vị "${u}" khỏi danh sách?`;
        if(!confirm(msg)) return;
        deleteUnit(u);
        toast('Đã xoá đơn vị "'+u+'"');
        renderAll();
      });
    });
  }
  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'so-cai-ncc-'+todayISO()+'.json';
    a.click();
  });
  if(isAdmin){
    document.getElementById('importFile').addEventListener('change', (e)=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const data = JSON.parse(reader.result);
          const keepAccounts = state.accounts, keepLog = state.activityLog;
          state = Object.assign(seedState(), data);
          if(!data.accounts) state.accounts = keepAccounts;
          if(!data.activityLog) state.activityLog = keepLog;
          logActivity('update','Cài đặt', 'Nhập dữ liệu từ file .json');
          toast('Đã nhập dữ liệu');
          renderAll();
        }catch(err){ toast('File không hợp lệ'); }
      };
      reader.readAsText(file);
    });
    document.getElementById('resetBtn').addEventListener('click', ()=>{
      if(!confirm('Xoá toàn bộ dữ liệu hiện tại (kể cả tài khoản khác) và nạp lại dữ liệu mẫu?')) return;
      const keepMe = currentUser();
      state = seedState();
      if(keepMe){ state.accounts = [keepMe]; currentUserId = keepMe.id; }
      logActivity('delete','Cài đặt', 'Xoá toàn bộ dữ liệu, nạp lại dữ liệu mẫu');
      toast('Đã nạp lại dữ liệu mẫu');
      renderAll();
    });
  }
}

/* ---------------------------- Quản trị tài khoản (Admin) ---------------------------- */
function renderAccounts(c){
  setTitle('Quản trị tài khoản', state.accounts.length+' tài khoản — phân quyền theo vai trò & đơn vị phụ trách');
  c.innerHTML = `
    <div class="panel">
      <div class="panel-head"><div><h2>Thêm tài khoản</h2>
      <div class="desc">Không có mật khẩu — đây là hệ thống nội bộ dùng chung, chọn tên là vào được ngay. Gõ tên đơn vị thực tế để tự khoá đúng đơn vị khi tài khoản đó nhập Doanh số — đơn vị mới sẽ tự được thêm vào hệ thống.</div></div></div>
      <div class="panel-body">
        <div class="form-grid">
          <div class="field"><label>Tên</label><input id="af_name" placeholder="VD: Trần Thị B"></div>
          <div class="field"><label>Vai trò</label>
            <select id="af_role">${ROLES.map(r=>`<option>${r}</option>`).join('')}</select>
          </div>
          <div class="field">
            <label>Đơn vị phụ trách</label>
            <input id="af_unit" list="af_unit_list" placeholder="Gõ tên đơn vị thực tế...">
            ${unitDatalistHTML('af_unit_list')}
          </div>
          <button class="btn btn-primary" id="addAccountBtn">+ Thêm tài khoản</button>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><div><h2>Danh sách tài khoản</h2></div></div>
      <div class="panel-body flush"><div class="tbl-wrap"><table class="data" id="accountsTable"></table></div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><div><h2>Quản lý danh sách đơn vị</h2>
      <div class="desc">Đơn vị chưa gán ai — bấm ✕ để xoá thẳng từ đây. Xem chi tiết doanh số theo đơn vị ở tab Phân bổ đơn vị.</div></div></div>
      <div class="panel-body" id="unassignedUnitsBox"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><div><h2>Phân quyền theo vai trò</h2></div></div>
      <div class="panel-body">
        <table class="data">
          <thead><tr><th>Khu vực</th><th>Admin</th><th>Quản lý</th><th>Nhân viên</th></tr></thead>
          <tbody>
            ${Object.entries({
              'Danh mục NCC': EDIT_PERMS.suppliers, 'Chính sách CK': EDIT_PERMS.policies,
              'Doanh số': EDIT_PERMS.transactions, 'Đối soát CK': EDIT_PERMS.reconcile,
              'Theo dõi mốc CK (chọn chu kỳ)': EDIT_PERMS.monitor, 'Cài đặt đơn vị': EDIT_PERMS.settings,
              'Quản trị tài khoản': EDIT_PERMS.accounts,
            }).map(([label, allowed])=>`
              <tr><td>${label}</td>${ROLES.map(r=>`<td style="text-align:center">${allowed.includes(r)?'✅':'—'}</td>`).join('')}</tr>
            `).join('')}
          </tbody>
        </table>
        <div class="helper">Tất cả vai trò đều <b>xem được</b> mọi tab. Nhân viên có gán Đơn vị sẽ bị khoá đúng đơn vị đó khi nhập Doanh số (không chọn sang đơn vị khác được), giúp tránh nhập nhầm đơn vị.</div>
      </div>
    </div>
  `;
  document.getElementById('addAccountBtn').addEventListener('click', ()=>{
    const name = document.getElementById('af_name').value.trim();
    if(!name){ toast('Nhập tên trước đã'); return; }
    const role = document.getElementById('af_role').value;
    const unit = ensureUnit(document.getElementById('af_unit').value);
    const acc = {id:uid('u'), name, role, unit, createdAt: todayISO()};
    state.accounts.push(acc);
    logActivity('create','Tài khoản', `Thêm tài khoản "${name}" (${role}${unit?', '+unit:''})`);
    toast('Đã thêm tài khoản'+(unit?` — đơn vị "${unit}"`:''));
    renderAll();
  });

  const tbl = document.getElementById('accountsTable');
  tbl.innerHTML = `
    <thead><tr><th>Tên</th><th>Vai trò</th><th>Đơn vị phụ trách</th><th>Ngày tạo</th><th></th></tr></thead>
    <tbody>${state.accounts.map(a=>`
      <tr>
        <td><input class="cell-edit" data-field="name" data-id="${a.id}" value="${escAttr(a.name)}"></td>
        <td><select class="cell-edit" data-field="role" data-id="${a.id}">${ROLES.map(r=>`<option ${a.role===r?'selected':''}>${r}</option>`).join('')}</select></td>
        <td>
          <input class="cell-edit" data-field="unit" data-id="${a.id}" list="rowunit_${a.id}" value="${escAttr(a.unit||'')}" placeholder="— Không gán —">
          ${unitDatalistHTML('rowunit_'+a.id)}
        </td>
        <td>${a.createdAt||''}</td>
        <td>${a.id===currentUserId?'<span class="tag gold">Bạn</span>':`<button class="row-del" data-del="${a.id}">✕</button>`}</td>
      </tr>`).join('')}</tbody>`;
  tbl.querySelectorAll('[data-field]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const acc = state.accounts.find(a=>a.id===el.dataset.id);
      if(!acc) return;
      const before = acc[el.dataset.field];
      let val = el.value;
      if(el.dataset.field==='unit') val = ensureUnit(val);
      acc[el.dataset.field] = val;
      logActivity('update','Tài khoản', `Sửa tài khoản "${acc.name}" (${el.dataset.field}: "${before||'(trống)'}" → "${val||'(trống)'}")`);

  tbl.querySelectorAll('[data-del]').forEach(btn=>{

      }

      state.accounts = state.accounts.filter(a=>a.id!==btn.dataset.del);

  const assignedUnits = new Set(state.accounts.map(a=>a.unit).filter(Boolean));
  const unassigned = state.units.filter(u=>!assignedUnits.has(u));

  box.innerHTML = state.units.length===0

       <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${state.units.map(u=>`
         <span class="tag" style="display:inline-flex;align-items:center;gap:6px">${u}<button class="row-del" data-del-unit-acct="${escAttr(u)}" title="Xoá đơn vị ${escAttr(u)}" style="padding:0 4px">✕</button></span>`).join('')}</div>`

         <span class="tag" style="display:inline-flex;align-items:center;gap:6px">${u}<button class="row-del" data-del-unit-acct="${escAttr(u)}" title="Xoá đơn vị ${escAttr(u)}" style="padding:0 4px">✕</button></span>`).join('')}</div>
       <div class="helper">${unassigned.length} đơn vị chưa có tài khoản nào phụ trách — sửa cột "Đơn vị phụ trách" ở bảng trên để gán, hoặc bấm ✕ để xoá hẳn đơn vị không dùng nữa.</div>`;
  document.querySelectorAll('[data-del-unit-acct]').forEach(btn=>{
    btn.addEventListener('click', ()=>{

      const msg = usage.total>0

        : `Xoá đơn vị "${u}" khỏi danh sách?`;
      if(!confirm(msg)) return;
      deleteUnit(u);
      toast('Đã xoá đơn vị "'+u+'"');
      renderAll();
    });
  });
}

/* ---------------------------- Nhật ký hoạt động ---------------------------- */
function renderActivityLog(c){
  setTitle('Nhật ký hoạt động', state.activityLog.length+' thao tác gần nhất trên toàn hệ thống');
  const users = ['Tất cả', ...new Set(state.activityLog.map(l=>l.userName))];
  c.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div><h2>Lịch sử thao tác</h2><div class="desc">Ghi lại mọi thêm/sửa/xoá trên toàn hệ thống, mới nhất trước</div></div>
        <div class="field" style="width:200px"><select id="logUserFilter">${users.map(u=>`<option>${u}</option>`).join('')}</select></div>
      </div>
      <div class="panel-body flush"><div class="tbl-wrap"><table class="data" id="logTable"></table></div></div>
    </div>
  `;
  function draw(filterUser){
    const rows = state.activityLog.filter(l=> !filterUser || filterUser==='Tất cả' || l.userName===filterUser).slice(0,300);
    const tbl = document.getElementById('logTable');
    if(rows.length===0){ tbl.outerHTML = `<div class="empty"><div class="big">Chưa có hoạt động nào</div></div>`; return; }
    tbl.innerHTML = `
      <thead><tr><th>Thời gian</th><th>Người thực hiện</th><th>Khu vực</th><th>Hành động</th><th class="wrap">Chi tiết</th></tr></thead>
      <tbody>${rows.map(l=>{
        const t = new Date(l.ts);
        const actionLabel = l.action==='create'?'Thêm':l.action==='update'?'Sửa':'Xoá';
        return `<tr class="log-row">
          <td>${t.toLocaleString('vi-VN')}</td>
          <td class="who">${l.userName} <span class="role-badge ${roleBadgeClass(l.role)}">${l.role}</span></td>
          <td>${l.entity}</td>
          <td><span class="action-badge ${l.action}">${actionLabel}</span></td>
          <td class="wrap">${l.detail||''}</td>
        </tr>`;
      }).join('')}</tbody>`;
  }
  draw('Tất cả');
  document.getElementById('logUserFilter').addEventListener('change', e=> draw(e.target.value));
}

/* ---------------------------- Init ---------------------------- */
/* Dọn dẹp 1 lần: xoá hết các đơn vị mặc định (Đơn vị B..T còn sót từ bản cũ), chỉ giữ lại "Đơn vị A".
   Chạy đúng 1 lần (đánh dấu bằng state.__unitsCleanupV1) để không xoá nhầm các đơn vị thật
   người dùng tự thêm sau này. Chứng từ Doanh số cũ vẫn giữ nguyên tên đơn vị đã ghi, không bị xoá. */
function migrateCleanupUnitsV1(){
  if(state.__unitsCleanupV1) return false;
  state.__unitsCleanupV1 = true;
  const keep = 'Đơn vị A';
  const before = state.units.slice();
  const changed = before.length!==1 || before[0]!==keep;
  if(changed){
    state.units = [keep];
    state.accounts.forEach(a=>{ if(a.unit && a.unit!==keep) a.unit=''; });
    logActivity('delete','Cài đặt', `Dọn dẹp đơn vị: xoá ${before.filter(u=>u!==keep).length} đơn vị mặc định, chỉ giữ lại "${keep}"`);
  }
  return changed;
}

(async function init(){
  const [shared, session] = await Promise.all([loadShared(), loadSession()]);
  state = shared ? Object.assign(seedState(), shared) : seedState();
  if(!state.accounts || state.accounts.length===0) state.accounts = seedState().accounts;
  if(!state.activityLog) state.activityLog = [];
  if(!state.banks || state.banks.length===0){
    const seeded = seedState();
    state.banks = seeded.banks; state.bankPolicies = seeded.bankPolicies;
    state.nextBankNo = seeded.nextBankNo;
  }
  if(!state.bankTransactions) state.bankTransactions = [];
  if(!state.bankReconciliations) state.bankReconciliations = [];
  currentUserId = (session && session.currentUserId && state.accounts.some(a=>a.id===session.currentUserId))
    ? session.currentUserId : null;
  if(shared && migrateCleanupUnitsV1()) saveState();
  setStoragePill(storageMode);
  renderAll();
})();
</script>
