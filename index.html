function renderInsRevenueTable(editable){
  const tbl = document.getElementById('insRevenueTable');
  const kpiWrap = document.getElementById('insAllocKpiWrap');
  if(!tbl) return;
  if(state.insurers.length===0){ tbl.outerHTML = `<div class="empty"><div class="big">Chưa có NCC bảo hiểm</div></div>`; return; }
  const month = insAllocMonth;
  const monthLocked = isInsAllocMonthLocked(month);
  const rateEditable = editable && !monthLocked; // chỉ cột "Tỷ lệ phân bổ tháng" bị khoá khi tháng đã chốt — DV vẫn sửa được bình thường
  const { rows, sys, threshold} = insAllocRows(month);
  const breaches = rows.filter(r=>r.status==='over'||r.status==='under');
  const monthLabel = (()=>{ const {from} = insMonthBounds(month); return from ? from.toLocaleDateString('vi-VN',{month:'long',year:'numeric'}) : month; })();

  if(kpiWrap){
    const lockInfo = insAllocMonthLockInfo(month);
    const lockedBanner = monthLocked ? `
      <div class="locked-note" style="margin-top:0">🔒 Tỷ lệ phân bổ tháng ${monthLabel} đã được CHỐT${lockInfo&&lockInfo.lockedAt?' lúc '+new Date(lockInfo.lockedAt).toLocaleString('vi-VN'):''}${lockInfo&&lockInfo.lockedBy?' bởi '+escHtml((state.accounts.find(a=>a.id===lockInfo.lockedBy)||{}).name||''):''} — chỉ Admin mở khoá lại được. Cột "DT dịch vụ/sửa chữa" vẫn sửa được bình thường.</div>
    ` : '';
    kpiWrap.innerHTML = `
      ${lockedBanner}
      <div class="stat-strip" style="margin-bottom:${breaches.length>0?'10px':'0'}">
        <div class="stat-chip"><span class="stat-dot"></span><span class="stat-label">Tổng DT hệ thống ${monthLabel}:</span> <b>${sys.total>0?fmt(sys.total):'—'}</b><span class="stat-label">(BR ${fmt(sys.br)} · DV ${fmt(sys.dv)})</span></div>
        <div class="stat-chip ${breaches.length>0?'rust':'forest'}"><span class="stat-dot"></span><span class="stat-label">Vượt ngưỡng ${fmtPct(threshold)}:</span> <b>${breaches.length}/${rows.length} hãng</b></div>
      </div>
      ${breaches.length>0 ? `
      <div class="locked-note" style="border-color:var(--rust);color:var(--rust);background:var(--rust-soft);margin-top:0;padding:10px 14px">
        ⚠ <b>${breaches.length} hãng</b> đang bán lệch so với kế hoạch phân bổ quá ngưỡng (tháng ${monthLabel}):
        ${breaches.map(r=>`<b>${escHtml(r.ins.name)}</b> (${r.status==='under'?'tăng':'giảm'} ${r.diff>0?'+':''}${fmtPct(r.diff)})`).join(' · ')}
      </div>` : sys.total===0 ? `<div class="helper">Chưa có dữ liệu doanh thu (BR/DV) cho tháng ${monthLabel} — chọn tháng khác hoặc nhập DT dịch vụ bên dưới.</div>` : ''}
    `;
  }

  tbl.innerHTML = `
    <colgroup>
      <col style="width:17%"><col style="width:9%"><col style="width:11%"><col style="width:12%">
      <col style="width:9%"><col style="width:9%"><col style="width:9%"><col style="width:9%"><col style="width:15%">
    </colgroup>
    <thead>
    <tr>
      <th>Hãng</th>
      ${thCompact('Phân bổ', 'tháng (%)', 'Tỷ lệ phân bổ tháng (%) — kế hoạch bán ra Admin/Quản lý giao cho hãng trong tháng, thường lấy từ Đề xuất tháng trước'+(monthLocked?' — ĐÃ CHỐT, chỉ Admin mở khoá mới sửa được':''), true)}
      ${thCompact('BR', 'bán ra', 'DT bán ra (BR) — phí bảo hiểm thu, tự tính từ hợp đồng "Đã cấp đơn" trong tháng', true)}
      ${thCompact('DV', 'dịch vụ', 'DT dịch vụ/sửa chữa (DV) — nhập tay theo tháng', true)}
      ${thCompact('SC/BR', 'DV÷BR', 'Tỷ lệ DT dịch vụ/sửa chữa so với DT bán ra (DV÷BR)', true)}
      ${thCompact('Thực tế', '% bán', 'Thực tế tỷ lệ bán — % đóng góp BR của hãng trong tổng BR toàn hệ thống tháng này', true)}
      ${thCompact('Đề xuất', 'T sau', 'Đề xuất tỷ lệ bán tháng sau = DT dịch vụ hãng ÷ Tổng DT dịch vụ toàn hệ thống tháng này (các hãng cộng lại đúng 100%)', true)}
      ${thCompact('Chênh lệch', '', 'Chênh lệch = Thực tế tỷ lệ bán − Tỷ lệ phân bổ tháng', true)}
      <th>Trạng thái</th>
    </tr>
    </thead>
    <tbody>${rows.map(r=>{
      const meta = INS_STATUS_META[r.status];
      return `
      <tr style="${meta.row}">
        <td>${escHtml(r.ins.name)}</td>
        <td class="num">
          ${rateEditable
            ? `<input class="cell-edit num mini-field" data-alloc="${r.ins.id}" type="text" inputmode="decimal" value="${r.allocationRate!=null?round2(r.allocationRate*100):''}" placeholder="—" style="text-align:right">`
            : (r.allocationRate!=null?fmtPct(r.allocationRate):'—')}${monthLocked?' 🔒':''}
        </td>
        <td class="num">${r.br>0?fmt(r.br):'—'}</td>
        <td class="num">
          ${editable
            ? `<input class="cell-edit num money mini-field" data-ins="${r.ins.id}" type="text" inputmode="numeric" value="${r.dv>0?formatMoneyValue(r.dv):''}" placeholder="0" style="text-align:right">`
            : (r.dv>0?fmt(r.dv):'—')}
        </td>
        <td class="num">${r.scBr===null ? '—' : (isFinite(r.scBr) ? fmtPct(r.scBr) : '—')}</td>
        <td class="num">${r.hasData ? fmtPct(r.actualRate) : '—'}</td>
        <td class="num" style="font-weight:700">${r.hasData ? fmtPct(r.proposedRate) : '—'}</td>
        <td class="num" style="font-weight:600">${r.diff!=null ? (r.diff>0?'+':'')+fmtPct(r.diff) : '—'}</td>
        <td><span class="${meta.badge}" title="${escAttr(meta.label)}">${meta.short}</span></td>
      </tr>`;
    }).join('')}
    </tbody>
    <tfoot><tr style="font-weight:700">
      <td>TỔNG hệ thống</td>
      <td class="num">${(()=>{ const s=rows.reduce((a,r)=>a+(r.allocationRate||0),0); return s>0?fmtPct(s):'—'; })()}</td>
      <td class="num">${fmt(sys.br)}</td>
      <td class="num">${fmt(sys.dv)}</td>
      <td class="num">${sys.br>0?fmtPct(sys.dv/sys.br):'—'}</td>
      <td class="num">100%</td>
      <td class="num">${sys.dv>0?'100%':'—'}</td>
      <td class="num">—</td>
      <td>—</td>
    </tr></tfoot>`;
  if(rateEditable){
    tbl.querySelectorAll('input[data-alloc]').forEach(el=>{
      el.addEventListener('change', ()=>{
        const insurerId = el.dataset.alloc;
        const ins = insurerById(insurerId);
        const raw = el.value.trim().replace(',', '.');
        const pct = raw==='' ? null : Math.max(0, Number(raw)||0);
        upsertInsAllocationRate(insurerId, month, pct);
        logActivity('update','Tỷ lệ phân bổ (Bảo hiểm)', `${ins?ins.name:''} — tháng ${month}: ${pct==null?'xoá':round2(pct)+'%'}`);
        saveState();
        renderInsRevenueTable(editable);
      });
    });
  }
  if(editable){
    tbl.querySelectorAll('input[data-ins]').forEach(el=>{
      attachMoneyFormatting(el);
      el.addEventListener('change', ()=>{
        const insurerId = el.dataset.ins;
        const ins = insurerById(insurerId);
        const amount = parseMoneyInput(el.value);
        upsertInsMonthlyRevenue(insurerId, month, amount);
        logActivity('update','DT dịch vụ (Bảo hiểm)', `${ins?ins.name:''} — tháng ${month}: ${fmt(amount)}đ`);
        saveState();
        renderInsRevenueTable(editable);
        renderNav(); // dữ liệu DV thay đổi có thể làm đổi số hãng vượt ngưỡng -> cập nhật chấm cảnh báo trên menu
      });
    });
  }
}

/* ---------------------------- Bảo hiểm · Đối soát CK (hoa hồng) ---------------------------- */
function renderInsReconcile(c){
  setTitle('Đối soát CK', state.insReconciliations.length+' kỳ đối soát — theo dõi Hoa hồng phải hưởng / đã nhận theo từng NCC bảo hiểm');
  const editable = canEdit('bh_reconcile');
  const insOptions = state.insurers.map(i=>`<option value="${i.id}">${escHtml(i.name)}</option>`).join('');
  c.innerHTML = `
    ${editable ? `
    <div class="panel">
      <div class="panel-head"><div><h2>Thêm kỳ đối soát</h2></div></div>
      <div class="panel-body">
        <div class="form-grid">
          <div class="field"><label>NCC bảo hiểm</label><select id="irf_ins">${insOptions}</select></div>
          <div class="field"><label>Tên kỳ</label><input id="irf_period" placeholder="VD: T5/2026"></div>
          <div class="field"><label>Từ ngày</label><input id="irf_from" type="date"></div>
          <div class="field"><label>Đến ngày</label><input id="irf_to" type="date"></div>
          <button class="btn btn-primary" id="addInsReconBtn">+ Thêm kỳ đối soát</button>
        </div>
      </div>
    </div>` : lockedNote('Bạn đang xem ở chế độ chỉ đọc — chỉ Admin/Quản lý mới thêm/sửa kỳ đối soát.')}
    <div class="panel">
      <div class="panel-head"><div><h2>Tất cả kỳ đối soát</h2><div class="desc" id="insReconFilterNote"></div></div>
      <button class="btn btn-ghost" id="insReconExportBtn">⬇ Xuất Excel</button>
      </div>
      <div class="panel-body flush"><div class="tbl-wrap"><table class="data" id="insReconTable"></table></div></div>
    </div>
  `;
  if(editable){
    document.getElementById('addInsReconBtn').addEventListener('click', ()=>{
      const insurerId = document.getElementById('irf_ins').value;
      if(!insurerId){ toast('Cần có NCC bảo hiểm trước'); return; }
      const from = document.getElementById('irf_from').value, to = document.getElementById('irf_to').value;
      if(!from || !to){ toast('Nhập đủ Từ ngày / Đến ngày'); return; }
      const period = document.getElementById('irf_period').value.trim() || (from+' → '+to);
      const r = {id: uid('ir'), insurerId, period, fromDate:from, toDate:to, confirmed:0, payments:[]};
      state.insReconciliations.push(r);
      const ins = insurerById(insurerId);
      logActivity('create','Đối soát CK (Bảo hiểm)', `Thêm kỳ "${period}" — ${ins?ins.name:''}`);
      toast('Đã thêm kỳ đối soát');
      renderAll();
    });
  }
  document.getElementById('insReconExportBtn').addEventListener('click', ()=>{
    const list = getFilteredInsRecon();
    const rows = list.map(r=>{
      const ins = insurerById(r.insurerId);
      const rc = insReconCalc(r);
      return {
        'Kỳ': r.period, 'NCC bảo hiểm': ins?ins.name:'(đã xoá)', 'Từ ngày': r.fromDate, 'Đến ngày': r.toDate,
        'Phí bảo hiểm thu': rc.premium, 'Hoa hồng phải hưởng': rc.totalDue, 'NCC xác nhận': Number(r.confirmed)||0,
        'Đã nhận': rc.received, 'Chênh lệch': rc.diff, 'Còn phải thu': rc.stillOwed,
        'Trạng thái chốt': r.locked ? 'Đã chốt' : 'Chưa chốt',
      };
    });
    exportToExcel('DoiSoatCK_BaoHiem_'+todayISO()+'.xlsx', [{name:'Đối soát CK Bảo hiểm', rows}]);
  });
  renderInsReconTable(editable);
}
function getFilteredInsRecon(){
  const pf = partnerScopeFilter('insurerId');
  const list = pf ? state.insReconciliations.filter(pf) : state.insReconciliations;
  return list.filter(r=>periodFilterMatchesRange(r.fromDate, r.toDate));
}
function renderInsReconTable(editable){
  const tbl = document.getElementById('insReconTable');
  if(!tbl){ renderAll(); return; }
  const note = document.getElementById('insReconFilterNote');
  const list = getFilteredInsRecon();
  if(note){
    const pf0 = partnerScopeFilter('insurerId');
    const allList0 = pf0 ? state.insReconciliations.filter(pf0) : state.insReconciliations;
    note.innerHTML = globalYearFilter ? `Đang lọc theo <b>${escAttr(periodFilterDescText())}</b> (${list.length}/${allList0.length} kỳ — tính theo kỳ có giao với khoảng đang lọc).` : '';
  }
  const isPartnerSelf = isPartnerAccount(currentUser());
  if(list.length===0){
    tbl.outerHTML = `<div class="empty"><div class="big">Chưa có kỳ đối soát nào</div>${editable?'Thêm kỳ đối soát ở form phía trên.':''}</div>`; return;
  }
  const dis = editable?'':'disabled';
  tbl.innerHTML = `
    <thead><tr>
      <th>Kỳ</th><th class="wrap">NCC bảo hiểm</th><th>Từ ngày</th><th>Đến ngày</th>
      <th class="num">Phí bảo hiểm thu</th><th class="num">Hoa hồng phải hưởng</th>
      <th class="num money-col">NCC xác nhận</th><th class="num money-col">Đã nhận</th>
      <th class="num">Chênh lệch</th><th class="num">Còn phải thu</th><th>Trạng thái</th><th>Chốt</th><th></th>
    </tr></thead>
    <tbody>${list.map(r=>{
      const ins = insurerById(r.insurerId);
      const rc = insReconCalc(r);
      const payments = ensureReconciliationPayments(r);
      const status = reconStatus(rc.totalDue, rc.received);
      const expanded = insReconExpanded.has(r.id);
      const lockedForMe = r.locked && currentRole()!=='Admin';
      const confirmedDis = ((editable && !lockedForMe) || (isPartnerSelf && !r.locked)) ? '' : 'disabled';
      const rowDis = (editable && !lockedForMe) ? '' : 'disabled';
      const canDelRow = editable && (!r.locked || currentRole()==='Admin');
      const mainRow = `<tr>
        <td>${escHtml(r.period)}</td>
        <td class="wrap">${ins?escHtml(ins.name):'<em>(đã xoá)</em>'}</td>
        <td>${r.fromDate}</td><td>${r.toDate}</td>
        <td class="num">${fmt(rc.premium)}</td>
        <td class="num" style="font-weight:700">${fmt(rc.totalDue)}${lockMismatchNote(r, rc.totalDue)}</td>
        <td class="num money-col"><input class="cell-edit money" data-field="confirmed" data-id="${r.id}" type="text" inputmode="numeric" value="${formatMoneyValue(r.confirmed)}" ${confirmedDis} title="${isPartnerSelf?'Bạn có thể tự xác nhận số hoa hồng của mình tại đây':''}"></td>
        <td class="num money-col">
          <button class="row-toggle-pay" data-toggle-pay="${r.id}" style="border:none;background:none;cursor:pointer;font-family:inherit;font-size:inherit;color:var(--ink);text-decoration:underline dotted;text-underline-offset:3px" title="${payments.length} lần thanh toán — bấm để xem/ghi nhận thêm">
            ${fmt(rc.received)} <span style="color:var(--slate);font-weight:400">(${payments.length})</span> ${expanded?'▾':'▸'}
          </button>
        </td>
        <td class="num" style="color:${rc.diff<0?'var(--rust)':'var(--forest)'}">${fmt(rc.diff)}</td>
        <td class="num" style="font-weight:700">${fmt(rc.stillOwed)}</td>
        <td><span class="stamp ${status.cls}">${status.label}</span></td>
        <td>${lockActionCellHTML(r, editable)}</td>
        <td>${canDelRow?`<button class="row-del" data-del="${r.id}">✕</button>`:''}</td>
      </tr>`;
      if(!expanded) return mainRow;
      const payRows = payments.slice().sort((a,b)=> b.date.localeCompare(a.date)).map(p=>`
        <tr style="background:#fff">
          <td style="padding-left:4px;color:var(--slate)">${new Date(p.date+'T00:00:00').toLocaleDateString('vi-VN')}</td>
          <td class="num" style="font-weight:600">${fmt(p.amount)}</td>
          <td><span class="tag">${p.method||'—'}</span></td>
          <td class="wrap" style="color:var(--slate)">${escHtml(p.note||'')}</td>
          <td>${editable?`<button class="row-del" data-del-pay="${r.id}|${p.id}" title="Xoá lần thanh toán này">✕</button>`:''}</td>
        </tr>`).join('');
      const detailRow = `<tr style="background:#FBFAF3">
        <td></td>
        <td colspan="12" style="padding:12px 16px 16px">
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);font-weight:600;margin-bottom:8px">Sổ nhận tiền — ${ins?escHtml(ins.name):''} · ${escHtml(r.period)}</div>
          ${editable ? `
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:10px">
            <div class="field" style="width:150px"><label>Ngày nhận</label><input type="date" id="irpay_date_${r.id}" value="${todayISO()}"></div>
            <div class="field" style="width:160px"><label>Số tiền (VNĐ)</label><input type="text" inputmode="numeric" class="field-money" id="irpay_amount_${r.id}" placeholder="0"></div>
            <div class="field" style="width:150px"><label>Hình thức</label><select id="irpay_method_${r.id}">${RECON_PAY_METHODS.map(m=>`<option>${m}</option>`).join('')}</select></div>
            <div class="field" style="flex:1;min-width:160px"><label>Ghi chú</label><input id="irpay_note_${r.id}" placeholder="VD: UNC 0234, đợt 1..."></div>
            <button class="btn btn-primary" data-add-pay="${r.id}">+ Ghi nhận thanh toán</button>
          </div>` : ''}
          ${payments.length===0 ? `<div style="color:var(--slate);font-size:12.5px">Chưa có lần thanh toán nào được ghi nhận.</div>` : `
          <table class="data" style="width:100%">
            <thead><tr><th style="padding-left:4px">Ngày</th><th class="num">Số tiền</th><th>Hình thức</th><th class="wrap">Ghi chú</th><th></th></tr></thead>
            <tbody>${payRows}</tbody>
          </table>`}
        </td>
      </tr>`;
      return mainRow + detailRow;
    }).join('')}</tbody>`;
  if(editable || isPartnerSelf){
    wireCellEdits(tbl, state.insReconciliations, 'Đối soát CK (Bảo hiểm)', r=>{ const ins=insurerById(r.insurerId); return `${r.period} (${ins?ins.name:''})`; });
    tbl.querySelectorAll('[data-add-pay]').forEach(el=>{
      const fld = document.getElementById('irpay_amount_'+el.dataset.addPay);
      if(fld) attachMoneyFormatting(fld);
    });
  }
  tbl.querySelectorAll('[data-toggle-pay]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.togglePay;
      if(insReconExpanded.has(id)) insReconExpanded.delete(id); else insReconExpanded.add(id);
      renderInsReconTable(editable);
    });
  });
  if(editable){
    tbl.querySelectorAll('[data-lock-recon]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const r = state.insReconciliations.find(x=>x.id===btn.dataset.lockRecon);
        if(!r) return;
        const rc = insReconCalc(r);
        const ins = insurerById(r.insurerId);
        confirmModal(`Chốt kỳ "${r.period}" (${ins?ins.name:''})?\nHoa hồng phải hưởng sẽ được chốt lại: ${fmt(rc.totalDue)}đ.\nMọi hợp đồng của NCC bảo hiểm này trong khoảng ${r.fromDate} → ${r.toDate} sẽ bị khoá sửa/xoá (trừ Admin).`, ()=>{
          lockReconciliation(r, rc, 'Đối soát CK (Bảo hiểm)', r.period);
          toast('Đã chốt kỳ "'+r.period+'"');
          saveState();
          renderAll();
        });
      });
    });
    tbl.querySelectorAll('[data-unlock-recon]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const r = state.insReconciliations.find(x=>x.id===btn.dataset.unlockRecon);
        if(!r) return;
        confirmModal(`Mở khoá kỳ "${r.period}"? Hồ sơ trong kỳ này sẽ sửa/xoá được bình thường trở lại.`, ()=>{
          unlockReconciliation(r, 'Đối soát CK (Bảo hiểm)', r.period);
          toast('Đã mở khoá kỳ "'+r.period+'"');
          saveState();
          renderAll();
        });
      });
    });
    tbl.querySelectorAll('[data-add-pay]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.addPay;
        const r = state.insReconciliations.find(x=>x.id===id);
        if(!r) return;
        const amount = parseMoneyInput(document.getElementById('irpay_amount_'+id).value);
        if(amount<=0){ toast('Nhập số tiền đã nhận'); return; }
        const date = document.getElementById('irpay_date_'+id).value || todayISO();
        const method = document.getElementById('irpay_method_'+id).value;
        const note = document.getElementById('irpay_note_'+id).value.trim();
        ensureReconciliationPayments(r).push({id:uid('pay'), date, amount, method, note, createdBy:currentUserId});
        const ins = insurerById(r.insurerId);
        logActivity('create','Đối soát CK (Bảo hiểm)', `Ghi nhận thanh toán ${fmt(amount)}đ (${method}) cho kỳ "${r.period}" — ${ins?ins.name:''}`);
        toast('Đã ghi nhận thanh toán');
        saveState();
        renderInsReconTable(editable);
      });
    });
    tbl.querySelectorAll('[data-del-pay]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const [rid, pid] = btn.dataset.delPay.split('|');
        const r = state.insReconciliations.find(x=>x.id===rid);
        if(!r) return;
        confirmModal('Xoá lần thanh toán này khỏi Sổ nhận tiền?', ()=>{
          r.payments = ensureReconciliationPayments(r).filter(p=>p.id!==pid);
          logActivity('delete','Đối soát CK (Bảo hiểm)', `Xoá 1 lần thanh toán ở kỳ "${r.period}"`);
          saveState();
          renderInsReconTable(editable);
        });
      });
    });
    tbl.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const r = state.insReconciliations.find(x=>x.id===btn.dataset.del);
        if(r && r.locked && currentRole()!=='Admin'){ toast('Kỳ đã chốt — chỉ Admin được xoá'); return; }
        const ins = r ? insurerById(r.insurerId) : null;
        confirmModal(`Xoá kỳ "${r?r.period:''}"${r&&r.locked?' (đã chốt)':''}?`, ()=>{
          const trashId = softDelete('insReconciliations', r, 'Đối soát CK (Bảo hiểm)');
          logActivity('delete','Đối soát CK (Bảo hiểm)', `Xoá kỳ "${r?r.period:''}" (${ins?ins.name:''})`);
          toastUndo('Đã xoá kỳ "'+(r?r.period:'')+'"', trashId);
          renderAll();
        });
      });
    });
  }
}

/* ---------------------------- Bảo hiểm · Lịch tái tục hằng năm ---------------------------- */
// Nhãn 'ok' đổi thành "Chưa tới hạn" thay vì "Đã khai thác đúng hạn" trước đây — 'ok' chỉ có nghĩa là mốc
// đến hạn còn xa (kể cả với hồ sơ mới giải ngân chưa từng mua bảo hiểm lần nào), không có nghĩa là ĐÃ có
// người mua — gọi là "đã khai thác" trong trường hợp đó là sai bản chất, dễ khiến người xem hiểu nhầm.
function renewalStatusLabel(status){
  return ({overdue:'Quá hạn chưa khai thác', due_soon:'Sắp đến hạn', in_progress:'Đang xử lý tái tục', ok:'Chưa tới hạn', snoozed:'🔕 Tạm ẩn'})[status] || status;
}
function renewalStatusStampHTML(status, snoozeUntil){
  const cls = ({overdue:'warn', due_soon:'pending', in_progress:'muted', ok:'ok', snoozed:'muted'})[status] || 'muted';
  const label = status==='snoozed' && snoozeUntil ? `🔕 Tạm ẩn tới ${new Date(snoozeUntil+'T00:00:00').toLocaleDateString('vi-VN')}` : renewalStatusLabel(status);
  return `<span class="stamp ${cls}">${label}</span>`;
}
function renderInsRenewal(c){
  const u = currentUser();
  const lockedUnits = (u && u.role==='Nhân viên') ? accountUnits(u) : [];
  const lockedUnit = lockedUnits.length===1 ? lockedUnits[0] : '';
  const lockedMulti = lockedUnits.length>1;
  if(lockedUnit) insRenewalUnitFilter = lockedUnit;
  else if(lockedMulti && insRenewalUnitFilter && !lockedUnits.includes(insRenewalUnitFilter)) insRenewalUnitFilter = '';
  const isAdmin = currentRole()==='Admin';
  const canManageLinks = currentRole()==='Admin' || currentRole()==='Quản lý'; // "Sửa liên kết" — việc kỹ thuật, vẫn chỉ Admin/Quản lý
  // "Không theo dõi" và "📋 Theo dõi" (nhật ký liên hệ/tạm ẩn) dùng LẠI đúng quyền sửa Doanh số đã cấu hình
  // sẵn ở "Cài đặt → Phân quyền chỉnh sửa" — Nhân viên nào được sửa Doanh số NH/BH thì cũng thao tác được
  // trên hồ sơ tái tục tương ứng nguồn đó, không cần thêm 1 lớp phân quyền riêng.
  const canTrackBh = canManageLinks || canEdit('bh_transactions');
  const canTrackNh = canManageLinks || canEdit('nh_transactions');
  const alertDays = renewalAlertDays();
  const autoSnoozeDays = renewalAutoSnoozeDays();
  const allRows = allRenewalRows();
  setTitle('Lịch tái tục', allRows.length+' hồ sơ cần theo dõi');
  const overdueCount = allRows.filter(r=>r.status==='overdue').length;
  const dueSoonCount = allRows.filter(r=>r.status==='due_soon').length;
  const inProgressCount = allRows.filter(r=>r.status==='in_progress').length;
  const snoozedCount = allRows.filter(r=>r.status==='snoozed').length;
  c.innerHTML = `
    <div class="panel">
      ${panelToggleHeadHTML('irwFilterPanel', 'Bộ lọc', '', `
        <div class="mini-stats-row">
          <div class="mini-stat"><div class="mini-stat-label">Quá hạn</div><div class="mini-stat-value" style="color:var(--rust)">${overdueCount}</div></div>
          <div class="mini-stat"><div class="mini-stat-label">Sắp đến hạn</div><div class="mini-stat-value" style="color:var(--amber)">${dueSoonCount}</div></div>
          <div class="mini-stat"><div class="mini-stat-label">Đang xử lý</div><div class="mini-stat-value" style="color:var(--slate)">${inProgressCount}</div></div>
          <div class="mini-stat"><div class="mini-stat-label">Tạm ẩn</div><div class="mini-stat-value" style="color:var(--slate)">${snoozedCount}</div></div>
          <div class="mini-stat"><div class="mini-stat-label">Tổng theo dõi</div><div class="mini-stat-value">${allRows.length}</div></div>
        </div>`, false, 'lọc')}
      <div class="panel-body" ${panelBodyOpenAttr('irwFilterPanel', false)}>
        <div class="form-grid">
          <div class="field">
            <label>Đơn vị</label>
            ${lockedUnit
              ? `<input id="irwf_unit" value="${escAttr(lockedUnit)}" disabled>`
              : lockedMulti
              ? `<select id="irwf_unit"><option value="">Cả ${lockedUnits.length} đơn vị của bạn</option>${lockedUnits.map(x=>`<option value="${escAttr(x)}" ${insRenewalUnitFilter===x?'selected':''}>${escAttr(x)}</option>`).join('')}</select>`
              : `<input id="irwf_unit" list="irwf_unit_list" placeholder="Tất cả đơn vị..." value="${escAttr(insRenewalUnitFilter)}">${unitDatalistHTML('irwf_unit_list')}`}
          </div>
          <div class="field"><label>Ngân hàng</label><input id="irwf_bank" list="irwf_bank_list" placeholder="Tất cả ngân hàng..." value="${escAttr(insRenewalBankFilter)}">
            <datalist id="irwf_bank_list">${state.banks.map(b=>`<option value="${escAttr(b.name)}">`).join('')}</datalist>
          </div>
          <div class="field"><label>Trạng thái</label>
            <select id="irwf_status">
              <option value="attention" ${insRenewalStatusFilter==='attention'?'selected':''}>🔔 Cần chú ý (mặc định)</option>
              <option value="" ${insRenewalStatusFilter===''?'selected':''}>Tất cả trạng thái</option>
              <option value="overdue" ${insRenewalStatusFilter==='overdue'?'selected':''}>Quá hạn chưa khai thác</option>
              <option value="due_soon" ${insRenewalStatusFilter==='due_soon'?'selected':''}>Sắp đến hạn</option>
              <option value="in_progress" ${insRenewalStatusFilter==='in_progress'?'selected':''}>Đang xử lý tái tục</option>
              <option value="ok" ${insRenewalStatusFilter==='ok'?'selected':''}>Chưa tới hạn</option>
              <option value="snoozed" ${insRenewalStatusFilter==='snoozed'?'selected':''}>🔕 Tạm ẩn</option>
            </select>
          </div>
          ${isAdmin ? `<div class="field" style="max-width:170px"><label>Ngưỡng "Sắp đến hạn" (ngày)</label><input id="irwAlertDaysInput" type="number" min="0" step="1" value="${alertDays}"></div>` : ''}
          ${isAdmin ? `<div class="field" style="max-width:190px"><label>Tự động ẩn sau quá hạn (ngày)</label><input id="irwAutoSnoozeDaysInput" type="number" min="0" step="1" value="${autoSnoozeDays}" title="Quá hạn quá số ngày này mà khách chưa tái tục -> hệ thống tự dời mốc sang đúng 1 năm sau, không cần bấm Tạm ẩn tay"></div>` : ''}
          <button class="btn btn-ghost" id="irwfClearBtn">Xem tất cả</button>
          <button class="btn btn-ghost" id="irwExportBtn">⇩ Xuất Excel</button>
        </div>
        ${collapsibleInfoHTML('renewal_filter_info', 'Danh sách gồm 2 nguồn: (1) hồ sơ vay thuộc gói yêu cầu mua lại bảo hiểm hằng năm — chỉ tính hồ sơ "Đã giải ngân" thuộc gói vay đã bật "Yêu cầu mua lại bảo hiểm hằng năm" ở Chính sách CK (Ngân hàng); (2) mọi đơn bảo hiểm "Đã cấp đơn" KHÔNG gắn khoản vay nào — mặc định đều theo dõi, đánh dấu "Không theo dõi" cho trường hợp ngoại lệ (hợp đồng nhiều năm, khách đã bán xe...). Liên kết/nhóm xe tự động theo biển số, dự phòng SĐT/tên khách hàng — nếu khớp sai, bấm "Sửa liên kết" ở cột cuối để chỉnh tay. Nếu khách không tái tục, hồ sơ vẫn cảnh báo "Quá hạn" trong đúng số ngày ở ô "Tự động ẩn sau quá hạn" (mặc định 15 ngày) — quá mốc đó, hệ thống TỰ dời mốc đến hạn sang đúng 1 năm sau, không cần Admin tự tay Tạm ẩn, rồi tự cảnh báo lại đúng theo ngưỡng "Sắp đến hạn" ở trên khi tới đúng chu kỳ mới. Nút "📋 Theo dõi" ở mỗi dòng dùng để ghi nhật ký liên hệ, hoặc hẹn tay 1 ngày khác nếu không muốn theo lịch tự động này.')}
      </div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <div><h2>Danh sách hồ sơ cần theo dõi</h2><div class="desc">Mặc định chỉ hiện hồ sơ Quá hạn/Sắp đến hạn/Đang xử lý — đổi ô "Trạng thái" ở Bộ lọc thành "Tất cả trạng thái" để xem cả hồ sơ Chưa tới hạn. Quá hạn/Sắp đến hạn luôn nổi lên đầu và nhấp nháy để dễ nhận ra.</div></div>
        ${isAdmin ? `<div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-ghost" id="renewalDeleteSelectedBtn" disabled>🗑 Bỏ theo dõi mục đã chọn (<span id="renewalSelectedCount">0</span>)</button>
          <button class="btn btn-ghost" id="renewalDeleteAllBtn">🗑 Bỏ theo dõi toàn bộ</button>
        </div>` : ''}
      </div>
      <div class="panel-body flush"><div class="tbl-wrap"><table class="data" id="renewalTable"></table></div></div>
    </div>
  `;
  wireInfoToggles(c);
  wirePanelToggles(c);
  document.getElementById('irwf_unit').addEventListener(lockedMulti?'change':'input', e=>{ insRenewalUnitFilter=e.target.value; drawRenewalTable(); });
  document.getElementById('irwf_bank').addEventListener('input', e=>{ insRenewalBankFilter=e.target.value; drawRenewalTable(); });
  document.getElementById('irwf_status').addEventListener('change', e=>{ insRenewalStatusFilter=e.target.value; drawRenewalTable(); });
  document.getElementById('irwfClearBtn').addEventListener('click', ()=>{
    if(!lockedUnit) insRenewalUnitFilter='';
    insRenewalBankFilter=''; insRenewalStatusFilter='';
    renderAll();
  });
  if(isAdmin){
    document.getElementById('irwAlertDaysInput').addEventListener('change', (e)=>{
      const days = Math.max(0, Number(e.target.value)||0);
      state.insRenewalAlertDays = days;
      e.target.value = days;
      logActivity('update','Cài đặt (Bảo hiểm)', `Đổi ngưỡng "Sắp đến hạn" tái tục bảo hiểm → ${days} ngày`);
      saveState();
      renderAll();
    });
    document.getElementById('irwAutoSnoozeDaysInput').addEventListener('change', (e)=>{
      const days = Math.max(0, Number(e.target.value)||0);
      state.insRenewalAutoSnoozeDays = days;
      e.target.value = days;
      logActivity('update','Cài đặt (Bảo hiểm)', `Đổi ngưỡng tự động ẩn sau quá hạn tái tục bảo hiểm → ${days} ngày`);
      saveState();
      renderAll();
    });
  }
  document.getElementById('irwExportBtn').addEventListener('click', ()=>{
    const rows = currentRenewalRows().map(r=>{
      const b = r.source==='bank' ? bankById(r.t.bankId) : null;
      return {
        'Nguồn': r.source==='bank' ? 'Qua khoản vay' : 'Bảo hiểm độc lập',
        'Đơn vị': r.t.unit, 'Khách hàng': r.t.customer||'', 'SĐT': r.t.phone||'', 'Biển số': r.t.vehicle||'',
        'Ngân hàng': b?b.name:'', 'Gói vay': r.source==='bank' ? (r.t.product||DEFAULT_BANK_PRODUCT) : '',
        'Ngày giải ngân': r.source==='bank' ? r.t.date : '',
        'Lần cấp đơn BH gần nhất': r.lastIssued ? r.lastIssued.date : '', 'Cách khớp': matchMethodLabel(r.matchMethod),
        'Mốc đến hạn tiếp theo': r.nextDue.toISOString().slice(0,10),
        'Số ngày còn lại (âm = quá hạn)': r.daysLeft, 'Trạng thái': renewalStatusLabel(r.status),
      };
    });
    exportToExcel('lich_tai_tuc_bao_hiem.xlsx', {'Lịch tái tục': rows});
  });
  drawRenewalTable();

  // Đánh dấu 1 dòng Lịch tái tục là "không theo dõi nữa" — dùng chung cho cả 2 nguồn (khoản vay / bảo
  // hiểm độc lập), gán renewalExempt lên đúng bản ghi gốc (bankTransactions hoặc insTransactions).
  function exemptRenewalRow(r){
    if(r.source==='bank'){
      const t = state.bankTransactions.find(x=>x.id===r.t.id);
      if(!t) return;
      t.renewalExempt = true;
      logActivity('update','Doanh số (NH)', `${t.customer||''} (${t.vehicle||''}) — Đánh dấu không theo dõi tái tục`);
    } else {
      const insTx = state.insTransactions.find(x=>x.id===r.t.id);
      if(!insTx) return;
      insTx.renewalExempt = true;
      logActivity('update','Doanh số (Bảo hiểm)', `${insTx.customer||''} (${insTx.vehicle||''}) — Đánh dấu không theo dõi tái tục`);
    }
  }
  // Bản ghi gốc (bankTransactions hoặc insTransactions) đứng sau 1 dòng Lịch tái tục — dùng để gán trực
  // tiếp renewalSnoozeUntil/renewalContactLog, tách biệt hoàn toàn với renewalExempt (bỏ theo dõi vĩnh viễn).
  function renewalUnderlyingRecord(r){
    return r.source==='bank'
      ? state.bankTransactions.find(x=>x.id===r.t.id)
      : state.insTransactions.find(x=>x.id===r.t.id);
  }
  // Modal "📋 Theo dõi": (1) Nhật ký liên hệ tư vấn lại — chỉ ghi lịch sử, KHÔNG đổi cách tính hạn, hồ sơ
  // vẫn cảnh báo bình thường; (2) Tạm ẩn cảnh báo tới 1 ngày hẹn trước — dùng khi khách chưa tái tục lần
  // này nhưng vẫn cần bám tiếp năm sau: hồ sơ vẫn nằm trong danh sách theo dõi (khác hẳn "Không theo dõi"
  // vốn ẩn vĩnh viễn), chỉ tạm ngưng nhấp nháy/đếm vào Quá hạn-Sắp đến hạn, tự động hiện cảnh báo lại đúng
  // ngày hẹn mà không cần ai nhớ để bật lại tay.
  function openRenewalTrackingModal(r){
    const rec = renewalUnderlyingRecord(r);
    if(!rec) return;
    const logType = r.source==='bank' ? 'Doanh số (NH)' : 'Doanh số (Bảo hiểm)';
    const renderBody = ()=>{
      const log = (rec.renewalContactLog||[]).slice().sort((a,b)=> b.date.localeCompare(a.date));
      const snoozeUntil = rec.renewalSnoozeUntil||'';
      const isSnoozedNow = snoozeUntil && snoozeUntil>todayISO();
      return `
        <div style="margin-bottom:18px">
          <div style="font-weight:600;margin-bottom:8px">Lịch sử liên hệ tư vấn</div>
          ${log.length ? log.map(l=>`
            <div style="padding:8px 0;border-bottom:1px solid var(--line)">
              <div style="font-weight:600">${new Date(l.date+'T00:00:00').toLocaleDateString('vi-VN')} <span class="meta-line" style="font-weight:400">— ${escHtml(l.by||'')}</span></div>
              <div class="meta-line">${escHtml(l.note||'')}</div>
            </div>`).join('') : `<div class="helper">Chưa có lịch sử liên hệ nào.</div>`}
          <div class="form-grid" style="margin-top:10px">
            <div class="field"><label>Ngày liên hệ</label><input id="rtmLogDate" type="date" value="${todayISO()}"></div>
            <div class="field" style="grid-column:1/-1"><label>Nội dung / kết quả</label><input id="rtmLogNote" placeholder="VD: Đã gọi tư vấn, khách chưa quyết định, hẹn gọi lại năm sau"></div>
            <button class="btn btn-ghost" id="rtmAddLogBtn">+ Ghi nhận liên hệ</button>
          </div>
        </div>
        <div style="border-top:1px solid var(--line);padding-top:14px">
          <div style="font-weight:600;margin-bottom:8px">Tạm ẩn cảnh báo</div>
          ${isSnoozedNow
            ? `<div class="helper">Đang tạm ẩn tới <b>${new Date(snoozeUntil+'T00:00:00').toLocaleDateString('vi-VN')}</b> — sẽ tự động hiện cảnh báo lại đúng ngày đó, không cần làm gì thêm.</div>
               <button class="btn btn-ghost" id="rtmClearSnoozeBtn" style="margin-top:8px">Huỷ tạm ẩn — hiện cảnh báo lại ngay</button>`
            : `<div class="helper">Hệ thống đã <b>tự động</b> tạm ẩn cảnh báo cho mọi hồ sơ quá hạn quá ${renewalAutoSnoozeDays()} ngày (chỉnh ở ô "Tự động ẩn sau quá hạn" trong Bộ lọc), rồi tự dời mốc sang đúng 1 năm sau — không cần bấm gì ở đây cho trường hợp thông thường. Chỉ dùng nút dưới đây nếu muốn hẹn 1 ngày CỤ THỂ khác với lịch tự động (VD khách hẹn "gọi lại sau 6 tháng").</div>
               <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center">
                 <button class="btn btn-ghost" data-snooze-preset="3">+3 tháng</button>
                 <button class="btn btn-ghost" data-snooze-preset="6">+6 tháng</button>
                 <button class="btn btn-ghost" data-snooze-preset="12">+1 năm</button>
                 <input id="rtmSnoozeDate" type="date" min="${todayISO()}">
                 <button class="btn btn-primary" id="rtmSnoozeBtn">Tạm ẩn tới ngày này</button>
               </div>`}
        </div>`;
    };
    openModal('Theo dõi tái tục — '+(rec.customer||'(chưa có tên KH)'), rec.vehicle||'', renderBody(), (bodyEl)=>{
      const wire = ()=>{
        const addBtn = bodyEl.querySelector('#rtmAddLogBtn');
        if(addBtn) addBtn.addEventListener('click', ()=>{
          const date = bodyEl.querySelector('#rtmLogDate').value || todayISO();
          const note = bodyEl.querySelector('#rtmLogNote').value.trim();
          if(!note){ toast('Nhập nội dung liên hệ'); return; }
          if(!rec.renewalContactLog) rec.renewalContactLog = [];
          rec.renewalContactLog.push({date, note, by:(currentUser()&&currentUser().name)||'', at:new Date().toISOString()});
          logActivity('update', logType, `${rec.customer||''} — Ghi nhận liên hệ tái tục: ${note}`);
          saveState();
          bodyEl.innerHTML = renderBody();
          wire();
        });
        bodyEl.querySelectorAll('[data-snooze-preset]').forEach(b=> b.addEventListener('click', ()=>{
          const months = Number(b.dataset.snoozePreset);
          const d = new Date(); d.setMonth(d.getMonth()+months);
          const dateInput = bodyEl.querySelector('#rtmSnoozeDate');
          if(dateInput) dateInput.value = d.toISOString().slice(0,10);
        }));
        const snoozeBtn = bodyEl.querySelector('#rtmSnoozeBtn');
        if(snoozeBtn) snoozeBtn.addEventListener('click', ()=>{
          const dateInput = bodyEl.querySelector('#rtmSnoozeDate');
          const val = dateInput ? dateInput.value : '';
          if(!val){ toast('Chọn ngày muốn hiện cảnh báo lại'); return; }
          rec.renewalSnoozeUntil = val;
          logActivity('update', logType, `${rec.customer||''} — Tạm ẩn cảnh báo tái tục tới ${val}`);
          saveState();
          toast('Đã tạm ẩn cảnh báo tới '+new Date(val+'T00:00:00').toLocaleDateString('vi-VN'));
          closeModal();
          renderAll();
        });
        const clearBtn = bodyEl.querySelector('#rtmClearSnoozeBtn');
        if(clearBtn) clearBtn.addEventListener('click', ()=>{
          rec.renewalSnoozeUntil = '';
          logActivity('update', logType, `${rec.customer||''} — Huỷ tạm ẩn cảnh báo tái tục`);
          saveState();
          toast('Đã huỷ tạm ẩn — cảnh báo hiện lại ngay');
          closeModal();
          renderAll();
        });
      };
      wire();
    });
  }
  if(isAdmin){
    document.getElementById('renewalDeleteSelectedBtn').addEventListener('click', ()=>{
      const tbl = document.getElementById('renewalTable');
      if(!tbl) return;
      const picked = Array.from(tbl.querySelectorAll('.renewal-chk:checked')).map(x=>({id:x.dataset.id, source:x.dataset.source}));
      if(picked.length===0) return;
      confirmModal(`Bỏ theo dõi tái tục cho ${picked.length} hồ sơ đã chọn?\n\nCác hồ sơ này sẽ không hiện lại trong Lịch tái tục nữa — có thể bật lại bằng cách sửa trực tiếp ở Doanh số Ngân hàng/Bảo hiểm nếu cần.`, ()=>{
        const rowsNow = currentRenewalRows();
        picked.forEach(({id,source})=>{
          const r = rowsNow.find(x=>x.t.id===id && x.source===source);
          if(r) exemptRenewalRow(r);
        });
        saveState();
        toast(`Đã bỏ theo dõi ${picked.length} hồ sơ`);
        renderAll();
      }, {danger:true});
    });
    document.getElementById('renewalDeleteAllBtn').addEventListener('click', ()=>{
      const rowsNow = currentRenewalRows();
      if(rowsNow.length===0){ toast('Không có hồ sơ nào để bỏ theo dõi'); return; }
      confirmModal(`Bỏ theo dõi tái tục cho TOÀN BỘ ${rowsNow.length} hồ sơ đang hiển thị theo bộ lọc hiện tại?\n\nCác hồ sơ này sẽ không hiện lại trong Lịch tái tục nữa — có thể bật lại bằng cách sửa trực tiếp ở Doanh số Ngân hàng/Bảo hiểm nếu cần.`, ()=>{
        rowsNow.forEach(r=> exemptRenewalRow(r));
        saveState();
        toast(`Đã bỏ theo dõi toàn bộ ${rowsNow.length} hồ sơ`);
        renderAll();
      }, {danger:true});
    });
  }

  function currentRenewalRows(){
    return allRows.filter(r=>{
      if(lockedUnits.length && !lockedUnits.includes(r.t.unit)) return false;
      if(insRenewalUnitFilter && r.t.unit.toLowerCase()!==insRenewalUnitFilter.trim().toLowerCase()) return false;
      if(insRenewalBankFilter){
        const b = bankById(r.t.bankId);
        if(!b || b.name.toLowerCase()!==insRenewalBankFilter.trim().toLowerCase()) return false;
      }
      if(insRenewalStatusFilter==='attention'){
        if(!(r.status==='overdue'||r.status==='due_soon'||r.status==='in_progress')) return false;
      } else if(insRenewalStatusFilter && r.status!==insRenewalStatusFilter) return false;
      return true;
    }).sort((a,b)=>{
      const aSn = a.status==='snoozed'?1:0, bSn = b.status==='snoozed'?1:0;
      if(aSn!==bSn) return aSn-bSn; // tạm ẩn luôn xuống cuối, không lẫn với hồ sơ đang thực sự cần chú ý
      return a.daysLeft-b.daysLeft;
    });
  }
  function drawRenewalTable(){
    const tbl = document.getElementById('renewalTable');
    const rows = currentRenewalRows();
    if(allRows.length===0){
      tbl.outerHTML = `<div class="empty"><div class="big">Chưa có hồ sơ nào cần theo dõi</div>Chưa có đơn bảo hiểm "Đã cấp đơn" nào trong hệ thống, hoặc tất cả đã bị đánh dấu "Không theo dõi tái tục".</div>`;
      return;
    }
    if(rows.length===0){
      tbl.outerHTML = `<div class="empty"><div class="big">Không có hồ sơ khớp bộ lọc</div></div>`;
      return;
    }
    tbl.innerHTML = `
      <thead><tr>
        ${isAdmin ? `<th style="width:32px"><input type="checkbox" id="renewalSelectAll" title="Chọn tất cả"></th>` : ''}
        <th class="wrap">Nguồn</th><th class="wrap">Khách hàng</th><th class="wrap" style="max-width:110px">Biển số</th>
        <th class="wrap" style="max-width:100px">Lần cấp đơn BH gần nhất</th><th class="wrap" style="max-width:90px">Cách khớp</th><th class="wrap" style="max-width:95px">Mốc đến hạn tiếp theo</th><th class="num">Số ngày</th><th>Trạng thái</th><th></th>
      </tr></thead>
      <tbody>${rows.map(r=>{
       try{
        const isBank = r.source==='bank';
        const b = isBank ? bankById(r.t.bankId) : null;
        const daysTxt = r.daysLeft<0 ? `Quá ${-r.daysLeft} ngày` : `Còn ${r.daysLeft} ngày`;
        const lastInsCell = r.lastIssued ? r.lastIssued.date
          : (r.pendingMatches.length ? `<em title="Có hợp đồng ngày ${escAttr(r.pendingMatches[0].date)} nhưng chưa Đã cấp đơn">Đang xử lý (${r.pendingMatches[0].date})</em>`
          : '<em>Chưa có</em>');
        // Gộp "Nguồn" + "Ngân hàng/Gói vay" + "Ngày giải ngân" thành 1 cột duy nhất — vì phần lớn hồ sơ giờ
        // là "Bảo hiểm độc lập" (không có khoản vay), để 2 cột riêng sẽ toàn dấu "—" lãng phí chỗ, rối mắt.
        const sourceCell = isBank
          ? `<div style="font-weight:600;white-space:nowrap">🏦 ${b?escHtml(b.name):'<em>(đã xoá)</em>'}</div><div class="meta-line" style="white-space:nowrap">${escHtml(r.t.product||DEFAULT_BANK_PRODUCT)} · Giải ngân ${r.t.date}</div>`
          : `<span class="meta-line" style="white-space:nowrap" title="Không có khoản vay nào theo dõi xe này — tự theo dõi trực tiếp từ Doanh số Bảo hiểm">📄 BH độc lập</span>`;
        const canTrackThisRow = isBank ? canTrackNh : canTrackBh;
        const actionBtn = isBank
          ? (canManageLinks ? `<button class="btn btn-ghost" data-editlink="${r.t.id}" style="font-size:11.5px;padding:4px 8px;white-space:nowrap">Sửa liên kết</button>` : '')
          : (canTrackThisRow ? `<button class="btn btn-ghost" data-exempt="${r.t.id}" style="font-size:11.5px;padding:4px 8px;white-space:nowrap" title="Dùng khi hợp đồng nhiều năm hoặc khách đã bán xe/huỷ — sẽ không hiện lại trong Lịch tái tục nữa">🚫 Không theo dõi</button>` : '');
        const trackBtn = canTrackThisRow ? `<button class="btn btn-ghost" data-tracking="${escAttr(r.t.id)}" data-tracking-source="${r.source}" style="font-size:11.5px;padding:4px 8px;white-space:nowrap;margin-top:4px" title="Ghi nhận liên hệ tư vấn lại, hoặc tạm ẩn cảnh báo tới 1 ngày hẹn trước">📋 Theo dõi${r.contactLog.length?` (${r.contactLog.length})`:''}</button>` : '';
        const isPulsing = r.status==='overdue' || r.status==='due_soon'; // tạm ẩn/đang xử lý/chưa tới hạn không nhấp nháy
        return `<tr class="${isPulsing?(r.status==='overdue'?'renewal-pulse-overdue':'renewal-pulse-soon'):''}">
          ${isAdmin ? `<td><input type="checkbox" class="renewal-chk" data-id="${escAttr(r.t.id)}" data-source="${r.source}"></td>` : ''}
          <td class="wrap">${sourceCell}</td>
          <td class="wrap"><b>${escHtml(r.t.customer||'(chưa có tên KH)')}</b>${r.missedCycles>0?` <span class="tag" style="color:var(--rust)" title="Đã ${r.missedCycles} lần quá hạn quá lâu mà khách không tái tục, hệ thống tự dời mốc sang năm sau">⏳ Lỡ ${r.missedCycles} lần</span>`:''}<div class="meta-line">${escHtml(r.t.phone||'')} · ${escHtml(r.t.unit)}</div></td>
          <td class="wrap" style="max-width:150px;word-break:break-all" title="${escAttr(r.t.vehicle||'')}">${escHtml(r.t.vehicle||'—')}</td>
          <td>${lastInsCell}</td>
          <td class="meta-line">${escHtml(matchMethodLabel(r.matchMethod))}</td>
          <td>${r.nextDue.toISOString().slice(0,10)}</td>
          <td class="num" style="font-weight:600;${r.status==='overdue'?'color:var(--rust)':r.status==='due_soon'?'color:var(--amber)':''}">${daysTxt}</td>
          <td>${renewalStatusStampHTML(r.status, r.snoozeUntil)}</td>
          <td><div style="display:flex;flex-direction:column;align-items:flex-start">${actionBtn}${trackBtn}</div></td>
        </tr>`;
       }catch(err){
        // Không để 1 bản ghi bất thường (dữ liệu ngày lỗi, thiếu field...) làm sập trắng cả bảng — chỉ báo lỗi

        console.error('Lỗi dựng dòng Lịch tái tục cho hồ sơ', r && r.t && r.t.id, err);

       }
      }).join('')}</tbody>`;
    if(canManageLinks){
      tbl.querySelectorAll('[data-editlink]').forEach(btn=>{
        btn.addEventListener('click', ()=> openRenewalLinkModal(btn.dataset.editlink));
      });
    }
    // Wiring cho "Không theo dõi" + "📋 Theo dõi": querySelectorAll rỗng vô hại nếu nút không được vẽ ra do
    // thiếu quyền (canTrackBh/canTrackNh) — không cần bọc thêm điều kiện role ở đây.
    tbl.querySelectorAll('[data-exempt]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const insTx = state.insTransactions.find(x=>x.id===btn.dataset.exempt);
        if(!insTx) return;
        confirmModal(`Đánh dấu "Không theo dõi tái tục" cho hợp đồng của "${insTx.customer||'(chưa có tên KH)'}" (${insTx.vehicle||'—'})?\n\nDùng khi: hợp đồng bảo hiểm nhiều năm, hoặc khách đã bán xe/huỷ hợp đồng. Hồ sơ này sẽ không hiện lại trong Lịch tái tục nữa — có thể bật lại bằng cách sửa trực tiếp ở Doanh số Bảo hiểm nếu cần.`, ()=>{
          insTx.renewalExempt = true;
          logActivity('update','Doanh số (Bảo hiểm)', `${insTx.customer||''} (${insTx.vehicle||''}) — Đánh dấu không theo dõi tái tục`);
          saveState();
          toast('Đã đánh dấu không theo dõi tái tục');
          renderAll();
        }, {danger:false});
      });
    });
    tbl.querySelectorAll('[data-tracking]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const rowsNow = currentRenewalRows();
        const r = rowsNow.find(x=>x.t.id===btn.dataset.tracking && x.source===btn.dataset.trackingSource);
        if(r) openRenewalTrackingModal(r);
      });
    });
    // Checkbox chọn dòng (chỉ Admin) — chỉ để bật/tắt nút "Bỏ theo dõi mục đã chọn", việc xoá thật sự
    // do 2 nút ở panel-head xử lý (đọc lại danh sách đã chọn tại thời điểm bấm, không lưu state riêng).
    if(isAdmin){
      const selAllChk = tbl.querySelector('#renewalSelectAll');
      const rowChks = ()=> Array.from(tbl.querySelectorAll('.renewal-chk'));
      const updateSelectedUI = ()=>{
        const checked = rowChks().filter(x=>x.checked);
        const btn = document.getElementById('renewalDeleteSelectedBtn');
        const cnt = document.getElementById('renewalSelectedCount');
        if(cnt) cnt.textContent = checked.length;
        if(btn) btn.disabled = checked.length===0;
        if(selAllChk) selAllChk.checked = rowChks().length>0 && checked.length===rowChks().length;
      };
      if(selAllChk) selAllChk.addEventListener('change', ()=>{
        rowChks().forEach(chk=> chk.checked = selAllChk.checked);
        updateSelectedUI();
      });
      rowChks().forEach(chk=> chk.addEventListener('change', updateSelectedUI));
      updateSelectedUI();
    }
  }
}

// Modal cho Admin/Quản lý sửa tay khi hệ thống khớp sai (hoặc xác nhận "chưa có hợp đồng phù hợp") — xem
// bankTransactions.renewalLink ở phần comment đầu khối "Lịch tái tục hằng năm" phía trên.
function openRenewalLinkModal(bankTxId){
  const t = state.bankTransactions.find(x=>x.id===bankTxId);
  if(!t) return;
  const {matches, method} = computeRenewalMatches(t);
  const current = matches[0] || null;
  const renderList = (q)=>{
    const qq = (q||'').trim().toLowerCase();
    const candidates = state.insTransactions.filter(it=>it.status!=='Huỷ').filter(it=>{
      if(!qq) return true;
      const hay = [it.customer, it.phone, it.vehicle, it.policyNo].join(' ').toLowerCase();
      return hay.includes(qq);
    }).sort((a,b)=> b.date.localeCompare(a.date)).slice(0,30);
    if(candidates.length===0) return `<div class="helper">Không tìm thấy hợp đồng bảo hiểm nào khớp từ khoá tìm.</div>`;
    return candidates.map(it=>{
      const ins = insurerById(it.insurerId);
      const selected = t.renewalLink===it.id;
      return `<div class="renewal-pick-row" data-pick="${it.id}" style="padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;${selected?'background:var(--forest-soft);border-color:var(--forest)':''}">
        <b>${escHtml(it.customer||'(chưa có tên KH)')}</b> · ${escHtml(it.vehicle||'—')}
        <div class="meta-line">${ins?escHtml(ins.name):''} · ${it.date} · ${escHtml(it.status)}${selected?' · <b>Đang chọn</b>':''}</div>
      </div>`;
    }).join('');
  };
  openModal('Sửa liên kết tái tục',
    `Hồ sơ vay: <b>${escHtml(t.customer||'(chưa có tên KH)')}</b> · ${escHtml(t.vehicle||'—')} · ${t.date}`,
    `<div class="helper" style="margin-bottom:10px">Đang khớp theo: <b>${escHtml(matchMethodLabel(method))}</b>${current?` — ${escHtml(current.customer||'')} · ${current.date}`:''}</div>
     <div class="field" style="margin-bottom:10px"><input id="rlm_search" placeholder="Tìm theo tên KH / biển số / SĐT / số đơn bảo hiểm..." autocomplete="off"></div>
     <div id="rlm_list" style="max-height:320px;overflow:auto"></div>
     <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
       <button class="btn btn-danger-ghost" id="rlm_none">Đánh dấu: chưa có hợp đồng phù hợp</button>
       ${t.renewalLink ? `<button class="btn btn-ghost" id="rlm_reset">Dùng lại khớp tự động</button>` : ''}
     </div>`,
    (body)=>{
      const listEl = body.querySelector('#rlm_list');
      const searchEl = body.querySelector('#rlm_search');
      const bindPicks = ()=>{
        listEl.querySelectorAll('[data-pick]').forEach(row=>{
          row.addEventListener('click', ()=>{
            const it = state.insTransactions.find(x=>x.id===row.dataset.pick);
            t.renewalLink = row.dataset.pick;
            logActivity('update','Doanh số (NH)', `${t.customer||''} (${t.vehicle||''}) — Gán thủ công liên kết tái tục → hợp đồng BH ${it?it.date:''} (${it?it.customer:''})`);
            saveState();
            closeModal();
            renderAll();
          });
        });
      };
      listEl.innerHTML = renderList('');
      bindPicks();
      searchEl.addEventListener('input', ()=>{ listEl.innerHTML = renderList(searchEl.value); bindPicks(); });
      body.querySelector('#rlm_none').addEventListener('click', ()=>{
        t.renewalLink = 'NONE';
        logActivity('update','Doanh số (NH)', `${t.customer||''} (${t.vehicle||''}) — Xác nhận thủ công: chưa có hợp đồng bảo hiểm phù hợp cho chu kỳ tái tục`);
        saveState();
        closeModal();
        renderAll();
      });
      const resetBtn = body.querySelector('#rlm_reset');
      if(resetBtn) resetBtn.addEventListener('click', ()=>{
        delete t.renewalLink;
        logActivity('update','Doanh số (NH)', `${t.customer||''} (${t.vehicle||''}) — Bỏ liên kết thủ công, dùng lại khớp tự động cho chu kỳ tái tục`);
        saveState();
        closeModal();
        renderAll();
      });
    });
}

/* ---------------------------- Cài đặt ---------------------------- */
function unitUsage(u){
  const accountsUsing = state.accounts.filter(a=>accountUnits(a).includes(u)).length;
  const txUsing = state.transactions.filter(t=>t.unit===u).length;
  return {accountsUsing, txUsing, total: accountsUsing+txUsing};
}
function deleteUnit(u){
  state.units = state.units.filter(x=>x!==u);
  // gỡ gán khỏi các tài khoản đang phụ trách đơn vị này (không xoá tài khoản, chỉ gỡ liên kết) — hoạt động đúng cả khi tài khoản đang phụ trách nhiều đơn vị (chỉ gỡ đúng đơn vị bị xoá, giữ nguyên các đơn vị còn lại)
  state.accounts.forEach(a=>{ if(accountUnits(a).includes(u)) setAccountUnits(a, accountUnits(a).filter(x=>x!==u)); });
  logActivity('delete','Cài đặt', `Xoá đơn vị "${u}" khỏi danh sách (gỡ liên kết khỏi các tài khoản đang phụ trách)`);
}
/* ---------------------------- Lưu trữ & dọn dữ liệu cũ (Cài đặt, chỉ Admin) ----------------------------
   Chỉ xoá dữ liệu ĐÃ CHỐT XONG trước 1 mốc ngày — tuyệt đối không đụng dữ liệu còn "sống":
   - Doanh số: chỉ xoá nếu nằm trong 1 kỳ Đối soát CK đã "chốt" (dùng đúng lockingReconOf() có sẵn).
   - Đối soát CK: chỉ xoá nếu đã chốt VÀ toàn bộ kỳ đã trước mốc ngày.
   - Hợp đồng: chỉ xoá nếu đã "Hết hạn" hoặc "Đã thay thế" (dùng đúng contractStatus() có sẵn).
   - Yêu cầu/Trao đổi: chỉ xoá nếu đã ở trạng thái "Đã xử lý".
   Xoá THẲNG, không qua Thùng rác (mục đích là giảm dung lượng thật sự) — bắt buộc xuất file lưu trữ trước. */
let archiveExportedForCutoff = null; // ghi nhớ ĐÃ xuất file cho đúng mốc ngày nào — đổi ngày phải xuất lại
const ARCHIVE_TX_GROUPS = [
  {key:'transactions', reconArr:'reconciliations', idField:'supplierId', label:'Doanh số NCC'},
  {key:'bankTransactions', reconArr:'bankReconciliations', idField:'bankId', label:'Doanh số NH'},
  {key:'insTransactions', reconArr:'insReconciliations', idField:'insurerId', label:'Doanh số Bảo hiểm'},
];
const ARCHIVE_RECON_GROUPS = [
  {key:'reconciliations', label:'Đối soát CK (NCC)'},
  {key:'bankReconciliations', label:'Đối soát CK (NH)'},
  {key:'insReconciliations', label:'Đối soát CK (Bảo hiểm)'},
];
const ARCHIVE_CONTRACT_GROUPS = [
  {key:'contracts', label:'Hợp đồng NCC'},
  {key:'bankContracts', label:'Hợp đồng NH'},
  {key:'insContracts', label:'Hợp đồng Bảo hiểm'},
];
const ARCHIVE_REQUEST_GROUPS = [
  {key:'requests', label:'Yêu cầu (NCC)'},
  {key:'bankRequests', label:'Yêu cầu (NH)'},
  {key:'insRequests', label:'Yêu cầu (Bảo hiểm)'},
];
function archiveGroups(cutoff){
  if(!cutoff) return [];
  const groups = [];
  ARCHIVE_TX_GROUPS.forEach(g=>{
    const items = (state[g.key]||[]).filter(t=> t.date < cutoff && lockingReconOf(t, state[g.reconArr], g.idField));
    if(items.length) groups.push({key:g.key, label:g.label, items});
  });
  ARCHIVE_RECON_GROUPS.forEach(g=>{
    const items = (state[g.key]||[]).filter(r=> r.locked && r.toDate && r.toDate < cutoff);
    if(items.length) groups.push({key:g.key, label:g.label, items});
  });
  ARCHIVE_CONTRACT_GROUPS.forEach(g=>{
    const items = (state[g.key]||[]).filter(ct=>{
      const st = contractStatus(ct);
      if(st==='expired') return ct.ngayHetHan && ct.ngayHetHan < cutoff;
      if(st==='superseded') return (ct.createdAt||'').slice(0,10) < cutoff;
      return false;
    });
    if(items.length) groups.push({key:g.key, label:g.label, items});
  });
  ARCHIVE_REQUEST_GROUPS.forEach(g=>{
    const items = (state[g.key]||[]).filter(r=> r.status==='da_xu_ly' && (r.updatedAt||'').slice(0,10) < cutoff);
    if(items.length) groups.push({key:g.key, label:g.label, items});
  });
  return groups;
}
// Chuyển 1 nhóm bản ghi thành các dòng dễ đọc để xuất Excel — mỗi loại dữ liệu có cột khác nhau.
function archiveRowsFor(key, items){
  const finders = {
    transactions: t=>({'Ngày':t.date,'Đơn vị':t.unit,'NCC':(supplierById(t.supplierId)||{}).name||'','Số CT':t.doc||'','Nhóm hàng':t.category||'','Trước VAT':t.gross,'Trả hàng':t.returns,'Người nhập':t.createdBy||''}),
    bankTransactions: t=>({'Ngày':t.date,'Đơn vị':t.unit,'Ngân hàng':(bankById(t.bankId)||{}).name||'','Khách hàng':t.customer||'','SĐT':t.phone||'','Biển số':t.vehicle||'','Số tiền vay':t.loanAmount,'Trạng thái':t.status}),
    insTransactions: t=>({'Ngày':t.date,'Đơn vị':t.unit,'NCC bảo hiểm':(insurerById(t.insurerId)||{}).name||'','Khách hàng':t.customer||'','SĐT':t.phone||'','Biển số':t.vehicle||'','Phí bảo hiểm':t.premiumAmount,'Trạng thái':t.status}),
    reconciliations: r=>({'Kỳ':r.period,'NCC':(supplierById(r.supplierId)||{}).name||'','Từ ngày':r.fromDate,'Đến ngày':r.toDate,'Đã chốt':r.locked?'Có':'Không'}),
    bankReconciliations: r=>({'Kỳ':r.period,'Ngân hàng':(bankById(r.bankId)||{}).name||'','Từ ngày':r.fromDate,'Đến ngày':r.toDate,'Đã chốt':r.locked?'Có':'Không'}),
    insReconciliations: r=>({'Kỳ':r.period,'NCC bảo hiểm':(insurerById(r.insurerId)||{}).name||'','Từ ngày':r.fromDate,'Đến ngày':r.toDate,'Đã chốt':r.locked?'Có':'Không'}),
    contracts: ct=>({'NCC':(supplierById(ct.supplierId)||{}).name||'','Tên hợp đồng':ct.ten,'Số HĐ':ct.soHopDong||'','Ngày ký':ct.ngayKy||'','Hiệu lực':ct.ngayHieuLuc||'','Hết hạn':ct.ngayHetHan||'','Link':ct.link||''}),
    bankContracts: ct=>({'Ngân hàng':(bankById(ct.bankId)||{}).name||'','Tên hợp đồng':ct.ten,'Số HĐ':ct.soHopDong||'','Ngày ký':ct.ngayKy||'','Hiệu lực':ct.ngayHieuLuc||'','Hết hạn':ct.ngayHetHan||'','Link':ct.link||''}),
    insContracts: ct=>({'NCC bảo hiểm':(insurerById(ct.insurerId)||{}).name||'','Tên hợp đồng':ct.ten,'Số HĐ':ct.soHopDong||'','Ngày ký':ct.ngayKy||'','Hiệu lực':ct.ngayHieuLuc||'','Hết hạn':ct.ngayHetHan||'','Link':ct.link||''}),
    requests: r=>({'NCC':(supplierById(r.supplierId)||{}).name||'','Trạng thái':requestStatusMeta(r.status).label,'Cập nhật lúc':r.updatedAt,'Nội dung':(r.messages||[]).map(m=>`[${m.authorName}] ${m.text}`).join(' | ')}),
    bankRequests: r=>({'Ngân hàng':(bankById(r.bankId)||{}).name||'','Trạng thái':requestStatusMeta(r.status).label,'Cập nhật lúc':r.updatedAt,'Nội dung':(r.messages||[]).map(m=>`[${m.authorName}] ${m.text}`).join(' | ')}),
    insRequests: r=>({'NCC bảo hiểm':(insurerById(r.insurerId)||{}).name||'','Trạng thái':requestStatusMeta(r.status).label,'Cập nhật lúc':r.updatedAt,'Nội dung':(r.messages||[]).map(m=>`[${m.authorName}] ${m.text}`).join(' | ')}),
  };
  const fn = finders[key];
  return fn ? items.map(fn) : items;
}
function wireArchivePanel(){
  const cutoffInput = document.getElementById('archiveCutoff');
  const previewBox = document.getElementById('archivePreviewBox');
  const exportBtn = document.getElementById('archiveExportBtn');
  const confirmText = document.getElementById('archiveConfirmText');
  const purgeBtn = document.getElementById('archivePurgeBtn');
  function refreshPreview(){
    const cutoff = cutoffInput.value;
    if(!cutoff){ previewBox.textContent = 'Chọn 1 ngày mốc trước.'; }
    else{
      const groups = archiveGroups(cutoff);
      const total = groups.reduce((s,g)=>s+g.items.length,0);
      previewBox.innerHTML = total>0
        ? `Sẽ xoá được <b>${total}</b> bản ghi đã chốt xong trước ${cutoff}:<br>${groups.map(g=>`- ${escHtml(g.label)}: ${g.items.length}`).join('<br>')}`
        : 'Không có dữ liệu nào đủ điều kiện xoá trước mốc này (chỉ tính dữ liệu đã chốt xong).';
    }
    updatePurgeBtnState();
  }
  function updatePurgeBtnState(){
    const cutoff = cutoffInput.value;
    const total = archiveGroups(cutoff).reduce((s,g)=>s+g.items.length,0);
    purgeBtn.disabled = !(cutoff && total>0 && archiveExportedForCutoff===cutoff && confirmText.value.trim()==='XOÁ VĨNH VIỄN');
  }
  cutoffInput.addEventListener('change', refreshPreview);
  confirmText.addEventListener('input', updatePurgeBtnState);
  refreshPreview();
  exportBtn.addEventListener('click', ()=>{
    const cutoff = cutoffInput.value;
    if(!cutoff){ toast('Chọn ngày mốc trước'); return; }
    const groups = archiveGroups(cutoff);
    if(groups.length===0){ toast('Không có gì để xuất'); return; }
    const sheets = {};
    groups.forEach(g=>{ sheets[g.label.slice(0,31)] = archiveRowsFor(g.key, g.items); });
    exportToExcel('luu_tru_truoc_'+cutoff+'.xlsx', sheets);
    archiveExportedForCutoff = cutoff;
    logActivity('update','Cài đặt', `Xuất file lưu trữ dữ liệu trước ${cutoff} (chuẩn bị xoá vĩnh viễn)`);
    toast('Đã xuất file lưu trữ — giữ file này lại trước khi xoá vĩnh viễn');
    updatePurgeBtnState();
  });
  purgeBtn.addEventListener('click', ()=>{
    if(purgeBtn.disabled) return;
    const cutoff = cutoffInput.value;
    confirmModal(`Xoá VĨNH VIỄN toàn bộ dữ liệu đã chốt xong trước ${cutoff}?\n\nKHÔNG đi qua Thùng rác — không thể khôi phục sau bước này. Đảm bảo bạn đã tải và lưu file lưu trữ vừa xuất.`, ()=>{
      const groups = archiveGroups(cutoff);
      let total = 0;
      groups.forEach(g=>{
        const removeIds = new Set(g.items.map(x=>x.id));
        state[g.key] = (state[g.key]||[]).filter(x=>!removeIds.has(x.id));
        total += removeIds.size;
      });
      logActivity('delete','Cài đặt', `Xoá vĩnh viễn ${total} bản ghi đã chốt xong trước ${cutoff} (dọn dữ liệu lưu trữ)`);
      archiveExportedForCutoff = null;
      saveState();
      toast(`Đã xoá vĩnh viễn ${total} bản ghi`);
      renderAll();
    }, {danger:true, confirmLabel:'Xoá vĩnh viễn'});
  });
}

          logActivity('update','Cài đặt', `${turningOff?'🔒 KHOÁ':'🔓 Mở lại'} công tắc khẩn cấp gửi email`);
          saveState();
          toast(turningOff ? 'Đã khoá gửi email' : 'Đã mở lại gửi email');
          renderAll();

          alertModal('Không đổi được trạng thái:\n\n'+err.message+'\n\nTrạng thái gửi email hiện KHÔNG đổi — kiểm tra lại kết nối/cấu hình rồi thử lại.');
          btn.disabled = false; btn.textContent = turningOff ? '🔒 Khoá gửi email' : '🔓 Mở lại gửi email';
        }
      }, {danger: turningOff});
    });
    document.getElementById('fbConnectBtn').addEventListener('click', async ()=>{
      const raw = document.getElementById('fbConfigArea').value;
      let cfg;
      try{ cfg = parseFirebaseConfigInput(raw); }
      catch(e){ toast(e.message); return; }
      if(!cfg || !cfg.projectId){ toast('Cấu hình thiếu projectId — kiểm tra lại'); return; }
      toast('Đang kết nối Firebase...');
      const res = await connectFirebase(cfg);
      if(res.ok){
        await saveFirebaseConfigToBootstrap(cfg);
        await syncBranchesForCurrentUser(); // Admin thao tác ở đây nên sẽ tự tải đủ cả 3 module trước khi đẩy dữ liệu lên
        logActivity('update','Cài đặt', 'Kết nối Firebase thành công (projectId: '+cfg.projectId+')');
        toast('Đã kết nối Firebase — đồng bộ real-time');
        saveState(); // đẩy dữ liệu hiện có lên Realtime Database nếu node còn trống
      } else {
        toast('Kết nối Firebase thất bại: '+res.error);
      }
      renderAll();
    });
    if(fb.status==='connected') document.getElementById('fbDisconnectBtn').addEventListener('click', ()=>{
      confirmModal('Ngắt kết nối Firebase? App sẽ quay lại lưu trong trò chuyện Claude / trình duyệt này.', ()=>{
        disconnectFirebase();
        saveFirebaseConfigToBootstrap(null);
        logActivity('update','Cài đặt', 'Ngắt kết nối Firebase');
        setStoragePill(storageMode==='firebase'?'memory':storageMode);
        toast('Đã ngắt kết nối Firebase');
        renderAll();
      });

    document.getElementById('addUnitBtn').addEventListener('click', ()=>{
      const input = document.getElementById('newUnitInput');
      const name = input.value.trim();
      if(!name){ toast('Nhập tên đơn vị trước'); return; }
      const before = state.units.length;
      const unit = ensureUnit(name);
      if(state.units.length===before){ toast('Đơn vị này đã có trong danh sách'); return; }
      logActivity('create','Cài đặt', `Thêm đơn vị "${unit}"`);
      toast('Đã thêm đơn vị "'+unit+'"');
      renderAll();
    });
    document.querySelectorAll('[data-del-unit]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const u = btn.dataset.delUnit;
        const usage = unitUsage(u);
        const msg = usage.total>0
          ? `Đơn vị "${u}" đang được ${usage.accountsUsing} tài khoản phụ trách và có ${usage.txUsing} chứng từ ghi nhận. Xoá khỏi danh sách sẽ gỡ liên kết khỏi các tài khoản đó (chứng từ cũ vẫn giữ nguyên). Vẫn xoá?`
          : `Xoá đơn vị "${u}" khỏi danh sách?`;
        confirmModal(msg, ()=>{
          deleteUnit(u);
          toast('Đã xoá đơn vị "'+u+'"');
          renderAll();
        });
      });
    });
  }
  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'so-cai-ncc-'+todayISO()+'.json';

  if(isAdmin){
    document.getElementById('importFile').addEventListener('change', (e)=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const data = JSON.parse(reader.result);
          const keepAccounts = state.accounts;
          const keepLogs = {activityLogNcc:state.activityLogNcc, activityLogNh:state.activityLogNh, activityLogBh:state.activityLogBh, activityLogShared:state.activityLogShared};
          state = Object.assign(seedState(), data);
          if(!data.accounts) state.accounts = keepAccounts;
          Object.keys(keepLogs).forEach(k=>{ if(!data[k]) state[k] = keepLogs[k]; }); // file cũ (trước khi tách log theo module) không có các field này -> giữ nguyên log hiện tại, tránh mất
          logActivity('update','Cài đặt', 'Nhập dữ liệu từ file .json');
          toast('Đã nhập dữ liệu');
          renderAll();
        }catch(err){ toast('File không hợp lệ'); }
      };
      reader.readAsText(file);
    });
    document.getElementById('resetBtn').addEventListener('click', ()=>{
      confirmModal('Xoá toàn bộ dữ liệu hiện tại (kể cả tài khoản khác) và nạp lại dữ liệu mẫu?', ()=>{
        const keepMe = currentUser();
        state = seedState();
        if(keepMe){ state.accounts = [keepMe]; currentUserId = keepMe.id; }
        logActivity('delete','Cài đặt', 'Xoá toàn bộ dữ liệu, nạp lại dữ liệu mẫu');
        toast('Đã nạp lại dữ liệu mẫu');
        renderAll();
      });
    });

  if(isAdmin && fb.status==='connected'){
    const box = document.getElementById('backupListBox');
    listBackups().then(list=>{
      if(!document.getElementById('backupListBox')) return; // đã chuyển tab trong lúc đang tải
      if(list.length===0){ box.innerHTML = '<div class="helper">Chưa có bản sao lưu nào — sẽ tự tạo vào lần Admin mở app kế tiếp.</div>'; return; }
      box.innerHTML = `<table class="data"><thead><tr><th>Ngày</th><th>Tạo lúc</th><th></th></tr></thead>
        <tbody>${list.map(b=>`<tr>
          <td>${b.date}</td>
          <td>${b.createdAt ? new Date(b.createdAt).toLocaleString('vi-VN') : ''}</td>
          <td style="display:flex;gap:8px">
            <button class="btn btn-ghost" data-backup-download="${b.date}" style="padding:4px 10px;font-size:12px">Tải JSON</button>
            <button class="btn btn-ghost" data-backup-restore="${b.date}" style="padding:4px 10px;font-size:12px;border-color:var(--rust);color:var(--rust)">Khôi phục</button>
          </td>
        </tr>`).join('')}</tbody></table>`;
      box.querySelectorAll('[data-backup-download]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const backup = await fetchBackup(btn.dataset.backupDownload);
          if(!backup){ toast('Không tải được bản sao lưu này'); return; }
          const merged = Object.assign(seedState(), ...Object.values(backup.data));
          const blob = new Blob([JSON.stringify(merged, null, 2)], {type:'application/json'});
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'backup_'+btn.dataset.backupDownload+'.json';
          a.click();
        });
      });
      box.querySelectorAll('[data-backup-restore]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const date = btn.dataset.backupRestore;
          confirmModal(`Khôi phục dữ liệu về đúng thời điểm bản sao lưu ngày ${date}?\n\nToàn bộ thay đổi SAU ngày đó (của mọi module, mọi người) sẽ bị THAY THẾ. Hành động này ghi thẳng lên Firebase, ảnh hưởng tới mọi người đang dùng app.`, ()=>{
            confirmModal('Xác nhận LẦN CUỐI — chắc chắn khôi phục?', async ()=>{
              const backup = await fetchBackup(date);
              if(!backup){ toast('Không tải được bản sao lưu này'); return; }
              state = Object.assign(seedState(), ...Object.values(backup.data));
              // KHÔNG xoá cache lastSavedRecords/lastSavedMeta ở đây — cố ý giữ nguyên, để saveState() ngay
              // sau đây tự so sánh đúng bản ghi nào khác so với dữ liệu đang có trên Firebase: bản ghi nào
              // backup có mà giờ khác/thiếu sẽ được ghi lại đúng, và QUAN TRỌNG — bản ghi nào KHÔNG có trong
              // backup nhưng đang tồn tại trên Firebase (thêm SAU thời điểm backup) sẽ tự động bị xoá đúng
              // nghĩa "khôi phục về đúng thời điểm đó" (rollback thật), thay vì chỉ cộng dồn thêm dữ liệu cũ.
              logActivity('update','Cài đặt', `Khôi phục dữ liệu từ bản sao lưu ngày ${date}`);
              toast('Đã khôi phục — đang lưu lại lên Firebase...');
              saveState();
              renderAll();
            });
          });
        });
      });
    });
    // ===== Kiểm tra dữ liệu trùng lặp =====
    function renderDedupBox(){
      const dbox = document.getElementById('dedupResultBox');
      if(!dbox) return;
      const dups = scanAllDuplicates();
      if(dups.length===0){
        dbox.innerHTML = `<div class="helper">Chưa quét, hoặc không tìm thấy bản ghi trùng lặp nào.</div>`;
        return;
      }
      const totalExtra = dups.reduce((s,d)=>s+d.extraCount,0);
      dbox.innerHTML = `
        <div class="helper" style="color:var(--rust);font-weight:600;margin-bottom:10px">⚠ Tìm thấy ${totalExtra} bản ghi thừa (trùng nội dung hoàn toàn) trong ${dups.length} loại dữ liệu.</div>
        <table class="data"><thead><tr><th>Loại dữ liệu</th><th class="num">Số nhóm trùng</th><th class="num">Bản ghi thừa</th><th></th></tr></thead>
        <tbody>${dups.map(d=>`<tr>
          <td>${escHtml(d.label)}</td>
          <td class="num">${d.groups.length}</td>
          <td class="num" style="color:var(--rust);font-weight:600">${d.extraCount}</td>
          <td><button class="btn btn-ghost" data-dedup-field="${d.field}" style="padding:4px 10px;font-size:12px;border-color:var(--rust);color:var(--rust)">Xoá ${d.extraCount} bản ghi thừa</button></td>
        </tr>`).join('')}</tbody></table>
        <div style="margin-top:10px"><button class="btn btn-primary" id="dedupAllBtn">Xoá tất cả ${totalExtra} bản ghi thừa (mọi loại)</button></div>
        <div class="helper" style="margin-top:8px">Bản ghi thừa được chuyển vào Thùng rác — nếu xoá nhầm, vào tab "Thùng rác" để khôi phục lại.</div>
      `;
      dbox.querySelectorAll('[data-dedup-field]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const d = dups.find(x=>x.field===btn.dataset.dedupField);
          if(!d) return;
          confirmModal(`Xoá ${d.extraCount} bản ghi thừa của "${d.label}"? Sẽ chuyển vào Thùng rác, khôi phục lại được.`, ()=>{
            d.groups.forEach(g=>removeDuplicateGroup(d.field, d.entity, g));
            logActivity('delete','Cài đặt', `Dọn ${d.extraCount} bản ghi trùng lặp — ${d.label}`);
            toast(`Đã dọn ${d.extraCount} bản ghi thừa của "${d.label}"`);
            saveState();
            renderDedupBox();
          });
        });
      });
      const allBtn = document.getElementById('dedupAllBtn');
      if(allBtn) allBtn.addEventListener('click', ()=>{
        confirmModal(`Xoá TẤT CẢ ${totalExtra} bản ghi thừa (mọi loại dữ liệu)? Sẽ chuyển vào Thùng rác, khôi phục lại được.`, ()=>{
          dups.forEach(d=>{ d.groups.forEach(g=>removeDuplicateGroup(d.field, d.entity, g)); });
          logActivity('delete','Cài đặt', `Dọn tổng cộng ${totalExtra} bản ghi trùng lặp (mọi loại dữ liệu)`);
          toast(`Đã dọn ${totalExtra} bản ghi thừa`);
          saveState();
          renderDedupBox();
        });
      });
    }
    const dedupBtn = document.getElementById('dedupScanBtn');
    if(dedupBtn) dedupBtn.addEventListener('click', renderDedupBox);
  }
}
